{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-design.fullname" . }}
type: Opaque
data:
  {{- if .Values.config.apiToken }}
  OD_API_TOKEN: {{ .Values.config.apiToken | b64enc | quote }}
  {{- else }}
  {{- fail "CRITICAL ERROR: config.apiToken cannot be empty." }}
  {{- end }}
  {{- if eq .Values.database.kind "postgres" }}
  {{- if .Values.database.postgres.password }}
  OD_PG_PASSWORD: {{ .Values.database.postgres.password | b64enc | quote }}
  {{- else }}
  {{- fail "CRITICAL ERROR: database.postgres.password cannot be empty when database.kind=postgres." }}
  {{- end }}
  {{- end }}
{{- end }}
