{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-design.fullname" . }}
type: Opaque
data:
  {{- if .Values.config.apiToken }}
  {{ include "open-design.secretKey" . | quote }}: {{ .Values.config.apiToken | b64enc | quote }}
  {{- else }}
  {{- fail "CRITICAL ERROR: config.apiToken cannot be empty. Set config.apiToken, or set config.existingSecret to source the token from an externally-managed Secret." }}
  {{- end }}
{{- end }}
