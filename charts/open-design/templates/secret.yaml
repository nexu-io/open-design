apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-design.fullname" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.apiToken }}
  OD_API_TOKEN: {{ .Values.config.apiToken | b64enc | quote }}
  {{- else }}
  OD_API_TOKEN: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}