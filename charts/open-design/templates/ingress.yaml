{{- $webBasePath := include "open-design.webBasePath" . -}}
{{- if .Values.ingress.enabled -}}
{{- range .Values.ingress.hosts }}
  {{- range .paths }}
    {{- $configuredPath := .path | trimSuffix "/" -}}
    {{- if and $configuredPath (ne $configuredPath $webBasePath) }}
      {{- fail "ingress path must match config.webBasePath" }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-design.fullname" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $configuredPath := .path | trimSuffix "/" -}}
          - path: {{ if and $webBasePath (eq $configuredPath "") }}{{ $webBasePath }}{{ else }}{{ .path }}{{ end }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "open-design.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
