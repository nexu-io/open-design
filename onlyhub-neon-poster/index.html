<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyHub — Never Finishes Loading</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="poster" aria-label="OnlyHub neon poster">
    <div class="noise"></div>
    <div class="halo halo-one"></div>
    <div class="halo halo-two"></div>
    <div class="grid"></div>

    <header>
      <div class="brand">ONLY<span>HUB</span></div>
      <div class="meta">SOLANA MEMECOIN / AFTER HOURS</div>
    </header>

    <section class="hero">
      <p class="eyebrow">THE INTERNET KEEPS LOADING.</p>
      <h1>THE NIGHT<br><span>KEEPS GOING.</span></h1>
      <div class="hub-chip">$HUB</div>
      <p class="subline">THE ONLY HUB THAT NEVER FINISHES LOADING.</p>
    </section>

    <section class="loader-wrap">
      <div class="loader-labels"><span>LOADING THE NIGHT</span><span id="percent">81%</span></div>
      <div class="loader"><div class="loader-fill"></div><div class="loader-glow"></div></div>
      <div class="horizon"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <footer>
      <span>01:37 AM / STILL ONLINE</span>
      <strong>ONLYHUB</strong>
      <span>NO ROCKETS. NO LASER EYES.</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
