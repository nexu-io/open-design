<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 替换为 PPT 标题 · Deck Title</title>
<style>
  :root{
    /* ============ 主题色（默认：深蓝商务） ============
       切换主题：从 references/themes.md 复制对应的 :root 块
       整体替换这几行 (--fg / --fg-rgb / --bg / --bg-rgb / --border / --accent) */
    --bg:      oklch(100% 0 0);
    --bg-rgb:  255,255,255;
    --surface: oklch(97.5% 0.003 240);
    --fg:      oklch(35% 0.01 60);
    --fg-rgb:  51,51,51;
    --muted:   oklch(55% 0.015 240);
    --muted-rgb: 100,116,139;
    --border:  oklch(92% 0.005 240);
    --border-rgb: 226,232,240;
    --accent:  oklch(30% 0.08 250);
    --accent-rgb: 10,31,61;

    /* ============ 字体（系统字体，禁止 Google Fonts）============ */
    --font-display: "PingFang SC","Microsoft YaHei","Segoe UI Bold","Segoe UI",sans-serif;
    --font-body:    "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --font-mono:    ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ============ Deck 容器 + 翻页 ============ */
  #deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;flex-wrap:nowrap;z-index:10}
  .slide{width:100vw;height:100vh;flex:0 0 100vw;position:relative;padding:6vh 8vw;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

  /* ============ 标题层级（sans-serif，投影可读）============ */
  .slide-title{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.2vw,56px);line-height:1.2;letter-spacing:-.01em;margin-bottom:1.6vh}
  .slide-subtitle{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.8vw,36px);line-height:1.3;margin-bottom:1.2vh}
  .slide-section{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,1.6vw,22px);color:var(--muted);margin-bottom:2vh;letter-spacing:.04em}
  .slide-body{font-family:var(--font-body);font-size:clamp(14px,1.3vw,18px);line-height:1.7;color:var(--fg);opacity:.85}
  .slide-body strong{font-weight:600;color:var(--fg)}
  .slide-body em{font-style:italic}

  /* 强调色 */
  .text-accent{color:var(--accent);font-weight:600}
  .text-muted{color:var(--muted)}

  /* ============ 布局工具 ============ */
  .col{display:flex;flex-direction:column;gap:2vh}
  .row{display:flex;align-items:center;gap:3vw}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:5vw;flex:1;align-items:start}
  .split-60{display:grid;grid-template-columns:6fr 4fr;gap:5vw;flex:1;align-items:start}
  .split-40{display:grid;grid-template-columns:4fr 6fr;gap:5vw;flex:1;align-items:start}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;flex:1;align-content:center}
  .grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:3vh 3vw;flex:1;align-content:center}
  .grid-6{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3vh 3vw;flex:1;align-content:center}
  .center{align-items:center;justify-content:center;text-align:center}
  .fill{flex:1}

  /* ============ 数据卡片 ============ */
  .stat-card{display:flex;flex-direction:column;gap:.6vh;padding-top:2vh;border-top:2px solid var(--accent)}
  .stat-card .stat-nb{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,5vw,64px);line-height:.9;color:var(--fg);letter-spacing:-.02em}
  .stat-card .stat-label{font-family:var(--font-body);font-size:clamp(13px,1.1vw,16px);color:var(--muted);margin-top:.4vh}

  /* ============ 引用块 ============ */
  .callout{padding:2.4vh 2vw;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
  .callout .q{font-family:var(--font-body);font-size:clamp(16px,1.5vw,22px);line-height:1.5;color:var(--fg);font-weight:500}
  .callout .cite{font-family:var(--font-mono);font-size:clamp(11px,.9vw,13px);color:var(--muted);margin-top:1vh;letter-spacing:.08em}

  /* ============ 要点列表 ============ */
  .bullet-list{display:flex;flex-direction:column;gap:1.6vh}
  .bullet-list .item{display:flex;gap:1vw;align-items:flex-start;font-family:var(--font-body);font-size:clamp(14px,1.3vw,18px);line-height:1.6;color:var(--fg);opacity:.88}
  .bullet-list .item::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:.65em}
  .bullet-list .item strong{font-weight:600;color:var(--fg)}

  /* ============ 表格 ============ */
  .data-table{width:100%;border-collapse:collapse;font-family:var(--font-body)}
  .data-table th{text-align:left;font-weight:600;font-size:clamp(12px,1vw,15px);color:var(--muted);border-bottom:2px solid var(--border);padding:1.2vh .8vw;text-transform:uppercase;letter-spacing:.06em}
  .data-table td{font-size:clamp(13px,1.1vw,16px);border-bottom:1px solid var(--border);padding:1.2vh .8vw;color:var(--fg)}
  .data-table tr:last-child td{border-bottom:none}

  /* ============ 标签/徽章 ============ */
  .tag{display:inline-block;font-family:var(--font-mono);font-size:clamp(10px,.8vw,12px);letter-spacing:.12em;padding:4px 10px;border:1px solid var(--border);border-radius:4px;color:var(--muted)}
  .tag-accent{border-color:var(--accent);color:var(--accent)}

  /* ============ 分隔线 ============ */
  .divider{width:100%;height:1px;background:var(--border);margin:2vh 0}
  .divider-accent{height:2px;background:var(--accent)}

  /* ============ 图片占位 ============ */
  .img-placeholder{border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1vh;padding:3vh;color:var(--muted);font-family:var(--font-mono);font-size:clamp(11px,.9vw,13px);letter-spacing:.1em}

  /* ============ 页脚页码 ============ */
  .slide-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:clamp(10px,.75vw,12px);color:var(--muted);letter-spacing:.08em;padding-top:2vh;border-top:1px solid var(--border)}

  /* ============ 封面页特殊布局 ============ */
  .slide.cover{justify-content:center;text-align:center;padding:8vh}
  .slide.cover .slide-title{font-size:clamp(32px,5.5vw,72px);margin-bottom:2vh}
  .slide.cover .slide-subtitle{font-size:clamp(18px,2.2vw,28px);color:var(--muted);font-weight:400;margin-bottom:4vh}
  .slide.cover .slide-body{font-size:clamp(13px,1.1vw,16px);color:var(--muted)}

  /* ============ 章节页 ============ */
  .slide.chapter{justify-content:center;align-items:center;text-align:center}
  .slide.chapter .slide-section{font-size:clamp(14px,1.2vw,18px);margin-bottom:1vh}
  .slide.chapter .slide-title{font-size:clamp(28px,4.5vw,60px)}

  /* ============ 导航圆点 ============ */
  #nav{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(var(--fg-rgb),.06);backdrop-filter:blur(6px)}
  #nav .dot{width:8px;height:8px;border-radius:50%;background:rgba(var(--fg-rgb),.2);cursor:pointer;border:0;padding:0}
  #nav .dot:hover{background:rgba(var(--fg-rgb),.4)}
  #nav .dot.active{background:rgba(var(--fg-rgb),.8);width:20px;border-radius:999px}

  /* ============ 高级组件库（PPT 导出兼容：无 animation/transition/backdrop-filter）============ */

  /* --- Surface Card 微投影卡片 --- */
  .surface-card{background:#fff;border-radius:10px;padding:2.5vh 2.5vw;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);border:1px solid var(--border)}

  /* --- Eyebrow 前缀标签 --- */
  .eyebrow{font-family:var(--font-mono);font-size:clamp(11px,.85vw,14px);letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600;padding:.5vh 0;border-top:2px solid var(--accent);display:inline-block;margin-bottom:1vh}

  /* --- Meta Bar 顶部信息条 --- */
  .meta-bar{display:flex;justify-content:space-between;align-items:center;padding:1vh 0;border-bottom:1px solid var(--border);margin-bottom:2vh;font-family:var(--font-mono);font-size:clamp(10px,.75vw,12px);color:var(--muted);letter-spacing:.06em}

  /* --- Progress Bar 进度条 --- */
  .progress-bar{display:flex;flex-direction:column;gap:.5vh}
  .progress-bar .bar-track{width:100%;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
  .progress-bar .bar-fill{height:100%;background:var(--accent);border-radius:4px}
  .progress-bar .bar-label{display:flex;justify-content:space-between;font-family:var(--font-body);font-size:clamp(12px,1vw,15px);color:var(--fg)}
  .progress-bar .bar-label .pct{font-weight:700;color:var(--accent)}

  /* --- Timeline 时间轴 --- */
  .timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:3vw}
  .timeline::before{content:'';position:absolute;left:calc(3vw + 8px);top:0;bottom:0;width:2px;background:var(--border)}
  .timeline .tl-item{display:grid;grid-template-columns:18px 1fr;gap:1.5vw;align-items:start;padding:1.5vh 0;position:relative}
  .timeline .tl-dot{width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);position:relative;z-index:1;flex-shrink:0}
  .timeline .tl-content{padding:.5vh 0}
  .timeline .tl-date{font-family:var(--font-mono);font-size:clamp(11px,.8vw,13px);color:var(--accent);font-weight:600;margin-bottom:.3vh}
  .timeline .tl-title{font-family:var(--font-display);font-size:clamp(15px,1.3vw,19px);font-weight:600;color:var(--fg);margin-bottom:.3vh}
  .timeline .tl-desc{font-family:var(--font-body);font-size:clamp(12px,1vw,15px);color:var(--muted);line-height:1.5}

  /* --- Icon Grid 图标网格 --- */
  .icon-grid{display:grid;gap:3vh 3vw;flex:1;align-content:start}
  .icon-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .icon-grid.cols-4{grid-template-columns:repeat(4,1fr)}
  .icon-grid .ic-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1vh;padding:2vh 1vw}
  .icon-grid .ic-icon{font-size:clamp(28px,3vw,48px);line-height:1;color:var(--accent);font-weight:700}
  .icon-grid .ic-title{font-family:var(--font-display);font-size:clamp(14px,1.2vw,17px);font-weight:600;color:var(--fg)}
  .icon-grid .ic-desc{font-family:var(--font-body);font-size:clamp(11px,.9vw,14px);color:var(--muted);line-height:1.4}

  /* --- Gradient Card 微渐变卡片 --- */
  .gradient-card{padding:3vh 2.5vw;border-radius:10px;color:#fff;position:relative;overflow:hidden}
  .gradient-card::after{content:'';position:absolute;top:-30%;right:-20%;width:40%;height:80%;background:rgba(255,255,255,.06);border-radius:50%}
  .gradient-card .gc-title{font-family:var(--font-display);font-size:clamp(18px,1.8vw,26px);font-weight:700;margin-bottom:.5vh;position:relative;z-index:1}
  .gradient-card .gc-body{font-family:var(--font-body);font-size:clamp(13px,1.1vw,16px);line-height:1.5;opacity:.92;position:relative;z-index:1}
  .gradient-card .gc-stat{font-family:var(--font-display);font-size:clamp(36px,4.5vw,56px);font-weight:800;margin-bottom:.5vh;position:relative;z-index:1}
  .gradient-card .gc-label{font-family:var(--font-body);font-size:clamp(12px,1vw,15px);opacity:.85;position:relative;z-index:1}

  /* --- Big Quote 大引用 --- */
  .big-quote{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:6vh 10vw;position:relative}
  .big-quote::before{content:'"';font-family:Georgia,serif;font-size:clamp(120px,16vw,240px);color:var(--accent);opacity:.12;position:absolute;top:-2vh;left:6vw;line-height:1}
  .big-quote .bq-text{font-family:var(--font-display);font-size:clamp(26px,3.2vw,48px);font-weight:600;line-height:1.4;color:var(--fg);position:relative;z-index:1;font-style:italic}
  .big-quote .bq-author{font-family:var(--font-mono);font-size:clamp(12px,1vw,16px);color:var(--muted);margin-top:2vh;letter-spacing:.1em;position:relative;z-index:1}

  /* --- Numbered Steps 编号步骤 --- */
  .numbered-steps{display:flex;flex-direction:column;gap:2.5vh}
  .numbered-steps .ns-item{display:grid;grid-template-columns:80px 1fr;gap:2vw;align-items:start}
  .numbered-steps .ns-num{font-family:var(--font-display);font-size:clamp(40px,5vw,72px);font-weight:800;color:var(--accent);opacity:.15;line-height:1;text-align:right}
  .numbered-steps .ns-title{font-family:var(--font-display);font-size:clamp(16px,1.4vw,21px);font-weight:700;color:var(--fg);margin-bottom:.3vh}
  .numbered-steps .ns-desc{font-family:var(--font-body);font-size:clamp(13px,1.1vw,16px);color:var(--muted);line-height:1.6}

  /* --- Before/After 对比 --- */
  .before-after{display:grid;grid-template-columns:1fr 1fr;gap:4vw;flex:1;align-items:start}
  .before-after .ba-col{padding:2.5vh 2vw;border-radius:8px}
  .before-after .ba-before{background:oklch(97% 0.01 20);border-left:3px solid oklch(55% 0.2 25)}
  .before-after .ba-after{background:oklch(97% 0.01 145);border-left:3px solid oklch(60% 0.18 145)}
  .before-after .ba-label{font-family:var(--font-mono);font-size:clamp(11px,.8vw,13px);letter-spacing:.12em;margin-bottom:1.5vh;padding:.4vh .8vw;border-radius:3px;display:inline-block}
  .before-after .ba-before .ba-label{color:oklch(55% 0.2 25);background:oklch(93% 0.02 25)}
  .before-after .ba-after .ba-label{color:oklch(60% 0.18 145);background:oklch(93% 0.02 145)}
  .before-after .ba-item{display:flex;gap:.8vw;align-items:flex-start;padding:.8vh 0;font-family:var(--font-body);font-size:clamp(13px,1.1vw,16px);color:var(--fg);line-height:1.5}
  .before-after .ba-item::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:.55em}
  .before-after .ba-before .ba-item::before{background:oklch(55% 0.2 25)}
  .before-after .ba-after .ba-item::before{background:oklch(60% 0.18 145)}

  /* --- Corner Decor 角落装饰 --- */
  .corner-decor{position:relative}
  .corner-decor::before,.corner-decor::after{content:'';position:absolute;width:40px;height:40px;border-color:var(--accent);border-style:solid}
  .corner-decor::before{top:0;left:0;border-width:2px 0 0 2px}
  .corner-decor::after{bottom:0;right:0;border-width:0 2px 2px 0}

  /* --- Ring Stat 环形指标 --- */
  .ring-stat{display:flex;flex-direction:column;align-items:center;gap:1vh;padding:2vh}
  .ring-stat .ring-svg{width:clamp(100px,12vw,160px);height:clamp(100px,12vw,160px)}
  .ring-stat .ring-value{font-family:var(--font-display);font-size:clamp(22px,2.5vw,36px);font-weight:800;color:var(--fg);margin-top:-1vh}
  .ring-stat .ring-label{font-family:var(--font-body);font-size:clamp(12px,1vw,15px);color:var(--muted)}

  /* --- Hero Banner 封面横幅 --- */
  .hero-banner{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
  .hero-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(var(--accent-rgb),.85) 0%,rgba(var(--accent-rgb),.6) 100%);z-index:1}
  .hero-banner .hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:8vh;color:#fff}
  .hero-banner .hero-content .slide-title{color:#fff;font-size:clamp(36px,5vw,64px);text-shadow:0 2px 8px rgba(0,0,0,.15)}
  .hero-banner .hero-content .slide-subtitle{color:rgba(255,255,255,.85);font-size:clamp(18px,2.2vw,30px)}
  .hero-banner .hero-content .slide-body{color:rgba(255,255,255,.75);font-size:clamp(14px,1.2vw,18px)}

  /* ============ 打印样式（PDF / PPTX 导出）============ */
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { width: 1920px !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body { display: block !important; }
    .slide { flex: none !important; width: 1920px !important; height: 1080px !important; min-height: 1080px !important; max-height: 1080px !important; page-break-after: always; break-after: page; position: relative !important; overflow: hidden !important; }
    .hero-banner { position: absolute !important; }
    .hero-banner .hero-content { position: static !important; height: auto !important; min-height: 1080px !important; }
    #nav { display: none !important; }
  }
</style>
</head>
<body>

<div id="deck">

<!-- ============================================================
     SLIDES 插入区 · 在此处填充所有 <section class="slide ..."> 页面
     每页模板参考 references/layouts.md
     ============================================================ -->

<!-- SLIDES_HERE -->

</div>

<div id="nav"></div>

<script>
// =============== 导航（翻页 / 圆点 / 键盘 / 滚轮 / 触屏） ===============
const deck=document.getElementById('deck');
const slides=deck.querySelectorAll('.slide');
const nav=document.getElementById('nav');
let idx=0,total=slides.length,lock=false;

deck.style.width=(total*100)+'vw';

slides.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='dot';b.dataset.i=i;b.setAttribute('aria-label','Page '+(i+1));
  b.onclick=()=>go(i);
  nav.appendChild(b);
});

function go(n){
  if(lock)return;
  idx=Math.max(0,Math.min(total-1,n));
  deck.style.transform=`translateX(${-idx*100}vw)`;
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  nav.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  lock=true;setTimeout(()=>lock=false,500);
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(idx+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(idx-1);
  if(e.key==='Home')go(0);
  if(e.key==='End')go(total-1);
});

let wheelAcc=0,wheelTO=null;
addEventListener('wheel',e=>{
  wheelAcc+=e.deltaY+e.deltaX;
  if(Math.abs(wheelAcc)>50){go(idx+(wheelAcc>0?1:-1));wheelAcc=0;}
  clearTimeout(wheelTO);wheelTO=setTimeout(()=>wheelAcc=0,150);
},{passive:true});

let tx=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{const dx=(e.changedTouches[0].clientX-tx);if(Math.abs(dx)>50)go(idx+(dx<0?1:-1));},{passive:true});

go(0);
</script>
</body>
</html>
