<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Animation Example</title>
  <style>
    :root {
      --ink: #16130f;
      --paper: #f4e9d4;
      --accent: #d24b31;
      --green: #276444;
      --pixel: "Courier New", ui-monospace, monospace;
      --sans: Inter, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f0e0b;
      color: var(--ink);
      font-family: var(--sans);
    }

    .poster {
      width: min(920px, calc(100vw - 32px));
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px) 0 0 / 18px 18px,
        linear-gradient(rgba(0,0,0,.08) 1px, transparent 1px) 0 0 / 18px 18px,
        var(--paper);
      border: 10px solid #2a2117;
      box-shadow: 0 30px 90px rgba(0,0,0,.42);
    }

    .label {
      position: absolute;
      top: 32px;
      left: 36px;
      font-family: var(--pixel);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 13px;
    }

    h1 {
      position: absolute;
      left: 36px;
      bottom: 34px;
      margin: 0;
      font-family: var(--pixel);
      font-size: clamp(44px, 9vw, 118px);
      line-height: .9;
      text-transform: uppercase;
      max-width: 8ch;
    }

    .year {
      position: absolute;
      right: 34px;
      top: 28px;
      font-family: var(--pixel);
      font-size: clamp(52px, 9vw, 122px);
      color: var(--accent);
      letter-spacing: -.08em;
    }

    .sprite {
      position: absolute;
      left: 55%;
      top: 52%;
      width: 128px;
      height: 128px;
      transform: translate(-50%, -50%);
      animation: bob 1.2s steps(2) infinite;
    }

    .sprite::before,
    .sprite::after {
      content: "";
      position: absolute;
      inset: 0;
      image-rendering: pixelated;
      background:
        linear-gradient(var(--green) 0 0) 48px 8px / 32px 16px,
        linear-gradient(var(--green) 0 0) 32px 24px / 64px 48px,
        linear-gradient(var(--accent) 0 0) 24px 72px / 80px 24px,
        linear-gradient(#2a2117 0 0) 40px 96px / 16px 24px,
        linear-gradient(#2a2117 0 0) 72px 96px / 16px 24px;
      background-repeat: no-repeat;
    }

    .sprite::after {
      opacity: .2;
      transform: translate(16px, 18px);
      filter: blur(1px);
    }

    .tag {
      position: absolute;
      right: 38px;
      bottom: 42px;
      font-family: var(--pixel);
      font-size: 18px;
      color: var(--green);
      text-transform: uppercase;
    }

    @keyframes bob {
      0%, 100% { transform: translate(-50%, -53%); }
      50% { transform: translate(-50%, -47%); }
    }
  </style>
</head>
<body>
  <main class="poster" data-od-id="sprite-poster">
    <div class="label">Pixel history postcard</div>
    <div class="year">1889</div>
    <div class="sprite" aria-label="Animated pixel sprite"></div>
    <h1>Pocket era begins</h1>
    <div class="tag">Flower card motif</div>
  </main>
</body>
</html>
