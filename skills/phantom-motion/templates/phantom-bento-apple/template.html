<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Bento Apple</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div id="deck-container">
        <section class="slide active" id="slide-1">
            <div class="bento-item item-1">
                <h1 class="editable-text" data-id="bento-s1-h1" contenteditable="true">Bento Layout</h1>
                <p class="editable-text" data-id="bento-s1-p1" contenteditable="true">Organized, modular, and beautiful.</p>
            </div>
            <div class="bento-item item-2">
                <h2 class="editable-text" data-id="bento-s1-h2" contenteditable="true">Performance</h2>
            </div>
            <div class="bento-item item-3">
                <p class="editable-text" data-id="bento-s1-p2" contenteditable="true">Fast</p>
            </div>
            <div class="bento-item item-4">
                <p class="editable-text" data-id="bento-s1-p3" contenteditable="true">Fluid</p>
            </div>
            <div class="bento-item item-5">
                <p class="editable-text" data-id="bento-s1-p4" contenteditable="true">Eco-friendly design system.</p>
            </div>
            <div class="bento-item item-6">
                <h2 class="editable-text" data-id="bento-s1-h3" contenteditable="true">Modular Architecture</h2>
                <p class="editable-text" data-id="bento-s1-p5" contenteditable="true">Building blocks for the future of decks.</p>
            </div>
        </section>
        <section class="slide" id="slide-2">
            <div class="bento-item item-1">
                <h1 class="editable-text" data-id="bento-s2-h1" contenteditable="true">Innovation</h1>
                <p class="editable-text" data-id="bento-s2-p1" contenteditable="true">Pushing boundaries every day.</p>
            </div>
            <div class="bento-item item-6">
                <h2 class="editable-text" data-id="bento-s2-h2" contenteditable="true">Future Ready</h2>
                <p class="editable-text" data-id="bento-s2-p2" contenteditable="true">Always one step ahead.</p>
            </div>
        </section>
    </div>

    <div id="controls">
        <button id="export-btn">💾 Export</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.contentEditable === 'true') return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            const activeSlide = slides[currentSlide];
            activeSlide.classList.add('active');
            runAnimation(activeSlide);
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function runAnimation(activeSlide) {
            gsap.set(activeSlide.querySelectorAll('.bento-item'), { clearProps: "all" });
            
            gsap.from(activeSlide.querySelectorAll('.bento-item'), {
                duration: 0.8,
                scale: 0.9,
                opacity: 0,
                y: 20,
                stagger: 0.1,
                ease: "back.out(1.7)"
            });
        }

        document.querySelectorAll('.editable-text').forEach(el => {
            const id = el.getAttribute('data-id');
            const saved = localStorage.getItem(id);
            if (saved) el.innerText = saved;
            el.addEventListener('input', () => {
                localStorage.setItem(id, el.innerText);
            });
        });

        document.getElementById('export-btn').onclick = () => {
            const content = document.documentElement.outerHTML;
            const blob = new Blob([content], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'bento-deck.html';
            a.click();
        };

        runAnimation(slides[0]);
    </script>
</body>
</html>
