<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom Neu-Minimal (Flux)</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="aura"></div>
<div id="flux-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; opacity:0.4;"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — THE MANIFESTO ═══════ -->
    <div class="phantom-slide active">
        <h3 class="editable-text" data-id="h3_0">Neural Interface // v9.0</h3>
        <h1 class="editable-text" data-id="h1_0">DESIGNING<br><em>INTELLIGENCE</em></h1>
        <p class="editable-text" data-id="p_0">
            超越表象，触及算法的艺术核心。在极简的空间内，重塑 AI 原生的交互语言。
        </p>
    </div>

    <!-- ═══════ SLIDE 1 — THE ARCHITECTURE ═══════ -->
    <div class="phantom-slide">
        <h3 class="editable-text" data-id="h3_1">Modular Systems</h3>
        <div class="neu-card">
            <h2 class="editable-text" data-id="h2_1">Scalable <em>Flux</em></h2>
            <p class="editable-text" data-id="p_1">
                每一行代码都是一种秩序。在流动的架构中，寻找确定的美学，构建永不过时的数字地标。
            </p>
            <div style="margin-top:3rem; display:grid; grid-template-columns:repeat(3, 1fr); gap:2rem;">
                <div>
                    <div style="font-size:2rem; font-weight:900;">0.01s</div>
                    <div class="editable-text" data-id="lab_1" style="font-family:var(--font-mono); font-size:9px; opacity:0.5; letter-spacing:2px;">LATENCY</div>
                </div>
                <div>
                    <div style="font-size:2rem; font-weight:900;">∞</div>
                    <div class="editable-text" data-id="lab_2" style="font-family:var(--font-mono); font-size:9px; opacity:0.5; letter-spacing:2px;">POSSIBILITY</div>
                </div>
                <div>
                    <div style="font-size:2rem; font-weight:900;">4K</div>
                    <div class="editable-text" data-id="lab_3" style="font-family:var(--font-mono); font-size:9px; opacity:0.5; letter-spacing:2px;">PRECISION</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ── UI Chrome ── -->
<div class="nav-neu">
    <button class="export-btn" onclick="exportHTML()">💾 EXPORT AS PRO</button>
    <div style="width:40px; height:1px; background:rgba(255,255,255,0.1);"></div>
    <div style="cursor:pointer; font-family:var(--font-mono); font-size:10px; letter-spacing:2px;" onclick="nextSlide()">STEP NEXT →</div>
    <div id="pageLabel" style="font-family:var(--font-mono); font-size:10px; opacity:0.4;">01 / 02</div>
</div>

<script>
const SLUG = "phantom-neu-minimal-flux";
const STORAGE_KEY = `phantom_edit_${SLUG}_`;

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');
const pageLabel = document.getElementById('pageLabel');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    current = n;
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    
    pageLabel.textContent = `${String(current + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
    runAnimation(current);
}

function nextSlide() { showSlide((current + 1) % slides.length); }

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Neuform Motion ──
function runAnimation(idx) {
    const activeSlide = slides[idx];
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    
    const tl = gsap.timeline();
    
    if (idx === 0) {
        tl.from(activeSlide.querySelector('h1'), { 
            y: 100, opacity: 0, skewY: 5, letterSpacing: "-0.2em",
            duration: 1.5, ease: "expo.out" 
        })
        .from(activeSlide.querySelector('h3'), { width: 0, opacity: 0, duration: 1 }, "-=1")
        .from(activeSlide.querySelector('p'), { opacity: 0, y: 20, duration: 1 }, "-=0.8");
        initFlux3D();
    }
    
    if (idx === 1) {
        tl.from(activeSlide.querySelector('.neu-card'), { 
            scale: 0.9, opacity: 0, y: 50, filter: "blur(20px)",
            duration: 1.2, ease: "power4.out" 
        })
        .from(activeSlide.querySelectorAll('.neu-card div > div'), { 
            y: 30, opacity: 0, stagger: 0.1, 
            duration: 0.8, ease: "power3.out" 
        }, "-=0.5");
    }
}

// ── Three.js: 3D 流光背景 ──
function initFlux3D() {
    const container = document.getElementById('flux-canvas');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 200, 32);
    const material = new THREE.MeshNormalMaterial({ wireframe: true, transparent: true, opacity: 0.1 });
    const flux = new THREE.Mesh(geometry, material);
    scene.add(flux);

    function animate() {
        requestAnimationFrame(animate);
        flux.rotation.y += 0.002;
        flux.rotation.z += 0.001;
        renderer.render(scene, camera);
    }
    animate();
}

// ── WYSIWYG Suite (Phantom Edit) ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        el.style.color = 'var(--accent)';
        el.style.borderBottom = '1px solid var(--accent)';
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            el.style.color = '';
            el.style.borderBottom = '';
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
        
        el.addEventListener('keydown', (ke) => {
            if (ke.key === 'Enter') { ke.preventDefault(); el.blur(); }
        });
    }
});

function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const clone = document.documentElement.cloneNode(true);
    const blob = new Blob([clone.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `phantom-pro-${Date.now()}.html`;
    a.click();
}

window.onload = () => {
    loadPersistence();
    runAnimation(0);
};
</script>
</body>
</html>
