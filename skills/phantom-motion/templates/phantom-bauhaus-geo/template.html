<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Bauhaus Geo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div id="deck-container">
        <section class="slide active" id="slide-1">
            <div class="shape circle"></div>
            <div class="shape square"></div>
            <div class="shape triangle"></div>
            <h1 class="editable-text" data-id="bau-s1-h1" contenteditable="true">BAU<br>HAUS</h1>
            <p class="editable-text" data-id="bau-s1-p1" contenteditable="true">FORM FOLLOWS FUNCTION.</p>
        </section>
        <section class="slide" id="slide-2">
            <div class="shape circle" style="background: var(--red); left: 10%; top: 20%;"></div>
            <div class="shape square" style="background: var(--yellow); right: 5%; bottom: 15%;"></div>
            <h1 class="editable-text" data-id="bau-s2-h1" contenteditable="true">GEO<br>METRY</h1>
            <p class="editable-text" data-id="bau-s2-p1" contenteditable="true">THE ESSENCE OF STRUCTURE.</p>
        </section>
    </div>

    <div id="controls">
        <button id="export-btn">💾 Export</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.contentEditable === 'true') return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            const activeSlide = slides[currentSlide];
            activeSlide.classList.add('active');
            runAnimation(activeSlide);
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function runAnimation(activeSlide) {
            gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
            
            gsap.from(activeSlide.querySelectorAll('.shape'), {
                duration: 1,
                scale: 0,
                opacity: 0,
                stagger: 0.2,
                ease: "elastic.out(1, 0.5)"
            });

            gsap.from(activeSlide.querySelector('h1'), {
                duration: 0.8,
                x: -100,
                opacity: 0,
                delay: 0.5,
                ease: "power4.out"
            });

            gsap.from(activeSlide.querySelector('p'), {
                duration: 0.8,
                y: 50,
                opacity: 0,
                delay: 0.8,
                ease: "power3.out"
            });
        }

        document.querySelectorAll('.editable-text').forEach(el => {
            const id = el.getAttribute('data-id');
            const saved = localStorage.getItem(id);
            if (saved) el.innerText = saved;
            el.addEventListener('input', () => {
                localStorage.setItem(id, el.innerText);
            });
        });

        document.getElementById('export-btn').onclick = () => {
            const content = document.documentElement.outerHTML;
            const blob = new Blob([content], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'bauhaus-deck.html';
            a.click();
        };

        runAnimation(slides[0]);
    </script>
</body>
</html>
