<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom Monochrome (Noir) — Absolute Grayscale</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="grid-overlay"></div>
<div id="silk-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; opacity:0.3;"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — THE VOID ═══════ -->
    <div class="phantom-slide active">
        <h3 class="editable-text" data-id="h3_0">Cinema Archive // v9.0</h3>
        <h1 class="editable-text" data-id="h1_0">MONO<em>CHROME</em><br>NOIR</h1>
        <p class="editable-text" data-id="p_0">
            剥离色彩的喧嚣，回归光影的本质。在灰阶的明暗交替中，重构电影感的叙事深度。
        </p>
    </div>

    <!-- ═══════ SLIDE 1 — THE TEXTURE ═══════ -->
    <div class="phantom-slide">
        <h3 class="editable-text" data-id="h3_1">Tactile Experience</h3>
        <h2 class="editable-text" data-id="h2_1">Digital <em>Substance</em></h2>
        <p class="editable-text" data-id="p_1">
            不是简单的黑白，而是细腻的材质表达。每一条曲线，每一道光影，都是对纯粹美学的致敬。
        </p>
    </div>

</div>

<!-- ── UI Chrome ── -->
<button class="export-btn" onclick="exportHTML()">💾 EXPORT成品</button>

<div class="nav-noir">
    <div style="cursor:pointer;" onclick="nextSlide()">DISCOVER →</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progBar" style="width:50%;"></div>
    </div>
    <div id="pageLabel">01 / 02</div>
</div>

<script>
const SLUG = "phantom-monochrome-noir";
const STORAGE_KEY = `phantom_edit_${SLUG}_`;

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');
const progBar = document.getElementById('progBar');
const pageLabel = document.getElementById('pageLabel');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    current = n;
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    
    progBar.style.width = `${((current + 1) / slides.length) * 100}%`;
    pageLabel.textContent = `${String(current + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
    
    runAnimation(current);
}

function nextSlide() { showSlide((current + 1) % slides.length); }

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Cinematic Noir Animations ──
function runAnimation(idx) {
    const activeSlide = slides[idx];
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    
    const tl = gsap.timeline();
    
    tl.from(activeSlide.querySelector('h3'), { opacity: 0, letterSpacing: "20px", duration: 1.5, ease: "power2.out" })
      .from(activeSlide.querySelector('h1, h2'), { opacity: 0, y: 50, filter: "blur(10px)", duration: 1.2, ease: "power3.out" }, "-=1")
      .from(activeSlide.querySelector('p'), { opacity: 0, duration: 1, ease: "sine.inOut" }, "-=0.5");
    
    if (idx === 0) initSilk3D();
}

// ── Three.js: 3D 丝绸绸缎 ──
function initSilk3D() {
    const container = document.getElementById('silk-canvas');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(10, 10, 50, 50);
    const material = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.1 
    });
    const silk = new THREE.Mesh(geometry, material);
    scene.add(silk);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;
        const pos = geometry.attributes.position;
        for(let i=0; i<pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            pos.setZ(i, Math.sin(x * 0.5 + time) * Math.cos(y * 0.5 + time) * 0.5);
        }
        pos.needsUpdate = true;
        silk.rotation.z += 0.001;
        renderer.render(scene, camera);
    }
    animate();
}

// ── WYSIWYG (Phantom Edit) Suite ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
        
        el.addEventListener('keydown', (ke) => {
            if (ke.key === 'Enter') { ke.preventDefault(); el.blur(); }
        });
    }
});

function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const clone = document.documentElement.cloneNode(true);
    // 移除编辑工具的脚本，保留纯净展示
    const blob = new Blob([clone.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `noir-export-${Date.now()}.html`;
    a.click();
}

window.onload = () => {
    loadPersistence();
    runAnimation(0);
};
</script>
</body>
</html>
