<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom People (Platform)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .export-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            background: #E63946; /* Platform Red */
            border: 2px solid #000;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            z-index: 1000;
        }
        .export-btn:hover {
            background: #000;
            color: #E63946;
            transform: skew(-5deg);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="hero-stripe"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — THE MANIFESTO ═══════ -->
    <div class="phantom-slide active">
        <h3 class="editable-text" data-id="s0_h3">Grassroots Movement · 2026</h3>
        <h1 class="editable-text" data-id="s0_h1">POWER<br>TO THE<br>PEOPLE</h1>
        <p class="editable-text" data-id="s0_p">这就是属于我们的发声平台。拒绝沉默，用设计的力量重塑公共讨论的边界。</p>
        
        <div id="poster-3d-rolling" style="position:absolute; right:5%; top:50%; transform:translateY(-50%); width:40%; height:80vh; z-index:-1;"></div>
    </div>

    <!-- ═══════ SLIDE 1 — GLOBAL REACH ═══════ -->
    <div class="phantom-slide">
        <h3 class="editable-text" data-id="s1_h3">Universal Impact</h3>
        <h2 class="editable-text" data-id="s1_h2">Worldwide <em>Connection</em></h2>
        <div style="margin-top:2rem;">
            <p class="editable-text" data-id="s1_p" style="background:var(--accent); color:#fff; border-color:#fff;">
                连接每一个孤岛，构建真实的共鸣。我们的叙事横跨大洲，在每一个角落引起回响。
            </p>
        </div>
        <div style="display:flex; gap:4rem; margin-top:3rem;">
            <div>
                <div style="font-family:var(--font-display); font-size:6rem; line-height:1;">4.2B</div>
                <div class="editable-text" data-id="s1_l1" style="font-family:var(--font-mono); font-size:0.8rem;">POTENTIAL_REACH</div>
            </div>
            <div>
                <div style="font-family:var(--font-display); font-size:6rem; line-height:1;">100%</div>
                <div class="editable-text" data-id="s1_l2" style="font-family:var(--font-mono); font-size:0.8rem;">OPEN_ACCESS</div>
            </div>
        </div>
    </div>

</div>

<!-- ── Navigation ── -->
<div class="nav-platform">
    <div class="page-indicator" id="pageIndicator">01</div>
    <div style="cursor:pointer; font-weight:900;" onclick="nextSlide()">NEXT ISSUE →</div>
</div>

<button class="export-btn" onclick="exportHTML()">💾 Export</button>

<script>
const STORAGE_KEY = 'phantom_people_';

// ── Persistence Logic ──
function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'people-export.html';
    a.click();
    URL.revokeObjectURL(url);
}

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');
const pageIndicator = document.getElementById('pageIndicator');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    current = n;
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    if (pageIndicator) pageIndicator.textContent = String(current + 1).padStart(2, '0');
    runAnimation(current);
}

function nextSlide() { showSlide((current + 1) % slides.length); }

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Platform Animations ──
function runAnimation(idx) {
    const activeSlide = slides[idx];
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    
    const tl = gsap.timeline();
    
    if (idx === 0) {
        tl.from(activeSlide.querySelector('h1'), { 
            x: -200, skewX: 20, opacity: 0, 
            duration: 1.2, ease: "expo.out" 
        })
        .from(activeSlide.querySelector('h3'), { opacity: 0, y: -20, duration: 0.5 }, "-=0.8")
        .from(activeSlide.querySelector('p'), { 
            scaleY: 0, transformOrigin: "top", 
            duration: 0.8, ease: "power3.out" 
        }, "-=0.6");
        initPoster3D();
    }
    
    if (idx === 1) {
        tl.from(activeSlide.querySelector('h2'), { 
            rotation: -10, scale: 0.5, opacity: 0, 
            duration: 0.8, ease: "back.out(2)" 
        })
        .from(activeSlide.querySelector('p'), { x: 100, opacity: 0, duration: 0.6 }, "-=0.4")
        .from(activeSlide.querySelectorAll('div > div'), { 
            y: 50, opacity: 0, stagger: 0.2, 
            duration: 0.8, ease: "power4.out" 
        }, "-=0.4");
    }
}

// ── Three.js: 3D 卷动海报 ──
function initPoster3D() {
    const container = document.getElementById('poster-3d-rolling');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // 模拟弯曲的海报几何体
    const geometry = new THREE.CylinderGeometry(5, 5, 12, 32, 1, true, 0, Math.PI);
    const material = new THREE.MeshBasicMaterial({ 
        color: 0xE63946, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.3 
    });
    const poster = new THREE.Mesh(geometry, material);
    poster.rotation.x = Math.PI / 2;
    scene.add(poster);

    function animate() {
        if (current !== 0) return;
        requestAnimationFrame(animate);
        poster.rotation.y += 0.01;
        renderer.render(scene, camera);
    }
    animate();
}

// ── WYSIWYG (所见即所得) 核心交互套件 ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        // 视觉反馈：革命红反色高亮
        el.style.outline = 'none';
        el.style.background = '#E63946';
        el.style.color = '#fff';
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            el.style.background = 'none';
            el.style.color = '';
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
        
        el.addEventListener('keydown', (ke) => {
            if (ke.key === 'Enter') {
                ke.preventDefault();
                el.blur();
            }
        });
    }
});

// Init
window.onload = () => {
    loadPersistence();
    runAnimation(0);
};
</script>
</body>
</html>
