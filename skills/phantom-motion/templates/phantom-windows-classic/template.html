<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom Windows (Classic)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .export-btn {
            position: fixed;
            bottom: 45px;
            right: 10px;
            padding: 4px 12px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            color: #000;
            cursor: pointer;
            font-family: "MS Sans Serif", "Tahoma", sans-serif;
            font-size: 11px;
            transition: none;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .export-btn:active {
            border-color: #808080 #fff #fff #808080;
            padding: 5px 11px 3px 13px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="win-3d-stack"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — Desktop ═══════ -->
    <div class="phantom-slide active">
        <div class="window relief">
            <div class="title-bar">
                <span>System Properties</span>
                <div style="display:flex; gap:2px;">
                    <button class="btn-classic" style="padding:0 4px; min-width:18px;">?</button>
                    <button class="btn-classic" style="padding:0 4px; min-width:18px;">×</button>
                </div>
            </div>
            <div class="window-body">
                <h1 class="editable-text" data-id="s0_h1">PhantomOS v1995</h1>
                <div class="relief-inset" style="padding:1.5rem; background:white;">
                    <h2 class="editable-text" data-id="s0_h2">Welcome to the <em>Future</em>.</h2>
                    <p class="editable-text" data-id="s0_p">正在启动核心驱动程序。检测到 640KB 常规内存（这已经足够任何人使用了）。系统已准备好进行多媒体叙事。</p>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button class="btn-classic" onclick="nextSlide()">OK</button>
                    <button class="btn-classic">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════ SLIDE 1 — Multimedia ═══════ -->
    <div class="phantom-slide">
        <div class="window relief" style="width:600px;">
            <div class="title-bar">
                <span>Aether Media Player</span>
                <button class="btn-classic" style="padding:0 4px; min-width:18px;">×</button>
            </div>
            <div class="window-body">
                <h2 class="editable-text" data-id="s1_h2">High Fidelity <em>Motion</em></h2>
                <div style="background:#000; height:200px; display:flex; align-items:center; justify-content:center; color:var(--accent);">
                    <div class="editable-text" data-id="s1_viz" style="font-family:var(--font-mono);">[ VISUALIZATION_ACTIVE ]</div>
                </div>
                <p class="editable-text" data-id="s1_p">支持 256 色超级 VGA 渲染与全双工 16 位音频输出。体验前所未有的数字震撼。</p>
            </div>
        </div>
    </div>

</div>

<!-- ── Taskbar ── -->
<div class="taskbar relief">
    <button class="btn-classic start-btn relief">
        <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="16" alt="">
        Start
    </button>
    <div style="width:2px; height:20px; background:var(--win-dark); margin:0 5px;"></div>
    <div class="relief-inset" style="padding:2px 10px; font-size:0.75rem; flex:1;">
        Phantom Motion - Creative Suite
    </div>
    <div class="relief-inset" style="padding:2px 8px; font-size:0.75rem;" id="timer">
        12:00 PM
    </div>
</div>

<button class="export-btn" onclick="exportHTML()">💾 Export</button>

<script>
const STORAGE_KEY = 'phantom_windows_';

// ── Persistence Logic ──
function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'windows-export.html';
    a.click();
    URL.revokeObjectURL(url);
}

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    current = n;
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    runAnimation(current);
}

function nextSlide() { showSlide((current + 1) % slides.length); }

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Boot Sequence ──
function runAnimation(idx) {
    const tl = gsap.timeline();
    const activeSlide = slides[idx];
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    const win = activeSlide.querySelector('.window');
    
    tl.from(win, { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(1.7)" })
      .from(activeSlide.querySelectorAll('.editable-text'), { opacity: 0, y: 10, stagger: 0.1, duration: 0.5 });
    
    if (idx === 0) initWin3D();
}

// ── Three.js: 3D 窗口堆叠 ──
function initWin3D() {
    const container = document.getElementById('win-3d-stack');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 20;

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // 创建多个漂浮的 3D 灰色方块（模拟窗口）
    const geometry = new THREE.BoxGeometry(8, 6, 0.2);
    const material = new THREE.MeshBasicMaterial({ color: 0xc0c0c0, wireframe: true, transparent: true, opacity: 0.1 });
    
    for(let i=0; i<5; i++) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*15, -i*5);
        scene.add(mesh);
        gsap.to(mesh.position, { z: "+=20", duration: 15, repeat: -1, ease: "none" });
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
}

// ── WYSIWYG (所见即所得) 核心交互套件 ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        // 视觉反馈：经典的 Windows 选色高亮
        const originalBg = el.style.background;
        const originalColor = el.style.color;
        el.style.outline = 'none';
        el.style.background = '#000080';
        el.style.color = '#ffffff';
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            el.style.background = originalBg;
            el.style.color = originalColor;
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
        
        // 支持回车完成编辑
        el.addEventListener('keydown', (ke) => {
            if (ke.key === 'Enter') {
                ke.preventDefault();
                el.blur();
            }
        });
    }
});

// ── Clock ──
setInterval(() => {
    const now = new Date();
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}, 1000);

// Init
window.onload = () => {
    loadPersistence();
    runAnimation(0);
};
</script>
</body>
</html>
