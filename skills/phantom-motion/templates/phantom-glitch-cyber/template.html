<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Glitch Cyber</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div id="deck-container">
        <section class="slide active" id="slide-1">
            <h1 class="editable-text" data-id="cyber-s1-h1" contenteditable="true">CYBER_CORE</h1>
            <p class="editable-text" data-id="cyber-s1-p1" contenteditable="true">// ACCESS GRANTED: THE FUTURE OF VISUALS IS HERE</p>
        </section>
        <section class="slide" id="slide-2">
            <h1 class="editable-text" data-id="cyber-s2-h1" contenteditable="true">ERROR_404</h1>
            <p class="editable-text" data-id="cyber-s2-p1" contenteditable="true">// SYSTEM BREACH: DECONSTRUCTING TRADITIONAL LAYOUTS</p>
        </section>
    </div>

    <div id="controls">
        <button id="export-btn">💾 Export</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.contentEditable === 'true') return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            const activeSlide = slides[currentSlide];
            activeSlide.classList.add('active');
            runAnimation(activeSlide);
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function runAnimation(activeSlide) {
            gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
            
            const h1 = activeSlide.querySelector('h1');
            const p = activeSlide.querySelector('p');

            // Glitch Effect
            gsap.from(h1, {
                duration: 0.1,
                x: () => Math.random() * 20 - 10,
                repeat: 5,
                yoyo: true,
                ease: "none",
                opacity: 0.5
            });

            gsap.from(h1, {
                duration: 0.5,
                opacity: 0,
                y: -50,
                ease: "power4.out"
            });

            gsap.from(p, {
                duration: 1,
                opacity: 0,
                x: -100,
                delay: 0.3,
                ease: "steps(20)"
            });
        }

        document.querySelectorAll('.editable-text').forEach(el => {
            const id = el.getAttribute('data-id');
            const saved = localStorage.getItem(id);
            if (saved) el.innerText = saved;
            el.addEventListener('input', () => {
                localStorage.setItem(id, el.innerText);
            });
        });

        document.getElementById('export-btn').onclick = () => {
            const content = document.documentElement.outerHTML;
            const blob = new Blob([content], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'cyber-deck.html';
            a.click();
        };

        runAnimation(slides[0]);
    </script>
</body>
</html>
