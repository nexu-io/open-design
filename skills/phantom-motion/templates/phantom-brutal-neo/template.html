<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom Brutal (Neo)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .export-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: #FF00FF; /* Brutal Magenta */
            border: 4px solid #000;
            color: #000;
            cursor: pointer;
            font-family: 'Archivo Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s;
            z-index: 1000;
            box-shadow: 8px 8px 0px #000;
        }
        .export-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px #000;
            background: #00FF00; /* Brutal Green */
        }
        .export-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="brutal-3d-scene" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; opacity:0.8;"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — RAW POWER ═══════ -->
    <div class="phantom-slide active">
        <h3 class="editable-text" data-id="s0_h3">Neo-Brutalism Manifest · 2026</h3>
        <h1><span class="editable-text" data-id="s0_h1_1">UNFILTERED</span><br><span class="editable-text" data-id="s0_h1_2">CREATIVITY</span></h1>
        <p class="editable-text" data-id="s0_p">
            拒绝妥协，拥抱真实。用最生猛的代码，构建最硬核的视觉。
        </p>
        <div style="margin-top:2rem; display:flex; gap:10px;">
            <div class="pill editable-text" data-id="s0_p1">#DESIGN_REBEL</div>
            <div class="pill editable-text" data-id="s0_p2">#BOLD_GRID</div>
        </div>
    </div>

    <!-- ═══════ SLIDE 1 — DATA STACK ═══════ -->
    <div class="phantom-slide">
        <h3 class="editable-text" data-id="s1_h3">Structural Analysis</h3>
        <div class="brutal-card">
            <h2 class="editable-text" data-id="s1_h2">Direct <em>Impact</em></h2>
            <p class="editable-text" data-id="s1_p">
                新野兽派不相信层级，只相信冲击。每一个像素都在尖叫，每一个布局都在对抗平庸。
            </p>
            <div style="margin-top:2rem; display:flex; gap:3rem;">
                <div>
                    <div style="font-size:3.5rem; font-weight:900;">24/7</div>
                    <div class="editable-text" data-id="s1_l1" style="font-family:var(--font-mono); font-size:0.8rem;">UPTIME_AGENCY</div>
                </div>
                <div>
                    <div style="font-size:3.5rem; font-weight:900;">+400%</div>
                    <div class="editable-text" data-id="s1_l2" style="font-family:var(--font-mono); font-size:0.8rem;">VISUAL_DENSITY</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ── Navigation ── -->
<div class="nav-brutal">
    <div class="btn-brutal" onclick="showSlide(0)">A</div>
    <div class="btn-brutal" onclick="showSlide(1)">B</div>
</div>

<button class="export-btn" onclick="exportHTML()">💾 Export</button>

<script>
const STORAGE_KEY = 'phantom_brutal_';

// ── Persistence Logic ──
function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'brutal-export.html';
    a.click();
    URL.revokeObjectURL(url);
}

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    current = n;
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    runAnimation(current);
}

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') showSlide((current + 1) % slides.length);
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Punchy Animations ──
function runAnimation(idx) {
    const activeSlide = slides[idx];
    
    // 核心修复：在开始新动画前，清理 slide 内所有元素的旧动画状态
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    
    const tl = gsap.timeline();
    
    if (idx === 0) {
        tl.from(activeSlide.querySelectorAll('h1 span'), { 
            scale: 0, opacity: 0, rotation: -10, 
            duration: 0.8, stagger: 0.2, ease: "back.out(2)" 
        })
        .from(activeSlide.querySelector('h3'), { x: -100, opacity: 0, duration: 0.5 }, "-=0.4")
        .from(activeSlide.querySelector('p'), { opacity: 0, y: 30, duration: 0.6 }, "-=0.2")
        .from(activeSlide.querySelectorAll('.pill'), { scale: 0, stagger: 0.1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, "-=0.3");
    }
    
    if (idx === 1) {
        tl.from(activeSlide.querySelector('.brutal-card'), { 
            x: 100, rotation: 5, opacity: 0, duration: 0.8, ease: "power4.out" 
        })
        .from(activeSlide.querySelectorAll('div > div'), { 
            y: 40, opacity: 0, stagger: 0.2, duration: 0.6, ease: "back.out(1.7)" 
        }, "-=0.4");
    }
}

// ── Three.js: 3D 漂浮卡片矩阵 ──
function initBrutal3D() {
    const container = document.getElementById('brutal-3d-scene');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // 创建彩色粗边框方块
    const colors = [0xFFFF00, 0xFF00FF, 0x00FF00, 0x00A3FF];
    for (let i = 0; i < 8; i++) {
        const geometry = new THREE.BoxGeometry(2, 2, 0.5);
        const material = new THREE.MeshBasicMaterial({ color: colors[i % colors.length] });
        const mesh = new THREE.Mesh(geometry, material);
        
        // 粗黑边框线
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 4 }));
        mesh.add(line);
        
        mesh.position.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 10);
        mesh.rotation.set(Math.random(), Math.random(), Math.random());
        group.add(mesh);
        
        gsap.to(mesh.position, {
            y: "+=2", duration: 2 + Math.random() * 2, repeat: -1, yoyo: true, ease: "sine.inOut"
        });
        gsap.to(mesh.rotation, {
            x: Math.PI * 2, y: Math.PI * 2, duration: 10 + Math.random() * 10, repeat: -1, ease: "none"
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // 鼠标视差
    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;
        gsap.to(group.rotation, { x: y * 0.2, y: x * 0.2, duration: 1 });
    });
}

// ── WYSIWYG (所见即所得) 核心交互套件 ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        // 视觉反馈：霓虹黄高亮块
        const originalBg = el.style.background;
        el.style.outline = '4px solid #000';
        el.style.background = '#FF0';
        el.style.boxShadow = '5px 5px 0px #000';
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            el.style.outline = 'none';
            el.style.background = originalBg;
            el.style.boxShadow = 'none';
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
        
        el.addEventListener('keydown', (ke) => {
            if (ke.key === 'Enter') {
                ke.preventDefault();
                el.blur();
            }
        });
    }
});

// Init
window.onload = () => {
    loadPersistence();
    initBrutal3D();
    runAnimation(0);
};
</script>
</body>
</html>
