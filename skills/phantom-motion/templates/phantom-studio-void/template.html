<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phantom Studio (Void)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .export-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            cursor: pointer;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 1000;
        }
        .export-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="grain"></div>

<div class="phantom-deck" id="deck">

    <!-- ═══════ SLIDE 0 — Hero ═══════ -->
    <div class="phantom-slide active">
        <h3 class="editable-text" data-id="s0_h3">Studio Collective · Autumn 2026</h3>
        <h1 class="editable-text" data-id="s0_h1">VOID <em>&</em><br>SUBSTANCE</h1>
        <div class="vertical-line"></div>
        <p class="editable-text" data-id="s0_p">在极简的留白中，探索物质与空间的平衡。这是一场关于纯粹美学的视觉实验。</p>
        
        <div id="void-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; opacity:0.6;"></div>
    </div>

    <!-- ═══════ SLIDE 1 — Narrative ═══════ -->
    <div class="phantom-slide">
        <div class="void-grid">
            <div>
                <h3 class="editable-text" data-id="s1_h3">Design Philosophy</h3>
                <h2 class="editable-text" data-id="s1_h2">Less, but <em>Better</em></h2>
                <p style="text-align:left; max-width:100%;" class="editable-text" data-id="s1_p1">
                    我们摒弃一切多余的装饰，只保留最核心的元素。通过光影的交织与材质的质感，
                    在虚无中构建出坚实的视觉存在。
                </p>
                <p style="text-align:left; max-width:100%; margin-top:2rem; font-style:italic;" class="editable-text" data-id="s1_p2">
                    "Simplicity is the ultimate sophistication."
                </p>
            </div>
            <div id="detail-canvas" style="height:500px; width:100%; position:relative;"></div>
        </div>
    </div>

</div>

<!-- ── UI Chrome ── -->
<div class="nav-info">
    <div class="slide-num" id="slideNum">01</div>
    <div style="width:40px; height:1px; background:var(--muted);"></div>
    <div style="cursor:pointer;" onclick="nextSlide()">NEXT →</div>
</div>

<div class="footer-brand">© 2026 Studio Void · AetherViz Collective</div>

<button class="export-btn" onclick="exportHTML()">💾 Export</button>

<script>
const STORAGE_KEY = 'phantom_void_';

// ── Persistence Logic ──
function loadPersistence() {
    document.querySelectorAll('.editable-text').forEach(el => {
        const saved = localStorage.getItem(STORAGE_KEY + el.dataset.id);
        if (saved) el.innerText = saved;
    });
}

function exportHTML() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'void-export.html';
    a.click();
    URL.revokeObjectURL(url);
}

// ── Core Engine ──
let current = 0;
const slides = document.querySelectorAll('.phantom-slide');
const slideNumEl = document.getElementById('slideNum');

function showSlide(n) {
    slides[current].classList.remove('active');
    slides[current].style.display = 'none';
    
    current = n;
    
    slides[current].style.display = 'flex';
    void slides[current].offsetWidth; 
    slides[current].classList.add('active');
    slideNumEl.textContent = String(current + 1).padStart(2, '0');
    
    runAnimation(current);
}

function nextSlide() { showSlide((current + 1) % slides.length); }

document.addEventListener('keydown', (e) => {
    if (document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') showSlide((current - 1 + slides.length) % slides.length);
});

// ── GSAP Cinematic Animations ──
function runAnimation(idx) {
    const tl = gsap.timeline();
    const activeSlide = slides[idx];
    gsap.set(activeSlide.querySelectorAll('*'), { clearProps: "all" });
    
    if (idx === 0) {
        tl.from(activeSlide.querySelector('h3'), { opacity: 0, y: 20, duration: 1, ease: 'power3.out' })
          .from(activeSlide.querySelector('h1'), { opacity: 0, y: 40, duration: 1.5, ease: 'power4.out' }, '-=0.6')
          .from(activeSlide.querySelector('.vertical-line'), { height: 0, duration: 1, ease: 'power2.inOut' }, '-=1')
          .from(activeSlide.querySelector('p'), { opacity: 0, y: 20, duration: 1 }, '-=0.5');
        initVoidCanvas();
    }
    
    if (idx === 1) {
        tl.from(activeSlide.querySelector('h3'), { opacity: 0, x: -30, duration: 1 })
          .from(activeSlide.querySelector('h2'), { opacity: 0, y: 30, duration: 1.2, ease: 'power3.out' }, '-=0.6')
          .from(activeSlide.querySelectorAll('p'), { opacity: 0, x: 20, stagger: 0.3, duration: 1 }, '-=0.8');
        initDetailCanvas();
    }
}

// ── Three.js: 抽象虚空几何 ──
let voidRenderer, detailRenderer;

function initVoidCanvas() {
    const container = document.getElementById('void-canvas');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    voidRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    voidRenderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(voidRenderer.domElement);

    // 巨大的线框球体作为背景
    const geometry = new THREE.IcosahedronGeometry(15, 2);
    const material = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.05 
    });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    function animate() {
        if (current !== 0) return;
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.001;
        sphere.rotation.x += 0.0005;
        voidRenderer.render(scene, camera);
    }
    animate();
}

function initDetailCanvas() {
    const container = document.getElementById('detail-canvas');
    if (container.querySelector('canvas')) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 5;

    detailRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    detailRenderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(detailRenderer.domElement);

    // 漂浮的立方体
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
    scene.add(line);

    gsap.to(line.position, { y: 0.3, duration: 2, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    gsap.to(line.rotation, { y: Math.PI * 2, x: Math.PI, duration: 10, repeat: -1, ease: 'none' });

    function animate() {
        if (current !== 1) return;
        requestAnimationFrame(animate);
        detailRenderer.render(scene, camera);
    }
    animate();
}

// ── WYSIWYG (所见即所得) 核心交互 ──
document.addEventListener('dblclick', (e) => {
    const el = e.target;
    if (el.classList.contains('editable-text')) {
        el.contentEditable = 'true';
        el.focus();
        
        // 视觉反馈：极简的白线下划线
        el.style.outline = 'none';
        el.style.borderBottom = '1px solid #fff';
        el.style.opacity = '0.8';
        
        const finishEditing = () => {
            el.contentEditable = 'false';
            el.style.borderBottom = 'none';
            el.style.opacity = '1';
            localStorage.setItem(STORAGE_KEY + el.dataset.id, el.innerText);
            el.removeEventListener('blur', finishEditing);
        };
        el.addEventListener('blur', finishEditing);
    }
});

// Start
window.onload = () => {
    loadPersistence();
    runAnimation(0);
};

// Handle resize
window.addEventListener('resize', () => {
    if (voidRenderer) voidRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
