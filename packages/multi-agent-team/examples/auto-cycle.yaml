# 循环求精模式 — 智能组队
# 自动选择最佳 Generator（创意生成）和 Reviewer（批判评审）配对
team:
  name: "智能迭代团队"
  mode: cycle
  auto_assign: true
  
  agents:
    - id: generator
      name: "创意生成器"
      role: "创意文案"
      skills: ["brand-copywriting", "creative-writing"]
      
    - id: reviewer
      name: "品牌审查"
      role: "文案评审"
      skills: ["copy-review", "critique"]
      
  cycle:
    generator_id: generator
    reviewer_id: reviewer
    max_iterations: 5
    score_threshold: 8.0
