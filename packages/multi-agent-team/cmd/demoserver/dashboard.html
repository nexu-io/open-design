<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenDesign Team Studio</title>
<style>
:root{--bg:#070912;--panel:#0d1220;--panel2:#12192b;--panel3:#182036;--line:#25304a;--line2:#33415f;--txt:#eef3ff;--muted:#91a0bd;--dim:#61708f;--brand:#7c5cff;--brand2:#20d6ff;--ok:#2ee68b;--warn:#ffc857;--bad:#ff5c7a;--pink:#ff69c8;--orange:#ff9f43;--shadow:0 24px 80px rgba(0,0,0,.45);--r:16px;--r2:24px;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"JetBrains Mono","SFMono-Regular",monospace}
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;overflow:hidden;background:radial-gradient(circle at 25% -10%,rgba(124,92,255,.28),transparent 34%),radial-gradient(circle at 85% 10%,rgba(32,214,255,.16),transparent 32%),linear-gradient(180deg,#070912,#0a0d17 54%,#070912);color:var(--txt);font-family:var(--font)}button,input,select,textarea{font-family:inherit}button{cursor:pointer}#app{height:100vh;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,11,20,.72);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 34px rgba(124,92,255,.5);display:grid;place-items:center;font-weight:900}.brand h1{font-size:16px;letter-spacing:.2px}.brand p{font-size:11px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:rgba(18,25,43,.75);border-radius:999px;color:var(--muted);padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 14px rgba(46,230,139,.6)}.primary{background:linear-gradient(135deg,var(--brand),#9d7bff);border:none;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 12px 32px rgba(124,92,255,.28)}.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:9px 13px}.main{display:grid;grid-template-columns:300px 1fr 410px;min-height:0}.left,.right{background:rgba(13,18,32,.78);backdrop-filter:blur(18px);border-color:rgba(255,255,255,.08)}.left{border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0}.right{border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0}.section-h{padding:18px 18px 12px}.eyebrow{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.4px}.section-h h2{font-size:15px;margin-top:5px}.search{margin:0 16px 10px;position:relative}.search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:11px 12px 11px 34px;outline:none}.search:before{content:"⌕";position:absolute;left:13px;top:9px;color:var(--dim)}.agent-groups{overflow:auto;padding:0 12px 16px}.group-title{font-size:11px;color:var(--muted);margin:14px 6px 8px;display:flex;justify-content:space-between}.agent{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid transparent;border-radius:14px;background:rgba(255,255,255,.025);margin-bottom:7px;transition:.18s}.agent:hover{background:rgba(124,92,255,.1);border-color:rgba(124,92,255,.35);transform:translateX(2px)}.agent.dragging{opacity:.45}.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(32,214,255,.16));color:#dfe7ff}.agent-meta{min-width:0;flex:1}.agent-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-id{font:10px var(--mono);color:var(--dim);margin-top:2px}.tag{font-size:10px;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.06);color:var(--muted)}.tag.ready{background:rgba(46,230,139,.1);color:var(--ok)}.tag.off{background:rgba(255,92,122,.08);color:var(--bad)}.tag.warn{background:rgba(255,200,87,.12);color:var(--warn);cursor:pointer}.tag.ok{background:rgba(32,214,255,.1);color:var(--brand2)}.center{display:flex;flex-direction:column;min-width:0;min-height:0}.modebar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.06)}.modes{display:flex;gap:8px;flex-wrap:wrap}.mode{border:1px solid var(--line);background:rgba(18,25,43,.72);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px}.mode.active{background:linear-gradient(135deg,rgba(124,92,255,.95),rgba(32,214,255,.7));color:#fff;border-color:transparent}
/* 中间画布区自适应高度：flex:1 撑满，内部 auto 滚动 */
.canvas-wrap{flex:1;min-height:0;overflow:auto;padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px}
.hero-card{border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(18,25,43,.86),rgba(12,16,28,.78));box-shadow:var(--shadow);border-radius:var(--r2);padding:18px;max-width:980px;margin:0 auto;width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
/* Tab 切换栏 */
.team-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line)}.team-tab{background:none;border:none;color:var(--muted);padding:10px 18px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:.16s}.team-tab:hover{color:var(--txt)}.team-tab.active{color:var(--brand2);border-bottom-color:var(--brand2)}
.workflow-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.workflow-head h2{font-size:22px}.workflow-head p{color:var(--muted);font-size:13px;margin-top:6px}.template-row{display:flex;gap:8px;flex-wrap:wrap}.template{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:8px 10px;font-size:12px}.template:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,92,255,.12)}.template.active{border-color:var(--brand2);background:rgba(32,214,255,.08);color:var(--brand2)}
/* 推荐编队卡片网格 */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}.rec-card{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.14s}.rec-card:hover{border-color:var(--brand);background:rgba(124,92,255,.08)}.rec-card.active{border-color:var(--brand2);background:rgba(32,214,255,.06)}.rec-card b{font-size:13px;display:block}.rec-card p{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}.rec-card .rec-mode{font:9px var(--mono);color:var(--brand2);margin-top:6px;display:inline-block;padding:2px 6px;border-radius:999px;background:rgba(32,214,255,.08)}.rec-card .rec-agents{font-size:9px;color:var(--dim);margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}.rec-agent-chip{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.06);border-radius:6px;padding:2px 5px;font-size:9px}.rec-agent-chip .dot-sm{width:6px;height:6px;border-radius:50%}
/* dropzone 自适应高度：min-height 缩小，内容撑开 */
.dropzone{min-height:120px;border:1.5px dashed rgba(124,92,255,.34);border-radius:22px;background:radial-gradient(circle at 50% 0,rgba(124,92,255,.12),transparent 40%),rgba(255,255,255,.02);padding:20px;position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;transition:min-height .2s}.dropzone.over{border-color:var(--brand2);background:rgba(32,214,255,.06)}.dropzone.has-team{min-height:auto;align-items:stretch;justify-content:flex-start;padding:20px}.placeholder{text-align:center;color:var(--muted);line-height:1.8}.placeholder b{color:#fff}.node{position:relative;width:220px;min-height:220px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(24,32,54,.94),rgba(14,20,35,.94));border-radius:20px;padding:18px;box-shadow:0 18px 42px rgba(0,0,0,.22);flex-shrink:0}.node:before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(124,92,255,.8),rgba(32,214,255,.45),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.node-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.node .avatar{width:48px;height:48px;border-radius:14px;font-size:18px}.node-title{font-size:14px;font-weight:800}.node-sub{font:11px var(--mono);color:var(--dim);margin-top:3px}.node label{display:block;font-size:11px;color:var(--dim);margin:10px 0 5px}.node input,.node select{width:100%;background:rgba(7,9,18,.7);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:12px;outline:none}.remove{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted)}.remove:hover{background:var(--bad);color:#fff}.edge{font-size:24px;color:var(--brand2);opacity:.8;align-self:center}.prompt-box{max-width:980px;margin:0 auto 0;width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;flex-shrink:0}.prompt-box textarea{min-height:92px;background:rgba(18,25,43,.86);border:1px solid var(--line);border-radius:18px;color:var(--txt);padding:14px;outline:none;resize:vertical}.prompt-actions{display:flex;flex-direction:column;gap:8px}.right-h{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}.right-h h2{font-size:15px}.timer{font:12px var(--mono);color:var(--brand2)}.output{flex:1;overflow:auto;padding:14px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim);font-size:13px}.run-agent{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:15px;padding:11px;margin-bottom:8px}.run-agent.running{border-color:rgba(46,230,139,.6);box-shadow:0 0 24px rgba(46,230,139,.08)}.status{font-size:10px;border-radius:999px;padding:4px 8px;margin-left:auto}.idle{background:rgba(255,255,255,.06);color:var(--muted)}.running-b{background:rgba(46,230,139,.12);color:var(--ok)}.done{background:rgba(32,214,255,.12);color:var(--brand2)}.err{background:rgba(255,92,122,.12);color:var(--bad)}.log{font:11px var(--mono);color:var(--muted);line-height:1.65;margin:4px 0}.log.ok{color:var(--ok)}.log.err{color:var(--bad)}.artifact{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:15px;padding:12px;margin:10px 0}.artifact b{font-size:13px}.artifact p{font-size:11px;color:var(--dim);margin-top:5px}.preview{height:260px;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-top:10px;background:#fff}.preview iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:1180px){.main{grid-template-columns:260px 1fr}.right{display:none}}@media(max-width:820px){.main{grid-template-columns:1fr}.left{display:none}.top-actions{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo">OD</div><div><h1>OpenDesign Team Studio</h1><p>内嵌在 OpenDesign 的多 Agent 组队编排能力，不是独立工具</p></div></div>
    <div class="top-actions"><div class="pill"><span class="dot" id="conn-dot"></span><span id="conn-text">检测服务...</span></div><button class="primary" id="run-btn" onclick="runTeam()">运行团队</button></div>
  </header>
  <main class="main">
    <aside class="left">
      <div class="section-h"><div class="eyebrow">OpenDesign Runtime</div><h2>可用 Agent 能力</h2></div>
      <div class="search"><input id="agent-search" oninput="renderAgents()" placeholder="搜索 Claude / Codex / Cursor..."></div>
      <div class="agent-groups" id="agent-list"></div>
    </aside>
    <section class="center">
      <div class="modebar"><div><div class="eyebrow">OpenDesign 内嵌组队模式</div></div><div class="modes" id="modes"></div></div>
      <div class="canvas-wrap">
        <div class="hero-card">
          <div class="team-tabs">
            <button class="team-tab active" id="tab-recommend" onclick="switchTab('recommend')">系统推荐编队</button>
            <button class="team-tab" id="tab-custom" onclick="switchTab('custom')">自定义组队</button>
          </div>
          <!-- 系统推荐面板 -->
          <div id="panel-recommend">
            <div class="workflow-head"><div><h2>选择推荐编队</h2><p id="mode-desc">面向普通用户：选择编队，自动组队，运行即可。</p></div></div>
            <div class="rec-grid" id="rec-grid"></div>
            <div id="rec-preview" style="display:none;margin-top:14px"><div class="eyebrow" style="margin-bottom:10px">当前编队</div><div id="rec-team-nodes" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"></div></div>
          </div>
          <!-- 自定义组队面板 -->
          <div id="panel-custom" style="display:none">
            <div class="workflow-head"><div><h2>自定义组队</h2><p>从左侧拖拽 Agent 到下方画布，自由编排角色与协作模式。</p></div></div>
            <div class="dropzone" id="dropzone" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropAgent(event)"><div class="placeholder">把左侧 Agent 能力拖到这里组队<br><b>拖入后可编辑角色和运行时类型</b></div></div>
          </div>
        </div>
        <div class="prompt-box"><textarea id="prompt">为 OpenDesign 生成一个现代 SaaS 落地页 Hero 区块，并输出可用于 PR 演示的视频素材说明和 HTML 产物。</textarea><div class="prompt-actions"><button class="primary" onclick="runTeam()">▶ Run</button><button class="ghost" onclick="clearTeam()">清空</button></div></div>
      </div>
    </section>
    <aside class="right"><div class="right-h"><h2>实时执行</h2><span class="timer" id="timer"></span></div><div class="output" id="output"><div class="empty">等待编队运行<br>这里会显示 Agent 状态、日志和产物预览</div></div></aside>
  </main>
</div>
<script>
let agents=[],team=[],mode='hybrid',running=false;
let activeTab='recommend';
const modes=[['inheritance','继承链','父子上下文继承，逐步细化'],['parallel','并行','多 Agent 同时执行，结果汇总'],['serial','串行','阶段链式传递，顺序执行'],['genetic','遗传','多代进化，择优迭代'],['hybrid','混合','分层并行，层间串行'],['cycle','循环','生成→评审往返，达阈值退出'],['complementary','互补','专家链式交接，按序传递']];
const colors=['#7c5cff','#20d6ff','#ff69c8','#2ee68b','#ffc857','#ff9f43','#a855f7'];
// Agent 安装/官网链接（id → {install, docs}）
const agentLinks={
'amr':{install:'https://github.com/nexu-io/open-design',docs:'https://github.com/nexu-io/open-design'},
'claude':{install:'https://docs.anthropic.com/en/docs/claude-code/overview',docs:'https://claude.ai'},
'codex':{install:'https://github.com/openai/codex',docs:'https://openai.com/codex'},
'devin':{install:'https://devin.ai',docs:'https://docs.devin.ai'},
'gemini':{install:'https://github.com/google-gemini/gemini-cli',docs:'https://gemini.google.com'},
'opencode':{install:'https://opencode.ai/docs/install',docs:'https://opencode.ai'},
'hermes':{install:'https://github.com/nexu-io/hermes',docs:'https://github.com/nexu-io/hermes'},
'trae-cli':{install:'https://github.com/bytedance/trae-cli',docs:'https://www.trae.ai'},
'grok-build':{install:'https://x.ai/cli',docs:'https://x.ai/cli'},
'kimi':{install:'https://github.com/MoonshotAI/kimi-cli',docs:'https://platform.moonshot.cn'},
'cursor-agent':{install:'https://docs.cursor.com/agent/cli',docs:'https://cursor.com'},
'qwen':{install:'https://github.com/QwenLM/qwen-code',docs:'https://tongyi.aliyun.com/qianwen'},
'qoder':{install:'https://github.com/qoder-dev/qoder-cli',docs:'https://qoder.ai'},
'copilot':{install:'https://docs.github.com/en/copilot/using-github-copilot/using-github-copilot-in-the-command-line',docs:'https://github.com/features/copilot'},
'pi':{install:'https://github.com/justgoodin/pi-cli',docs:'https://github.com/justgoodin/pi-cli'},
'kiro':{install:'https://kiro.dev',docs:'https://kiro.dev/docs'},
'kilo':{install:'https://github.com/kilo-dev/kilo',docs:'https://github.com/kilo-dev/kilo'},
'vibe':{install:'https://github.com/mistralai/vibe-cli',docs:'https://mistral.ai'},
'deepseek':{install:'https://github.com/deepseek-ai/DeepSeek-TUI',docs:'https://platform.deepseek.com'},
'aider':{install:'https://aider.chat/docs/install.html',docs:'https://aider.chat'},
'antigravity':{install:'https://antigravity.google/cli',docs:'https://antigravity.google/docs/cli-overview'},
'reasonix':{install:'https://github.com/esengine/DeepSeek-Reasonix',docs:'https://esengine.github.io/DeepSeek-Reasonix/'},
};
// 推荐编队卡片 —— 覆盖全部 7 种协作模式
const recs=[
  {id:'design',name:'设计交付队',mode:'complementary',desc:'设计总监→UI 构建→质量审查，专家链式交接',roles:[['hermes,claude,codex','Creative Director'],['opencode,codex,cursor,windsurf,trae,qoder','UI Builder'],['codex,claude,qwen','QA Reviewer']]},
  {id:'review',name:'生成评审队',mode:'cycle',desc:'生成器↔评审循环打磨，达阈值退出',roles:[['hermes,claude','Generator'],['codex,qwen,deepseek','Reviewer']]},
  {id:'full',name:'完整 PR 演示队',mode:'hybrid',desc:'策略→实现→视觉→基准分析，分层并行+层间串行',roles:[['hermes,claude','Strategy Planner'],['codex,deepseek','Implementation Agent'],['cursor,windsurf,trae,qoder','Visual Builder'],['opencode,gemini,kimi','Benchmark Analyst']]},
  {id:'pair',name:'结对编程队',mode:'serial',desc:'两个 Agent 串行交接：实现→审查',roles:[['codex,claude,hermes','Implementer'],['codex,claude,qwen','Reviewer']]},
  {id:'parallel',name:'并行竞速队',mode:'parallel',desc:'多 Agent 同层并行执行，最快结果汇总',roles:[['codex,claude,hermes','Builder A'],['opencode,gemini','Builder B'],['deepseek,qwen','Builder C']]},
  {id:'inherit',name:'继承细化队',mode:'inheritance',desc:'父子 Agent 上下文继承，逐步细化产物',roles:[['hermes,claude','Planner'],['codex,deepseek','Developer'],['qwen,opencode','Refiner']]},
  {id:'genetic',name:'遗传进化队',mode:'genetic',desc:'多代并行生成变体→择优→下一代进化',roles:[['codex,hermes','Variant A'],['claude,opencode','Variant B'],['deepseek,qwen','Variant C']]},
];
document.addEventListener('DOMContentLoaded',()=>{renderModes();loadAgents();renderRecs();refreshCanvas()});
function cap(s){return (s||'?').slice(0,1).toUpperCase()}function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function groupOf(a){const id=(a.id+' '+a.name+' '+a.command).toLowerCase();if(/claude|codex|gemini|opencode|hermes|deepseek|aider|reasonix|qwen|kimi/.test(id))return '核心推理 / 代码 Agent';if(/cursor|copilot|trae|qoder|kiro|kilo|vibe|antigravity|devin/.test(id))return 'IDE / 编程工具';if(/grok|pi/.test(id))return '云端 / 其他 Agent';if(/vela|amr/.test(id))return 'OpenDesign Runtime';return '其他可用工具'}
async function loadAgents(){try{const r=await fetch('/api/agents');const d=await r.json();agents=d.agents||[];setConn(d.source==='daemon',d.source||'local')}catch(e){agents=[];setConn(false,'offline')}if(!agents.length){agents=[{id:'claude',name:'Claude Code',command:'claude',available:true,source:'local'},{id:'codex',name:'OpenAI Codex',command:'codex',available:true,source:'local'},{id:'cursor',name:'Cursor',command:'cursor',available:false,source:'local'},{id:'gemini',name:'Gemini CLI',command:'gemini',available:false,source:'local'}]}renderAgents();renderRecs();}
function setConn(ok,source){document.getElementById('conn-dot').className='dot '+(ok?'on':'');document.getElementById('conn-text').textContent=ok?'Daemon 已连接':'本地扫描模式 · '+source}
function renderModes(){document.getElementById('modes').innerHTML=modes.map(m=>`<button class="mode ${m[0]===mode?'active':''}" onclick="selectMode('${m[0]}')">${m[1]}</button>`).join('');document.getElementById('mode-desc').textContent=(modes.find(m=>m[0]===mode)||modes[0])[2];}
function selectMode(m){mode=m;renderModes();refreshCanvas()}
function renderAgents(){const q=(document.getElementById('agent-search').value||'').toLowerCase();const fs=agents.filter(a=>(a.id+' '+a.name+' '+a.command).toLowerCase().includes(q));const groups={};fs.forEach(a=>{const g=groupOf(a);(groups[g]||(groups[g]=[])).push(a)});document.getElementById('agent-list').innerHTML=Object.entries(groups).map(([g,list])=>`<div class="group-title"><span>${g}</span><span>${list.length}</span></div>`+list.map(a=>{const auth=a.authStatus==='missing'?'<span class="tag warn" title="'+esc(a.fixHint||'')+'" onclick="event.stopPropagation();showFix(\''+esc(a.id)+'\')">需登录</span>':a.authStatus==='ok'?'<span class="tag ok">已登录</span>':'';const links=agentLinks[a.id];const linkTag=a.available?(links?`<a class="tag ready" href="${links.docs}" target="_blank" onclick="event.stopPropagation()" style="text-decoration:none">文档↗</a>`:''):(links?`<a class="tag off" href="${links.install}" target="_blank" onclick="event.stopPropagation()" style="text-decoration:none;cursor:pointer">安装↗</a>`:'<span class="tag off">未装</span>');return `<div class="agent" draggable="${a.available}" ondragstart="${a.available?'dragStart(event)':''}" data-id="${esc(a.id)}" data-name="${esc(a.name||a.id)}" data-command="${esc(a.command||a.id)}" style="${a.available?'':'opacity:.6'}"><div class="avatar">${cap(a.name||a.id)}</div><div class="agent-meta"><div class="agent-name">${esc(a.name||a.id)}</div><div class="agent-id">${esc(a.id)} · ${esc(a.source||'')}</div></div>${auth}${linkTag}</div>`}).join('')).join('')||'<div class="empty">未找到工具</div>'}
function showFix(id){const a=agents.find(x=>x.id===id);if(!a||!a.fixHint)return;alert(a.name+' 认证修复指引：\n\n'+a.fixHint)}
function showTeamPreview(){const pv=document.getElementById('rec-preview');if(!pv)return;if(!team.length){pv.style.display='none';return}pv.style.display='';document.getElementById('rec-team-nodes').innerHTML=team.map((t,i)=>`<div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:18px;background:${colors[i%colors.length]}33;color:${colors[i%colors.length]}">${cap(t.name)}</div><div><div style="font-size:13px;font-weight:700">${esc(t.role)}</div><div style="font:11px var(--mono);color:var(--dim)">${esc(t.name)} · ${esc(t.type)}</div></div></div>${i<team.length-1?'<span style="color:var(--brand2);font-size:24px">→</span>':''}`).join('')}
// Tab 切换
function switchTab(t){activeTab=t;document.getElementById('tab-recommend').classList.toggle('active',t==='recommend');document.getElementById('tab-custom').classList.toggle('active',t==='custom');document.getElementById('panel-recommend').style.display=t==='recommend'?'':'none';document.getElementById('panel-custom').style.display=t==='custom'?'':'none';if(t==='custom')refreshCanvas()}
// 推荐编队卡片渲染
function renderRecs(){const grid=document.getElementById('rec-grid');if(!grid)return;grid.innerHTML=recs.map(r=>{const picked=r.roles.map(([ids])=>agents.find(x=>ids.split(',').some(id=>(x.id+' '+x.command+' '+x.name).toLowerCase().includes(id.trim())))).filter(Boolean);const chips=picked.map((a,i)=>`<span class="rec-agent-chip"><span class="dot-sm" style="background:${colors[i%colors.length]}"></span>${esc(a.name)}</span>`).join('')||'<span style="color:var(--dim);font-size:11px">(等待 Agent 加载)</span>';return `<div class="rec-card ${team.length&&team[0]._rec===r.id?'active':''}" onclick="useRec('${r.id}')"><b>${r.name}</b><p>${r.desc}</p><div class="rec-mode">${r.mode}</div><div class="rec-agents">${chips}</div></div>`}).join('')}
function useRec(id){const r=recs.find(x=>x.id===id);if(!r)return;team=[];mode=r.mode;const pick=(ids,role)=>{const list=ids.split(',').map(s=>s.trim());let a=agents.find(x=>list.some(id=>(x.id+' '+x.command+' '+x.name).toLowerCase().includes(id))&&x.available&&x.authStatus!=='missing')||agents.find(x=>list.some(id=>(x.id+' '+x.command+' '+x.name).toLowerCase().includes(id))&&x.available);if(a)addAgent({id:a.id,name:a.name,type:a.command,command:a.command},role)};r.roles.forEach(([ids,role])=>pick(ids,role));team.forEach(t=>t._rec=id);renderModes();renderRecs();renderAgents();showTeamPreview()}
function dragStart(e){const el=e.target.closest('.agent');e.dataTransfer.setData('text/plain',JSON.stringify({id:el.dataset.id,name:el.dataset.name,command:el.dataset.command}));el.classList.add('dragging')}function dragOver(e){e.preventDefault();document.getElementById('dropzone').classList.add('over')}function dragLeave(){document.getElementById('dropzone').classList.remove('over')}function dropAgent(e){e.preventDefault();dragLeave();try{const a=JSON.parse(e.dataTransfer.getData('text/plain'));addAgent(a);switchTab('custom')}catch{}}
function addAgent(a,role){if(team.some(t=>t.id===a.id))return;team.push({id:a.id,name:a.name||a.id,type:a.command||a.id,role:role||defaultRole(team.length)});refreshCanvas()}
function defaultRole(i){return ['Planner','Designer','Developer','Reviewer','Synthesizer'][i]||`Agent ${i+1}`}
function removeAgent(i){team.splice(i,1);refreshCanvas()}function clearTeam(){team=[];refreshCanvas();renderRecs()}function upd(i,k,v){team[i][k]=v}
function refreshCanvas(){const dz=document.getElementById('dropzone');if(!dz)return;if(!team.length){dz.className='dropzone';dz.innerHTML='<div class="placeholder">把左侧 Agent 能力拖到这里组队<br><b>拖入后可编辑角色和运行时类型</b></div>';return}dz.className='dropzone has-team';dz.innerHTML=team.map((t,i)=>`<div class="node"><button class="remove" onclick="removeAgent(${i})">×</button><div class="node-top"><div class="avatar" style="background:${colors[i%colors.length]}33;color:${colors[i%colors.length]}">${cap(t.name)}</div><div><div class="node-title">${esc(t.name)}</div><div class="node-sub">${esc(t.type)}</div></div></div><label>队内角色</label><input value="${esc(t.role)}" onchange="upd(${i},'role',this.value)"><label>运行时类型</label><select onchange="upd(${i},'type',this.value)">${agents.map(a=>`<option value="${esc(a.id)}" ${a.id===t.type?'selected':''}>${esc(a.name||a.id)}</option>`).join('')}</select></div>${i<team.length-1?'<div class="edge">→</div>':''}`).join('')}
function yaml(){let y=['version: "1.0"','team:',`  name: "demo-${mode}-team"`,`  mode: ${mode}`,'  agents:'];team.forEach(t=>y.push(`    - id: ${t.id}\n      name: "${t.role}"\n      role: "${t.role}"\n      type: ${t.type}\n      skills: []`));if(mode==='cycle'&&team.length>1)y.push(`  cycle:\n    generator_id: ${team[0].id}\n    reviewer_id: ${team[1].id}\n    max_iterations: 3\n    score_threshold: 8.0`);if(mode==='complementary')y.push('  experts:\n'+team.map((t,i)=>`    - agent_id: ${t.id}\n      role: "${t.role}"\n      specialty: "${t.role}"\n      skills: []\n      order: ${i+1}`).join('\n'));return y.join('\n')}
async function runTeam(){if(running)return;if(!team.length){alert('请先选择或组建一个团队：\n\n· 系统推荐 Tab：点击推荐编队卡片\n· 自定义组队 Tab：拖拽左侧 Agent 到画布');return}const needAuth=team.map(t=>agents.find(a=>a.id===t.id)).filter(a=>a&&a.authStatus==='missing');if(needAuth.length){const names=needAuth.map(a=>a.name).join('、');const hints=needAuth.map(a=>a.name+'：'+(a.fixHint||'需登录')).join('\n\n');if(!confirm('以下 Agent 可能未完成认证，运行可能失败：\n\n'+names+'\n\n修复指引：\n\n'+hints+'\n\n是否继续运行？'))return}running=true;const out=document.getElementById('output');const start=Date.now();document.getElementById('run-btn').disabled=true;out.innerHTML=team.map((t,i)=>`<div class="run-agent running" id="row-${t.id}"><div class="avatar">${cap(t.name)}</div><div><b>${esc(t.role)}</b><div class="agent-id">${esc(t.type)}</div></div><span class="status running-b" id="st-${t.id}">运行中</span></div>`).join('')+'<div id="logs"></div><div id="arts"></div>';const timer=setInterval(()=>{document.getElementById('timer').textContent=Math.round((Date.now()-start)/1000)+'s'},1000);try{const resp=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:yaml(),prompt:document.getElementById('prompt').value})});const reader=resp.body.getReader(),dec=new TextDecoder();let buf='',ev='';while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(line.startsWith('event: '))ev=line.slice(7).trim();if(line.startsWith('data: ')){try{onEvent(ev,JSON.parse(line.slice(6)))}catch{}}}}}catch(e){log('err','Error: '+e.message)}finally{clearInterval(timer);running=false;document.getElementById('run-btn').disabled=false}}
function onEvent(ev,d){if(ev==='init')log('','启动 '+d.mode+' · '+d.agents+' agents');if(ev==='result'){const st=document.getElementById('st-'+d.agent);if(st){st.className='status '+(d.success?'done':'err');st.textContent=d.success?'完成':'失败'}log(d.success?'ok':'err',`${d.agent} ${d.success?'完成':'失败'} · ${d.duration}`+(d.error?' · '+d.error:''))}if(ev==='artifact'){log('ok','产物 '+d.name);document.getElementById('arts').innerHTML+=`<div class="artifact"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(d.name)}</b><a href="/api/artifacts/${esc(d.id)}" target="_blank" style="font-size:11px;color:var(--brand2);text-decoration:none">在新窗口打开 ↗</a></div><p>${esc(d.producer||'')}</p><div class="preview"><iframe srcdoc="${esc(d.preview||'')}"></iframe></div></div>`}if(ev==='error')log('err',d.msg||'error');if(ev==='done'){log('ok','团队执行完成');const arts=document.getElementById('arts');if(arts&&arts.children.length){arts.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:8px 12px;border-radius:12px;background:rgba(46,230,139,.08);border:1px solid rgba(46,230,139,.2)"><span style="color:var(--ok);font-size:13px;font-weight:600">✓ 交付 '+arts.children.length+' 个产物</span><span style="font-size:11px;color:var(--muted)">点击产物可在新窗口查看完整内容</span></div>'+arts.innerHTML}else{log('','本次运行未产出 artifact（可能需要配置 skill 或 design-system 才会生成 HTML 工件）')}}}
function log(cls,msg){const l=document.getElementById('logs');if(l)l.innerHTML+=`<div class="log ${cls}">${new Date().toLocaleTimeString()}  ${esc(msg)}</div>`}
</script>
</body>
</html>
