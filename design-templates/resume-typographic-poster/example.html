<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Typographic Poster</title>
<style>
:root{--paper:#f4efe4;--ink:#151514;--muted:#6f665c;--line:#1b1a1830;--accent:#e95f38;--accent2:#c7ff46;--dark:#111;--soft:#fffaf0;--sans:Inter,Arial,sans-serif;--serif:Georgia,'Times New Roman',serif;--mono:'Courier New',monospace}*{box-sizing:border-box}body{margin:0;background:#d9d0c1;color:var(--ink);font-family:var(--sans);line-height:1.35}.stage{min-height:100vh;padding:32px;display:grid;place-items:center}.sheet{width:min(1120px,100%);min-height:760px;background:var(--paper);box-shadow:0 40px 90px #0003;position:relative;overflow:hidden;border:1px solid #0002}.kicker{font:700 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:-.055em;line-height:.9}h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase}p{margin:0}.muted{color:var(--muted)}.rule{height:1px;background:var(--line)}.tag{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;padding:5px 10px;font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;background:var(--soft)}.grid{display:grid;gap:18px}.metric{font-family:var(--serif);font-size:42px;line-height:.9}.small{font-size:12px;color:var(--muted)}.section{border-top:1px solid var(--line);padding-top:12px}.section h3{margin:0 0 8px;font:800 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.item{margin-bottom:12px}.item strong{display:block;font-size:15px}.item span{font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px}.bar{height:8px;border:1px solid var(--ink);background:linear-gradient(90deg,var(--accent) var(--v),transparent 0)}@page{size:A4;margin:0}@media print{body{background:white}.stage{padding:0}.sheet{width:210mm;min-height:297mm;box-shadow:none;border:0}}@media(max-width:760px){.stage{padding:12px}.sheet{min-height:auto}h1{font-size:58px!important}.hide-sm{display:none!important}}
.sheet{padding:72px;display:grid;grid-template-columns:.75fr 1.25fr;gap:38px;background:#fbfaf6}.rail{writing-mode:vertical-rl;transform:rotate(180deg);font:800 11px var(--mono);letter-spacing:.18em;border-left:8px solid #111;padding-left:12px}.hero{align-self:center}h1{font-family:Arial,sans-serif;font-size:96px;letter-spacing:-.08em;text-transform:uppercase}.poster-lines{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:38px}.poster-lines div{border-top:12px solid #111;padding-top:8px;font:700 12px var(--mono)}</style>
</head>
<body>
<div class="stage"><article class="sheet poster"><div class='rail'>CV / TYPOGRAPHIC SYSTEM / Type-led Designer</div><main class='hero'><h1>Ryan Vale</h1><p class='lede'>Words first. Systems second. Everything aligned.</p><div class='chips'><span class='tag'>Type-led Designer</span><span class='tag'>Available 2026</span></div><div class='poster-lines'><div>Experience / 09 years</div><div>Focus / typography</div><div>Clients / culture + tools</div><div>Output / systems</div></div></main></article></div>
</body>
</html>
