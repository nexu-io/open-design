<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store screenshot plan</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#111; color:#f5f5f5; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 18% 12%,#2f3f9d 0,transparent 36%),#111; }
      main { width:min(920px,94vw); padding:28px; border:1px solid #343434; border-radius:18px; background:#1a1a1a; box-shadow:0 24px 80px #0008; }
      header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:24px; } h1 { margin:0; font-size:20px; } p { margin:6px 0 0; color:#aaa; font-size:13px; }
      .badge { padding:7px 10px; border:1px solid #555; border-radius:999px; color:#c7d2fe; font-size:12px; }
      .pages { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
      article { min-height:300px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid #3a3a3a; border-radius:12px; background:linear-gradient(165deg,#f7f7fb,#c7cbff); color:#171722; }
      article:nth-child(2) { background:linear-gradient(165deg,#1e275f,#7583ff); color:white; } article:nth-child(3) { background:linear-gradient(165deg,#f8dfca,#ef926f); } article:nth-child(4) { background:linear-gradient(165deg,#d9f4e9,#67cbb1); }
      .num { font:600 12px ui-monospace,monospace; opacity:.68; } h2 { margin:0; font-size:20px; letter-spacing:-.04em; } .phone { height:125px; margin-top:18px; border:6px solid #181818; border-radius:18px 18px 4px 4px; background:linear-gradient(145deg,#fff,#dedee8); box-shadow:0 12px 24px #1114; }
      footer { margin-top:18px; color:#8d8d8d; font-size:12px; } @media(max-width:700px){.pages{grid-template-columns:repeat(2,1fr)}}
    </style>
  </head>
  <body><main>
    <header><div><h1>Focus Atlas</h1><p>ScreenshotPlan · 4-page narrative</p></div><span class="badge">App Store + Google Play</span></header>
    <section class="pages" aria-label="Screenshot plan pages">
      <article><span class="num">01 / PLAN</span><h2>Own your day</h2><div class="phone"></div></article>
      <article><span class="num">02 / FOCUS</span><h2>Make room for deep work</h2><div class="phone"></div></article>
      <article><span class="num">03 / REVIEW</span><h2>See your progress</h2><div class="phone"></div></article>
      <article><span class="num">04 / MOMENTUM</span><h2>Build a calmer rhythm</h2><div class="phone"></div></article>
    </section><footer>Static gallery preview only. Open the product workspace to edit, review, render, and export.</footer>
  </main></body>
</html>
