<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Pattern Preview</title>
    <style>
      :root {
        --bg: #fafaf9;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #18181b;
        --muted: #71717a;
        --accent: #18181b;
        --accent-fg: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--text);
      }
      main {
        min-height: 100%;
        display: grid; place-items: center;
        padding: 48px 24px;
      }
      .card {
        width: 100%; max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .brand {
        font-weight: 600; font-size: 18px;
        text-align: center; margin-bottom: 24px;
      }
      h1 {
        font-size: 20px; letter-spacing: -0.01em;
        margin: 0 0 6px; text-align: center;
      }
      .subtitle {
        font-size: 14px; color: var(--muted);
        margin: 0 0 22px; text-align: center;
      }
      label {
        display: block; font-size: 13px; color: var(--muted);
        margin-bottom: 6px;
      }
      input[type=email] {
        width: 100%; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; background: #fff; color: inherit;
      }
      .submit {
        margin-top: 16px; width: 100%; padding: 10px 12px;
        border: 0; border-radius: 8px; cursor: pointer;
        background: var(--accent); color: var(--accent-fg);
        font-weight: 600; font-size: 14px;
      }
      .success {
        margin-top: 12px; font-size: 13px; color: var(--muted);
        text-align: center; min-height: 18px;
      }
      footer {
        margin-top: 22px;
        text-align: center; font-size: 13px; color: var(--muted);
      }
      footer a { color: var(--text); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Reset password">
        <div class="brand">Acme</div>
        <h1>Reset password</h1>
        <p class="subtitle">Enter your email and we'll send a reset link.</p>
        <form>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="you@company.com"
              autofocus
            />
          </div>
          <button class="submit" type="submit">Send reset link</button>
          <p class="success" role="status" aria-live="polite"></p>
        </form>
        <footer>
          <a href="#login">&larr; Back to login</a>
        </footer>
      </section>
    </main>
  </body>
</html>
