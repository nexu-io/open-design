Because AgentIcon still serves kimi.svg through <img> (apps/web/src/components/AgentIcon.tsx:14-31,71-80), this hard-coded #1c1b1a fill is applied in both themes. On dark mode the surrounding cards switch to --bg-panel: #222120 and --text: #e8e4dc (apps/web/src/index.css:75-88), so the mark you just changed ends up nearly the same color as the card and becomes hard to see again. The new assertion also locks that regression in by requiring the dark fill and forbidding the previous white fill. Please make Kimi theme-aware instead of baking a single dark color into the asset—for example, move it onto a rendering path that can adapt the secondary mark per theme (or swap assets by theme), then update this test to verify the icon stays legible in both light and dark mode rather than asserting one fixed hex value.<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#1783ff" d="M21.846 0a1.923 1.923 0 1 1 0 3.846H20.15a.226.226 0 0 1-.227-.226V1.923C19.923.861 20.784 0 21.846 0"/><path fill="#666666" d="m11.065 11.199 7.257-7.2c.137-.136.06-.41-.116-.41H14.3a.16.16 0 0 0-.117.051l-7.82 7.756c-.122.12-.302.013-.302-.179V3.82c0-.127-.083-.23-.185-.23h-2.69c-.103 0-.186.103-.186.23v15.95c0 .128.083.23.186.23h2.69c.103 0 .186-.102.186-.23v-3.25a.25.25 0 0 1 .069-.178l2.424-2.406a.16.16 0 0 1 .205-.023l6.484 4.772a7.7 7.7 0 0 0 3.453 1.283c.108.012.2-.095.2-.23v-3.06c0-.117-.07-.212-.164-.227a5 5 0 0 1-2.027-.807l-5.613-4.064c-.117-.078-.132-.279-.028-.381"/></svg>