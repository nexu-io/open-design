<svg width="1705" height="291" viewBox="0 0 1705 291" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LeastGen Studio wordmark artwork for the pixel-scan hero logo.
       The engine samples the ALPHA channel only (glyph fill color is
       irrelevant); keep the 1705:291 aspect — the host box depends on it. -->
  <defs>
    <mask id="lg-mark-mask">
      <rect x="0" y="0" width="291" height="291" rx="64" fill="white"/>
      <circle cx="145.5" cy="88" r="27" fill="black"/>
      <circle cx="88" cy="203" r="21" fill="black"/>
      <circle cx="203" cy="203" r="21" fill="black"/>
      <line x1="134" y1="112" x2="96" y2="185" stroke="black" stroke-width="9"/>
      <line x1="157" y1="112" x2="195" y2="185" stroke="black" stroke-width="9"/>
      <line x1="111" y1="203" x2="180" y2="203" stroke="black" stroke-width="9"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="291" height="291" rx="64" fill="#202020" mask="url(#lg-mark-mask)"/>
  <text x="1705" y="222" text-anchor="end" textLength="1290" lengthAdjust="spacingAndGlyphs"
        font-family="-apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-weight="600" font-size="212" letter-spacing="-4" fill="#202020">LeastGen Studio</text>
</svg>
