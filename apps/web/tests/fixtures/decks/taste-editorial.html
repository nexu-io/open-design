<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Deck navigation regression fixture</title></head>
<body>
<!-- Test-only compatibility fixture: navigation script preserved verbatim from
     design-templates/html-ppt-taste-editorial/example.html
     at c5ae6292c464094de80d0191fab50144bff8a027. Presentation styling and content are omitted.
     This is not a runtime template or Skill Discovery candidate. -->
<div class="deck">
  <section class="slide">Slide 1</section>
  <section class="slide">Slide 2</section>
  <section class="slide">Slide 3</section>
  <section class="slide">Slide 4</section>
  <section class="slide">Slide 5</section>
  <section class="slide">Slide 6</section>
  <section class="slide">Slide 7</section>
  <section class="slide">Slide 8</section>
  <section class="slide">Slide 9</section>
  <section class="slide">Slide 10</section>
</div>
<div id="deck-progress" aria-hidden="true"><span></span></div>
<nav id="deck-nav" aria-label="Slide navigation"></nav>
<script>
(function () {
  var deck = document.querySelector('.deck');
  if (!deck) return;

  var slides = Array.prototype.filter.call(deck.children, function (el) {
    return el.classList && el.classList.contains('slide');
  });
  var nav = document.getElementById('deck-nav');
  var progress = document.querySelector('#deck-progress span');
  if (!slides.length || !nav || !progress) return;

  var idx = 0;
  var wheelAcc = 0;
  var wheelTimer = null;
  var touchX = 0;
  var touchY = 0;

  document.body.classList.add('deck-nav-ready');
  document.body.setAttribute('tabindex', '-1');
  document.body.style.outline = 'none';

  slides.forEach(function (_, i) {
    var dot = document.createElement('button');
    dot.className = 'dot';
    dot.type = 'button';
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', function () { go(i); });
    nav.appendChild(dot);
  });

  function clamp(n) {
    return Math.max(0, Math.min(slides.length - 1, n));
  }

  function go(n) {
    idx = clamp(n);
    slides.forEach(function (slide, i) {
      var active = i === idx;
      slide.classList.toggle('active', active);
      slide.classList.toggle('is-active', active);
      slide.setAttribute('aria-hidden', active ? 'false' : 'true');
    });
    Array.prototype.forEach.call(nav.querySelectorAll('.dot'), function (dot, i) {
      var active = i === idx;
      dot.classList.toggle('active', active);
      if (active) dot.setAttribute('aria-current', 'true');
      else dot.removeAttribute('aria-current');
    });
    progress.style.width = (((idx + 1) / slides.length) * 100) + '%';
  }

  function shouldIgnoreKeyTarget(target) {
    if (!target || !target.tagName) return false;
    var tag = target.tagName.toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;
  }

  function onKey(e) {
    if (e.__tasteDeckHandled || shouldIgnoreKeyTarget(e.target)) return;
    var next = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') next = idx + 1;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') next = idx - 1;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = slides.length - 1;
    if (next === null) return;
    e.__tasteDeckHandled = true;
    e.preventDefault();
    go(next);
  }

  function onWheel(e) {
    var delta = e.deltaY + e.deltaX;
    if (Math.abs(delta) < 1) return;
    e.preventDefault();
    wheelAcc += delta;
    if (Math.abs(wheelAcc) > 60) {
      go(idx + (wheelAcc > 0 ? 1 : -1));
      wheelAcc = 0;
    }
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function () { wheelAcc = 0; }, 150);
  }

  function onTouchStart(e) {
    if (!e.touches || !e.touches.length) return;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }

  function onTouchEnd(e) {
    if (!e.changedTouches || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      go(idx + (dx < 0 ? 1 : -1));
    }
  }

  function focusDeck() {
    try {
      window.focus();
      document.body.focus({ preventScroll: true });
    } catch (_) {}
  }

  window.addEventListener('keydown', onKey, true);
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('touchstart', onTouchStart, { passive: true });
  window.addEventListener('touchend', onTouchEnd, { passive: true });
  document.addEventListener('mousedown', focusDeck);
  window.addEventListener('load', focusDeck);

  go(0);
  focusDeck();
})();
</script>
</body>
</html>
