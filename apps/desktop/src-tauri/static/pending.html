<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Design</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        align-items: center;
        background: #05070d;
        color: #f7f7fb;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
      }

      main {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 28px 32px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
      }

      p {
        color: #aeb7d5;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open Design</h1>
      <p>Waiting for the web runtime URL...</p>
    </main>
  </body>
</html>
