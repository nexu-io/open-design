<!doctype html>
<!--
  Open Design · OD Next handheld shell — platform-neutral phone (restrained camera dot and symmetric side keys — use when the brief names no platform).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青禾小馆 · 在线点餐</title>
  <style>
    :root {
      --phone-screen-width: 390px;
      --phone-screen-height: 844px;
      --phone-bezel: 10px;
      --phone-outer-radius: 52px;
      --phone-screen-radius: 42px;
      --phone-safe-top: 50px;
      --phone-safe-bottom: 29px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f8f8f9;
      --phone-stage-bg: #eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
        linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.85),
        0 32px 68px -20px rgba(10,12,16,.52),
        0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 96px;
      bottom: 96px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .camera-dot {
      position: absolute;
      z-index: 20;
      top: 13px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: start;
      padding: 14px 20px 0;
      color: var(--phone-system-fg);
      opacity: .8;
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 15px;
      font-size: 14px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 56px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 15px;
      gap: 6px;
    }
    .status-icons svg {
      display: block;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .status-icons .connectivity { width: 15px; height: 12px; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .battery { width: 19px; height: 11px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 96px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>
  <style id="app-style">
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --ground: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #fafafb;
  --ink: #16181d;
  --ink-2: #4e5560;
  --ink-3: #666d78;
  --line: #e6e9ee;
  --line-soft: #eef0f3;
  --accent: #1e7a52;
  --accent-deep: #145a3c;
  --accent-soft: #e4f2eb;
  --price: #c23a16;
  --danger: #c0392b;
  --danger-soft: #fbeae7;
  --info: #165a9c;
  --info-soft: #e4eefb;
  --warn: #7a5a00;
  --warn-soft: #fbf0d8;
  --pick: #0f5873;
  --pick-soft: #e1f0f5;
  --mute: #4e5560;
  --mute-soft: #edf0f3;
  --r-lg: 18px;
  --r-md: 14px;
  --r-sm: 10px;
  --shadow-1: 0 6px 18px -8px rgba(20, 24, 32, .16);
  --shadow-2: 0 -6px 24px -12px rgba(20, 24, 32, .22);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

* { -webkit-touch-callout: none; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
input, textarea, select { font: inherit; }
h1, h2, h3, h4, p, ul { margin: 0; }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.phone-content {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--ground);
}

#appwrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
#view { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }

.page { position: absolute; inset: 0; display: flex; flex-direction: column; }
.page.is-hidden { display: none; }

.p-head {
  flex: none;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line-soft);
}
.p-title { font-size: 17px; font-weight: 700; letter-spacing: .01em; }

.p-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.p-scroll::-webkit-scrollbar { display: none; }

.pad { padding: 12px 16px; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

[hidden] { display: none !important; }

svg.ic { display: block; flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-s { width: 18px; height: 18px; }
.ic-xs { width: 15px; height: 15px; }
.ic-l { width: 44px; height: 44px; }

/* ---------------- tab bar ---------------- */
#tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--surface);
  border-top: 1px solid var(--line-soft);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 52px;
  border-radius: 14px;
  color: var(--ink-3);
  position: relative;
}
.tab-label { font-size: 12px; font-weight: 500; line-height: 1.2; }
.tab .ic { width: 23px; height: 23px; stroke-width: 1.7; }
.tab.is-on { color: var(--accent-deep); }
.tab.is-on .tab-label { font-weight: 650; }
.tab-badge {
  position: absolute;
  top: 2px;
  left: calc(50% + 6px);
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--price);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 17px;
  text-align: center;
  display: none;
}
.tab-badge.show { display: block; }

/* ---------------- menu page ---------------- */
.menu-head { flex: none; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
.store-strip { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
.store-dot {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent-deep);
}
.store-dot .ic { width: 24px; height: 24px; stroke-width: 1.7; }
.store-name { font-size: 18px; font-weight: 750; letter-spacing: .01em; }
.store-sub { margin-top: 3px; font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.store-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent-deep); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-top: 6px; }

.searchbar { display: flex; align-items: center; gap: 8px; margin: 10px 16px 6px; padding: 0 6px 0 12px; height: 40px; border-radius: 12px; background: var(--ground); border: 1px solid transparent; }
.searchbar:focus-within { background: var(--surface); border-color: var(--accent); }
.searchbar .ic { width: 18px; height: 18px; color: var(--ink-3); }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; color: var(--ink); height: 100%; padding: 0; }
.searchbar input::placeholder { color: var(--ink-3); }
.search-clear { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-3); }
.search-clear .ic { width: 16px; height: 16px; }

.cat-rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 12px; }
.cat-rail::-webkit-scrollbar { display: none; }
.cat-chip {
  flex: none;
  min-height: 38px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  background: var(--ground);
  border: 1px solid transparent;
}
.cat-chip.is-on { color: #fff; background: var(--accent); font-weight: 650; }

.menu-meta { display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; font-size: 13px; color: var(--ink-3); }
.menu-meta b { color: var(--ink); font-weight: 650; }

.dish-list { padding: 2px 16px 20px; display: flex; flex-direction: column; gap: 10px; }

.dish {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.dish-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 12px;
  padding: 10px;
  text-align: left;
  align-items: center;
}
.dish-main:focus-visible { border-radius: var(--r-md); }
.dish-thumb { flex: none; width: 96px; border-radius: var(--r-sm); overflow: hidden; align-self: flex-start; }
.dish-thumb img { display: block; width: 100%; height: auto; aspect-ratio: 1/1; object-fit: cover; }
.dish-noimg { width: 96px; align-self: stretch; display: grid; place-items: center; background: var(--surface-2); }
.dish-txt { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; align-self: stretch; justify-content: center; }
.dish-name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dish-name { font-size: 16px; font-weight: 700; color: var(--ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dish-tag {
  flex: none;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-radius: 5px;
  padding: 1px 6px;
  line-height: 1.5;
}
.dish-desc { font-size: 13px; line-height: 1.5; color: var(--ink-3); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; min-height: calc(2 * 1.5em); }
.price { color: var(--price); font-weight: 750; font-size: 17px; letter-spacing: -.01em; }
.price-unit { font-size: 12px; }
.dish-price-line { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
.dish-sold { font-size: 11px; color: var(--ink-3); }

.dish-ctl { flex: none; width: 72px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px 10px; }

.stepper { display: flex; align-items: center; gap: 2px; }
.step-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 50%;
}
.step-btn .ic { width: 20px; height: 20px; }
.step-dec { color: var(--ink-2); }
.step-inc { color: var(--accent-deep); background: var(--accent-soft); }
.step-count { min-width: 28px; text-align: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.add-single { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 3px 8px -2px rgba(30, 122, 82, .5); }
.add-single .ic { width: 22px; height: 22px; stroke-width: 2; }

.empty-box { padding: 48px 24px 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty-glyph {
  width: 76px; height: 76px;
  display: grid; place-items: center;
  border-radius: 26px;
  background: var(--surface);
  color: #b6bcc6;
  margin-bottom: 8px;
}
.empty-glyph .ic { width: 40px; height: 40px; stroke-width: 1.4; }
.empty-title { font-size: 16px; font-weight: 700; }
.empty-sub { font-size: 13px; line-height: 1.6; color: var(--ink-3); max-width: 260px; }
.btn-ghost { min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; font-size: 14px; }
.btn-ghost.is-accent { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-soft); }

/* ---------------- shared controls ---------------- */
.btn {
  min-height: 44px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 15px;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -6px rgba(30, 122, 82, .6); }
.btn-primary:disabled { background: #c6ccd3; color: #fff; box-shadow: none; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-soft { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.btn-block { width: 100%; }

.text-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); border-radius: 10px; }
.text-btn.is-danger { color: var(--danger); }
.text-btn .ic { width: 18px; height: 18px; }

.seg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 3px; background: var(--line-soft); border-radius: 12px; padding: 3px; }
.seg-btn { min-height: 42px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg-btn .ic { width: 18px; height: 18px; }
.seg-btn.is-on { background: var(--surface); color: var(--accent-deep); font-weight: 700; box-shadow: 0 1px 4px rgba(20,24,32,.08); }

.panel { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); overflow: hidden; }
.panel-pad { padding: 12px 16px; }

.kv { font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.kv b { color: var(--ink); font-weight: 650; }

/* ---------------- cart page ---------------- */
.cart-foot {
  flex: none;
  background: var(--surface);
  border-top: 1px solid var(--line-soft);
  box-shadow: var(--shadow-2);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.cart-foot-note { font-size: 12px; color: var(--danger); line-height: 1.4; }
.cart-total-l { text-align: right; }
.cart-total-h { font-size: 11px; color: var(--ink-3); }
.total-price { color: var(--price); font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.cart-total-l .total-price small { font-size: 13px; }

.addr-card { display: flex; gap: 12px; align-items: flex-start; }
.addr-pin { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent-deep); }
.addr-pin .ic { width: 22px; height: 22px; }
.addr-main { flex: 1 1 auto; min-width: 0; }
.addr-who { font-size: 15px; font-weight: 700; }
.addr-who .od-nowrap { font-weight: 500; color: var(--ink-3); font-size: 13px; margin-left: 6px; }
.addr-where { margin-top: 3px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.addr-tag { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; color: var(--info); background: var(--info-soft); padding: 1px 7px; border-radius: 5px; }
.addr-edit { flex: none; align-self: center; }

.svc-note { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.svc-note .ic { width: 15px; height: 15px; color: var(--accent); }

.cart-sec { margin: 10px 16px 0; }

.cart-sec-head { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
.cart-sec-head .ic { width: 18px; height: 18px; color: var(--accent-deep); }
.cart-sec-title { font-size: 14px; font-weight: 700; flex: 1; }
.cart-sec-note { font-size: 12px; color: var(--ink-3); }

.line { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.line-thumb { flex: none; width: 64px; border-radius: var(--r-sm); overflow: hidden; align-self: flex-start; }
.line-thumb img { display: block; width: 100%; height: auto; aspect-ratio: 1/1; object-fit: cover; }
.line-noimg { width: 64px; height: 64px; flex: none; border-radius: var(--r-sm); background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
.line-noimg .ic { width: 24px; height: 24px; }
.line-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.line-name { font-size: 15px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.line-meta { font-size: 12.5px; color: var(--ink-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.line-prices { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.line-unit { font-size: 12px; color: var(--ink-2); }
.line-unit s { color: var(--ink-3); }
.line-total { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.line-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
.del-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-3); border-radius: 10px; }
.del-btn .ic { width: 20px; height: 20px; }

.coupon-line { display: flex; align-items: center; gap: 10px; padding: 12px 16px; width: 100%; text-align: left; }
.coupon-line:active { background: var(--surface-2); }
.coupon-ico { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
.coupon-ico .ic { width: 20px; height: 20px; }
.coupon-txt { flex: 1 1 auto; min-width: 0; }
.coupon-cap { font-size: 14px; font-weight: 650; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.coupon-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.coupon-pick { color: var(--ink-3); display: flex; align-items: center; }
.coupon-pick .ic { width: 18px; height: 18px; }
.coupon-tag { font-size: 12px; font-weight: 700; color: var(--accent-deep); }
.coupon-tag.is-off { color: var(--ink-3); font-weight: 600; }

.bill { padding: 4px 16px 12px; }
.bill-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 30px; padding-top: 6px; }
.bill-row .od-nowrap { font-size: 14px; color: var(--ink-2); }
.bill-row b { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--ink); }
.bill-row .free { color: var(--accent-deep); font-size: 12px; font-weight: 600; }
.bill-row .cut { color: var(--price); }
.bill-total { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
.bill-total b { font-size: 20px; font-weight: 800; color: var(--ink); }
.bill-total .od-nowrap { font-size: 15px; font-weight: 700; color: var(--ink); }
.bill-note { margin-top: 8px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }

/* ---------------- orders ---------------- */
.order-card { margin: 0 16px 12px; }
.order-top { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; }
.store-mini { flex: 1 1 auto; min-width: 0; }
.order-store { font-size: 15px; font-weight: 700; }
.order-when { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.pill {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 650;
  padding: 3px 10px;
  border-radius: 999px;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.p-ok { color: var(--accent-deep); background: var(--accent-soft); }
.pill.p-warn { color: var(--warn); background: var(--warn-soft); }
.pill.p-info { color: var(--info); background: var(--info-soft); }
.pill.p-pick { color: var(--pick); background: var(--pick-soft); }
.pill.p-mute { color: var(--mute); background: var(--mute-soft); }
.pill.p-mute2 { color: var(--ink-3); background: var(--mute-soft); }
.order-svc { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; flex: none; }

.order-body { padding: 10px 16px 4px; }
.order-items { display: flex; flex-direction: column; gap: 6px; }
.order-item-row { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--ink); }
.order-item-name { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.order-item-more { font-size: 12px; color: var(--ink-3); }
.order-qty { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; }

.order-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 12px; }
.order-amount { font-size: 13px; color: var(--ink-3); }
.order-amount b { color: var(--price); font-size: 15px; font-weight: 750; }
.order-acts { display: flex; gap: 8px; align-items: center; }
.mini-btn { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); font-size: 13.5px; font-weight: 650; display: inline-flex; align-items: center; gap: 5px; background: var(--surface); }
.mini-btn.is-solid { background: var(--accent); border-color: var(--accent); color: #fff; }
.mini-btn.is-danger { color: var(--danger); border-color: #e5b4ad; }

.order-empty-card { margin: 16px; }

/* ---------------- overlays ---------------- */
#overlay { position: absolute; left: 0; right: 0; top: 0; bottom: var(--phone-safe-bottom); z-index: 30; pointer-events: none; }
#overlay.has-open { pointer-events: auto; }

.ov { position: absolute; inset: 0; display: flex; flex-direction: column; }
.ov-scrim { position: absolute; inset: 0; background: rgba(18, 21, 26, .46); animation: fade-in .18s ease-out both; }
.ov[data-kind="dialog"] .ov-scrim { background: rgba(18, 21, 26, .5); }

.sheet {
  margin-top: auto;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -10px 40px -12px rgba(12, 15, 20, .4);
  padding-bottom: calc(18px + env(safe-area-inset-bottom));
  animation: sheet-up .24s cubic-bezier(.2, .8, .3, 1) both;
  overflow: hidden;
}
.sheet-handle { width: 40px; height: 4px; border-radius: 99px; background: #d4d9e0; margin: 8px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; flex: none; }
.sheet-title { flex: 1 1 auto; font-size: 17px; font-weight: 750; }
.sheet-x { width: 44px; height: 44px; margin: -8px -6px -8px 0; display: grid; place-items: center; color: var(--ink-3); border-radius: 50%; }
.sheet-x .ic { width: 20px; height: 20px; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.sheet-foot { flex: none; }

.dialog {
  margin: auto;
  width: min(calc(100% - 56px), 340px);
  background: var(--surface);
  border-radius: 18px;
  padding: 20px 18px 16px;
  text-align: center;
  animation: pop-in .2s cubic-bezier(.2, .8, .3, 1) both;
}
.dialog-title { font-size: 17px; font-weight: 750; }
.dialog-txt { margin-top: 8px; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
.dialog-txt.is-left { text-align: left; }
.dialog-txt .bill .bill-total { margin-top: 6px; padding-top: 8px; }
.dialog-txt .bill .bill-row b { font-size: 14px; }
.dialog-acts { margin-top: 16px; display: flex; gap: 10px; }
.dialog-acts .btn { flex: 1 1 0; }

.dish-sheet .ds-img { flex: none; position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; }
.dish-sheet .ds-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ds-main { padding: 14px 16px 16px; }
.ds-name-row { display: flex; align-items: center; gap: 8px; }
.ds-name { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.ds-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ds-price { margin-top: 8px; display: flex; align-items: baseline; gap: 4px; }
.ds-price .price { font-size: 22px; }
.ds-desc { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--ink-3); }

.ds-sect { padding: 4px 16px 8px; }
.ds-sect-label { font-size: 15px; font-weight: 750; padding: 10px 0 6px; }
.ds-sect-sub { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.opt-row {
  width: 100%;
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: 12px;
  padding: 0 12px;
  text-align: left;
}
.opt-row:active { background: var(--surface-2); }
.opt-radio { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid #cdd2da; display: grid; place-items: center; }
.opt-row.is-on .opt-radio { border-color: var(--accent); }
.opt-radio i { width: 10px; height: 10px; border-radius: 50%; background: transparent; }
.opt-row.is-on .opt-radio i { background: var(--accent); }
.opt-name { flex: 1 1 auto; font-size: 15px; font-weight: 500; }
.opt-price { font-size: 13px; color: var(--ink-2); }
.opt-check { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 1.5px solid #cdd2da; display: grid; place-items: center; color: transparent; }
.opt-row.is-on .opt-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt-check .ic { width: 14px; height: 14px; stroke-width: 2.6; }

.ds-buy {
  border-top: 1px solid var(--line-soft);
  background: var(--surface);
  padding: 10px 16px 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ds-buy-total { flex: 1 1 auto; min-width: 0; }
.ds-buy-cap { font-size: 11px; color: var(--ink-3); }
.ds-buy-total .price { font-size: 23px; }
.ds-buy-btn { flex: none; min-height: 48px; padding: 0 24px; }
.ds-buy-btn.is-added { background: var(--accent-deep); }

.form-sec { padding: 2px 16px 8px; }
.field { margin-bottom: 4px; }
.field-label { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 650; margin-bottom: 7px; }
.field-label .req { color: var(--danger); }
.field-label .opt-note { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.field-input, .field-area {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-size: 16px;
  color: var(--ink);
  padding: 12px 13px;
}
.field-input { height: 48px; }
.field-area { min-height: 84px; resize: none; line-height: 1.5; }
.field-input:focus, .field-area:focus { border-color: var(--accent); outline: none; }
.field.is-bad .field-input, .field.is-bad .field-area { border-color: var(--danger); background: var(--danger-soft); }
.ferr { display: none; margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: var(--danger); }
.field.is-bad .ferr { display: block; }
.form-summary { display: none; margin: 8px 16px 4px; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); font-size: 13px; line-height: 1.6; color: #8f2d20; }
.form-summary.show { display: block; }
.form-summary a { color: inherit; text-decoration: underline; }

.pick-labels { display: flex; gap: 8px; flex-wrap: wrap; }
.pick-label-chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; color: var(--ink-2); }
.pick-label-chip.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); font-weight: 650; }

.coupon-sheet-row { padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.coupon-sheet-row:first-of-type { border-top: 0; }
.coupon-list-title { font-size: 13px; color: var(--ink-3); padding: 4px 16px 2px; }
.coupon-code-input-row { display: flex; gap: 8px; padding: 6px 16px 4px; }
.coupon-code-input {
  flex: 1 1 auto; min-width: 0;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 16px;
  padding: 0 13px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.coupon-code-input:focus { border-color: var(--accent); outline: none; }
.coupon-apply { flex: none; min-height: 48px; padding: 0 18px; border-radius: 12px; }
.coupon-hint-row { padding: 8px 16px 2px; }
.coupon-hints { display: flex; flex-wrap: wrap; gap: 6px; }
.hint-chip { min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 600; }
.hint-chip.is-dim { background: var(--mute-soft); color: var(--ink-3); }
.coupon-msg { margin: 6px 16px 0; font-size: 13px; line-height: 1.5; min-height: 0; }
.coupon-msg.ok { color: var(--accent-deep); }
.coupon-msg.bad { color: var(--danger); }
.applied-coupon { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }

.order-detail-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; font-size: 13.5px; color: var(--ink-2); }
.order-detail-row b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.order-detail-row .od-truncate { color: var(--ink); }

.success-wrap { padding: 26px 20px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.success-ring {
  width: 84px; height: 84px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-deep);
}
.success-ring .ic { width: 44px; height: 44px; stroke-width: 2.2; }
.success-title { margin-top: 16px; font-size: 19px; font-weight: 800; }
.success-sub { margin-top: 6px; font-size: 13.5px; line-height: 1.6; color: var(--ink-3); }
.success-num { margin-top: 14px; padding: 10px 16px; border-radius: 12px; background: var(--surface-2); display: flex; gap: 18px; }
.success-num .od-stat { text-align: center; }
.success-num b { font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); display: block; }
.success-num span { font-size: 11px; color: var(--ink-3); }
.success-acts { width: 100%; display: flex; gap: 10px; margin-top: 18px; padding-bottom: 8px; }
.success-acts .btn { flex: 1 1 0; }

/* toast */
#toasts { position: absolute; left: 0; right: 0; bottom: 96px; z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 24px; }
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 100%;
  background: #23272e;
  color: #fff;
  font-size: 14px;
  line-height: 1.45;
  border-radius: 12px;
  padding: 10px 14px 10px 16px;
  box-shadow: 0 12px 30px -10px rgba(10, 12, 16, .6);
  animation: fade-in .2s ease-out both;
}
.toast .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.toast-act { flex: none; color: #ffe08a; font-weight: 700; min-height: 36px; padding: 0 10px; display: inline-flex; align-items: center; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { transform: translateY(26px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pop-in { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .ov-scrim, .sheet, .dialog, .toast { animation: none; }
  * { transition: none !important; }
}
</style>

<body>
  <div class="phone-frame" data-phone-shell data-platform="neutral">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div id="appwrap">
          <main id="view" aria-live="polite">
            <section class="page" id="page-menu" data-route="menu" aria-label="菜单">
              <div class="menu-head">
                <div class="store-strip">
                  <span class="store-dot" aria-hidden="true">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M5 9.2c0-3.2 3.1-5.7 7-5.7s7 2.5 7 5.7H5Z"/><path d="M4.6 9.2h14.8l-1.2 5.9a3.1 3.1 0 0 1-3 2.4H8.8a3.1 3.1 0 0 1-3-2.4L4.6 9.2Z"/><path d="M12 14.4v.01"/></svg>
                  </span>
                  <span>
                    <span class="store-name">青禾小馆</span>
                    <span class="store-sub">家常川湘菜 · 现炒现做</span>
                    <span class="store-chip" aria-hidden="true">满 ¥40 免配送费</span>
                  </span>
                </div>
                <div class="searchbar">
                  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m15.6 15.6 4.4 4.4"/></svg>
                  <label class="sr-only" for="menuSearch">搜索菜品</label>
                  <input id="menuSearch" type="search" placeholder="搜索菜品，如“豆腐”" autocomplete="off" />
                  <button class="search-clear" data-act="search-clear" aria-label="清除搜索" hidden>
                    <svg class="ic" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>
                  </button>
                </div>
                <div class="cat-rail od-rail" id="catRail" style="--od-rail-pad:16px; --od-gap:6px;"></div>
              </div>
              <div class="p-scroll" id="menuScroll">
                <div id="menuMeta"></div>
                <div class="dish-list" id="menuList"></div>
              </div>
            </section>

            <section class="page is-hidden" id="page-cart" data-route="cart" aria-label="购物车">
              <header class="p-head">
                <span class="p-title od-fill">购物车</span>
                <button class="text-btn is-danger" data-act="clear-cart" id="clearCartBtn">
                  <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 7V5.6A1.6 1.6 0 0 1 11.6 4h.8A1.6 1.6 0 0 1 14 5.6V7M6.5 7l1 12.2A1.5 1.5 0 0 0 9 20.6h6a1.5 1.5 0 0 0 1.5-1.4L17.5 7M10 11v6M14 11v6"/></svg>
                  清空
                </button>
              </header>
              <div class="p-scroll" id="cartScroll">
                <div id="cartEmpty" class="empty-box" hidden>
                  <span class="empty-glyph" aria-hidden="true">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M2.8 5h1.6l2.2 8.6a2 2 0 0 0 2 1.5h6.6a2 2 0 0 0 1.9-1.4L19.6 8H6.4"/><circle cx="9.4" cy="20" r="1.5"/><circle cx="16.6" cy="20" r="1.5"/><path d="M9.8 10.5h4.4M12 8.3v4.4"/></svg>
                  </span>
                  <p class="empty-title">购物车还是空的</p>
                  <p class="empty-sub">本店满 ¥40 免配送费，去挑几道喜欢的好菜吧。</p>
                  <button class="btn btn-primary" data-act="goto-menu" style="margin-top:14px;">去点餐</button>
                </div>
                <div id="cartBody"></div>
              </div>
              <div class="cart-foot" id="cartFoot" hidden>
                <div class="cart-total-l od-fill">
                  <div class="cart-foot-note" id="cartGateNote"></div>
                  <div class="od-nowrap"><small class="total-price" id="cartFootTotal" style="font-size:18px;">¥0</small></div>
                </div>
                <button class="btn btn-primary" id="checkoutBtn" data-act="checkout">去结算</button>
              </div>

  function comboKey(itemId, specId, addonKey) {

    var s = null;

  function qtyOfCombo(itemId, specId, addonIds) {
    var key = comboKey(itemId, specId, (addonIds || []).slice().sort().join(","));

    var ids = (addonIds || []).slice().sort();
    var addons = (item.addons || []).filter(function (a) { return ids.indexOf(a.id) >= 0; });
    var addSum = 0;
    addons.forEach(function (a) { addSum += a.price; });
    var spec = null;

    var unit = item.base + (spec ? spec.delta : 0) + addSum;
    return {

      itemId: item.id,
      name: item.name,
      specId: specId,
      specName: spec ? spec.name : "",

      addonNames: addonNameList(item, ids),
      unit: unit,
      qty: qty || 1

  }

  function calc() {
    var subtotal = 0;
    var count = 0;
    state.cart.forEach(function (ln) { subtotal += ln.unit * ln.qty; count += ln.qty; });

    var baseFee = 0;
    if (state.service === "delivery") baseFee = subtotal >= FREE_MIN ? 0 : DELIVERY_FEE;

    var coupon = state.applied ? couponByCode(state.applied) : null;
    var cState = "none";
    var discount = 0;
    var fee = baseFee;

    if (coupon) {
      if (state.used.indexOf(coupon.code) >= 0) cState = "used";
      else if (subtotal < coupon.min) cState = "below";
      else if (coupon.type === "amount") { discount = coupon.value; cState = "on"; }
      else {
        if (state.service === "delivery" && baseFee > 0) { fee = 0; discount = baseFee; cState = "on"; }
        else cState = "none";
      }
    }

    var total = subtotal - discount + fee;
    if (total < 0) total = 0;
    return { subtotal: subtotal, count: count, fee: fee, discount: discount, total: total, coupon: coupon, cState: cState };
  }

    if (opts.app) wrap.inert = true;
    if (opener && opener.focus && typeof opener.focus === "function") lastOpener = opener;
    var af = $("[data-autofocus]", ov);
    if (af) { setTimeout(function () { af.focus(); }, 30); }
  }

  function closeOverlay(immediate) {
    var ov = $("#overlay");
    if (!ov.classList.contains("has-open")) return;
    var finish = function () {
      ov.innerHTML = "";
      ov.classList.remove("has-open");
      ov.setAttribute("aria-hidden", "true");
      $("#appwrap").inert = false;
      if (lastOpener) { try { lastOpener.focus(); } catch (e) {} lastOpener = null; }
    };
    if (immediate || reducedMotion) { finish(); return; }
    var kids = ov.querySelectorAll(".ov");
    kids.forEach(function (k) {
      k.style.transition = "opacity .16s ease-out";
      var panel = k.querySelector(".sheet, .dialog");
      if (panel) panel.style.transition = "opacity .16s ease-out, transform .16s ease-in";
    });
    ov.style.opacity = "0";
    setTimeout(finish, 150);
  }

  function openSheet(innerHtml, opts) {
    var html = '<div class="ov" data-kind="sheet"><div class="ov-scrim" data-act="overlay-close" aria-hidden="true"></div><div class="sheet" role="dialog" aria-modal="true"><span class="sheet-handle" aria-hidden="true"></span>' + innerHtml + "</div></div>";
    openOverlay(html, opts && opts.opener, { app: true });
  }

  function openDialog(cfg) {
    window.__confirmCb = cfg.onOk;
    var html =
      '<div class="ov" data-kind="dialog"><div class="ov-scrim" data-act="overlay-close" aria-hidden="true"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-label="' + esc(cfg.title) + '">' +
      '<p class="dialog-title">' + esc(cfg.title) + "</p>" +
      (cfg.text ? '<div class="dialog-txt' + (cfg.rich ? " is-left" : "") + '">' + cfg.text + "</div>" : "") +
      '<div class="dialog-acts">' +
      '<button class="btn btn-soft" data-act="dialog-cancel">' + esc(cfg.cancelText || "取消") + "</button>" +
      '<button class="btn ' + (cfg.okKind === "danger" ? "btn-danger" : "btn-primary") + '" data-act="dialog-ok">' + esc(cfg.okText || "确定") + "</button>" +
      "</div></div></div>";
    openOverlay(html, cfg.opener, { app: true });
  }

  function confirmThen(cfg) {
    openDialog(cfg);
  }

  /* ---------- menu rendering ---------- */
  function matchItem(it) {
    if (state.q) {
      var hay = (it.name + it.desc + it.tags.join("")).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    } else if (state.cat !== "all" && it.cat !== state.cat) {
      return false;
    }
    return true;
  }

  function filteredItems() {
    return MENU.filter(matchItem);
  }

  function dishImgHtml(item, cls, size) {
    if (!item.img) return "";
    var uri = IMG[item.img];
    if (!uri || uri.indexOf("__IMG_") === 0) uri = "";
    var alt = esc(item.name);
    if (!uri) return "";
    return '<span class="' + cls + '" style="--od-ratio:1">' +
      '<img class="od-media od-media-cover" src="' + uri + '" alt="' + alt + '" width="' + (size || 96) + '" height="' + (size || 96) + '" loading="lazy" />' +
      "</span>";
  }

        (state.cat === c.id ? ' aria-pressed="true"' : ' aria-pressed="false"') + ">" + esc(c.name) + "</button>";
    }).join("");

      ? dishImgHtml(it, "dish-thumb")

    var stepper = "";
    if (qty === 0) {
      stepper = '<button class="add-single" data-act="add" data-id="' + it.id + '" aria-label="加入购物车：' + esc(it.name) + '">' + I.plus.replace("viewBox", 'style="width:22px;height:22px;" viewBox') + "</button>";

        '<span class="step-count">' + qty + "</span>" +

    }

    return (
      '<article class="dish">' +

      '<span class="dish-price-line"><span class="od-nowrap"><span class="price-unit" style="font-size:12px;">¥</span><span class="price" style="font-size:18px;">' + fmt(it.base) + '</span></span></span>' +

  /* ---------- dish sheet ---------- */
  function dishBase() { return state.dish; }

  function dishComboQty() {
    var d = dishBase();
    if (!d) return 0;
    return qtyOfCombo(d.item.id, d.specId, d.addons);
  }

  function refreshDishSheet() {
    var d = dishBase();
    if (!d) return;
    var item = d.item;
    var qty = qtyOfCombo(item.id, d.specId, d.addons);
    if (qty > 0) d.qty = qty;
    else if (!d.qty || d.qty < 1) d.qty = 1;

    var unit = item.base;
    var spec = null;
    (item.specs || []).forEach(function (s) { if (s.id === d.specId) spec = s; });
    if (spec) unit += spec.delta;
    d.addons.forEach(function (aid) {
      (item.addons || []).forEach(function (a) { if (a.id === aid) unit += a.price; });
    });

    var total = unit * d.qty;
    var u = $("#dsUnitPrice");
    if (u) u.textContent = fmt(unit);
    var tt = $("#dsTotal");
    if (tt) tt.textContent = fmt(total);
    var cap = $("#dsCountCap");
    if (cap) cap.textContent = String(d.qty);
    var q = $("#dsQty");
    if (q) q.textContent = String(d.qty);
    var addedBtn = $("#dsAddBtn");
    var inCart = qtyOfCombo(item.id, d.specId, d.addons) > 0;
    addedBtn.textContent = inCart ? "再买一件" : "加入购物车";
    addedBtn.classList.toggle("is-added", inCart);
    var stepDec = $("#dsDec");
    if (stepDec) stepDec.disabled = d.qty <= 1;

    $$(".opt-row[data-spec]").forEach(function (r) {
      var on = r.getAttribute("data-spec") === d.specId;
      r.classList.toggle("is-on", on);
      r.setAttribute("aria-checked", on ? "true" : "false");
    });
    $$(".opt-row[data-addon]").forEach(function (r) {
      var on = d.addons.indexOf(r.getAttribute("data-addon")) >= 0;
      r.classList.toggle("is-on", on);
      r.setAttribute("aria-checked", on ? "true" : "false");
    });
  }

  function openDish(itemId, openerEl) {
    var item = ITEMS[itemId];
    if (!item) return;
    var d = { item: item, specId: item.specs.length ? item.specs[0].id : "", addons: [], qty: 1 };
    var comboQ = qtyOfCombo(item.id, d.specId, d.addons);
    if (comboQ > 0) d.qty = comboQ;
    state.dish = d;

    var headImg = item.img ? '<div class="ds-img"><img src="' + IMG[item.img] + '" alt="' + esc(item.name) + '" width="480" height="480" /></div>' : "";

    var specsHtml = "";
    if (item.specs.length) {
      specsHtml += '<div class="ds-sect"><p class="ds-sect-label">规格<span class="ds-sect-sub">必选</span></p>';
      specsHtml += item.specs.map(function (s) {
        var priceTxt = s.delta === 0 ? "" : (s.delta > 0 ? " +¥" + fmt(s.delta) : " -¥" + fmt(-s.delta));
        var on = s.id === d.specId;
        return '<button class="opt-row' + (on ? " is-on" : "") + '" data-spec="' + s.id + '" role="radio" aria-checked="' + on + '">' +
          '<span class="opt-radio" aria-hidden="true"><i></i></span>' +
          '<span class="opt-name">' + esc(s.name) + "</span>" +
          (priceTxt ? '<span class="opt-price od-nowrap">' + priceTxt + "</span>" : "") + "</button>";
      }).join("");
      specsHtml += "</div>";
    }

    var addonsHtml = "";
    if (item.addons.length) {
      addonsHtml += '<div class="ds-sect"><p class="ds-sect-label">加料<span class="ds-sect-sub">可多选</span></p>';
      addonsHtml += item.addons.map(function (a) {
        return '<button class="opt-row" data-addon="' + a.id + '" role="checkbox" aria-checked="false">' +
          '<span class="opt-name">' + esc(a.name) + "</span>" +
          (a.price ? '<span class="opt-price od-nowrap">+¥' + fmt(a.price) + "</span>" : '<span class="opt-price">免费</span>') +
          '<span class="opt-check" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="m5.5 12.8 4.2 4.2L18.5 8"/></svg></span></button>';
      }).join("");
      addonsHtml += "</div>";
    }

    var tags = (item.tags || []).map(function (t) { return '<span class="dish-tag">' + esc(t) + "</span>"; }).join("");

    var body =
      '<div class="sheet-head"><span class="sheet-title">菜品详情</span>' +
      '<button class="sheet-x" data-act="overlay-close" aria-label="关闭">' + I.close + "</button></div>" +
      '<div class="sheet-body">' +
      headImg +
      '<div class="ds-main">' +
      '<div class="ds-name-row"><span class="ds-name">' + esc(item.name) + "</span></div>" +
      (tags ? '<div class="ds-tags">' + tags + "</div>" : "") +
      '<div class="ds-price"><span class="od-nowrap">¥<span class="price" id="dsUnitPrice">' + fmt(item.base) + "</span></span></div>" +
      '<p class="ds-desc">' + esc(item.desc || "") + "</p></div>" +
      specsHtml +
      addonsHtml +
      "</div>" +
      '<div class="ds-buy sheet-foot">' +
      '<div class="ds-buy-total"><div class="ds-buy-cap">共 <span id="dsCountCap">1</span> 份，合计</div>' +
      '<div class="od-nowrap">¥<span class="price" id="dsTotal">' + fmt(item.base) + "</span></div></div>" +
      '<div class="stepper" role="group" aria-label="数量">' +
      '<button class="step-btn step-dec" id="dsDec" data-act="ds-dec" aria-label="减少数量" ' + (d.qty <= 1 ? "disabled" : "") + ">" + I.minus + "</button>" +
      '<span class="step-count" id="dsQty">1</span>' +
      '<button class="step-btn step-inc" data-act="ds-inc" aria-label="增加数量">' + I.plus + "</button></div>" +
      '<button class="btn btn-primary ds-buy-btn" id="dsAddBtn" data-act="ds-add">加入购物车</button>' +
      "</div>";

    openSheet(body, { opener: openerEl });
    refreshDishSheet();
  }

          '<span class="addr-pin" aria-hidden="true">' + I.pin + "</span>" +
          '<div class="addr-main"><div class="addr-who">还没有收货地址</div>' +
          '<div class="addr-where">下单前需要先添加一个配送地址</div></div>' +
          '<span class="addr-edit" style="color:var(--accent-deep);" aria-hidden="true">' + I.chev + "</span></button></section>";

    } else {

      return '<div class="line">' + thumb +
        '<div class="line-main">' +

        (desc ? '<span class="line-meta">' + esc(desc) + "</span>" : "") +
        '<span class="line-prices"><span class="od-nowrap"><span class="line-unit">¥' + fmt(ln.unit) + "</span></span>" +
        '<span class="od-nowrap"><span class="line-total" style="color:var(--ink);">¥' + fmt(ln.unit * ln.qty) + "</span></span></span></div>" +
        '<div class="line-side">' +
        '<button class="del-btn" data-act="del" data-key="' + ln.key + '" aria-label="删除：' + esc(ln.name) + (desc ? "（" + esc(desc) + "）" : "") + '">' + I.trash + "</button>" +
        '<div class="stepper" role="group" aria-label="数量：' + esc(ln.name) + '">' +
        '<button class="step-btn step-dec" data-act="cart-dec" data-key="' + ln.key + '" aria-label="减少：' + esc(ln.name) + '">' + I.minus + "</button>" +

        "</div></div></div>";

    var couponHtml = couponCardHtml(t);

    body.innerHTML =
      '<section class="cart-sec" style="margin-top:12px;">' +
      '<div class="seg" role="radiogroup" aria-label="取餐方式">' +

      '<section class="cart-sec" style="margin-bottom:20px;"><div class="panel">' + billHtml + "</div></section>";

  function couponCardHtml(t) {
    var inner;
    if (state.applied && t.coupon) {
      var stateTxt = t.cState === "on" ? '<span class="coupon-tag">已优惠 ¥' + fmt(t.discount) + "</span>"
        : t.cState === "used" ? '<span class="coupon-tag is-off">已使用</span>'
        : t.cState === "below" ? '<span class="coupon-tag is-off">还差 ¥' + fmt(t.coupon.min - t.subtotal) + "</span>"
        : '<span class="coupon-tag is-off">已选</span>';
      inner =
        '<button class="coupon-line" data-act="open-coupons">' +
        '<span class="coupon-ico" aria-hidden="true">' + I.ticket + "</span>" +
        '<span class="coupon-txt"><span class="coupon-cap od-truncate">' + esc(t.coupon.code) + " · " + esc(t.coupon.desc) + "</span>" +
        '<span class="coupon-sub">点击可更换或移除</span></span>' + stateTxt +
        '<span class="coupon-pick">' + I.chev + "</span></button>";
    } else {
      var hint = "本店可领：满 ¥80 减 ¥15 等";
      inner =
        '<button class="coupon-line" data-act="open-coupons">' +
        '<span class="coupon-ico" aria-hidden="true">' + I.ticket + "</span>" +
        '<span class="coupon-txt"><span class="coupon-cap">优惠券</span><span class="coupon-sub">' + hint + "</span></span>" +
        '<span class="coupon-pick" style="color:var(--warn);">' + I.chev + "</span></button>";
    }
    return inner;
  }

  function billHtmlOf(t) {
    var rows = "";
    rows += billRow("商品金额", '<b>¥' + fmt(t.subtotal) + "</b>");
    if (t.discount > 0) {
      var label = t.coupon ? "优惠（" + esc(t.coupon.code) + "）" : "优惠";
      rows += billRow(label, '<b class="cut">-¥' + fmt(t.discount) + "</b>");
    }
    if (state.service === "delivery") {
      if (t.fee === 0) {
        if (t.subtotal >= FREE_MIN) rows += billRow("配送费", '<span class="od-nowrap free">已免（满 ¥40）</span>');
        else if (t.discount > 0) rows += billRow("配送费", '<span class="od-nowrap free">已免（优惠券）</span>');
        else rows += billRow("配送费", '<span class="od-nowrap free">免费</span>');
      } else {
        rows += billRow("配送费", '<b>¥' + fmt(t.fee) + "</b>");
      }
    } else {
      rows += billRow("配送费", '<span class="od-nowrap free">自取免配送费</span>');
    }
    rows +=
      '<div class="bill-row bill-total">' +
      '<span class="od-nowrap">实付金额</span><span class="od-nowrap"><b>¥' + fmt(t.total) + "</b></span></div>";

    var noteLines = [];
    if (state.service === "delivery") {
      if (t.subtotal < FREE_MIN) noteLines.push("再买 ¥" + fmt(FREE_MIN - t.subtotal) + " 可免配送费");
      var gap = underMinDelivery();
      if (gap) noteLines.push("外卖起送 ¥20");
    } else {
      noteLines.push("到店自取，凭取餐号到店取餐");
    }
    return '<div class="bill">' + rows + (noteLines.length ? '<p class="bill-note">' + noteLines.join(" · ") + "</p>" : "") + "</div>";
  }

  function billRow(k, v) {
    return '<div class="bill-row"><span class="od-nowrap">' + k + "</span><span>" + v + "</span></div>";
  }

  function renderCartFoot(t) {
    var note = $("#cartGateNote");
    var btn = $("#checkoutBtn");
    var total = $("#cartFootTotal");
    total.textContent = "¥" + fmt(t.total);
    var gap = underMinDelivery();
    if (state.service === "delivery" && gap) {
      note.textContent = "还差 ¥" + fmt(gap) + " 起送";
      btn.disabled = true;
      btn.textContent = "去结算";
    } else if (!state.address && state.service === "delivery") {
      note.textContent = "请先添加收货地址";
      btn.disabled = false;
      btn.textContent = "添加地址去结算";
    } else {
      note.textContent = "";
      btn.disabled = false;
      btn.textContent = state.service === "delivery" ? "去结算" : "提交自取订单";
    }
  }

  /* ---------- coupon sheet ---------- */
  function couponStateFor(cp, t) {
    if (state.used.indexOf(cp.code) >= 0) return { on: false, txt: "已使用", dim: true };
    if (t.subtotal < cp.min) return { on: false, txt: "还差 ¥" + fmt(cp.min - t.subtotal), dim: true };
    if (state.applied === cp.code) return { on: true, txt: "使用中", dim: false };
    if (state.applied && couponByCode(state.applied)) return { on: false, txt: "可领", dim: false };
    return { on: false, txt: "可领", dim: false };
  }

  function openCoupons(opener) {
    var t = calc();
    var appliedIsValid = state.applied && t.coupon && t.cState === "on";

    var list = COUPONS.map(function (cp) {
      var st = couponStateFor(cp, t);
      var used = state.used.indexOf(cp.code) >= 0;
      var isCur = state.applied === cp.code;
      return (
        '<button class="coupon-sheet-row od-row" style="width:100%;text-align:left;" data-act="coupon-pick" data-code="' + cp.code + '"' +
        (st.dim || isCur ? ' aria-disabled="true"' : "") + ">" +
        '<span class="coupon-ico" aria-hidden="true">' + I.ticket + "</span>" +

        '<span class="coupon-sub" style="display:block;">' + esc(cp.desc) + (cp.type === "fee" ? "（配送专用）" : "") + "</span>" +
        (used ? '<span class="coupon-sub" style="display:block;">本券仅限使用一次</span>' : "") +
        "</span>" +
        '<span class="pill ' + (st.on ? "p-ok" : "p-mute") + '" style="flex:none;"><span class="dot"></span>' + esc(st.txt) + "</span>" +

      );
    }).join("");

    var hintChips = COUPONS.map(function (cp) {
      return '<button class="hint-chip' + (state.used.indexOf(cp.code) >= 0 ? " is-dim" : "") + '" data-act="coupon-fill" data-code="' + cp.code + '">' + esc(cp.code) + "</button>";
    }).join("");

    var html =
      '<div class="sheet-head"><span class="sheet-title">选择优惠券</span>' +
      '<button class="sheet-x" data-act="overlay-close" aria-label="关闭">' + I.close + "</button></div>" +
      '<div class="sheet-body">' +
      (appliedIsValid ? '<div class="applied-coupon"><span class="coupon-ico" aria-hidden="true">' + I.ticket + "</span>" +
        '<span class="coupon-txt"><span class="coupon-cap">当前使用：' + esc(state.applied) + "</span>" +
        '<span class="coupon-sub">已优惠 ¥' + fmt(t.discount) + "</span></span>" +
        '<button class="mini-btn" data-act="coupon-remove">不使用</button></div>' : "") +
      '<p class="coupon-list-title">可用券（下单后核销，单笔限用一张）</p>' +
      list +
      '<p class="coupon-list-title" style="margin-top:10px;">手动输入兑换码</p>' +
      '<div class="coupon-code-input-row">' +
      '<input class="coupon-code-input" id="couponCode" placeholder="输入优惠码" maxlength="16" autocomplete="off" data-autofocus />' +
      '<button class="btn btn-primary coupon-apply" data-act="coupon-apply">使用</button></div>' +
      '<div class="coupon-msg" id="couponMsg"></div>' +
      '<div class="coupon-hint-row"><div class="coupon-hints"><span class="coupon-list-title" style="padding:0;">可点此填入：</span>' + hintChips + "</div></div>" +
      '<div style="height:16px;"></div></div>';

  function couponMsgSet(kind, text) {
    var m = $("#couponMsg");
    if (m) { m.className = "coupon-msg " + kind; m.textContent = text; }
  }

  function applyCouponCode(code) {
    var cp = couponByCode(code);
    var t = calc();
    if (!cp) {
      couponMsgSet("bad", "未找到优惠码「" + code + "」，请核对后重试。");
      return;
    }
    if (state.used.indexOf(code) >= 0) {
      couponMsgSet("bad", "优惠码「" + code + "」已使用过，本券单次有效。");
      return;
    }
    if (t.subtotal < cp.min) {
      couponMsgSet("bad", "未达到门槛：还差 ¥" + fmt(cp.min - t.subtotal) + " 即可使用「" + code + "」。");
      return;
    }
    if (cp.type === "fee" && state.service === "pickup") {
      couponMsgSet("bad", "当前为自取订单，无需配送费，此券不适用。");
      return;
    }
    state.applied = code;
    persistAll();
    couponMsgSet("ok", "已使用优惠码「" + code + "」，金额已更新。");
    renderCart();
    renderDishBadge();
  }

  /* ---------- address editor ---------- */
  function openAddress(opener) {
    var a = state.address || { name: "", phone: "", detail: "", door: "", tag: "家" };
    pendingAddrTag = a.tag || "家";
    var tagMap = ["家", "公司", "学校"];

      fieldBlock("detail", "详细地址", '<span class="req">*</span>', '<textarea class="field-area" id="f-detail" name="detail" rows="2" maxlength="60" placeholder="街道、小区、楼栋与门牌">' + esc(a.detail) + "</textarea>", "必填：请填写完整到门牌号的地址。") +

      "</form></div>";

    openSheet(body, { opener: opener });

    Array.prototype.forEach.call(inputs, function (inp) {
      inp.addEventListener("blur", function () {

        updateAddrSummary();
      });
    });

  function fieldBlock(key, label, mark, inputHtml, errMsg) {
    return '<div class="field" data-f="' + key + '">' +
      '<label class="field-label" for="f-' + key + '">' + label + " " + mark + "</label>" +
      inputHtml +
      '<p class="ferr" role="alert" data-err-for="' + key + '">' + errMsg + "</p></div>";
  }

  function addrValue() {
    var el = function (n) { return $("#addrForm").querySelector('[name="' + n + '"]'); };
    return {
      name: el("name").value.trim(),
      phone: el("phone").value.trim(),
      detail: el("detail").value.trim(),
      door: "",
      tag: pendingAddrTag
    };
  }

  function validateAddrField(key) {
    var v = addrValue();
    var field = $('.field[data-f="' + key + '"]');
    var bad = false;
    if (key === "name") bad = !v.name;
    else if (key === "phone") bad = !/^1\d{10}$/.test(v.phone);
    else if (key === "detail") bad = !v.detail;
    if (field) field.classList.toggle("is-bad", bad);
    return !bad;
  }

  function updateAddrSummary() {
    var bads = [];
    var checks = ["name", "phone", "detail"];
    checks.forEach(function (k) { if (!validateAddrField(k)) bads.push(k); });
    var sum = $("#addrSummary");
    if (!sum) return;
    if (bads.length) {
      var mapName = { name: "收货人", phone: "手机号", detail: "详细地址" };
      sum.className = "form-summary show";
      sum.innerHTML = "还有 <b>" + bads.length + "</b> 项未填写正确：" + bads.map(function (k) {
        return '<a href="#f-' + k + '" data-focus-field="' + k + '">' + mapName[k] + "</a>";
      }).join("、") + "。请补充后重试。";
    } else {
      sum.className = "form-summary";
      sum.innerHTML = "";
    }
    return bads.length === 0;
  }

  /* ---------- orders ---------- */
  function seedOrders() {
    var addr = { name: "测试用户-001", phone: "00000000000", detail: "测试地址-001（非真实地址）", door: "", tag: "家" };
    function ago(mins) { return new Date(Date.now() - mins * 60000).toISOString(); }

    var orders = [];
    var lines;

    lines = [makeLine(ITEMS.kungpao, "l", ["spicy"], 1), makeLine(ITEMS.mapotofu, "m", ["mince"], 1), makeLine(ITEMS.chaofan, "l", [], 1)];
    orders.push(buildOrder("delivery", "done", ago(60 * 24), lines, "WELCOME15", addr));

    lines = [makeLine(ITEMS.huntun, "", ["xia"], 2), makeLine(ITEMS.danhuatang, "", [], 1)];
    orders.push(buildOrder("delivery", "canceled", ago(60 * 3), lines, null, addr));

    lines = [makeLine(ITEMS.kungpao, "m", [], 2), makeLine(ITEMS.qiezi, "", ["mince2"], 1)];
    orders.push(buildOrder("delivery", "delivering", ago(45), lines, "XINGYUN8", addr));

    lines = [makeLine(ITEMS.mapotofu, "m", [], 1), makeLine(ITEMS.chaofan, "m", [], 1)];
    orders.push(buildOrder("pickup", "pickup", ago(50), lines, null, null));

    lines = [makeLine(ITEMS.congee, "", ["you"], 1), makeLine(ITEMS.suanmei, "", [], 1)];
    orders.push(buildOrder("delivery", "pending", ago(6), lines, null, addr));

    return orders;
  }

  function buildOrder(service, status, timeISO, lines, couponCode, address) {
    var tmpApplied = state.applied;
    var tmpCart = state.cart;
    var tmpService = state.service;
    state.service = service;
    state.cart = lines;
    state.applied = couponCode;
    var t = calc();
    state.service = tmpService;
    state.cart = tmpCart;
    state.applied = tmpApplied;

    var items = lines.map(function (ln) {
      return {
        itemId: ln.itemId,
        name: ln.name,
        meta: lineDesc(ln),
        specId: ln.specId,
        addonIds: ln.addonIds,
        unit: ln.unit,
        qty: ln.qty
      };
    });

    var order = {
      id: "DD" + String(Math.floor(Math.random() * 900000000) + 100000000),
      service: service,
      status: status,
      time: timeISO,
      items: items,
      couponCode: couponCode,
      subtotal: t.subtotal,
      discount: t.discount,
      fee: t.fee,
      total: t.total,
      address: address || null,
      store: STORE_NAME
    };
    return order;
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    function p2(n) { return n < 10 ? "0" + n : "" + n; }
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    var yesterday = new Date(today.getTime() - 86400000);
    var isY = d.toDateString() === yesterday.toDateString();
    var hm = p2(d.getHours()) + ":" + p2(d.getMinutes());
    if (sameDay) return "今天 " + hm;
    if (isY) return "昨天 " + hm;
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }

  function orderServiceText(o) { return o.service === "delivery" ? "外卖配送" : "到店自取"; }
  function orderAddrText(o) {
    if (!o.address) return PICKUP_PLACE;
    var a = o.address;
    return a.name + " " + a.phone + " · " + a.detail + (a.door ? " " + a.door : "");
  }

  function orderActions(o) {
    if (o.status === "pending") return [{ act: "order-cancel", label: "取消订单", kind: "line" }];
    if (o.status === "delivering") return [{ act: "order-receive", label: "确认收货", kind: "solid" }];
    if (o.status === "pickup") return [{ act: "order-receive", label: "确认取餐", kind: "solid" }];
    if (o.status === "done" || o.status === "canceled") return [{ act: "order-repeat", label: "再来一单", kind: "line" }];
    return [];
  }

  function renderOrderRail() {
    var rail = $("#orderRail");
    var chips = [{ id: "all", name: "全部" }];
    STATUS_ORDER.forEach(function (k) { chips.push({ id: k, name: STATUS[k].label }); });
    rail.innerHTML = chips.map(function (c) {
      return '<button class="cat-chip' + (state.orderFilter === c.id ? " is-on" : "") + '" data-act="order-filter" data-s="' + c.id + '"' +
        (state.orderFilter === c.id ? ' aria-pressed="true"' : ' aria-pressed="false"') + ">" + esc(c.name) + "</button>";
    }).join("");
  }

  function filteredOrders() {
    var list = state.orders.slice();
    if (state.orderFilter !== "all") list = list.filter(function (o) { return o.status === state.orderFilter; });
    return list;
  }

  function orderCard(o) {
    var st = STATUS[o.status];
    var acts = orderActions(o);
    var items = o.items.slice(0, 3);
    var more = o.items.length - items.length;
    var rows = items.map(function (it) {
      return '<span class="order-item-row"><span class="order-item-name">' + esc(it.name) + (it.meta ? '<span style="color:var(--ink-3);font-size:12px;">（' + esc(it.meta) + "）</span>" : "") + "</span>" +
        '<span class="order-qty">×' + it.qty + "</span></span>";

      return '<button class="' + cls + '" data-act="' + a.act + '" data-id="' + o.id + '">' + esc(a.label) + "</button>";

    return (
      '<article class="order-card panel" data-act="order-open" data-id="' + o.id + '">' +

      (actBtns ? '<span class="order-acts">' + actBtns + "</span>" : "") +
      "</div></article>"
    );

  function renderOrders() {
    renderOrderRail();
    var list = filteredOrders();

      '<div class="panel" style="margin:0 16px;">' + items + "</div>" +
