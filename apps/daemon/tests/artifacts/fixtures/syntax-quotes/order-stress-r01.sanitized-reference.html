      '<div class="panel" style="margin:0 16px;padding:2px 16px;">' + billRows + "</div>" +
      '<div style="height:18px;"></div></div>' +
      '<div class="sheet-foot" style="padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:10px;">' + actBtns + "</div>";

    openSheet(body, { opener: opener });
  }

  function detailRow(k, v) {
    return '<div class="order-detail-row"><span style="flex:none;">' + k + "</span><span class=\"od-truncate\" style=\"flex:1;text-align:right;\">" + v + "</span></div>";
  }

  function repeatOrder(o, opener) {
    var count = 0;
    var missing = 0;
    o.items.forEach(function (it) {
      var item = ITEMS[it.itemId];
      if (!item) {
        for (var i = 0; i < MENU.length; i++) { if (MENU[i].name === it.name) item = MENU[i]; }
      }
      if (!item) { missing++; return; }
      var specId = it.specId || (item.specs.length ? item.specs[0].id : "");
      if (!it.specId && item.specs.length) {
        var ok = null;
        item.specs.forEach(function (s) { if (s.delta === (it.unit - item.base)) ok = s.id; });
        if (ok) specId = ok;
      }
      var usedAddons = [];
      (it.addonIds || []).forEach(function (aid) {
        (item.addons || []).forEach(function (a) { if (a.id === aid) usedAddons.push(aid); });
      });
      addToCart(item, specId, usedAddons, it.qty);
      count += it.qty;
    });
    closeOverlay(true);
    goRoute("cart");
    persistAll();
    renderDishBadge();
    if (missing) {
      toast("已把可下单的 " + count + " 件加入购物车，另有 " + missing + " 项已下架未加入。");
    } else {
      toast("已把本单 " + count + " 件商品加入购物车，可继续调整。");
    }
  }

  /* ---------- placing order ---------- */
  function checkout() {
    if (!state.cart.length) return;
    var gap = underMinDelivery();
    if (gap) {
      toast("还差 ¥" + fmt(gap) + " 才起送，再逛逛吧。");
      return;
    }
    if (state.service === "delivery" && !state.address) {
      openAddress();
      toast("请先填写配送地址。", 2400);
      return;
    }
    var t = calc();
    var okEl = document.activeElement && document.activeElement.closest ? document.activeElement.closest("[data-act='checkout']") : null;
    var opener = okEl && okEl.focus ? okEl : null;

    var destHtml = state.service === "delivery"
      ? "配送至：" + esc(state.address.name) + " " + esc(state.address.phone) + " · " + esc(state.address.detail) + (state.address.door ? " " + esc(state.address.door) : "")
      : "到店自取 · " + esc(PICKUP_PLACE);

    var billRows =
      '<div class="bill" style="padding:0;">' +
      billRow("共 " + t.count + " 件", '<b>¥' + fmt(t.subtotal) + "</b>") +
      (t.discount > 0 ? billRow("优惠（" + esc((t.coupon || {}).code || "") + "）", '<b class="cut">-¥' + fmt(t.discount) + "</b>") : "") +
      billRow("配送费", t.fee === 0 ? '<span class="free">免费</span>' : "<b>¥" + fmt(t.fee) + "</b>") +
      '<div class="bill-row bill-total"><span>实付金额</span><b style="color:var(--price);font-size:18px;">¥' + fmt(t.total) + "</b></div>" +
      "</div>";

    confirmThen({
      title: "确认提交订单",
      text: destHtml +
        '<div style="margin-top:12px;">' + billRows + "</div>",
      rich: true,
      okText: "提交订单",
      cancelText: "再想想",
      onOk: function () { placeOrder(); },
      opener: opener
    });
  }

  function placeOrder() {
    var t = calc();
    var lines = state.cart.map(function (ln) {
      return {
        itemId: ln.itemId,
        name: ln.name,
        meta: lineDesc(ln),
        specId: ln.specId,
        addonIds: ln.addonIds,
        unit: ln.unit,
        qty: ln.qty
      };
    });
    var addrSnap = state.service === "delivery" ? state.address : null;

    var order = {
      id: "DD" + String(Math.floor(Math.random() * 900000000) + 100000000),
      service: state.service,
      status: "pending",
      time: new Date().toISOString(),
      items: lines,
      couponCode: state.applied && t.discount > 0 ? state.applied : null,
      subtotal: t.subtotal,
      discount: t.discount,
      fee: t.fee,
      total: t.total,
      address: addrSnap,
      store: STORE_NAME
    };

    state.orders.unshift(order);
    if (order.couponCode) {
      state.used.push(order.couponCode);
    }
    var placedTotal = order.total;
    var placedId = order.id;
    var placedService = order.service;
    var placedCount = t.count;

    state.cart = [];
    state.applied = null;
    persistAll();
    renderDishBadge();
    renderCart();

    var acts =
      '<button class="btn btn-primary" data-act="success-orders">查看订单</button>' +
      '<button class="btn btn-soft" data-act="success-menu">继续点餐</button>';

    var html =
      '<div class="ov" data-kind="dialog"><div class="ov-scrim" aria-hidden="true"></div>' +
      '<div class="dialog"><div class="success-wrap">' +
      '<span class="success-ring" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="m5.5 12.8 4.2 4.2L18.5 8"/></svg></span>' +
      '<p class="success-title">订单已提交</p>' +
      '<p class="success-sub">' + (placedService === "delivery" ? "商家接单后开始制作，可随时在「订单」页查看进度。" : "到店报取餐号即可取餐，出餐后可到店。") + "</p>" +
      '<p class="success-sub" style="margin-top:2px;">订单号：' + esc(placedId) + "</p>" +
      '<div class="success-num">' +
      '<span class="od-stat"><b>' + placedCount + '</b><span>件数</span></span>' +
      '<span class="od-stat"><b>¥' + fmt(placedTotal) + '</b><span>实付金额</span></span>' +
      "</div>" +
      '<div class="success-acts">' + acts + "</div>" +
      "</div></div></div>";

    openOverlay(html, null, { app: true });
  }

  /* ---------- undo ---------- */
  function removeLine(key, withUndo) {
    var line = null;
    var idx = -1;
    state.cart.forEach(function (ln, i) { if (ln.key === key) { line = ln; idx = i; } });
    if (!line) return;
    state.cart.splice(idx, 1);
    persistAll();
    renderCart();
    renderDishBadge();
    if (withUndo) {
      showUndoToast(JSON.parse(JSON.stringify(line)), idx);
    }
  }

  function showUndoToast(line, idx) {
    var box = $("#toasts");
    var t = document.createElement("div");
    t.className = "toast";
    t.setAttribute("role", "status");
    var label = line.name + (lineDesc(line) ? "（" + lineDesc(line) + "）" : "");
    t.innerHTML = '<span class="tt">已删除「' + esc(label) + "」</span>" +
      '<button class="toast-act" type="button">撤销</button>';
    box.appendChild(t);
    var timer = setTimeout(function () { t.remove(); }, 4200);
    t.querySelector(".toast-act").addEventListener("click", function () {
      clearTimeout(timer);
      t.remove();
      var existing = null;
      state.cart.forEach(function (ln) { if (ln.key === line.key) existing = ln; });
      if (existing) {
        existing.qty += line.qty;
      } else {
        state.cart.splice(Math.min(idx, state.cart.length), 0, line);
      }
      persistAll();
      renderCart();
      renderDishBadge();
      toast("已恢复「" + esc(line.name) + "」。");
    });
  }

  function clearCartAll() {
    confirmThen({
      title: "清空购物车",
      text: "购物车中共 " + cartCount() + " 件商品，清空后无法恢复。",
      okText: "清空",
      cancelText: "再想想",
      okKind: "danger",
      onOk: function () {
        state.cart = [];
        state.applied = null;
        persistAll();
        renderCart();
        renderDishBadge();
        toast("购物车已清空。");
      }
    });
  }

  function renderDishBadge() {
    var n = cartCount();
    var badge = $("#cartBadge");
    badge.textContent = n > 99 ? "99+" : String(n);
    badge.classList.toggle("show", n > 0);
  }

  function afterCartChange() {
    renderCart();
    renderDishBadge();
    if (state.route === "menu") renderMenu();
  }

  /* ---------- action delegation ---------- */
  var actions = {
    "nav": function (el) {
      var h = el.getAttribute("data-h");
      navigate(h);
    },
    "cat": function (el) {
      state.cat = el.getAttribute("data-cat");
      if (state.q) {
        state.q = "";
        $("#menuSearch").value = "";
      }
      renderSearchState();
      renderMenu();
    },
    "goto-cat": function (el) {
      state.cat = el.getAttribute("data-cat");
      state.q = "";
      var inp = $("#menuSearch");
      inp.value = "";
      renderSearchState();
      renderMenu();
    },
    "search-clear": function () {
      state.q = "";
      $("#menuSearch").value = "";
      renderSearchState();
      renderMenu();
    },
    "goto-menu": function () { goRoute("menu"); },
    "add": function (el) {
      var item = ITEMS[el.getAttribute("data-id")];
      var specId = item.specs.length ? item.specs[0].id : "";
      addToCart(item, specId, [], 1);
      afterCartChange();
    },
    "minus": function (el) {
      var id = el.getAttribute("data-id");
      var item = ITEMS[id];
      var firstSpec = item && item.specs.length ? item.specs[0].id : "";
      var line = null;
      var dflt = null;
      state.cart.forEach(function (ln) {
        if (ln.itemId !== id) return;
        if (!line) line = ln;
        if (ln.specId === firstSpec && !ln.addonIds.length) dflt = ln;
      });
      var target = dflt || line;
      if (!target) return;
      setCartQtyByKey(target.key, target.qty - 1);
    },
    "open": function (el) {
      openDish(el.getAttribute("data-id"), el);
    },
    "cart-inc": function (el) { setCartQtyByKey(el.getAttribute("data-key"), 1, 1); },
    "cart-dec": function (el) { setCartQtyByKey(el.getAttribute("data-key"), -1, 1); },
    "del": function (el) { removeLine(el.getAttribute("data-key"), true); },
    "set-service": function (el) {
      var svc = el.getAttribute("data-svc");
      if (state.service === svc) return;
      state.service = svc;
      persistAll();
      renderCart();
    },
    "open-addr": function (el) { openAddress(el); },
    "open-coupons": function (el) { openCoupons(el); },
    "coupon-pick": function (el) {
      var code = el.getAttribute("data-code");
      var cp = couponByCode(code);
      if (!cp) return;
      if (state.used.indexOf(code) >= 0) { couponMsgSet("bad", "该券已使用过。"); return; }
      var t = calc();
      if (t.subtotal < cp.min) { couponMsgSet("bad", "未达门槛，还差 ¥" + fmt(cp.min - t.subtotal) + "。"); return; }
      if (cp.type === "fee" && state.service === "pickup") { couponMsgSet("bad", "自取订单无需配送费，此券不适用。"); return; }
      if (state.applied === code) { state.applied = null; }
      else { state.applied = code; }
      persistAll();
      renderCart();
      renderDishBadge();
      couponMsgSet("ok", state.applied ? "已应用「" + code + "」。可在购物车明细中查看。" : "已取消使用该券。");
      var t2 = calc();
      if (state.applied === code && t2.cState === "below") couponMsgSet("bad", "已选择该券，但当前金额未达门槛，未生效。");
    },
    "coupon-fill": function (el) {
      var inp = $("#couponCode");
      if (inp) inp.value = el.getAttribute("data-code");
      couponMsgSet("", "");
    },
    "coupon-apply": function () {
      var inp = $("#couponCode");
      var code = inp ? inp.value.trim().toUpperCase() : "";
      if (!code) { couponMsgSet("bad", "请输入优惠码。"); return; }
      applyCouponCode(code);
    },
    "coupon-remove": function () {
      state.applied = null;
      persistAll();
      renderCart();
      renderDishBadge();
      closeOverlay(true);
      toast("已取消使用优惠券。");
    },
    "overlay-close": function () { closeOverlay(); },
    "dialog-cancel": function () { closeOverlay(); },
    "dialog-ok": function () {
      var cb = window.__confirmCb;
      window.__confirmCb = null;
      closeOverlay(true);
      if (cb) cb();
    },
    "ds-spec": function (el) {
      var d = state.dish;
      if (!d) return;
      d.specId = el.getAttribute("data-spec");
      refreshDishSheet();
    },
    "ds-addon": function (el) {
      var d = state.dish;
      if (!d) return;
      var id = el.getAttribute("data-addon");
      var i = d.addons.indexOf(id);
      if (i >= 0) d.addons.splice(i, 1);
      else d.addons.push(id);
      refreshDishSheet();
    },
    "ds-inc": function () {
      var d = state.dish;
      if (!d) return;
      d.qty += 1;
      refreshDishSheet();
    },
    "ds-dec": function () {
      var d = state.dish;
      if (!d) return;
      if (d.qty > 1) d.qty -= 1;
      refreshDishSheet();
    },
    "ds-add": function () {
      var d = state.dish;
      if (!d) return;
      addToCart(d.item, d.specId, d.addons, d.qty);
      afterCartChange();
      var btn = $("#dsAddBtn");
      if (btn) {
        btn.textContent = "已加入购物车 ✓";
        btn.classList.add("is-added");
      }
      toast("已加入：<b>" + esc(d.item.name) + "</b>");
      d.qty = 1;
      refreshDishSheet();
    },
    "addr-tag": function (el) {
      pendingAddrTag = el.getAttribute("data-tag");
      $$(".pick-label-chip").forEach(function (c) {
        c.classList.toggle("is-on", c.getAttribute("data-tag") === pendingAddrTag);
      });
    },
    "order-filter": function (el) {
      state.orderFilter = el.getAttribute("data-s");
      renderOrders();
    },
    "order-open": function (el) {
      openOrderDetail(el.getAttribute("data-id"), el);
    },
    "order-cancel": function (el) {
      var id = el.getAttribute("data-id");
      var o = findOrder(id);
      if (!o) return;
      confirmThen({
        title: "取消订单",
        text: "确定要取消这笔「" + esc(o.items.length) + " 件 · ¥" + fmt(o.total) + "」的订单吗？取消后不可恢复。",
        okText: "确认取消",
        cancelText: "保留订单",
        okKind: "danger",
        onOk: function () {
          o.status = "canceled";
          persistAll();
          renderOrders();
          toast("订单已取消。");
        }
      });
    },
    "order-receive": function (el) {
      var o = findOrder(el.getAttribute("data-id"));
      if (!o) return;
      if (o.status === "delivering") {
        o.status = "done";
        persistAll();
        renderOrders();
        toast("已确认收货，感谢惠顾。");
      } else if (o.status === "pickup") {
        o.status = "done";
        persistAll();
        renderOrders();
        toast("已确认取餐，欢迎再次光临。");
      }
      var ov = $("#overlay");
      if (ov.classList.contains("has-open")) closeOverlay(true);
    },
    "order-repeat": function (el) {
      var o = findOrder(el.getAttribute("data-id"));
      if (!o) return;
      repeatOrder(o, el);
    },
    "success-orders": function () {
      closeOverlay(true);
      state.orderFilter = "all";
      goRoute("orders");
    },
    "success-menu": function () {
      closeOverlay(true);
      goRoute("menu");
    },
    "clear-cart": function () { clearCartAll(); },
    "checkout": function () { checkout(); }
  };

  function setCartQtyByKey(key, delta) {
    var line = null;
    state.cart.forEach(function (ln) { if (ln.key === key) line = ln; });
    if (!line) return;
    var next = delta === 1 ? line.qty + 1 : line.qty - 1;
    if (next <= 0) {
      removeLine(key, true);
      return;
    }
    line.qty = next;
    persistAll();
    renderCart();
    renderDishBadge();
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    var fn = actions[act];
    if (fn) fn(el);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var ov = $("#overlay");
      if (ov.classList.contains("has-open")) { e.preventDefault(); closeOverlay(); }
    }
  });

  /* spec option rows use data-spec/data-addon not data-act */
  document.addEventListener("click", function (e) {
    var sp = e.target.closest ? e.target.closest(".opt-row[data-spec]") : null;
    if (sp) { actions["ds-spec"](sp); return; }
    var ad = e.target.closest ? e.target.closest(".opt-row[data-addon]") : null;
    if (ad) { actions["ds-addon"](ad); return; }
  });

  /* address submit */
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "addrForm") {
      e.preventDefault();
      var ok = updateAddrSummary();
      if (!ok) {
        var firstBad = $(".field.is-bad");
        if (firstBad) { var inp = firstBad.querySelector("input, textarea"); if (inp) inp.focus(); }
        return;
      }
      var v = addrValue();
      state.address = {
        name: v.name,
        phone: v.phone,
        detail: v.detail,
        door: "",
        tag: pendingAddrTag || "家"
      };
      persistAll();
      closeOverlay(true);
      renderCart();
      toast("收货地址已保存。");
    }
  });

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("[data-focus-field]") : null;
    if (a) {
      e.preventDefault();
      var key = a.getAttribute("data-focus-field");
      var inp = $("#addrForm").querySelector('[name="' + key + '"]');
      if (inp) inp.focus();
    }
  });

  /* search input */
  var searchInput = $("#menuSearch");
  searchInput.addEventListener("input", function () {
    state.q = searchInput.value.trim();
    renderSearchState();
    renderMenu();
  });

  window.addEventListener("hashchange", function () { renderFromCurrentHash(); });

  /* ---------- boot ---------- */
  (function boot() {
    renderDishBadge();
    if (!location.hash) location.hash = "#/menu";
    renderFromCurrentHash();
  })();
})();
</script>
</body>
</html>
