<!doctype html>
<html lang="zh-CN">
<head>

<title>套餐面板 · 交互样式</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#202020;background:#f4f4f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:64px 40px}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #83df62;outline-offset:4px}header{max-width:1320px;margin:auto auto 40px}.eyebrow{font-size:11px;letter-spacing:2px;color:#747474}h1{font-size:32px;letter-spacing:-1px;margin:14px 0}header p{font-size:14px;color:#6d6d6d;line-height:1.8}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.control{border:1px solid #d7d7d4;border-radius:100px;background:transparent;padding:9px 16px;font-size:12px}.control:hover{background:#e9e9e5}.grid{max-width:1320px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.specimen{border:1px solid #dededb;border-radius:20px;background:#eaeae7;overflow:hidden}.stage{min-height:318px;padding:18px 14px;position:relative}.windowbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dots{display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#c9c9c5}.trigger{border:1px solid #d9d9d6;background:#fafafa;border-radius:30px;padding:5px 13px;min-width:62px;font-size:13px;font-weight:600;color:#666}.trigger:hover,.trigger[aria-expanded=true]{color:#202020;background:white}.panel{background:#202020;border-radius:16px;padding:16px;color:#fafafa;box-shadow:0 16px 30px #00000020;font-size:12px;font-weight:500;line-height:18px;transition:opacity .18s,transform .18s}.panel.hidden{opacity:0;transform:translateY(-5px);visibility:hidden}.membership{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}.title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;line-height:24px}.wordmark{font-size:14px;line-height:16px;font-weight:500;letter-spacing:-.8px;border-top:1px solid;bor .wordmark{display:block;width:auto;height:16px;max-width:52px;border:0;border-radius:0;padding:0;filter:brightness(0) invert(1)}.triggerLogo{display:block;height:16px;width:auto;filter:brightness(0);opacity:.65}.trigger{display:flex;align-items:center;justify-content:center;min-height:30px}
.specimen{border:0;background:transparent;overflow:visible}.stage{min-height:0;padding:0}.grid{align-items:start;gap:24px}.dots{display:none}.windowbar{justify-content:flex-end;margin-bottom:18px}
.control[aria-pressed="true"]{background:#202020;color:#fafafa;border-color:#202020}
.planLabel{font-size:14px;font-weight:500;color:#666;line-height:30px}
</style>

<main class="grid" id="grid"></main>

const plans=[{id:'free',name:'免费版',percent:0,balance:'0.00'},{id:'plus',name:'标准版',percent:24,balance:'12.00'},{id:'pro',name:'专业版',percent:36,balance:'0.00'},{id:'max',name:'旗舰版',percent:62,balance:'28.00'}];

for(const plan of plans){const paid=plan.id!=='free';const el=document.createElement('section');el.className='specimen '+plan.id;el.dataset.plan=plan.id;el.innerHTML=`<div class="stage"><div class="windowbar"><div class="dots"><i></i><i></i><i></i></div><span class="planLabel">${plan.id[0].toUpperCase()+plan.id.slice(1)}</span></div><div class="panel" id="panel-${plan.id}"><div class="membership"><div class="title"><span>${plan.name}</span><img class="wordmark" src="${officialLogos[plan.id]}" alt="${plan.id}" /></div><span class="upgrade">${plan.id==='max'?'管理':'升级'}</span></div><div class="data" aria-busy="false"><div class="content">${paid?`<div class="row"><span>7天额度免费用</span><span class="entry"><span>已用 ${plan.percent}%</span>${arrow}</span></div><div class="track" role="progressbar" aria-label="7天额度免费用" aria-valuenow="${plan.percent}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${plan.percent}%"></div></div>`:''}<div class="wallet"><span>钱包余额</span><span class="value">US$${plan.balance}${arrow}</span></div></div><div class="skeletons" aria-hidden="true">${paid?'<div class="row"><div class="bone"></div><div class="bone end"></div></div><div class="bone long"></div>':''}<div class="skeletonWallet"><div class="bone"></div><div class="bone end"></div></div></div></div></div></div>`;document.querySelector('#grid').append(el);

}
function setMode(loading){
 document.querySelector('#show-all').setAttribute('aria-pressed',String(!loading));
 document.querySelector('#load-all').setAttribute('aria-pressed',String(loading));
 document.querySelectorAll('.specimen').forEach(el=>{
 const data=el.querySelector('.data'),content=el.querySelector('.content');
 data.classList.toggle('pending',loading);data.setAttribute('aria-busy',String(loading));
 content.inert=loading;content.setAttribute('aria-hidden',String(loading));
 });
}
document.querySelector('#show-all').onclick=()=>setMode(false);
document.querySelector('#load-all').onclick=()=>setMode(true);
</script>
</body></html>
