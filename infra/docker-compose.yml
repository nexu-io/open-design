version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studio365-postgres
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio365
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: studio365-redis
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    container_name: studio365-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Bangkok
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - postgres
      - redis

  ollama:
    image: ollama/ollama:latest
    container_name: studio365-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    image: python:3.11-slim
    container_name: studio365-api
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../apps/api:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://studio:studio@postgres:5432/studio365
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama

  web:
    image: node:20-alpine
    container_name: studio365-web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../apps/web:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pg_data:
  n8n_data:
  ollama_data:
