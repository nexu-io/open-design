<!DOCTYPE html>
<html lang="es" data-od-id="screen-forgot-password">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olvidé contraseña · NicaRunner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-app);">
<div class="card" style="width:100%;max-width:420px;" data-od-id="forgot-password-card">
  <div style="text-align:center;margin-bottom:var(--s-xl);">
    <svg width="40" height="40" viewBox="0 0 48 48" fill="none" style="color:var(--accent);"><rect x="4" y="4" width="40" height="40" rx="10" stroke="currentColor" stroke-width="2"/><path d="M14 26l6-6 4 4 8-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h2 style="text-align:center;margin-bottom:var(--s-sm);">¿Olvidaste tu contraseña?</h2>
  <p style="text-align:center;color:var(--tx-md);margin-bottom:var(--s-xl);font-size:0.875rem;">Ingresá tu email y te enviaremos un enlace para restablecerla.</p>
  <div class="form-field">
    <label for="email">Email</label>
    <input id="email" class="input" type="email" placeholder="correo@ejemplo.com" value="admin@nicarunner.com">
  </div>
  <button class="btn btn-primary" style="width:100%;" data-od-id="forgot-submit">Enviar enlace</button>
  <div style="text-align:center;margin-top:var(--s-lg);">
    <a href="login.html" class="form-link">Volver al inicio de sesión</a>
  </div>
</div>
</body>
</html>
