<!DOCTYPE html>
<html lang="es" data-od-id="screen-runner-share">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha del corredor · NicaRunner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.runner-hero{background:var(--bg-sb);padding:48px var(--s-xl);text-align:center}.runner-hero .dorsal{font-family:var(--font-mono);font-size:4rem;font-weight:700;color:var(--accent);line-height:1}.runner-hero h1{font-size:1.5rem;font-weight:700;color:var(--sb-fg);margin-top:var(--s-lg)}.runner-hero .meta{color:var(--sb-muted);font-size:0.875rem;margin-top:var(--s-xs)}.runner-card{max-width:600px;margin:var(--s-xl) auto;padding:0 var(--s-xl)}.stat-row{display:flex;justify-content:space-between;padding:var(--s-md) 0;border-bottom:1px solid var(--bd-inner)}.stat-row:last-child{border-bottom:none}.stat-label{font-size:0.875rem;color:var(--tx-md)}.stat-value{font-family:var(--font-mono);font-size:0.875rem;font-weight:500;color:var(--tx-hi)}</style>
</head>
<body data-od-id="runner-share-page">
<div class="runner-hero" data-od-id="runner-hero">
  <div class="dorsal" data-od-id="runner-dorsal">042</div>
  <h1>Carlos Mendoza</h1>
  <p class="meta">Ultra Trail Volcán Mombacho 2025 · 50K</p>
</div>

<div class="runner-card" data-od-id="runner-detail-card">
  <div class="card" data-od-id="runner-stats">
    <div class="card-header"><span class="card-title">Detalle del resultado</span></div>
    <div class="stat-row">
      <span class="stat-label">Posición general</span>
      <span class="stat-value">1°</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Posición en categoría</span>
      <span class="stat-value">1° · Élite Masculino</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Tiempo oficial</span>
      <span class="stat-value">3:24:15</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Tiempo chip</span>
      <span class="stat-value">3:24:12</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Ritmo promedio</span>
      <span class="stat-value">4:05 /km</span>
    </div>
  </div>

  <div style="text-align:center;margin-top:var(--s-xl);">
    <a href="public-results.html" class="btn btn-secondary">&larr; Volver a resultados</a>
  </div>

  <p style="text-align:center;color:var(--tx-md);font-size:0.75rem;margin-top:var(--s-xl);">
    Resultados oficiales de NicaRunner · Cronometraje certificado
  </p>
</div>
</body>
</html>
