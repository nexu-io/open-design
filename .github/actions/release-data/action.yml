name: Produce independent data resources
description: Materialize a JSON resource selection once while retaining independent product artifacts
inputs:
  source-sha:
    required: true
    description: Immutable checkout identity
  run:
    required: true
    description: Python-selected workload execution flags, used only for artifact transport
runs:
  using: composite
  steps:
    - name: Materialize selected data resources
      shell: bash
      run: >-
        "$RUNNER_TEMP/release-tools/tools-release" resource materialize
        --root "$GITHUB_WORKSPACE"
        --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/data.json"
        --output "$RUNNER_TEMP/exact-data"
        --receipt "$RUNNER_TEMP/exact-data-result.json"
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: exact-data-product-all-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/products
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_skills_darwin_arm64 }}
      with:
        name: exact-data-cache-skills-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/skills/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_design_templates_darwin_arm64 }}
      with:
        name: exact-data-cache-design-templates-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/design-templates/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_design_systems_darwin_arm64 }}
      with:
        name: exact-data-cache-design-systems-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/design-systems/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_craft_darwin_arm64 }}
      with:
        name: exact-data-cache-craft-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/craft/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_plugins_darwin_arm64 }}
      with:
        name: exact-data-cache-plugins-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/plugins/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_frames_darwin_arm64 }}
      with:
        name: exact-data-cache-frames-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/frames/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_community_pets_darwin_arm64 }}
      with:
        name: exact-data-cache-community-pets-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/community-pets/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_prompt_templates_darwin_arm64 }}
      with:
        name: exact-data-cache-prompt-templates-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/prompt-templates/artifact
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ fromJSON(inputs.run).closure_data_plugin_previews_darwin_arm64 }}
      with:
        name: exact-data-cache-plugin-previews-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/exact-data/contributions/plugin-previews/artifact
        if-no-files-found: error
        retention-days: 1
