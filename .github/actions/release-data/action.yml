name: Build and publish independent data resources
description: Execute the miss batch and publish content-addressed plan products directly
inputs:
  plan-config:
    required: true
    description: This release lane's independent Python plan declaration
  storage-endpoint:
    required: true
    description: Existing plan bucket S3 endpoint
  storage-bucket:
    required: true
    description: Existing plan bucket
  public-origin:
    required: true
    description: Public plan object origin
  access-key-id:
    required: true
    description: Plan storage credential, injected only into product publication
  secret-access-key:
    required: true
    description: Plan storage credential, injected only into product publication
outputs:
  products:
    description: Current-run product manifests; not trusted reusable results
    value: ${{ steps.products.outputs.products }}
runs:
  using: composite
  steps:
    - name: "[build] Closure data resources · misses"
      shell: bash
      run: >-
        "$RUNNER_TEMP/release-tools/tools-release" resource materialize
        --root "$GITHUB_WORKSPACE"
        --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/data.execution.json"
        --output "$RUNNER_TEMP/exact-data"
        --receipt "$RUNNER_TEMP/exact-data-result.json"
    - name: "[publish] Closure data products · plan cache"
      id: products
      shell: bash
      env:
        PLAN_CONFIG: ${{ inputs.plan-config }}
        CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ inputs.storage-endpoint }}
        CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ inputs.storage-bucket }}
        OD_WORKLOAD_RESULTS_BASE_URL: ${{ inputs.public-origin }}
        CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ inputs.access-key-id }}
        CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ inputs.secret-access-key }}
      run: >-
        python3 .github/scripts/convergence.py --config "$PLAN_CONFIG" contribute-batch
        --pending "$RUNNER_TEMP/exact-plan/pending.json" --batch data --directory-field id
        --products-root "$RUNNER_TEMP/exact-data/contributions"
        --output "$RUNNER_TEMP/convergence-products"
