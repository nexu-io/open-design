name: Setup release platform toolchain
description: Install the pinned Node.js and pnpm toolchain

inputs:
  dependency-cache:
    description: Enable setup-node's pnpm dependency cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 10.33.2

    - name: Setup Node.js
      if: ${{ inputs.dependency-cache != 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: 24.18.0

    - name: Setup Node.js with pnpm cache
      if: ${{ inputs.dependency-cache == 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: 24.18.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
