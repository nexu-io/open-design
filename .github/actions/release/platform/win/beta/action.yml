name: Distribute beta Windows x64
description: Mechanically extracted beta Closure platform orchestration

inputs:
  metadata_beta_version:
    description: Forwarded beta workflow contract value
    required: true
  metadata_closure_version:
    description: Forwarded beta workflow contract value
    required: true
  metadata_shell_version:
    description: Forwarded beta workflow contract value
    required: true
  workflow_amr_profile:
    description: Forwarded beta workflow contract value
    required: true
  workflow_publish:
    description: Forwarded beta workflow contract value
    required: true
  workflow_release_public_origin:
    description: Forwarded beta workflow contract value
    required: true
  workflow_win_x64_sign_mode:
    description: Forwarded beta workflow contract value
    required: true
  workflow_win_x64_smoke_mode:
    description: Forwarded beta workflow contract value
    required: true
  workflow_win_x64_target:
    description: Forwarded beta workflow contract value
    required: true
  workflow_win_x64_update_metadata_url:
    description: Forwarded beta workflow contract value
    required: true
  workflow_win_x64_update_target_version:
    description: Forwarded beta workflow contract value
    required: true

outputs:
  smoke_result:
    description: Forwarded beta platform result
    value: ${{ steps.win_x64_smoke.outcome }}
  win_x64_url:
    description: Forwarded beta platform result
    value: ${{ steps.win_x64_platform_outputs.outputs.installer_url }}

runs:
  using: composite
  steps:
    - name: Setup release toolchain
      uses: ./.github/actions/release/platform/setup
      with:
        dependency-cache: "true"
    - name: Restore Windows tools-pack cache
      id: cache
      uses: ./.github/actions/release/platform/cache
      with:
        origin-key: ${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/daemon/**', 'apps/web/**', 'shells/electron/**', 'packages/agui-adapter/**', 'packages/contracts/**', 'packages/plugin-runtime/**', 'packages/sidecar/**', 'packages/shell/**', 'packages/platform/**', 'tools/pack/bin/**', 'tools/pack/package.json', 'tools/pack/resources/**', 'tools/pack/src/**', 'tools/pack/tsconfig.json', 'assets/community-pets/**', 'assets/frames/**', 'craft/**', 'design-systems/**', 'design-templates/**', 'plugins/_official/**', 'plugins/registry/**', 'prompt-templates/**', 'skills/**', '.github/actions/release/platform/**', '.github/workflows/release-beta.yml', '.github/workflows/distribution-beta.yml', '.github/scripts/release/cache/win.ps1') }}
        prefix: tools-pack-win-v1-beta-${{ runner.os }}-
    - name: Install dependencies
      shell: pwsh
      run: pnpm install --frozen-lockfile
    - name: Resolve win_x64 Shell smoke acceptance identity
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $digest = (pnpm.cmd exec tsx .github/scripts/release/shell-smoke-acceptance.ts win_x64).Trim()
        if ($LASTEXITCODE -ne 0 -or $digest -notmatch '^sha256:[0-9a-f]{64}$') {
          throw "invalid win_x64 Shell smoke acceptance digest: $digest"
        }
        "RELEASE_SHELL_SMOKE_ACCEPTANCE_DIGEST=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Download shared Standalone contract
      uses: actions/download-artifact@v8
      with:
        name: open-design-beta-closure-shared
        path: ${{ runner.temp }}\release-closure\shared
    - name: Resolve immutable win_x64 Electron Shell
      id: win_x64_shell_resolution
      shell: pwsh
      env:
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.workflow_amr_profile }}
        RELEASE_CHANNEL: beta
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_SHELL_SMOKE_MATRIX: win-shell-v2
        RELEASE_STANDALONE_PROTOCOL_VERSION: "1"
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        $identityArgs = @("exec", "tools-pack", "win", "identity", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--portable", "--release-version", "${{ inputs.metadata_beta_version }}", "--shell-version", "${{ inputs.metadata_shell_version }}", "--to", "${{ inputs.workflow_win_x64_target }}", "--sign-mode", "${{ inputs.workflow_win_x64_sign_mode }}", "--json")
        $identityOutput = pnpm.cmd @identityArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win identity failed with exit code $LASTEXITCODE" }
        $identityOutput | Set-Content -Path $env:RELEASE_SHELL_PLAN_JSON_PATH -Encoding utf8
        pnpm.cmd exec tools-release resolve-shell-build
        if ($LASTEXITCODE -ne 0) { throw "immutable Windows Shell resolution failed with exit code $LASTEXITCODE" }
    - name: Setup NSIS
      if: ${{ steps.win_x64_shell_resolution.outputs.state == 'miss' || (inputs.workflow_win_x64_smoke_mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof != 'hit' && inputs.workflow_win_x64_update_metadata_url == '' && inputs.workflow_win_x64_update_target_version == '') }}
      uses: ./.github/actions/release/platform/win/nsis
      with:
        attempts: "3"
        delay-seconds: "5"
    - name: Build beta win_x64
      id: win_tools_pack_build
      if: ${{ steps.win_x64_shell_resolution.outputs.state == 'miss' }}
      continue-on-error: true
      shell: pwsh
      env:
        OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.workflow_win_x64_update_metadata_url }}
        OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.workflow_win_x64_update_target_version }}
        # Bake the AMR profile (tools-pack reads OPEN_DESIGN_AMR_PROFILE) so a
        # feature-test dispatch produces a packaged app that targets that
        # profile's AMR backend and enables the workspace-team transport. Empty
        # = default (prod) — the normal beta pipeline is unaffected. Mirrors the
        # mac_arm64 build step above; this was missing here, so every win_x64
        # dogfood build silently fell back to prod and could not sign in to a
        # feature-test AMR environment.
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.workflow_amr_profile }}
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        pnpm.cmd exec tools-pack win cleanup --dir "${{ runner.temp }}\tools-pack" --namespace release-beta-win --json
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--portable", "--release-version", "${{ inputs.metadata_beta_version }}", "--shell-version", "${{ inputs.metadata_shell_version }}", "--to", "${{ inputs.workflow_win_x64_target }}", "--sign-mode", "${{ inputs.workflow_win_x64_sign_mode }}", "--require-vela-cli", "--json")
        $buildOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win build failed with exit code $LASTEXITCODE" }
        $buildOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\build.json" -Encoding utf8
        $build = $buildOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace release-beta-win --payload-path $build.payloadPath --expected-version "${{ inputs.metadata_shell_version }}" --json
    - name: Retry beta win_x64 without restored cache
      id: win_tools_pack_build_retry
      if: ${{ steps.win_x64_shell_resolution.outputs.state == 'miss' && steps.win_tools_pack_build.outcome == 'failure' }}
      shell: pwsh
      env:
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.workflow_amr_profile }}
      run: |
        $ErrorActionPreference = "Stop"
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ runner.temp }}\tools-pack-cache"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        pnpm.cmd exec tools-pack win cleanup --dir "${{ runner.temp }}\tools-pack" --namespace release-beta-win --json
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--portable", "--release-version", "${{ inputs.metadata_beta_version }}", "--shell-version", "${{ inputs.metadata_shell_version }}", "--to", "${{ inputs.workflow_win_x64_target }}", "--sign-mode", "${{ inputs.workflow_win_x64_sign_mode }}", "--require-vela-cli", "--json")
        $buildOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win fallback build failed with exit code $LASTEXITCODE" }
        $buildOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\build.json" -Encoding utf8
        $build = $buildOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace release-beta-win --payload-path $build.payloadPath --expected-version "${{ inputs.metadata_shell_version }}" --json
    - name: Register verified immutable win_x64 Electron Shell
      shell: pwsh
      if: ${{ steps.win_x64_shell_resolution.outputs.state == 'miss' }}
      env:
        RELEASE_CHANNEL: beta
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: pnpm exec tools-release register-shell-build
    - name: Build beta win_x64 Standalone native contribution
      shell: pwsh
      env:
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      run: |
        $ErrorActionPreference = "Stop"
        $version = "${{ inputs.metadata_closure_version }}"
        $closureOutput = pnpm.cmd exec tools-pack closure build-distribution-target `
          --blob-origin $env:RELEASE_PUBLIC_ORIGIN `
          --channel beta `
          --dir "${{ runner.temp }}\tools-pack" `
          --platform win32-x64 `
          --version $version `
          --json
        if ($LASTEXITCODE -ne 0) { throw "Standalone Closure build failed with exit code $LASTEXITCODE" }
        $reportPath = "${{ runner.temp }}\release-build\win_x64\closure-target.json"
        $closureOutput | Set-Content -Path $reportPath -Encoding utf8
        $report = $closureOutput | ConvertFrom-Json
        Copy-Item -LiteralPath $report.contributionPath -Destination "${{ runner.temp }}\release-build\win_x64\target-contribution.json"
        $targetBlobRoot = "${{ runner.temp }}\release-build\win_x64\closure-blobs"
        New-Item -ItemType Directory -Force -Path $targetBlobRoot | Out-Null
        $digest = [string]$report.contribution.native.artifact.digest
        Copy-Item -LiteralPath (Join-Path $report.blobRoot $digest.Substring(7)) -Destination (Join-Path $targetBlobRoot $digest.Substring(7))
    - name: Prepare win_x64 Standalone smoke graph
      shell: pwsh
      run: |
        pnpm.cmd exec tools-release merge-closure-distribution `
          "${{ runner.temp }}\release-closure\shared\shared-contribution.json" `
          "${{ runner.temp }}\release-build\win_x64\target-contribution.json" `
          --output "${{ runner.temp }}\release-build\win_x64\closure-distribution.json"
    - name: Publish verified win_x64 Standalone native blob
      shell: pwsh
      if: ${{ inputs.workflow_publish == 'true' }}
      env:
        RELEASE_CHANNEL: beta
        RELEASE_CLOSURE_BLOB_ROOT: ${{ runner.temp }}\tools-pack\out\closure-distribution\beta\win32-x64\versions\${{ inputs.metadata_closure_version }}\blobs
        RELEASE_CLOSURE_CONTRIBUTION_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\target-contribution.json
        RELEASE_CLOSURE_CONTRIBUTION_KIND: target
        RELEASE_CLOSURE_PUBLICATION_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\closure-publication.json
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
        RELEASE_VERSION: ${{ inputs.metadata_closure_version }}
      run: pnpm.cmd exec tools-release publish-closure-contribution
    - name: Upload win_x64 dogfood build to release storage
      shell: pwsh
      # publish=false only. Artifact paths come from the build's own --json
      # output rather than a hardcoded layout, so whichever of installerPath /
      # portableZipPath the selected win_x64_target actually produced is what
      # gets uploaded. Writes under dogfood/<version>/<build>/ and nowhere
      # else; see the guard in tools/release/src/storage/dogfood.ts.
      if: ${{ !cancelled() && inputs.workflow_publish != 'true' }}
      continue-on-error: true
      env:
        DOGFOOD_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        DOGFOOD_BUILD_JSON_KEYS: installerPath,portableZipPath
        DOGFOOD_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        DOGFOOD_LABEL: Windows x64 beta ${{ inputs.metadata_beta_version }}
        DOGFOOD_VERSION: ${{ inputs.metadata_beta_version }}
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: pnpm exec tools-release publish-dogfood
    - name: Delete failed Windows tools-pack cache
      if: ${{ steps.win_tools_pack_build.outcome == 'failure' && steps.cache.outputs.cache-matched-key != '' }}
      uses: ./.github/actions/release/platform/cache/delete-failed
      with:
        matched-key: ${{ steps.cache.outputs.cache-matched-key }}
        platform: win
    - name: Build beta win_x64 update fixture
      if: ${{ inputs.workflow_win_x64_smoke_mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof != 'hit' && inputs.workflow_win_x64_update_metadata_url == '' && inputs.workflow_win_x64_update_target_version == '' }}
      shell: pwsh
      env:
        OD_TOOLS_PACK_WIN_NSIS_TEST_HOOKS: faults
      run: |
        $ErrorActionPreference = "Stop"
        $match = [regex]::Match("${{ inputs.metadata_beta_version }}", "^(?<base>\d+\.\d+\.\d+)-beta\.(?<number>\d+)$")
        if (-not $match.Success) { throw "full Windows smoke requires a counted beta version; got ${{ inputs.metadata_beta_version }}" }
        $updateVersion = "{0}-beta.{1}" -f $match.Groups["base"].Value, ([int]$match.Groups["number"].Value + 1)
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\release-work\win_x64\tools-pack-update-fixture", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--portable", "--release-version", "${{ inputs.metadata_beta_version }}", "--shell-version", $updateVersion, "--launcher-version", $updateVersion, "--to", "nsis", "--sign-mode", "${{ inputs.workflow_win_x64_sign_mode }}", "--require-vela-cli", "--json")
        $updateOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture failed with exit code $LASTEXITCODE" }
        $updateOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\windows-tools-pack-update-build.json" -Encoding utf8
        $updateBuild = $updateOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace release-beta-win --payload-path $updateBuild.payloadPath --expected-version $updateVersion --json
    - name: Materialize legacy win_x64 migration fixture
      id: win_x64_legacy_fixture
      if: ${{ inputs.workflow_win_x64_smoke_mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof != 'hit' }}
      shell: pwsh
      env:
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      run: |
        $ErrorActionPreference = "Stop"
        $fixtureDir = "${{ runner.temp }}\release-work\win_x64\legacy-migration"
        $installerPath = Join-Path $fixtureDir "open-design-$env:LEGACY_WIN_X64_VERSION-win-x64-setup.exe"
        $url = "$env:RELEASE_PUBLIC_ORIGIN/beta/versions/$env:LEGACY_WIN_X64_VERSION.unsigned/open-design-$env:LEGACY_WIN_X64_VERSION.unsigned-win-x64-setup.exe"
        New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
        Invoke-WebRequest -Uri $url -OutFile $installerPath -MaximumRetryCount 3 -RetryIntervalSec 2
        $actualDigest = "sha256:$((Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash.ToLowerInvariant())"
        if ($actualDigest -ne $env:LEGACY_WIN_X64_DIGEST) {
          throw "legacy Windows installer digest mismatch: expected $env:LEGACY_WIN_X64_DIGEST, got $actualDigest"
        }
        "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "version=$env:LEGACY_WIN_X64_VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
    - name: Smoke beta win_x64 packaged runtime
      id: win_x64_smoke
      if: ${{ inputs.workflow_win_x64_smoke_mode != 'skip' }}
      continue-on-error: true
      working-directory: e2e
      env:
        OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        OD_PACKAGED_E2E_CLOSURE_DISTRIBUTION_MANIFEST_PATH: ${{ runner.temp }}\release-build\win_x64\closure-distribution.json
        OD_PACKAGED_E2E_NAMESPACE: release-beta-win
        OD_PACKAGED_E2E_RELEASE_CHANNEL: beta
        OD_PACKAGED_E2E_RELEASE_VERSION: ${{ inputs.metadata_beta_version }}
        OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}\tools-pack
        OD_PACKAGED_E2E_WIN: "1"
        OD_PACKAGED_E2E_WIN_LEGACY_INSTALLER_PATH: ${{ steps.win_x64_legacy_fixture.outputs.installer_path }}
        OD_PACKAGED_E2E_WIN_LEGACY_VERSION: ${{ steps.win_x64_legacy_fixture.outputs.version }}
        OD_PACKAGED_E2E_WIN_MIN_SHELL_VERSION: ${{ env.CLOSURE_MIN_SHELL_VERSION }}
        OD_PACKAGED_E2E_WIN_SMOKE_LANES: ${{ inputs.workflow_win_x64_smoke_mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof == 'hit' && 'standalone' || '' }}
        OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: ${{ inputs.workflow_win_x64_smoke_mode }}
        OD_PACKAGED_E2E_WIN_UPDATE_FIXTURE: ${{ inputs.workflow_win_x64_smoke_mode == 'full' && inputs.workflow_win_x64_update_metadata_url == '' && inputs.workflow_win_x64_update_target_version == '' && 'tools-serve' || '' }}
        OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.workflow_win_x64_update_metadata_url }}
        OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.workflow_win_x64_update_target_version }}
        OD_PACKAGED_E2E_SHELL_SMOKE_PROOF: ${{ steps.win_x64_shell_resolution.outputs.smoke_proof }}
        # Preserve the immutable outer's origin version separately from the
        # current release projection. Reinstall acceptance needs both facts.
        OD_PACKAGED_E2E_SHELL_VERSION: ${{ steps.win_x64_shell_resolution.outputs.shell_version != '' && steps.win_x64_shell_resolution.outputs.shell_version || inputs.metadata_shell_version }}
      shell: pwsh
      run: |
        # Native runner paths contain backslashes. Let PowerShell serialize
        # the array so the spec always receives valid JSON instead of a
        # hand-escaped string whose substituted RUNNER_TEMP can corrupt it.
        $env:OD_PACKAGED_E2E_CLOSURE_BLOB_ROOTS_JSON = @(
          "${{ runner.temp }}\release-closure\shared\blobs"
          "${{ runner.temp }}\release-build\win_x64\closure-blobs"
        ) | ConvertTo-Json -Compress
        pnpm exec tsx scripts/release-smoke.ts win specs/win.spec.ts
    - name: Register win_x64 Electron Shell full-smoke proof
      shell: pwsh
      if: ${{ inputs.workflow_win_x64_smoke_mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof != 'hit' && inputs.workflow_win_x64_update_metadata_url == '' && inputs.workflow_win_x64_update_target_version == '' }}
      env:
        RELEASE_CHANNEL: beta
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_SHELL_SMOKE_MATRIX: win-shell-v2
        RELEASE_SHELL_SMOKE_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.json
        RELEASE_STANDALONE_PROTOCOL_VERSION: "1"
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: pnpm exec tools-release register-shell-smoke
    - name: Write win_x64 release report
      shell: pwsh
      if: ${{ always() }}
      env:
        BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_BUILD_TARGET: ${{ inputs.workflow_win_x64_target }}
        RELEASE_CHANNEL: beta
        RELEASE_NAMESPACE: release-beta-win
        RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\report.json
        RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.md
        RELEASE_SMOKE_MODE: ${{ inputs.workflow_win_x64_smoke_mode }}
        RELEASE_TARGET: win_x64
        RELEASE_VERSION: ${{ inputs.metadata_beta_version }}
        REPORT_TITLE: win_x64 beta build
      run: pnpm exec tools-release write-report
    - name: Publish win_x64 report summary
      if: ${{ always() }}
      shell: pwsh
      run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
    - name: Persist Windows tools-pack cache
      if: ${{ success() }}
      uses: ./.github/actions/release/platform/cache/save
      with:
        build-failed: ${{ steps.win_tools_pack_build.outcome == 'failure' }}
        cache-hit: ${{ steps.cache.outputs.cache-hit }}
        key: ${{ steps.cache.outputs.key }}
        platform: win
        prefix: ${{ steps.cache.outputs.prefix }}
    - name: Prepare win_x64 assets
      if: ${{ inputs.workflow_publish == 'true' }}
      shell: pwsh
      run: |
        tools\pack\scripts\prepare-platform-assets.ps1 `
          -ReleaseTarget win_x64 `
          -ReleaseAssetsDir "${{ runner.temp }}\release-assets\win_x64" `
          -BuildJsonPath "${{ runner.temp }}\release-build\win_x64\build.json" `
          -ReleaseNamespace release-beta-win `
          -ReleaseVersion "${{ inputs.metadata_beta_version }}" `
          -ReleaseAssetSuffix ".unsigned" `
          -ReleaseChannel beta `
          -ReleasePublicOrigin "${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}" `
          -IncludeZip $${{ inputs.workflow_win_x64_target == 'all' || inputs.workflow_win_x64_target == 'zip' }}
    - name: Publish win_x64 platform
      shell: pwsh
      if: ${{ inputs.workflow_publish == 'true' }}
      env:
        RELEASE_ASSET_SUFFIX: .unsigned
        RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
        RELEASE_CHANNEL: beta
        RELEASE_CLOSURE_ENABLED: "false"
        RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
        RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.workflow_release_public_origin != '' && inputs.workflow_release_public_origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_ENABLED: "true"
        WIN_INCLUDE_ZIP: ${{ inputs.workflow_win_x64_target == 'all' || inputs.workflow_win_x64_target == 'zip' }}
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
        RELEASE_TARGET: win_x64
        RELEASE_VERSION: ${{ inputs.metadata_beta_version }}
      run: pnpm exec tools-release publish-platform
    - name: Read win_x64 platform outputs
      id: win_x64_platform_outputs
      if: ${{ inputs.workflow_publish == 'true' }}
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require("fs");
          const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/win_x64.json`, "utf8"));
          for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
    - name: Upload win_x64 publish manifest
      if: ${{ inputs.workflow_publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: open-design-beta-win-x64-publish-manifest
        path: ${{ runner.temp }}\release-platform-manifests\win_x64.json
        if-no-files-found: error
    - name: Upload win_x64 Standalone contribution
      if: ${{ inputs.workflow_publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: open-design-beta-closure-win32-x64
        path: ${{ runner.temp }}\release-build\win_x64\target-contribution.json
        if-no-files-found: error
