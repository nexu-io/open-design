name: Distribute exact Windows x64
description: Shared exact-release Closure platform orchestration

inputs:
  candidate-id:
    description: Immutable release candidate build-spec digest
    required: true
  channel:
    description: Validated exact release name
    required: true
  release-version:
    description: Exact release version
    required: true
  closure-version:
    description: Standalone Closure version
    required: true
  shell-version:
    description: Reusable Electron Shell version
    required: true
  amr-profile:
    description: Optional AMR profile baked into the app
    required: true
  publish:
    description: Publish exact assets and metadata
    required: true
  phase:
    description: all, prepare, or finish; split calls retain one runner workspace
    required: false
    default: all
  release-public-origin:
    description: Optional public release origin override
    required: true
  sign-mode:
    description: Windows signing mode
    required: true
  smoke-mode:
    description: Windows smoke coverage
    required: true
  build-target:
    description: tools-pack Windows build target
    required: true
  update-metadata-url:
    description: Optional external updater metadata URL
    required: true
  update-target-version:
    description: Optional external updater target version
    required: true

outputs:
  candidate_manifest_url:
    description: Unlisted candidate target manifest URL
    value: ${{ steps.candidate.outputs.candidate_manifest_url }}
  candidate_primary_url:
    description: Unlisted candidate primary download URL
    value: ${{ steps.candidate.outputs.candidate_primary_url }}
  smoke_result:
    description: Packaged smoke outcome
    value: ${{ steps.win_x64_smoke.outcome }}
  win_x64_url:
    description: Published Windows installer URL
    value: ${{ steps.win_x64_platform_outputs.outputs.installer_url }}

runs:
  using: composite
  steps:
    - name: Validate exact Windows orchestration phase
      shell: pwsh
      run: |
        if (@("all", "prepare", "finish") -notcontains "${{ inputs.phase }}") {
          throw "unsupported exact Windows orchestration phase: ${{ inputs.phase }}"
        }
    - name: Setup release toolchain
      if: ${{ inputs.phase != 'finish' }}
      uses: ./.github/actions/release/platform/setup
      with:
        dependency-cache: "true"
    - name: Restore Windows tools-pack cache
      if: ${{ inputs.phase != 'finish' }}
      id: cache
      uses: ./.github/actions/release/platform/cache
      with:
        origin-key: ${{ github.run_id }}-${{ github.run_attempt }}
        prefix: tools-pack-win-v3-${{ inputs.channel }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Install dependencies
      if: ${{ inputs.phase != 'finish' }}
      shell: pwsh
      run: pnpm install --frozen-lockfile
    - name: Resolve win_x64 Shell smoke acceptance identity
      if: ${{ inputs.phase != 'finish' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $digest = (pnpm.cmd exec tools-release identity digest shell.spec.win_x64 --parameter matrix=win-shell-v2 --parameter standaloneProtocolVersion=1).Trim()
        if ($LASTEXITCODE -ne 0 -or $digest -notmatch '^sha256:[0-9a-f]{64}$') {
          throw "invalid win_x64 Shell smoke acceptance digest: $digest"
        }
        "RELEASE_SHELL_SPEC_DIGEST=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Download shared Standalone contract
      if: ${{ inputs.phase != 'finish' }}
      uses: actions/download-artifact@v8
      with:
        name: open-design-${{ inputs.channel }}-closure-shared
        path: ${{ runner.temp }}\release-closure\shared
    - name: Resolve immutable win_x64 Electron Shell
      if: ${{ inputs.phase != 'finish' }}
      id: win_x64_shell_resolution
      shell: pwsh
      env:
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr-profile }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_SHELL_SMOKE_MATRIX: win-shell-v2
        RELEASE_STANDALONE_PROTOCOL_VERSION: "1"
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        $identityArgs = @("exec", "tools-pack", "win", "identity", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-${{ inputs.channel }}-win", "--portable", "--release-version", "${{ inputs.release-version }}", "--shell-version", "${{ inputs.shell-version }}", "--to", "${{ inputs.build-target }}", "--sign-mode", "${{ inputs.sign-mode }}", "--json")
        $identityOutput = pnpm.cmd @identityArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win identity failed with exit code $LASTEXITCODE" }
        $identityOutput | Set-Content -Path $env:RELEASE_SHELL_PLAN_JSON_PATH -Encoding utf8
        pnpm.cmd exec tools-release resolve-shell-build
        if ($LASTEXITCODE -ne 0) { throw "immutable Windows Shell resolution failed with exit code $LASTEXITCODE" }
    - name: Setup NSIS
      if: ${{ inputs.phase != 'finish' && (steps.win_x64_shell_resolution.outputs.state == 'miss' || (inputs.smoke-mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof != 'hit' && inputs.update-metadata-url == '' && inputs.update-target-version == '')) }}
      uses: ./.github/actions/release/platform/win/nsis
    - name: Build exact win_x64
      id: win_tools_pack_build
      if: ${{ inputs.phase != 'finish' && steps.win_x64_shell_resolution.outputs.state == 'miss' }}
      continue-on-error: true
      shell: pwsh
      env:
        OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.update-metadata-url }}
        OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.update-target-version }}
        # Bake the AMR profile (tools-pack reads OPEN_DESIGN_AMR_PROFILE) so a
        # feature-test dispatch produces a packaged app that targets that
        # profile's AMR backend and enables the workspace-team transport. Empty
        # Empty keeps the normal exact pipeline on prod.
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr-profile }}
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        pnpm.cmd exec tools-pack win cleanup --dir "${{ runner.temp }}\tools-pack" --namespace "release-${{ inputs.channel }}-win" --json
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-${{ inputs.channel }}-win", "--portable", "--release-version", "${{ inputs.release-version }}", "--shell-version", "${{ inputs.shell-version }}", "--to", "${{ inputs.build-target }}", "--sign-mode", "${{ inputs.sign-mode }}", "--json")
        $buildOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win build failed with exit code $LASTEXITCODE" }
        $buildOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\build.json" -Encoding utf8
        $build = $buildOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace "release-${{ inputs.channel }}-win" --payload-path $build.payloadPath --expected-version "${{ inputs.shell-version }}" --json
    - name: Retry exact win_x64 without restored cache
      id: win_tools_pack_build_retry
      if: ${{ inputs.phase != 'finish' && steps.win_x64_shell_resolution.outputs.state == 'miss' && steps.win_tools_pack_build.outcome == 'failure' }}
      shell: pwsh
      env:
        OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr-profile }}
      run: |
        $ErrorActionPreference = "Stop"
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ runner.temp }}\tools-pack-cache"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
        pnpm.cmd exec tools-pack win cleanup --dir "${{ runner.temp }}\tools-pack" --namespace "release-${{ inputs.channel }}-win" --json
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-${{ inputs.channel }}-win", "--portable", "--release-version", "${{ inputs.release-version }}", "--shell-version", "${{ inputs.shell-version }}", "--to", "${{ inputs.build-target }}", "--sign-mode", "${{ inputs.sign-mode }}", "--json")
        $buildOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win fallback build failed with exit code $LASTEXITCODE" }
        $buildOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\build.json" -Encoding utf8
        $build = $buildOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace "release-${{ inputs.channel }}-win" --payload-path $build.payloadPath --expected-version "${{ inputs.shell-version }}" --json
    - name: Register verified immutable win_x64 Electron Shell
      shell: pwsh
      if: ${{ inputs.phase != 'finish' && steps.win_x64_shell_resolution.outputs.state == 'miss' }}
      env:
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: pnpm exec tools-release register-shell-build
    - name: Resolve win_x64 Standalone target contribution
      id: closure_target
      if: ${{ inputs.phase != 'finish' }}
      uses: ./.github/actions/release/closure/target/win
      with:
        build-dir: ${{ runner.temp }}\release-build\win_x64
        channel: ${{ inputs.channel }}
        public-origin: ${{ inputs.release-public-origin }}
        publish-enabled: "true"
        release-version: ${{ inputs.closure-version }}
    - name: Report win_x64 release reuse plan
      if: ${{ inputs.phase != 'finish' }}
      shell: pwsh
      env:
        RELEASE_CLOSURE_BUILD_STATE: ${{ steps.closure_target.outputs.resolution }}
        RELEASE_OUTER_CACHE_EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        RELEASE_OUTER_CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        RELEASE_REUSE_PLAN_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\reuse-plan.json
        RELEASE_SHELL_BUILD_STATE: ${{ steps.win_x64_shell_resolution.outputs.state }}
        RELEASE_SMOKE_PROOF_STATE: ${{ steps.win_x64_shell_resolution.outputs.smoke_proof }}
        RELEASE_SMOKE_SELECTED_LANES: ${{ inputs.smoke-mode == 'skip' && 'none' || (inputs.smoke-mode == 'full' && steps.win_x64_shell_resolution.outputs.smoke_proof == 'hit' && 'standalone' || 'profile-default') }}
        RELEASE_TARGET: win_x64
      run: pnpm.cmd exec tools-release write-reuse-plan
    - name: Prepare win_x64 Standalone smoke graph
      if: ${{ inputs.phase != 'finish' }}
      shell: pwsh
      run: |
        pnpm.cmd exec tools-release merge-closure-distribution `
          "${{ runner.temp }}\release-closure\shared\shared-contribution.json" `
          "${{ runner.temp }}\release-build\win_x64\target-contribution.json" `
          --output "${{ runner.temp }}\release-build\win_x64\closure-distribution.json"
    - name: Upload win_x64 candidate to release storage
      id: candidate
      shell: pwsh
      # 30-day unlisted convenience projection. Artifact paths come from the build's own --json
      # output rather than a hardcoded layout, so whichever of installerPath /
      # portableZipPath the selected win_x64_target actually produced is what
      # gets uploaded under the immutable candidate prefix.
      if: ${{ inputs.phase != 'finish' && !cancelled() }}
      env:
        RELEASE_CANDIDATE_BUILD_JSON_KEYS: installerPath,portableZipPath
        RELEASE_CANDIDATE_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_CANDIDATE_ID: ${{ inputs.candidate-id }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
        RELEASE_TARGET: win_x64
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: pnpm exec tools-release publish-candidate-target
    - name: Export exact Windows phase state
      if: ${{ inputs.phase != 'finish' }}
      shell: pwsh
      run: |
        @(
          "OD_RELEASE_EXACT_BUILD_OUTCOME=${{ steps.win_tools_pack_build.outcome }}"
          "OD_RELEASE_EXACT_CACHE_HIT=${{ steps.cache.outputs.cache-hit }}"
          "OD_RELEASE_EXACT_CACHE_KEY=${{ steps.cache.outputs.key }}"
          "OD_RELEASE_EXACT_CACHE_PREFIX=${{ steps.cache.outputs.prefix }}"
          "OD_RELEASE_EXACT_SHELL_STATE=${{ steps.win_x64_shell_resolution.outputs.state }}"
          "OD_RELEASE_EXACT_SHELL_VERSION=${{ steps.win_x64_shell_resolution.outputs.shell_version }}"
          "OD_RELEASE_EXACT_SMOKE_PROOF=${{ steps.win_x64_shell_resolution.outputs.smoke_proof }}"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Build win_x64 exact update fixture
      if: ${{ inputs.phase != 'prepare' && inputs.smoke-mode == 'full' && env.OD_RELEASE_EXACT_SMOKE_PROOF != 'hit' && inputs.update-metadata-url == '' && inputs.update-target-version == '' }}
      shell: pwsh
      env:
        OD_TOOLS_PACK_WIN_NSIS_TEST_HOOKS: faults
      run: |
        $ErrorActionPreference = "Stop"
        $match = [regex]::Match("${{ inputs.release-version }}", "^(?<base>\d+\.\d+\.\d+)-${{ inputs.channel }}\.(?<number>\d+)$")
        if (-not $match.Success) { throw "full Windows smoke requires a counted exact version; got ${{ inputs.release-version }}" }
        $updateVersion = "{0}-${{ inputs.channel }}.{1}" -f $match.Groups["base"].Value, ([int]$match.Groups["number"].Value + 1)
        $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\release-work\win_x64\tools-pack-update-fixture", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-${{ inputs.channel }}-win", "--portable", "--release-version", "${{ inputs.release-version }}", "--shell-version", $updateVersion, "--launcher-version", $updateVersion, "--to", "nsis", "--sign-mode", "${{ inputs.sign-mode }}", "--json")
        $updateOutput = pnpm.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture failed with exit code $LASTEXITCODE" }
        $updateOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\windows-tools-pack-update-build.json" -Encoding utf8
        $updateBuild = $updateOutput | ConvertFrom-Json
        pnpm.cmd exec tools-pack win validate-payload --namespace "release-${{ inputs.channel }}-win" --payload-path $updateBuild.payloadPath --expected-version $updateVersion --json
    - name: Materialize legacy win_x64 migration fixture
      id: win_x64_legacy_fixture
      if: ${{ inputs.phase != 'prepare' && inputs.channel == 'beta' && inputs.smoke-mode == 'full' && env.OD_RELEASE_EXACT_SMOKE_PROOF != 'hit' }}
      shell: pwsh
      env:
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      run: |
        $ErrorActionPreference = "Stop"
        $fixtureDir = "${{ runner.temp }}\release-work\win_x64\legacy-migration"
        $installerPath = Join-Path $fixtureDir "open-design-$env:LEGACY_WIN_X64_VERSION-win-x64-setup.exe"
        $url = "$env:RELEASE_PUBLIC_ORIGIN/beta/versions/$env:LEGACY_WIN_X64_VERSION.unsigned/open-design-$env:LEGACY_WIN_X64_VERSION.unsigned-win-x64-setup.exe"
        New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
        Invoke-WebRequest -Uri $url -OutFile $installerPath -MaximumRetryCount 3 -RetryIntervalSec 2
        $actualDigest = "sha256:$((Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash.ToLowerInvariant())"
        if ($actualDigest -ne $env:LEGACY_WIN_X64_DIGEST) {
          throw "legacy Windows installer digest mismatch: expected $env:LEGACY_WIN_X64_DIGEST, got $actualDigest"
        }
        "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "version=$env:LEGACY_WIN_X64_VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
    - name: Smoke exact win_x64 packaged runtime
      id: win_x64_smoke
      if: ${{ inputs.phase != 'prepare' && inputs.smoke-mode != 'skip' }}
      continue-on-error: true
      working-directory: e2e
      env:
        OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        OD_PACKAGED_E2E_CLOSURE_DISTRIBUTION_MANIFEST_PATH: ${{ runner.temp }}\release-build\win_x64\closure-distribution.json
        OD_PACKAGED_E2E_NAMESPACE: release-${{ inputs.channel }}-win
        OD_PACKAGED_E2E_RELEASE_CHANNEL: ${{ inputs.channel }}
        OD_PACKAGED_E2E_RELEASE_VERSION: ${{ inputs.release-version }}
        OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}\tools-pack
        OD_PACKAGED_E2E_WIN: "1"
        OD_PACKAGED_E2E_WIN_LEGACY_INSTALLER_PATH: ${{ steps.win_x64_legacy_fixture.outputs.installer_path }}
        OD_PACKAGED_E2E_WIN_LEGACY_VERSION: ${{ steps.win_x64_legacy_fixture.outputs.version }}
        OD_PACKAGED_E2E_WIN_MIN_SHELL_VERSION: ${{ env.CLOSURE_MIN_SHELL_VERSION }}
        OD_PACKAGED_E2E_WIN_SMOKE_LANES: ${{ inputs.smoke-mode == 'full' && env.OD_RELEASE_EXACT_SMOKE_PROOF == 'hit' && 'standalone' || '' }}
        OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: ${{ inputs.smoke-mode }}
        OD_PACKAGED_E2E_WIN_UPDATE_FIXTURE: ${{ inputs.smoke-mode == 'full' && inputs.update-metadata-url == '' && inputs.update-target-version == '' && 'tools-serve' || '' }}
        OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.update-metadata-url }}
        OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.update-target-version }}
        OD_PACKAGED_E2E_SHELL_SMOKE_PROOF: ${{ env.OD_RELEASE_EXACT_SMOKE_PROOF }}
        # Preserve the immutable outer's origin version separately from the
        # current release projection. Reinstall acceptance needs both facts.
        OD_PACKAGED_E2E_SHELL_VERSION: ${{ env.OD_RELEASE_EXACT_SHELL_VERSION != '' && env.OD_RELEASE_EXACT_SHELL_VERSION || inputs.shell-version }}
      shell: pwsh
      run: |
        # Native runner paths contain backslashes. Let PowerShell serialize
        # the array so the spec always receives valid JSON instead of a
        # hand-escaped string whose substituted RUNNER_TEMP can corrupt it.
        $env:OD_PACKAGED_E2E_CLOSURE_BLOB_ROOTS_JSON = @(
          "${{ runner.temp }}\release-closure\shared\blobs"
          "${{ runner.temp }}\release-build\win_x64\closure-blobs"
        ) | ConvertTo-Json -Compress
        pnpm exec tsx scripts/release-smoke.ts win specs/win.spec.ts
    - name: Register win_x64 Electron Shell full-smoke proof
      shell: pwsh
      if: ${{ inputs.phase != 'prepare' && inputs.smoke-mode == 'full' && env.OD_RELEASE_EXACT_SMOKE_PROOF != 'hit' && inputs.update-metadata-url == '' && inputs.update-target-version == '' }}
      env:
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_PLAN_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\shell-plan.json
        RELEASE_SHELL_SMOKE_MATRIX: win-shell-v2
        RELEASE_SHELL_SMOKE_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.json
        RELEASE_STANDALONE_PROTOCOL_VERSION: "1"
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
      run: pnpm exec tools-release register-shell-smoke
    - name: Write win_x64 release report
      shell: pwsh
      if: ${{ always() && (inputs.phase != 'prepare' || failure()) }}
      env:
        BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_BUILD_TARGET: ${{ inputs.build-target }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_NAMESPACE: release-${{ inputs.channel }}-win
        RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\report.json
        RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.md
        RELEASE_SMOKE_MODE: ${{ inputs.smoke-mode }}
        RELEASE_TARGET: win_x64
        RELEASE_VERSION: ${{ inputs.release-version }}
        REPORT_TITLE: win_x64 ${{ inputs.channel }} build
      run: pnpm exec tools-release write-report
    - name: Publish win_x64 report summary
      if: ${{ always() && (inputs.phase != 'prepare' || failure()) }}
      shell: pwsh
      run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
    - name: Persist Windows tools-pack cache
      if: ${{ inputs.phase != 'prepare' && success() }}
      uses: ./.github/actions/release/platform/cache/save
      with:
        build-failed: ${{ env.OD_RELEASE_EXACT_BUILD_OUTCOME == 'failure' }}
        cache-hit: ${{ env.OD_RELEASE_EXACT_CACHE_HIT }}
        key: ${{ env.OD_RELEASE_EXACT_CACHE_KEY }}
        platform: win
        prefix: ${{ env.OD_RELEASE_EXACT_CACHE_PREFIX }}
    - name: Prepare win_x64 assets
      if: ${{ inputs.phase != 'prepare' && inputs.publish == 'true' }}
      shell: pwsh
      run: |
        tools\pack\scripts\prepare-platform-assets.ps1 `
          -ReleaseTarget win_x64 `
          -ReleaseAssetsDir "${{ runner.temp }}\release-assets\win_x64" `
          -BuildJsonPath "${{ runner.temp }}\release-build\win_x64\build.json" `
          -ReleaseNamespace "release-${{ inputs.channel }}-win" `
          -ReleaseVersion "${{ inputs.release-version }}" `
          -ReleaseAssetSuffix ".unsigned" `
          -ReleaseChannel "${{ inputs.channel }}" `
          -ReleasePublicOrigin "${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}" `
          -IncludeZip $${{ inputs.build-target == 'all' || inputs.build-target == 'zip' }}
    - name: Publish win_x64 platform
      shell: pwsh
      if: ${{ inputs.phase != 'prepare' && inputs.publish == 'true' }}
      env:
        RELEASE_ASSET_SUFFIX: .unsigned
        RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_CLOSURE_ENABLED: "false"
        RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
        RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
        RELEASE_PUBLIC_ORIGIN: ${{ inputs.release-public-origin != '' && inputs.release-public-origin || env.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
        RELEASE_SHELL_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
        RELEASE_SHELL_ENABLED: "true"
        WIN_INCLUDE_ZIP: ${{ inputs.build-target == 'all' || inputs.build-target == 'zip' }}
        RELEASE_STORAGE_ACCESS_KEY_ID: ${{ env.CLOUDFLARE_R2_RELEASES_AK }}
        RELEASE_STORAGE_BUCKET: ${{ env.CLOUDFLARE_R2_RELEASES_BUCKET }}
        RELEASE_STORAGE_ENDPOINT: ${{ env.CLOUDFLARE_R2_RELEASES_URL }}
        RELEASE_STORAGE_REGION: auto
        RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ env.CLOUDFLARE_R2_RELEASES_SK }}
        RELEASE_TARGET: win_x64
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: pnpm exec tools-release publish-platform
    - name: Read win_x64 platform outputs
      id: win_x64_platform_outputs
      if: ${{ inputs.phase != 'prepare' && inputs.publish == 'true' }}
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require("fs");
          const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/win_x64.json`, "utf8"));
          for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
    - name: Upload win_x64 publish manifest
      if: ${{ inputs.phase != 'prepare' && inputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: open-design-${{ inputs.channel }}-win-x64-publish-manifest
        path: ${{ runner.temp }}\release-platform-manifests\win_x64.json
        if-no-files-found: error
    - name: Upload win_x64 Standalone contribution
      if: ${{ inputs.phase != 'prepare' && inputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: open-design-${{ inputs.channel }}-closure-win32-x64
        path: ${{ runner.temp }}\release-build\win_x64\target-contribution.json
        if-no-files-found: error
