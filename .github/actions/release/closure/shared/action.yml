name: Build shared Standalone Closure
description: Build, optionally publish, and hand off the once-owned Closure components

inputs:
  channel:
    required: true
  min-shell-version:
    description: Frozen initial Shell compatibility declaration for this channel
    required: true
  publish-enabled:
    required: false
    default: "true"
  release-version:
    required: true

runs:
  using: composite
  steps:
    - name: Validate frozen Closure compatibility boundary
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ inputs.min-shell-version }}" ]; then
          echo "${{ inputs.channel }} requires a frozen minimum compatible Shell version" >&2
          exit 1
        fi

    - name: Resolve shared Closure build identity
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        digest="$(pnpm exec tools-release identity digest closure.shared.build \
          --parameter minShellVersion=${{ inputs.min-shell-version }} \
          --parameter nodeVersion=$(node -p 'process.version') \
          --parameter packageManager=$(node -p 'require("./package.json").packageManager'))"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Resolve immutable shared Closure build
      id: closure_resolution
      if: ${{ inputs.publish-enabled == 'true' }}
      shell: bash
      env:
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_CLOSURE_BLOB_ROOT: ${{ runner.temp }}/release-build/closure-shared/blobs
        RELEASE_CLOSURE_BUILD_DIGEST: ${{ steps.identity.outputs.digest }}
        RELEASE_CLOSURE_BUILD_KIND: shared
        RELEASE_CLOSURE_BUILD_TOKEN: shared
        RELEASE_CLOSURE_CONTRIBUTION_JSON_PATH: ${{ runner.temp }}/release-build/closure-shared/shared-contribution.json
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: pnpm exec tools-release resolve-closure-build

    - name: Build shared Closure components
      if: ${{ steps.closure_resolution.outputs.state != 'hit' }}
      shell: bash
      run: |
        set -euo pipefail
        build_dir="$RUNNER_TEMP/release-build/closure-shared"
        mkdir -p "$build_dir"
        pnpm exec tools-pack closure build-distribution-shared \
          --blob-origin "$RELEASE_PUBLIC_ORIGIN" \
          --channel "${{ inputs.channel }}" \
          --dir "$RUNNER_TEMP/tools-pack" \
          --min-shell-version "${{ inputs.min-shell-version }}" \
          --version "${{ inputs.release-version }}" \
          --json > "$build_dir/build.json"
        contribution_path="$(jq -er '.contributionPath' "$build_dir/build.json")"
        blob_root="$(jq -er '.blobRoot' "$build_dir/build.json")"
        cp "$contribution_path" "$build_dir/shared-contribution.json"
        cp -R "$blob_root" "$build_dir/blobs"

    - name: Register immutable shared Closure build
      if: ${{ inputs.publish-enabled == 'true' && steps.closure_resolution.outputs.state != 'hit' }}
      shell: bash
      env:
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_CLOSURE_BLOB_ROOT: ${{ runner.temp }}/release-build/closure-shared/blobs
        RELEASE_CLOSURE_BUILD_DIGEST: ${{ steps.identity.outputs.digest }}
        RELEASE_CLOSURE_BUILD_KIND: shared
        RELEASE_CLOSURE_BUILD_TOKEN: shared
        RELEASE_CLOSURE_CONTRIBUTION_JSON_PATH: ${{ runner.temp }}/release-build/closure-shared/shared-contribution.json
      run: pnpm exec tools-release register-closure-build

    - name: Publish verified shared Closure blobs
      if: ${{ inputs.publish-enabled == 'true' }}
      shell: bash
      env:
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_CLOSURE_BLOB_ROOT: ${{ runner.temp }}/release-build/closure-shared/blobs
        RELEASE_CLOSURE_CONTRIBUTION_JSON_PATH: ${{ runner.temp }}/release-build/closure-shared/shared-contribution.json
        RELEASE_CLOSURE_CONTRIBUTION_KIND: shared
        RELEASE_CLOSURE_PUBLICATION_JSON_PATH: ${{ runner.temp }}/release-build/closure-shared/publication.json
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: pnpm exec tools-release publish-closure-contribution

    - name: Upload shared Closure contract and acceptance blobs
      uses: actions/upload-artifact@v7
      with:
        name: open-design-${{ inputs.channel }}-closure-shared
        path: |
          ${{ runner.temp }}/release-build/closure-shared/shared-contribution.json
          ${{ runner.temp }}/release-build/closure-shared/blobs
        if-no-files-found: error
        retention-days: 1
