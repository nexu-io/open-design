version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(bot):"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(bot):"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      node:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/deploy"
      - "/tools/pack"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(bot):"
    groups:
      docker:
        patterns: ["*"]
