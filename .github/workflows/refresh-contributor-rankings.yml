name: refresh-contributor-rankings

on:
  # Weekly refresh: regenerates the RANKING_SNAPSHOT block in
  # apps/landing-page/public/community/contributors/index.html from live
  # GitHub data so the public leaderboards stay current without hand-edits.
  schedule:
    - cron: '17 1 * * 1'
  # Manual trigger: use to force-refresh outside the weekly cron, e.g. after
  # adding someone to data/contributor-exclusions.json.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-contributor-rankings
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh contributor rankings snapshot
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Generate Open Design bot token
        id: open-design-bot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: nexu-io
          repositories: open-design
          # `members: read` lets the script resolve nexu-io/core-maintainers
          # team membership so maintainers are filtered out of the public
          # leaderboard. If the bot App installation lacks Members: Read at
          # the org level, the script will fail loudly — that is the intended
          # behaviour (silently skipping the filter would surface maintainers
          # on a leaderboard meant for the rest of the community).
          permission-members: read
          permission-contents: write
          permission-pull-requests: write

      - name: Refresh snapshot
        env:
          GITHUB_TOKEN: ${{ steps.open-design-bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: node --experimental-strip-types scripts/refresh-contributor-rankings.ts

      - name: Create refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.open-design-bot-token.outputs.token }}
          add-paths: |
            apps/landing-page/public/community/contributors/index.html
          branch: automation/refresh-contributor-rankings
          delete-branch: true
          commit-message: 'docs(community): refresh contributor rankings snapshot'
          author: 'open-design-bot[bot] <282769551+open-design-bot[bot]@users.noreply.github.com>'
          committer: 'open-design-bot[bot] <282769551+open-design-bot[bot]@users.noreply.github.com>'
          title: 'docs(community): refresh contributor rankings snapshot'
          body: |
            Refreshes the All-time and This Week leaderboards on
            `/community/contributors` from live GitHub data.

            Generated by the scheduled `refresh-contributor-rankings` workflow.
            Source script: `scripts/refresh-contributor-rankings.mjs`.
            Exclusions: `data/contributor-exclusions.json` + the
            `nexu-io/core-maintainers` team + bot-like account heuristics.
