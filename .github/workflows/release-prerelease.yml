          RELEASE_SMOKE_MODE: skip
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: win_x64 prerelease build
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" write-report
      - name: Publish win_x64 report summary
        if: ${{ !cancelled() && steps.report_win_x64.outcome == 'success' }}
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Prepare win_x64 assets
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_CHANNEL: prerelease
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_INCLUDE_ZIP: "true"
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" prepare-platform-assets
      - name: Publish win_x64 platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          WIN_INCLUDE_ZIP: "true"
          RELEASE_SIGNED: "false"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" publish-platform
      - name: Read win_x64 platform outputs
        id: win_x64_platform_outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/win_x64.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Upload windows prerelease publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/win_x64.json
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish prerelease release
    # No validation job appears in `needs` or `if`, and none may be added.
    # Tests are parallel siblings and smoke is downstream: both can turn the
    # run red, while version_metadata_url remains the authoritative delivery
    # signal for this internal channel.
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.metadata.result == 'success' &&
        needs.build_mac.result == 'success' &&
        (needs.build_mac_intel.result == 'success' || needs.build_mac_intel.result == 'skipped') &&
        needs.build_win.result == 'success'
      }}
    runs-on: ubuntu-latest
    outputs:
      version_metadata_url: ${{ steps.outputs.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.outputs.outputs.mac_arm64_dmg_url }}
      mac_intel_url: ${{ steps.outputs.outputs.mac_x64_dmg_url }}
      win_url: ${{ steps.outputs.outputs.win_x64_installer_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      BRANCH_NAME: ${{ needs.metadata.outputs.branch }}
      ENABLE_MAC: "true"
      ENABLE_WIN: "true"
      GITHUB_RELEASE_ENABLED: "false"
      RELEASE_CHANNEL: prerelease
      RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
      RELEASE_SIGNED: ${{ inputs.mac_sign_mode != 'no' && 'true' || 'false' }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      REPORT_MODE: zip
      STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # Shallow — see the metadata job's checkout for why.
          fetch-depth: 1
      - name: Download mac prerelease publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-mac-arm64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Download mac intel prerelease publish manifest
        if: ${{ needs.build_mac_intel.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Download windows prerelease publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Setup release publisher
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-publish
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}

      - name: Prepare and publish prerelease release notes
        env:
          RELEASE_CHANNEL: prerelease
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-metadata/release-note-plan.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          pnpm exec tools-release prepare-release-note
          pnpm exec tools-release publish-release-note
          pnpm exec tools-release verify-release-note

      - name: Publish prerelease metadata
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: ${{ needs.build_mac_intel.result == 'success' }}
          ENABLE_WIN_X64: "true"
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_CHANNEL: prerelease
          RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-metadata/outputs.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_SIGNED: ${{ inputs.mac_sign_mode != 'no' && 'true' || 'false' }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release publish-metadata
      - name: Read metadata outputs
        id: outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-metadata/outputs.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Verify prerelease metadata
        env:
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: ${{ needs.build_mac_intel.result == 'success' }}
          ENABLE_WIN_X64: "true"
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_CHANNEL: prerelease
          RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release verify-metadata
      - name: Write prerelease metadata summary
        env:
          RELEASE_CHANNEL: prerelease
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/release-metadata/summary.md
        run: pnpm exec tools-release summary-metadata
      - name: Publish summary
        run: cat "${{ runner.temp }}/release-metadata/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: intermediate platform publish manifests after metadata publication
          ARTIFACT_NAME_REGEX: "^open-design-prerelease-(mac-arm64|mac-x64|win-x64)-publish-manifest$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
  smoke_plan:
    name: Resolve published prerelease targets
    needs: [metadata, publish]
    if: ${{ always() && !cancelled() && inputs.enable_smoke && needs.publish.result == 'success' && needs.publish.outputs.version_metadata_url != '' }}
    runs-on: ubuntu-latest
    outputs:
      mac_arm64: ${{ steps.plan.outputs.mac_arm64 }}
      mac_x64: ${{ steps.plan.outputs.mac_x64 }}
      win_x64: ${{ steps.plan.outputs.win_x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # This job reads published metadata over HTTP and touches no product
          # code, so it runs the staging script that ships with this workflow
          # rather than the one at the built commit.
          fetch-depth: 1
      - name: Prepare release tool
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-publish
      - name: Read published version metadata
        id: plan
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.release_version }}
          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        # A platform that did not build is absent from the metadata, so the
        # per-platform jobs below are gated on what actually shipped rather than
        # on the flags the build was dispatched with.
        run: pnpm exec tools-release artifact plan

  smoke_mac_arm64:
    name: Smoke prerelease mac arm64
    needs: [metadata, publish, smoke_plan]
    if: ${{ always() && !cancelled() && needs.smoke_plan.result == 'success' && needs.smoke_plan.outputs.mac_arm64 == 'true' }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RELEASE_NAMESPACE: release-prerelease
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Setup release validation
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-validation
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
      - name: Stage published mac arm64 dmg
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          RELEASE_TARGET: mac_arm64
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        shell: bash
        run: |
          pnpm exec tools-release artifact resolve --output "$RUNNER_TEMP/installer.json"
          pnpm exec tools-pack stage-artifact "$RUNNER_TEMP/installer.json"
      - name: Smoke prerelease mac packaged runtime
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          OD_PACKAGED_E2E_MAC: "1"
          # A literal, never an expression that can resolve to ''. mac.spec.ts
          # reads this with `??`, so an empty string survives and selects the
          # `full` updater path, which then dies for want of a fixture.
          OD_PACKAGED_E2E_MAC_SMOKE_PROFILE: core
          OD_PACKAGED_E2E_NAMESPACE: release-prerelease
          OD_PACKAGED_E2E_RELEASE_CHANNEL: prerelease
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/release-report/mac_arm64
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release-smoke.ts mac specs/mac.spec.ts
      - name: Write mac_arm64 smoke report
        if: ${{ always() }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac_arm64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}/release-report/mac_arm64/report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}/release-report/mac_arm64/summary.md
          RELEASE_SMOKE_MODE: core
          RELEASE_TARGET: mac_arm64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: mac_arm64 prerelease packaged smoke
        run: pnpm exec tools-release write-report
      - name: Publish mac_arm64 smoke summary
        if: ${{ always() }}
        run: cat "${{ runner.temp }}/release-report/mac_arm64/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mac arm64 smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-mac-arm64-smoke-report
          path: ${{ runner.temp }}/release-report/mac_arm64
          if-no-files-found: warn
          retention-days: 14

  smoke_mac_x64:
    name: Smoke prerelease mac intel x64
    needs: [metadata, publish, smoke_plan]
    if: ${{ always() && !cancelled() && needs.smoke_plan.result == 'success' && needs.smoke_plan.outputs.mac_x64 == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      RELEASE_NAMESPACE: release-prerelease-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Setup release validation
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-validation
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
      - name: Stage published mac intel dmg
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_x64/build.json
          RELEASE_TARGET: mac_x64
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        shell: bash
        run: |
          pnpm exec tools-release artifact resolve --output "$RUNNER_TEMP/installer.json"
          pnpm exec tools-pack stage-artifact "$RUNNER_TEMP/installer.json"
      - name: Smoke prerelease mac_x64 packaged runtime
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_x64/build.json
          OD_PACKAGED_E2E_MAC: "1"
          OD_PACKAGED_E2E_MAC_SMOKE_PROFILE: core
          OD_PACKAGED_E2E_NAMESPACE: release-prerelease-intel
          OD_PACKAGED_E2E_RELEASE_CHANNEL: prerelease
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/release-report/mac_x64
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release-smoke.ts mac specs/mac.spec.ts
      - name: Write mac_x64 smoke report
        if: ${{ always() }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_x64/build.json
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-intel
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}/release-report/mac_x64/report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}/release-report/mac_x64/summary.md
          RELEASE_SMOKE_MODE: core
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: mac_x64 prerelease packaged smoke
        run: pnpm exec tools-release write-report
      - name: Publish mac_x64 smoke summary
        if: ${{ always() }}
        run: cat "${{ runner.temp }}/release-report/mac_x64/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mac intel smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-mac-x64-smoke-report
          path: ${{ runner.temp }}/release-report/mac_x64
          if-no-files-found: warn
          retention-days: 14

  smoke_win_x64:
    name: Smoke prerelease win x64
    needs: [metadata, publish, smoke_plan]
    # Windows smoke has to stay on a Windows runner: it drives the real NSIS
    # installer, the uninstall registry keys, and the shell shortcuts.
    if: ${{ always() && !cancelled() && needs.smoke_plan.result == 'success' && needs.smoke_plan.outputs.win_x64 == 'true' && inputs.win_x64_smoke_mode != 'skip' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_NAMESPACE: release-prerelease-win
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Setup release validation
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-validation
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
      - name: Stage published windows installer
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_TARGET: win_x64
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        shell: bash
        run: |
          pnpm exec tools-release artifact resolve --output "$RUNNER_TEMP/installer.json"
          pnpm exec tools-pack stage-artifact "$RUNNER_TEMP/installer.json"
      - name: Clear mark-of-the-web from the downloaded installer
        shell: pwsh
        # tools-pack launches the installer through CreateProcess, which does not
        # consult the zone stream, but ASR and AppLocker policies on a hosted
        # runner can. Stripping it keeps a policy change from looking like a
        # product regression.
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "${{ runner.temp }}\tools-pack\out\win\namespaces\release-prerelease-win\builder\Open Design-release-prerelease-win-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "staged installer not found at $installer" }
          Unblock-File -LiteralPath $installer
      - name: Setup NSIS
        # Only the `full` profile packages anything here — the updater payload
        # fixture below. `core` installs the downloaded setup.exe and needs no
        # NSIS toolchain at all.
        if: ${{ inputs.win_x64_smoke_mode == 'full' }}
        shell: pwsh
        run: |
          function Test-Makensis {
            [bool]((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe"))
          }
          if (Test-Makensis) { Write-Host "makensis already present"; exit 0 }
          foreach ($attempt in 1..4) {
            Write-Host "choco install nsis (attempt $attempt)"
            choco install nsis -y --no-progress
            if (Test-Makensis) { break }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Test-Makensis)) {
            Write-Error "NSIS install failed after 4 attempts: makensis absent from PATH and C:\Program Files (x86)\NSIS"
            exit 1
          }
          Write-Host "NSIS ready"
      - name: Build prerelease win_x64 update fixture
        # Only the `full` Windows smoke consumes this fixture. It is a second,
        # complete Windows package built at version+1 so the updater has
        # something real to apply — the published artifact cannot supply it,
        # because it is the version being updated FROM.
        if: ${{ inputs.win_x64_smoke_mode == 'full' && inputs.win_x64_update_metadata_url == '' && inputs.win_x64_update_target_version == '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = [regex]::Match("${{ needs.metadata.outputs.release_version }}", "^(?<base>\d+\.\d+\.\d+)-prerelease\.(?<number>\d+)$")
          if (-not $match.Success) { throw "full Windows smoke requires a counted prerelease version; got ${{ needs.metadata.outputs.release_version }}" }
          $updateVersion = "{0}-prerelease.{1}" -f $match.Groups["base"].Value, ([int]$match.Groups["number"].Value + 1)
          $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\release-work\win_x64\tools-pack-update-fixture", "--namespace", "release-prerelease-win", "--app-version", $updateVersion, "--to", "nsis", "--json")
          $updateOutput = pnpm.cmd @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture failed with exit code $LASTEXITCODE" }
          $updateOutput | Set-Content -Path "${{ runner.temp }}\release-build\win_x64\windows-tools-pack-update-build.json" -Encoding utf8
          $updateBuild = $updateOutput | ConvertFrom-Json
          pnpm.cmd exec tools-pack win validate-payload --namespace release-prerelease-win --payload-path $updateBuild.payloadPath --expected-version $updateVersion --json
      - name: Smoke prerelease windows packaged runtime
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          OD_PACKAGED_E2E_NAMESPACE: release-prerelease-win
          OD_PACKAGED_E2E_RELEASE_CHANNEL: prerelease
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
          OD_PACKAGED_E2E_WIN: "1"
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: ${{ inputs.win_x64_smoke_mode }}
          OD_PACKAGED_E2E_WIN_UPDATE_FIXTURE: ${{ inputs.win_x64_smoke_mode == 'full' && inputs.win_x64_update_metadata_url == '' && inputs.win_x64_update_target_version == '' && 'tools-serve' || '' }}
          OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.win_x64_update_metadata_url }}
          OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.win_x64_update_target_version }}
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec tsx scripts/release-smoke.ts win specs/win.spec.ts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Write win_x64 smoke report
        if: ${{ always() }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-win
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.md
          RELEASE_SMOKE_MODE: ${{ inputs.win_x64_smoke_mode }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: win_x64 prerelease packaged smoke
        run: pnpm exec tools-release write-report
      - name: Publish win_x64 smoke summary
        if: ${{ always() }}
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload windows smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-win-x64-smoke-report
          path: ${{ runner.temp }}\release-report\win_x64
          if-no-files-found: warn
          retention-days: 14
  cleanup_partial_release_assets:
    name: Cleanup unpublished prerelease asset artifacts
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
      - publish
    if: ${{ always() && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit || inputs.ref || github.ref }}

      - name: Delete unpublished prerelease asset artifacts
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: intermediate prerelease asset Actions artifacts from this unpublished run. Canonical manual downloads are only the R2 links in a successful publish summary
          ARTIFACT_NAME_REGEX: "-release-assets$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
