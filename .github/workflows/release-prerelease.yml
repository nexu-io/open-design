name: release-prerelease
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional source ref to build. Dispatch this formal workflow on release/vX.Y.Z; empty builds that release ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Base version (x.y.z). Required when the optional source ref is not release/vX.Y.Z."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "Optional AMR profile baked into the build (test or feature-test point the packaged app at that profile's Vela backend and enable the workspace-team transport). Empty leaves the default (prod)."
        required: false
        type: string
        default: ""
      enable_mac_x64:
        description: "Build and publish macOS x64 (Intel) artifacts. ON by default: stable ships Intel and stable is gated on validated prerelease artifacts, so an Intel-less prerelease cannot be promoted. The switch stays so a run that is explicitly not about Intel can buy back the ~12 min it adds to the critical path (~33 min on the macos-15-intel fleet against ~21 min everywhere else); turning it off costs that build its promotion eligibility."
        required: false
        type: boolean
        default: true
      enable_smoke:
        description: "Run downloaded-artifact smoke for mac arm64, mac Intel, and Windows after publish. ON by default. These jobs validate the exact R2 artifacts users receive and do not gate CDN publication."
        required: false
        type: boolean
        default: true
      enable_tests:
        description: "Run Plan-selected P0 Functional E2E, E2E Vitest, daemon shards, and verify jobs in this workflow. ON by default. Their outcome affects the workflow conclusion but does not gate CDN publication."
        required: false
        type: boolean
        default: true
      mac_sign_mode:
        description: "macOS signing depth for both mac lanes. 'sign-only' (default) codesigns with the Apple certificate but skips the Apple notary round-trip, which is minutes of waiting on Apple that no prerelease consumer needs. 'notarize' also notarizes and staples — use it for the last prerelease before a stable promotion, since stable ships notarized. 'no' skips signing entirely and will FAIL the stable promotion gate, which requires platforms.mac.signed == true."
        required: true
        type: choice
        options:
          - "no"
          - "sign-only"
          - "notarize"
        default: "sign-only"
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage, applied only when enable_smoke is on. enable_smoke decides WHETHER packaged smoke runs; this input decides HOW DEEP the Windows one goes."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Optional git ref to build. Empty builds the caller's ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Base version (x.y.z). Required when ref is not release/vX.Y.Z."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "Optional AMR profile baked into the build (test or feature-test enable the workspace-team transport by pointing at that profile's Vela backend). Empty leaves the default (prod)."
        required: false
        type: string
        default: ""
      enable_mac_x64:
        description: "Build and publish macOS x64 (Intel) artifacts. ON by default: stable ships Intel and stable is gated on validated prerelease artifacts, so an Intel-less prerelease cannot be promoted. The switch stays so a run that is explicitly not about Intel can buy back the ~12 min it adds to the critical path; turning it off costs that build its promotion eligibility."
        required: false
        type: boolean
        default: true
      enable_smoke:
        description: "Run downloaded-artifact smoke for mac arm64, mac Intel, and Windows after publish. ON by default; smoke does not gate CDN publication."
        required: false
        type: boolean
        default: true
      enable_tests:
        description: "Run Plan-selected P0 Functional E2E, E2E Vitest, daemon shards, and verify jobs in this workflow. ON by default; tests do not gate CDN publication."
        required: false
        type: boolean
        default: true
      mac_sign_mode:
        description: "macOS signing depth for both mac lanes: no / sign-only / notarize. Defaults to sign-only — codesigned but not sent to Apple's notary service. Use notarize for the last prerelease before a stable promotion. 'no' fails the stable promotion gate, which requires platforms.mac.signed == true."
        required: false
        type: string
        default: "sign-only"
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage, applied only when enable_smoke is on: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The prerelease version that was built."
        value: ${{ jobs.metadata.outputs.release_version }}
      channel:
        description: "The prerelease channel."
        value: ${{ jobs.metadata.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.metadata.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.metadata.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published prerelease; empty on cold start."
        value: ${{ jobs.metadata.outputs.previous_commit }}
      # --- Advisory signals ------------------------------------------------
      # Nothing below gates publication.
      #
      # Code tests run beside the platform builds and downloaded-artifact smoke
      # runs after publish. Neither appears in publish.needs, so R2 delivery is
      # independent even though a failed validation makes the overall run red.
      #
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json. This is the authoritative \"did a package actually ship?\" signal — it is non-empty only when the publish job wrote metadata. Do NOT read the overall workflow conclusion for that: it now goes red whenever an advisory test job fails, even though the package shipped."
        value: ${{ jobs.publish.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_intel_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.publish.outputs.win_url }}
permissions:
  actions: write
  contents: read
concurrency:
  group: open-design-release-prerelease
  cancel-in-progress: false
env:
  PRERELEASE_SAVE_PNPM_CACHE: "false"
  OPEN_DESIGN_TELEMETRY_RELAY_URL: ${{ vars.OPEN_DESIGN_TELEMETRY_RELAY_URL }}
  # PostHog product-analytics ingest. Defined as repository secret + var
  # so official builds ship with analytics enabled; PR builds and forks
  # without these run the daemon in no-op analytics mode (events never
  # leave the user's machine, /api/analytics/config returns enabled=false).
  POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  # PostHog Error tracking sourcemap upload. Personal API key (phx_...) and
  # project ID let tools-pack's web-sourcemaps step ship browser sourcemaps
  # to PostHog after `next build` and before the .map files are stripped
  # from the packaged bundle. Missing in PR/fork builds → upload is skipped
  # and the helper still strips .map to keep source out of the installer.
  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
  POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
  # Workspace Team gate for packaged prerelease builds. tools-pack reads
  # OPEN_DESIGN_AMR_PROFILE and bakes OD_VELA_WEB_URL into open-design-config.json;
  # both are required for the packaged daemon to enable the workspace-team
  # transport (see apps/packaged/src/workspace-team.ts).
  #
  # Every profile now resolves an origin, production included: prod's Vela
  # backend serves the feature (WORKSPACE_TEAM_ENABLED plus a configured
  # resource-hub blob store), so a prod build ships the transports enabled.
  # An empty amr_profile still yields no origin, which the packaged gate treats
  # as dormant — a build that forgets the profile degrades to local-only rather
  # than pointing at an unknown backend.
  #
  # Origins stay in repository secrets rather than literals: the non-prod AMR
  # environments are internal deployments and this repository is public.
  # Secrets read here: VELA_WEB_URL_FEATURE_TEST, VELA_WEB_URL_TEST,
  # VELA_WEB_URL_PROD.
  OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr_profile }}
  OD_VELA_WEB_URL: ${{ inputs.amr_profile == 'feature-test' && secrets.VELA_WEB_URL_FEATURE_TEST || inputs.amr_profile == 'test' && secrets.VELA_WEB_URL_TEST || (inputs.amr_profile == 'prod' || inputs.amr_profile == '') && secrets.VELA_WEB_URL_PROD || '' }}
  OD_VELA_WEB_URL_FEATURE_TEST: ${{ secrets.VELA_WEB_URL_FEATURE_TEST }}
  OD_VELA_WEB_URL_TEST: ${{ secrets.VELA_WEB_URL_TEST }}
  OD_VELA_WEB_URL_PROD: ${{ secrets.VELA_WEB_URL_PROD }}
jobs:
  metadata:
    name: "[prepare] Prerelease metadata and Plan"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPEN_DESIGN_PRERELEASE_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/prerelease/latest/metadata.json
      OPEN_DESIGN_RELEASE_CHANNEL: prerelease
      OPEN_DESIGN_STABLE_VERSION: ${{ inputs.release_version }}
    outputs:
      run: ${{ steps.plan.outputs.run }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_count: ${{ steps.plan.outputs.test_count }}
      common_matrix: ${{ steps.plan.outputs.common_matrix }}
      common_count: ${{ steps.plan.outputs.common_count }}
      requests: ${{ steps.plan.outputs.requests }}
      sources: ${{ steps.plan.outputs.sources }}
      pending_artifact: prerelease-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
      contribution: ${{ steps.mode.outputs.contribution }}
      contributions: ${{ steps.plan.outputs.contributions }}
      base_version: ${{ steps.prerelease.outputs.base_version }}
      branch: ${{ steps.prerelease.outputs.branch }}
      channel: ${{ steps.prerelease.outputs.channel }}
      commit: ${{ steps.prerelease.outputs.commit }}
      github_release_enabled: ${{ steps.prerelease.outputs.github_release_enabled }}
      latest_stable: ${{ steps.prerelease.outputs.latest_stable }}
      previous_commit: ${{ steps.prev.outputs.previous_commit }}
      prerelease_number: ${{ steps.prerelease.outputs.prerelease_number }}
      prerelease_version: ${{ steps.prerelease.outputs.prerelease_version }}
      release_number: ${{ steps.prerelease.outputs.release_number }}
      release_name: ${{ steps.prerelease.outputs.release_name }}
      release_version: ${{ steps.prerelease.outputs.release_version }}
      state_source: ${{ steps.prerelease.outputs.state_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          # Shallow. Nothing in this workflow reads git history: the built
          # commit arrives as an explicit input/env (RELEASE_COMMIT), `pnpm
          # guard` uses `git ls-files` (index, not history), and tools-pack /
          # tools-release never shell out to git. A full clone of this
          # repository is a 2.2 GiB pack and cost 44-102s per job.
          fetch-depth: 1
      - name: Resolve built identity
        id: identity
        env:
          BUILD_REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          {
            echo "branch=$BUILD_REF"
            echo "commit=$built_sha"
          } >> "$GITHUB_OUTPUT"
          echo "BUILT_SHA=$built_sha" >> "$GITHUB_ENV"
      - name: "[prepare] Distinct workflow control snapshot"
        if: ${{ steps.identity.outputs.commit != github.sha }}
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: plan-control
          fetch-depth: 1
      - name: "[resolve] Actual source runner profiles"
        id: runners
        env:
          OD_CI_RUNNER_MODE: ${{ vars.OD_CI_RUNNER_MODE }}
        run: python3 .github/scripts/runners.py
      - name: "[resolve] Formal release result consumption"
        id: mode
        run: |
          echo "contribution=true" >> "$GITHUB_OUTPUT"
          echo "mode=enforce" >> "$GITHUB_OUTPUT"
      - name: "[plan] Frozen prerelease workloads"
        id: plan
        env:
          EXECUTION_INPUTS: ${{ toJSON(inputs) }}
          RUNNER_PLAN: ${{ steps.runners.outputs.runs_on }}
          CONTROL_ROOT: ${{ steps.identity.outputs.commit == github.sha && '.' || 'plan-control' }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          runners="$(jq -c '. + {source_javascript:["ubuntu-latest"],release_tests:["ubuntu-latest"],ui_p0:["ubuntu-latest"],source_mac_arm64:["macos-14"],source_mac_x64:["macos-15-intel"],source_win_x64:["windows-latest"]}' <<< "$RUNNER_PLAN")"
          python3 "$CONTROL_ROOT/.github/scripts/convergence.py" --root . --config "$CONTROL_ROOT/.github/config/convergence/release-prerelease.json" github-output \
            --workflow release-prerelease --all-workloads --runner-plan-json "$runners" \
            --execution-inputs-json "$EXECUTION_INPUTS" --mode enforce --pending "$RUNNER_TEMP/pending-convergence.json"
      - name: "[retain] Frozen Plan witness"
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pending-convergence.json
            ${{ runner.temp }}/requests
          if-no-files-found: error
          retention-days: 7
      - name: Setup release control
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-control

      - name: Capture previous prerelease commit
        id: prev
        run: |
          set -euo pipefail
          prev="$(curl -fsSL "$OPEN_DESIGN_PRERELEASE_METADATA_URL" | jq -r '.github.commit // ""' 2>/dev/null || true)"
          echo "previous prerelease commit: ${prev:-<none>}"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"
      - name: Prepare prerelease release metadata
        id: prerelease
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          GITHUB_REF_NAME: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: pnpm exec tools-release prepare prerelease
      - name: Validate R2 prerelease access
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          R2_ACCESS_PROBE_NAME: release-prerelease
          RELEASE_CHANNEL: prerelease
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release check-storage
  common:
    name: "[build] Shared JavaScript"
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    needs: metadata
    if: ${{ needs.metadata.outputs.contribution == 'true' && needs.metadata.outputs.common_count != '0' }}
    runs-on: ${{ fromJSON(needs.metadata.outputs.common_matrix).include[0].runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: '[validate] Source references'
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_javascript
      - name: '[prepare] JavaScript build tools'
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: shared-javascript
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
      - name: '[build] Source packages'
        id: source_packages
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.packages.retain && format('{0}/source-products/packages/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.packages.operation == 'restore' && 'import' || 'build' }} packages
          --url "$SOURCE_PACKAGES_URL" --sha256 "$SOURCE_PACKAGES_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source daemon'
        id: source_daemon
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.daemon.retain && format('{0}/source-products/daemon/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.daemon.operation == 'restore' && 'import' || 'build' }} daemon
          --url "$SOURCE_DAEMON_URL" --sha256 "$SOURCE_DAEMON_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source shell'
        id: source_shell
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.shell.retain && format('{0}/source-products/shell/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.shell.operation == 'restore' && 'import' || 'build' }} shell
          --url "$SOURCE_SHELL_URL" --sha256 "$SOURCE_SHELL_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ !cancelled() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-prerelease.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: prerelease-common-results
          products: manifest
          batches: '["source_javascript"]'
          formal-release: 'true'
          current-job: '[build] Shared JavaScript'
          step-results: |
            {"[build] Source packages":"${{ steps.source_packages.outcome }}","[build] Source daemon":"${{ steps.source_daemon.outcome }}","[build] Source shell":"${{ steps.source_shell.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}

  source_mac_arm64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] mac_arm64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && needs.metadata.outputs.contribution == 'true' && fromJSON(needs.metadata.outputs.requests).source_mac_arm64.web.operation == 'build' }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_arm64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
          postinstall-intent: source-web
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ success() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-prerelease.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: prerelease-source-mac-arm64
          products: manifest
          batches: '["source_mac_arm64"]'
          formal-release: 'true'
          current-job: '[build] mac_arm64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  source_mac_x64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] mac_x64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && inputs.enable_mac_x64 && needs.metadata.outputs.contribution == 'true' && (fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build') }}
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Disable Spotlight indexing for mac_x64 workload
        run: |
          set -euo pipefail
          sudo mdutil -i off /
          sudo mdutil -i off /System/Volumes/Data
          mdutil -s / /System/Volumes/Data
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
          postinstall-intent: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' && 'mac-runtime' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' && 'source-web' || 'release-executor' }}
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: "[prepare] Platform product tools"
        id: platform_product_tools
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' }}
        shell: bash
        run: pnpm --filter @open-design/tools-pack build
      - name: "[build] Release executor"
        id: release_executor
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/executor/product/workspace.tar.gz
        run: |
          set -euo pipefail
          pnpm --filter @open-design/tools-release build
          pnpm --filter @open-design/tools-pack executor:dev export --output "$SOURCE_OUTPUT" --json
      - name: "[build] mac_x64 runtime"
        id: mac_x64_runtime
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/runtime/product/workspace.tar.gz
        run: >-
          pnpm exec tools-pack mac runtime-export
          --dir "$RUNNER_TEMP/mac-runtime-export"
          --namespace runtime-export
          --output "$SOURCE_OUTPUT"
          --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ !cancelled() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-prerelease.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: prerelease-source-mac-x64
          products: manifest
          batches: '["source_mac_x64"]'
          formal-release: 'true'
          current-job: '[build] mac_x64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}","[prepare] Platform product tools":"${{ steps.platform_product_tools.outcome }}","[build] Release executor":"${{ steps.release_executor.outcome }}","[build] mac_x64 runtime":"${{ steps.mac_x64_runtime.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  source_win_x64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] win_x64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && true && needs.metadata.outputs.contribution == 'true' && (fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_win_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
          postinstall-intent: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' && 'source-web' || 'release-executor' }}
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: "[prepare] Platform product tools"
        id: platform_product_tools
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build' }}
        shell: pwsh
        run: pnpm.cmd --filter @open-design/tools-pack build
      - name: "[build] Release executor"
        id: release_executor
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build' }}
        shell: pwsh
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}\source-products\executor\product\workspace.tar.gz
        run: |
          $ErrorActionPreference = "Stop"
          pnpm.cmd --filter @open-design/tools-release build
          if ($LASTEXITCODE -ne 0) { throw "tools-release build failed with exit code $LASTEXITCODE" }
          pnpm.cmd --filter @open-design/tools-pack executor:dev export --output $env:SOURCE_OUTPUT --json
          if ($LASTEXITCODE -ne 0) { throw "release executor export failed with exit code $LASTEXITCODE" }
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ success() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-prerelease.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: prerelease-source-win-x64
          products: manifest
          batches: '["source_win_x64"]'
          formal-release: 'true'
          current-job: '[build] win_x64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}","[build] Release executor":"${{ steps.release_executor.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  dispatch_card:
    name: Dispatch prerelease progress card
    # The single writer remains outside the release run so its polling and
    # Feishu retries cannot consume a release runner. Tests and packaged smoke
    # are now ordinary jobs in this run; the card observes them through the
    # origin topology instead of discovering two downstream workflow runs.
    # Red is not, however, a channel anyone watches. The progressive card is the
    # ONLY prerelease notification left, so a card that was never dispatched is
    # a release the team never hears about. The last steps below are the ping
    # for that, and they live in this job rather than a job of their own
    # precisely because nothing may depend on the dispatchers.
    needs: metadata
    if: ${{ needs.metadata.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Read only by the last step, which alerts when the card was not
      # dispatched. Deliberately the OTHER bot: the card posts through the
      # Feishu application bot below, so an application credential that expired
      # (or was emptied, which silently skips the dispatch step) must not take
      # the alert down with it.
      FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_RELEASE_SIGN_SECRET }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
      GH_REPO: ${{ github.repository }}
      PRIMARY_REF: ${{ needs.metadata.outputs.branch }}
      FALLBACK_REF: ${{ github.event.repository.default_branch || 'main' }}
      # `secrets` is not a context an `if:` may read, so the card dispatch
      # checks for its own credentials through env instead. A fork, or a
      # repository without the Feishu app configured, simply skips the card.
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_RELEASE_CHAT_ID: ${{ secrets.FEISHU_RELEASE_CHAT_ID }}
    steps:
      - name: Checkout dispatch helper
        id: checkout
        uses: actions/checkout@v6.0.2
        with:
          # Deliberately the ref this workflow was loaded from, NOT the built
          # commit. The helper is infrastructure that ships with this file, so
          # the two are always in step; pinning it to the built commit would
          # break the moment a release branch carried an older .github tree.
          fetch-depth: 1
      - name: Dispatch progressive Feishu card
        id: card_dispatch
        if: ${{ env.FEISHU_APP_ID != '' && env.FEISHU_RELEASE_CHAT_ID != '' }}
        env:
          BRANCH: ${{ needs.metadata.outputs.branch }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          EXPECT_SMOKE: ${{ inputs.enable_smoke }}
          EXPECT_TESTS: ${{ inputs.enable_tests }}
          PREVIOUS_COMMIT: ${{ needs.metadata.outputs.previous_commit }}
          VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          bash .github/scripts/release/dispatch-validation.sh release-prerelease-card.yml \
            -f "version=$VERSION" \
            -f "commit=$COMMIT" \
            -f "branch=$BRANCH" \
            -f "previous_commit=$PREVIOUS_COMMIT" \
            -f "origin_run_id=$GITHUB_RUN_ID" \
            -f "expect_tests=$EXPECT_TESTS" \
            -f "expect_smoke=$EXPECT_SMOKE" \
            -f "validation_location=origin"
          # Only reached when the dispatch above actually succeeded — the helper
          # exits non-zero on every ref it could not dispatch on, and `run:`
          # blocks stop at the first failure. Empty therefore covers every way
          # the card fails to start: the helper could not dispatch on any ref,
          # an earlier step in this job died, or this step was skipped because
          # the application bot's credentials are missing.
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      # ---- Fallback when the card never started --------------------------
      # `always()` so a failed dispatch above still reaches these; gated on the
      # checkout because both scripts come from the working tree. They run on
      # every prerelease and stay silent on the healthy ones — the composer
      # refuses to emit `alert=true` when the card was dispatched, which is the
      # same rule this repository cannot afford to get wrong: a fallback that
      # also posts on good days is just a second card.
      #
      # This ping is necessarily early. It fires beside the build, before any
      # package exists, so it reports where the version metadata WILL appear
      # instead of claiming a publication verdict it cannot have yet. Once the
      # card workflow IS running, release-prerelease-card.yml's own
      # `fallback_notice` job owns the rest of the lane — the two are mutually
      # exclusive, so a release can never draw both.
      - name: Compose the fallback notice
        id: notice
        if: >-
          ${{
            always() && github.repository == 'nexu-io/open-design' &&
            steps.checkout.outcome == 'success'
          }}
        env:
          BRANCH: ${{ needs.metadata.outputs.branch }}
          CARD_DISPATCHED: ${{ steps.card_dispatch.outputs.dispatched }}
          CHANNEL_LABEL: Prerelease
          COMMIT: ${{ needs.metadata.outputs.commit }}
          LANE_SUMMARY: "card dispatch=${{ steps.card_dispatch.outcome }} · validation=origin run"
          ORIGIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # This job runs beside the build, so the packages are still coming.
          # A probe would be worse than useless here: a job cannot ask the API
          # whether its own run has finished.
          PIPELINE_PROGRESS: running
          RELEASE_CHANNEL: prerelease
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          STAGE: dispatch
          VERSION: ${{ needs.metadata.outputs.release_version }}
        run: python3 .github/scripts/feishu.py fallback
      - name: Fail loudly when the fallback bot is itself unconfigured
        # Both notification paths down at once is an incident of its own, and a
        # red job is the only channel left to say so. Only reachable on this
        # repository: the composer above is scoped to it, so a fork — which has
        # neither bot — leaves `alert` empty and never goes red for this.
        # `always()` because the whole point is to speak after something
        # broke — without it GitHub's implicit success() skips this step in
        # every run where an earlier step already failed. The outcome check
        # is the other half: never act on a composer that did not finish.
        if: >-
          ${{
            always() && steps.notice.outcome == 'success' &&
            steps.notice.outputs.alert == 'true' && env.FEISHU_WEBHOOK == ''
          }}
        run: |
          echo "::error::the prerelease card was never dispatched and FEISHU_RELEASE_WEBHOOK is unset, so no fallback notice could be delivered"
          exit 1
      - name: Post the fallback notice
        if: >-
          ${{
            always() && steps.notice.outcome == 'success' &&
            steps.notice.outputs.alert == 'true' && env.FEISHU_WEBHOOK != ''
          }}
        env:
          NOTICE_BODY: ${{ steps.notice.outputs.body }}
          NOTICE_TEMPLATE: ${{ steps.notice.outputs.template }}
          NOTICE_TITLE: ${{ steps.notice.outputs.title }}
          RUN_URL: ${{ steps.notice.outputs.run_url }}
        run: python3 .github/scripts/feishu.py notice
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    needs: [metadata, common]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && inputs.enable_tests && needs.metadata.outputs.test_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.test_matrix) }}
    env:
      OD_WATCHER_TEST_DEBUG: ${{ matrix.debug || '' }}
      TEST_KIND: ${{ matrix.kind }}
      TEST_SHARD: ${{ matrix.shard || '' }}
      TEST_GROUP: ${{ matrix.group || '' }}
      TEST_SHARED: ${{ needs.metadata.outputs.contribution }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        if: ${{ needs.metadata.outputs.contribution == 'true' }}
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --shared packages,daemon,shell
      - name: Configure CI parallelism
        if: ${{ matrix.kind == 'ui' }}
        uses: ./.github/actions/configure-ci-parallelism
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: ${{ format('test-{0}', matrix.kind) }}
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Setup Playwright
        if: ${{ matrix.kind == 'e2e' || matrix.kind == 'ui' }}
        uses: ./.github/actions/setup-playwright
        with:
          package-json-path: e2e/package.json
          install-command: pnpm -C e2e exec playwright install --with-deps chromium
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Allow Chromium user namespaces on GitHub Ubuntu
        if: ${{ matrix.kind == 'e2e' }}
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare test dependencies
        run: python3 .github/scripts/release/test_unit.py prepare
      - name: Clean Playwright state
        if: ${{ matrix.kind == 'ui' }}
        run: pnpm -C e2e exec tsx scripts/playwright.ts clean
      - name: Run test unit
        run: python3 .github/scripts/release/test_unit.py run
      - name: Preserve project-runtime domain artifact
        if: ${{ success() && matrix.kind == 'ui' && matrix.group == 'project-runtime' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}-domain
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Run UI critical extras
        if: ${{ matrix.extra == true }}
        run: python3 .github/scripts/release/test_unit.py extra
      - name: Upload Playwright debug artifact
        if: ${{ always() && matrix.kind == 'ui' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  cache_test:
    name: "[cache] Completed test results"
    needs: [metadata, test]
    if: ${{ always() && !cancelled() && needs.metadata.result == 'success' && inputs.enable_tests && needs.metadata.outputs.contribution == 'true' && needs.metadata.outputs.test_count != '0' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: '[cache] Publish independently successful workloads'
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-prerelease.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: prerelease-test-results
          products: none
          formal-release: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
  build_mac:
    outputs:
      manifest_key: ${{ steps.mac_arm64_platform_outputs.outputs.platform_manifest_key }}
      url: ${{ steps.mac_arm64_platform_outputs.outputs.dmg_url }}
    name: Build prerelease mac arm64
    needs:
      - metadata
      - common
      - source_mac_arm64
    if: ${{ !cancelled() && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.source_mac_arm64.result == 'success' && needs.source_mac_arm64.outputs.requests || needs.source_mac_arm64.result == 'skipped' && needs.metadata.outputs.requests || 'null' }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_arm64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.PRERELEASE_SAVE_PNPM_CACHE }}
          cache-tools: 'true'
          postinstall-intent: platform-build
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm exec tools-pack workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ""
        run: pnpm exec tools-pack workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: Prepare mac_arm64 signing certificate
        if: ${{ (inputs.mac_sign_mode != 'no') }}
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/open-design-signing.p12"
          if ! printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$cert_path"
          fi
          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build prerelease mac_arm64
        id: mac_arm64_tools_pack_build
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr_profile }}
          OD_WEB_SOURCEMAP_UPLOAD: "true"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-build/mac_arm64"
          rm -rf "$RUNNER_TEMP/tools-pack"
          : > "$RUNNER_TEMP/release-build/mac_arm64/build.log"
          build_args=(
            exec tools-pack mac package
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace release-prerelease
            --portable
            --app-version "${{ needs.metadata.outputs.release_version }}"
            --build-json "$RUNNER_TEMP/release-build/mac_arm64/build.json"
            --mac-compression "normal"
            --to "all"
            --json
            --require-vela-cli
          )
          case "${{ inputs.mac_sign_mode }}" in
            no) ;;
            sign-only) build_args+=(--signed) ;;
            notarize) build_args+=(--signed --notarize) ;;
