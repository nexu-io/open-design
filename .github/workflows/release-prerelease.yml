name: release-prerelease
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to build. Empty builds the dispatched ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Base version (x.y.z). Required when ref is not release/vX.Y.Z."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "AMR profile baked into the build. Only prod builds can receive stable-promotion qualification."
        required: true
        type: choice
        options: [prod, test, feature-test]
        default: prod
      mac_arm64_sign_mode:
        description: "macOS arm64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed, notarized]
        default: notarized
      mac_x64_sign_mode:
        description: "macOS x64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed, notarized]
        default: notarized
      win_x64_sign_mode:
        description: "Windows x64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed]
        default: unsigned
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Optional git ref to build. Empty builds the caller's ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Base version (x.y.z). Required when ref is not release/vX.Y.Z."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "AMR profile baked into the build."
        required: false
        type: string
        default: prod
      mac_arm64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_x64_sign_mode:
        required: false
        type: string
        default: notarized
      win_x64_sign_mode:
        required: false
        type: string
        default: unsigned
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The prerelease version that was built."
        value: ${{ jobs.distribute.outputs.release_version }}
      channel:
        description: "The prerelease channel."
        value: ${{ jobs.distribute.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.distribute.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.distribute.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published prerelease; empty on cold start."
        value: ${{ jobs.distribute.outputs.previous_commit }}
      mac_arm64_smoke_result:
        description: "macOS arm64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.mac_arm64_smoke_result }}
      mac_x64_smoke_result:
        description: "macOS x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.mac_x64_smoke_result }}
      win_x64_smoke_result:
        description: "Windows x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.win_x64_smoke_result }}
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json."
        value: ${{ jobs.distribute.outputs.version_metadata_url }}
      stable_qualification_url:
        description: "Immutable stable-promotion qualification URL; empty when ineligible."
        value: ${{ jobs.distribute.outputs.stable_qualification_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_intel_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.distribute.outputs.win_url }}
permissions:
  actions: write
  contents: read
concurrency:
  group: open-design-release-prerelease
  cancel-in-progress: false
jobs:
  distribute:
    name: Distribute prerelease release
    uses: ./.github/workflows/distribution.yml
    secrets: inherit
    with:
      channel: prerelease
      enhanced_validation: true
      ref: ${{ inputs.ref }}
      release_version: ${{ inputs.release_version }}
      release_name: Open Design Prerelease
      amr_profile: ${{ inputs.amr_profile }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}
      smoke_advisory: true
      stable_qualification: true
      verify_notarization: true
