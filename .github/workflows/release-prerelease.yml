          # buys nothing for an internal channel, and metadata carries no
          # notarized field for the stable gate to check.
          case "${{ inputs.mac_sign_mode }}" in
            no) ;;
            sign-only) build_args+=(--signed) ;;
            notarize) build_args+=(--signed --notarize) ;;
            *) echo "unsupported mac_sign_mode: ${{ inputs.mac_sign_mode }}" >&2; exit 1 ;;
          esac
          if build_output="$(pnpm "${build_args[@]}" 2> >(tee -a "$RUNNER_TEMP/release-build/mac_arm64/build.log" >&2))"; then
            printf '%s\n' "$build_output" | tee "$RUNNER_TEMP/release-build/mac_arm64/build.json"
          else
            build_status=$?
            printf '%s\n' "$build_output"
            exit "$build_status"
          fi
      - name: Retry prerelease mac_arm64 without restored cache
