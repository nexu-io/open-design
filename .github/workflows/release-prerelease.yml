          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          candidate_app="$mount_point/Open Design Prerelease.app"
          if [ ! -d "$candidate_app" ]; then
            echo "prerelease app not found in DMG: $candidate_app" >&2
            exit 1
          fi
          # The signature is checked on every signed build, because
          # platforms.mac[Intel].signed == true is what the stable promotion
          # gate reads. The stapled-ticket and Gatekeeper assessments only pass
          # for a notarized build, so they follow mac_sign_mode rather than
          # failing the job for doing exactly what it was asked to do.
          codesign --verify --deep --strict "$candidate_app"
          if [ "${{ inputs.mac_sign_mode }}" = "notarize" ]; then
            xcrun stapler validate "$candidate_app"
            spctl --assess --type execute --verbose=4 "$candidate_app"
          else
            echo "mac_sign_mode=${{ inputs.mac_sign_mode }}: signature verified; skipping stapler/spctl, which require a notarization ticket this build did not request."
          fi

      - name: Write mac_x64 release report
        if: ${{ always() }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_x64/build.json
          BUILD_LOG_PATH: ${{ runner.temp }}/release-build/mac_x64/build.log
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-intel
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}/release-report/mac_x64/report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}/release-report/mac_x64/summary.md
          # The build jobs no longer smoke; the packaged smoke lives in
          # release-prerelease-smoke.yml and writes its own report there.
          RELEASE_SMOKE_MODE: skip
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: mac_x64 prerelease build
        run: pnpm exec tools-release write-report

      - name: Publish mac_x64 report summary
        if: ${{ always() }}
        run: cat "${{ runner.temp }}/release-report/mac_x64/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune mac_x64 tools-pack cache
        continue-on-error: true
        run: bash .github/scripts/release/cache/mac.sh

      - name: Save mac_x64 tools-pack cache
        if: ${{ success() && (steps.mac_x64_tools_pack_cache_restore.outputs.cache-hit != 'true' || steps.mac_x64_tools_pack_build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tools-pack-cache
          key: ${{ steps.mac_x64_tools_pack_cache_key.outputs.key }}

      - name: Retain recent mac_x64 tools-pack caches
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="${{ steps.mac_x64_tools_pack_cache_key.outputs.prefix }}"
          keep=1
          cache_ids="$(gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id,key,createdAt --jq ".[$keep:] | .[].id")"
          count=0
          while IFS= read -r cache_id; do
            if [ -n "$cache_id" ]; then
              gh cache delete "$cache_id"
              count=$((count + 1))
            fi
          done <<< "$cache_ids"
          echo "actionsCachePrefix=$prefix deleted=$count"

      - name: Prepare mac intel prerelease assets
        env:
          RELEASE_ARTIFACT_MODE: all
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-intel
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: bash tools/release/scripts/prepare-platform-assets.sh
      - name: Publish mac intel prerelease platform
        env:
          RELEASE_ARTIFACT_MODE: all
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-platform-outputs/mac_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac_x64
          RELEASE_REPORT_ZIP_PATH: ${{ runner.temp }}/release-report/mac_x64-report.zip
          # platforms.mac[Intel].signed in the published metadata comes from
          # this value via the platform manifest, and the stable promotion gate
          # reads it. It must describe what was actually done, not a constant.
          RELEASE_SIGNED: ${{ inputs.mac_sign_mode != 'no' && 'true' || 'false' }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: pnpm exec tools-release publish-platform
      - name: Upload mac intel prerelease publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/mac_x64.json
          if-no-files-found: error
          retention-days: 1
      # Packaged smoke moved to release-prerelease-smoke.yml — see build_mac.
  build_win:
    name: Build prerelease win x64
    # Tests never gate delivery on this channel — see build_mac.
    needs: metadata
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # Shallow — see the metadata job's checkout for why.
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      # No `cache: pnpm`. It caches the pnpm STORE, and on this repository that
      # store never paid for itself on Windows. Measured across four consecutive
      # prerelease runs: on a miss (3 of 4) it cost 100s / 66s / 43s in the
      # "Post Setup Node.js" save with no install speedup, and on the one hit it
      # traded a 32s restore for a 36s faster install — a wash. Worse, it
      # competes for the repository's 10 GB Actions cache budget against the
      # per-lane tools-pack caches, which are worth ~11 min of build time each.
      # This is now the only release build job without it, which is exactly the
      # shape every other build job (mac arm64, mac Intel, linux) already had.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compute Windows tools-pack cache key
        id: win_tools_pack_cache_key
        shell: pwsh
        env:
          WIN_TOOLS_PACK_ORIGIN_KEY: ${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/daemon/**', 'apps/web/**', 'apps/desktop/**', 'apps/packaged/**', 'packages/agui-adapter/**', 'packages/contracts/**', 'packages/plugin-runtime/**', 'packages/sidecar-proto/**', 'packages/sidecar/**', 'packages/platform/**', 'tools/pack/bin/**', 'tools/pack/package.json', 'tools/pack/resources/**', 'tools/pack/src/**', 'tools/pack/tsconfig.json', 'assets/community-pets/**', 'assets/frames/**', 'craft/**', 'design-systems/**', 'design-templates/**', 'plugins/_official/**', 'plugins/registry/**', 'prompt-templates/**', 'skills/**', '.github/workflows/release-prerelease.yml', '.github/scripts/release/cache/win.ps1') }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_TOOLS_PACK_ORIGIN_KEY)) {
            throw "Windows tools-pack cache origin key is empty"
          }
          $prefix = "tools-pack-win-v1-prerelease-$env:RUNNER_OS-"
          "origin=$env:WIN_TOOLS_PACK_ORIGIN_KEY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prefix=$prefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "key=$prefix$env:WIN_TOOLS_PACK_ORIGIN_KEY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Restore Windows tools-pack cache
        id: win_tools_pack_cache_restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tools-pack-cache
          key: ${{ steps.win_tools_pack_cache_key.outputs.key }}
          restore-keys: |
            ${{ steps.win_tools_pack_cache_key.outputs.prefix }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup NSIS
        shell: pwsh
        run: |
          # windows-latest no longer guarantees a preinstalled NSIS, and the
          # Chocolatey community feed flakes: prerelease.4 hit a silent
          # "Unable to find package 'nsis'" fetch failure that left this step
          # green (pwsh -command does not propagate choco's exit code) and let
          # the build die on makensis half an hour later. Retry the install
          # and hard-fail HERE, with a clear message, if makensis still cannot
          # be found — a red Setup NSIS step is diagnosable; a mid-build
          # makensis error is not.
          function Test-Makensis {
            [bool]((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe"))
          }
          if (Test-Makensis) { Write-Host "makensis already present"; exit 0 }
          foreach ($attempt in 1..4) {
            Write-Host "choco install nsis (attempt $attempt)"
            choco install nsis -y --no-progress
            if (Test-Makensis) { break }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Test-Makensis)) {
            Write-Error "NSIS install failed after 4 attempts: makensis absent from PATH and C:\Program Files (x86)\NSIS"
            exit 1
          }
          Write-Host "NSIS ready"
      - name: Build prerelease windows artifacts
        id: win_tools_pack_build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolsPackDir = "${{ runner.temp }}/tools-pack"
          $cacheDir = "${{ runner.temp }}/tools-pack-cache"
          $buildJsonPath = Join-Path $env:RUNNER_TEMP "release-build\win_x64\build.json"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $buildJsonPath) | Out-Null
          pnpm.cmd exec tools-pack win cleanup --dir $toolsPackDir --namespace release-prerelease-win --json
          $buildArgs = @(
            "exec", "tools-pack", "win", "build",
            "--dir", $toolsPackDir,
            "--cache-dir", $cacheDir,
            "--namespace", "release-prerelease-win",
            "--portable",
            "--app-version", "${{ needs.metadata.outputs.release_version }}",
            "--to", "all",
            "--json"
          )
          "cache_failed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          try {
            $buildOutput = pnpm @buildArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Windows tools-pack cached build exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Warning "Windows tools-pack cached build failed; removing restored cache and retrying without cache."
            "cache_failed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $cacheDir
            pnpm.cmd exec tools-pack win cleanup --dir $toolsPackDir --namespace release-prerelease-win --json
            $buildOutput = pnpm exec tools-pack win build `
              --dir $toolsPackDir `
              --cache-dir $cacheDir `
              --namespace release-prerelease-win `
              --portable `
              --app-version "${{ needs.metadata.outputs.release_version }}" `
              --to all `
              --json
            if ($LASTEXITCODE -ne 0) {
              throw "Windows tools-pack uncached fallback build exited with code $LASTEXITCODE"
            }
          }
          $buildOutput | Set-Content -Path $buildJsonPath
          $build = $buildOutput | ConvertFrom-Json
          pnpm.cmd exec tools-pack win validate-payload --namespace release-prerelease-win --payload-path $build.payloadPath --expected-version "${{ needs.metadata.outputs.release_version }}" --json
          $buildOutput
      - name: Delete failed Windows tools-pack cache
        if: ${{ steps.win_tools_pack_build.outputs.cache_failed == 'true' && steps.win_tools_pack_cache_restore.outputs.cache-matched-key != '' }}
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $matchedKey = "${{ steps.win_tools_pack_cache_restore.outputs.cache-matched-key }}"
          $caches = @(gh cache list --key $matchedKey --limit 100 --json id,key,ref | ConvertFrom-Json | Where-Object { $_.key -eq $matchedKey })
          foreach ($cache in $caches) {
            gh cache delete $cache.id
          }
          "deletedFailedCacheKey=$matchedKey count=$($caches.Count)"
      - name: Write win_x64 release report
        if: ${{ always() }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-win
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.md
          # See the mac lanes: packaged smoke moved out of this job.
          RELEASE_SMOKE_MODE: skip
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: win_x64 prerelease build
        run: pnpm exec tools-release write-report

      - name: Publish win_x64 report summary
        if: ${{ always() }}
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Prune Windows tools-pack cache
        shell: pwsh
        continue-on-error: true
        run: ./.github/scripts/release/cache/win.ps1
      - name: Save Windows tools-pack cache
        if: ${{ success() && (steps.win_tools_pack_cache_restore.outputs.cache-hit != 'true' || steps.win_tools_pack_build.outputs.cache_failed == 'true') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tools-pack-cache
          key: ${{ steps.win_tools_pack_cache_key.outputs.key }}
      - name: Retain recent Windows tools-pack caches
        if: ${{ success() }}
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = "${{ steps.win_tools_pack_cache_key.outputs.prefix }}"
          $keep = 1
          $caches = @(gh cache list --key $prefix --sort created_at --order desc --limit 100 --json id,key,createdAt | ConvertFrom-Json)
          $stale = @($caches | Select-Object -Skip $keep)
          foreach ($cache in $stale) {
            gh cache delete $cache.id
          }
          "actionsCachePrefix=$prefix kept=$([Math]::Min($caches.Count, $keep)) deleted=$($stale.Count)"
      - name: Prepare windows prerelease assets
        shell: pwsh
        run: |
          tools\release\scripts\prepare-platform-assets.ps1 `
            -ReleaseTarget win_x64 `
            -ReleaseAssetsDir "${{ runner.temp }}\release-assets\win_x64" `
            -BuildJsonPath "${{ runner.temp }}\release-build\win_x64\build.json" `
            -ReleaseNamespace release-prerelease-win `
            -ReleaseVersion "${{ needs.metadata.outputs.release_version }}" `
            -ReleaseAssetSuffix "" `
            -ReleaseChannel prerelease `
            -ReleasePublicOrigin "${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}" `
            -ReleaseNotes "Open Design Prerelease ${{ needs.metadata.outputs.release_version }}" `
            -IncludeZip $true
      - name: Publish windows prerelease platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          RELEASE_SIGNED: "false"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_INCLUDE_ZIP: "true"
        run: pnpm exec tools-release publish-platform
      - name: Upload windows prerelease publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-win-x64-publish-manifest
          path: ${{ runner.temp }}\release-platform-manifests\win_x64.json
          if-no-files-found: error
          retention-days: 1
      # The Windows update fixture and the packaged Windows smoke both moved
      # to release-prerelease-smoke.yml, which rebuilds the fixture there when
      # `full` coverage is requested and installs the setup.exe re-downloaded
      # from R2 — see build_mac.
  build_linux:
    name: Build prerelease linux x64
    # Tests never gate delivery on this channel — see build_mac.
    needs: metadata
    if: ${{ vars.ENABLE_STABLE_LINUX == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      smoke_result: ${{ steps.linux_smoke.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # Shallow — see the metadata job's checkout for why.
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prerelease linux artifacts
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/release-report/linux_x64"
          mkdir -p "$report_dir"
          : > "$report_dir/tools-pack.log"
          build_args=(
            exec tools-pack linux build
            --dir "$RUNNER_TEMP/tools-pack"
            --namespace release-prerelease-linux
            --portable
            --app-version "${{ needs.metadata.outputs.release_version }}"
            --to appimage
            --containerized
            --json
          )
          if build_output="$(pnpm "${build_args[@]}" 2> >(tee -a "$report_dir/tools-pack.log" >&2))"; then
            printf '%s\n' "$build_output" | tee "$report_dir/tools-pack.json"
            node -e 'const fs = require("node:fs"); JSON.parse(fs.readFileSync(process.argv[1], "utf8"));' "$report_dir/tools-pack.json"
          else
            build_status=$?
            printf '%s\n' "$build_output" | tee "$report_dir/tools-pack.json"
            exit "$build_status"
          fi
      - name: Smoke prerelease linux AppImage runtime
        id: linux_smoke
        continue-on-error: true
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_LINUX_APPIMAGE: "1"
          OD_PACKAGED_E2E_NAMESPACE: release-prerelease-linux
          OD_PACKAGED_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/release-report/linux_x64/screenshots/open-design-linux-smoke.png
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/release-report/linux_x64"
          mkdir -p "$report_dir/screenshots"
          cat > "$report_dir/manifest.json" <<EOF
          {
            "channel": "prerelease",
            "platform": "linux",
            "releaseVersion": "${{ needs.metadata.outputs.release_version }}",
            "spec": "specs/linux.spec.ts",
            "namespace": "release-prerelease-linux",
            "screenshot": "screenshots/open-design-linux-smoke.png",
            "githubRunId": "$GITHUB_RUN_ID",
            "githubRunAttempt": "$GITHUB_RUN_ATTEMPT",
            "commit": "${{ needs.metadata.outputs.commit }}"
          }
          EOF
          sudo apt-get update 2>&1 | tee "$report_dir/apt-get-update.log"
          sudo apt-get install -y xvfb 2>&1 | tee "$report_dir/apt-get-install-xvfb.log"
          xvfb-run -a pnpm test specs/linux.spec.ts 2>&1 | tee "$report_dir/vitest.log"
      - name: Upload linux e2e spec report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-linux-e2e-report
          path: ${{ runner.temp }}/release-report/linux_x64
          if-no-files-found: warn
      - name: Prepare linux prerelease assets
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/linux_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_NAMESPACE: release-prerelease-linux
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: linux_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: bash tools/release/scripts/prepare-platform-assets.sh
      - name: Publish linux prerelease platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/linux_x64
          RELEASE_CHANNEL: prerelease
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-platform-outputs/linux_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_SIGNED: "false"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: linux_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: pnpm exec tools-release publish-platform
      - name: Upload linux prerelease publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-prerelease-linux-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/linux_x64.json
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish prerelease release
    # No test suite appears in `needs` or `if`, and none may be added.
    # prerelease is the internal channel: its job is to put a package in a
    # colleague's hands so a human can test it, and machine CI is a second,
    # parallel signal about the same commit — not a valve on the first one. A
    # flaky suite used to mean nobody got a build that day, which is a worse
    # outcome than shipping an internal package alongside a red test. The
    # suites now live in release-prerelease-tests.yml and the packaged smoke in
    # release-prerelease-smoke.yml; the progressive Feishu card is what carries
    # their verdict to a human. Stable is unaffected: its promotion gate reads
    # the prerelease metadata through tools/release/src/metadata/prepare-stable.ts
    # and runs its own checks.
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
      - build_linux
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.metadata.result == 'success' &&
        needs.build_mac.result == 'success' &&
        (needs.build_mac_intel.result == 'success' || needs.build_mac_intel.result == 'skipped') &&
        needs.build_win.result == 'success' &&
        (needs.build_linux.result == 'success' || needs.build_linux.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    outputs:
      version_metadata_url: ${{ steps.outputs.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.outputs.outputs.mac_arm64_dmg_url }}
      mac_intel_url: ${{ steps.outputs.outputs.mac_x64_dmg_url }}
      win_url: ${{ steps.outputs.outputs.win_x64_installer_url }}
      linux_url: ${{ steps.outputs.outputs.linux_x64_appImage_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      BRANCH_NAME: ${{ needs.metadata.outputs.branch }}
      ENABLE_LINUX: ${{ needs.build_linux.result == 'success' }}
      ENABLE_MAC: "true"
      ENABLE_WIN: "true"
      GITHUB_RELEASE_ENABLED: "false"
      RELEASE_CHANNEL: prerelease
      RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
      RELEASE_SIGNED: ${{ inputs.mac_sign_mode != 'no' && 'true' || 'false' }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      REPORT_MODE: zip
      STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # Shallow — see the metadata job's checkout for why.
          fetch-depth: 1
      # The artifact downloads below run on the runner's own Node, and the pnpm
      # toolchain this job actually uses is set up further down, right before
      # `pnpm install`. The Setup Node.js that used to sit here was a second,
      # redundant copy of that one — it paid for its own post-job step and
      # bought nothing.
      - name: Download mac prerelease publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-mac-arm64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Download mac intel prerelease publish manifest
        if: ${{ needs.build_mac_intel.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Download windows prerelease publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests
      - name: Download linux prerelease publish manifest
        if: ${{ needs.build_linux.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-prerelease-linux-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and publish prerelease release notes
        env:
          RELEASE_CHANNEL: prerelease
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-metadata/release-note-plan.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          pnpm exec tools-release prepare-release-note
          pnpm exec tools-release publish-release-note
          pnpm exec tools-release verify-release-note

      - name: Publish prerelease metadata
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          ENABLE_LINUX_X64: ${{ needs.build_linux.result == 'success' }}
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: ${{ needs.build_mac_intel.result == 'success' }}
          ENABLE_WIN_X64: "true"
          LINUX_X64_RESULT: ${{ needs.build_linux.result }}
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_CHANNEL: prerelease
          RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-metadata/outputs.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_SIGNED: ${{ inputs.mac_sign_mode != 'no' && 'true' || 'false' }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release publish-metadata
      - name: Read metadata outputs
        id: outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-metadata/outputs.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Verify prerelease metadata
        env:
          ENABLE_LINUX_X64: ${{ needs.build_linux.result == 'success' }}
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: ${{ needs.build_mac_intel.result == 'success' }}
          ENABLE_WIN_X64: "true"
          LINUX_X64_RESULT: ${{ needs.build_linux.result }}
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_CHANNEL: prerelease
          RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release verify-metadata
      - name: Write prerelease metadata summary
        env:
          RELEASE_CHANNEL: prerelease
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/release-metadata/summary.md
        run: pnpm exec tools-release summary-metadata
      - name: Publish summary
        run: cat "${{ runner.temp }}/release-metadata/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
  dispatch_smoke:
    name: Dispatch packaged smoke
    # Packaged smoke needs a package, so unlike dispatch_validation this one
    # waits for `publish` — but it only waits long enough to POST the dispatch.
    # The smoke itself downloads the artifacts back out of R2 in
    # release-prerelease-smoke.yml, which is both closer to what a user installs
    # and completely off this workflow's concurrency group.
    needs:
      - metadata
      - publish
    # `always() && !cancelled()` is load-bearing, not decoration.
    #
    # `build_linux` is skipped on every run (the repository has no
    # ENABLE_STABLE_LINUX variable), and GitHub applies a skip "to all jobs in
    # the dependency chain from the point of failure or skip onwards" unless a
    # job uses a conditional expression that causes it to continue. That break
    # is per job and is NOT inherited: `publish` carries the same prefix and so
    # runs, but its own dependents are still downstream of build_linux's skip.
    # Without a break of its own this job never evaluates the conditions below
    # at all — GitHub's implicit `success()` skips it first.
    #
    # That is how release-prerelease-smoke.yml went 0-for-N. In run
    # 34149795952 publish succeeded, version_metadata_url was published, and
    # enable_smoke arrived as true; the job was still skipped with zero steps.
    # The explicit publish gate below is what actually decides whether smoke is
    # dispatched, and it is unchanged.
    if: >-
      ${{
        always() && !cancelled() &&
        inputs.enable_smoke &&
        needs.publish.result == 'success' &&
        needs.publish.outputs.version_metadata_url != ''
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRIMARY_REF: ${{ needs.metadata.outputs.branch }}
      FALLBACK_REF: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - name: Checkout dispatch helper
        uses: actions/checkout@v6.0.2
        with:
          # Deliberately the ref this workflow was loaded from, NOT the built
          # commit. The helper is infrastructure that ships with this file, so
          # the two are always in step; pinning it to the built commit would
          # break the moment a release branch carried an older .github tree.
          fetch-depth: 1
      - name: Dispatch packaged smoke
        env:
          COMMIT: ${{ needs.metadata.outputs.commit }}
          VERSION: ${{ needs.metadata.outputs.release_version }}
          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
          WIN_X64_SMOKE_MODE: ${{ inputs.win_x64_smoke_mode }}
          WIN_X64_UPDATE_METADATA_URL: ${{ inputs.win_x64_update_metadata_url }}
          WIN_X64_UPDATE_TARGET_VERSION: ${{ inputs.win_x64_update_target_version }}
        run: |
          bash .github/scripts/release/dispatch-validation.sh release-prerelease-smoke.yml \
            -f "commit=$COMMIT" \
            -f "version=$VERSION" \
            -f "origin_run_id=$GITHUB_RUN_ID" \
            -f "version_metadata_url=$VERSION_METADATA_URL" \
            -f "win_x64_smoke_mode=$WIN_X64_SMOKE_MODE" \
            -f "win_x64_update_metadata_url=$WIN_X64_UPDATE_METADATA_URL" \
            -f "win_x64_update_target_version=$WIN_X64_UPDATE_TARGET_VERSION"
  cleanup_partial_release_assets:
    name: Cleanup unpublished prerelease asset artifacts
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
      - build_linux
      - publish
    if: ${{ always() && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit || inputs.ref || github.ref }}

      - name: Delete unpublished prerelease asset artifacts
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: intermediate prerelease asset Actions artifacts from this unpublished run. Canonical manual downloads are only the R2 links in a successful publish summary
          ARTIFACT_NAME_REGEX: "-release-assets$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
