name: distribution-beta

on:
  workflow_call:
    inputs:
      enable_mac_arm64:
        required: false
        type: boolean
        default: true
      enable_win_x64:
        required: false
        type: boolean
        default: true
      enable_mac_x64:
        required: false
        type: boolean
        default: true
      publish:
        required: false
        type: boolean
        default: true
      promote:
        description: "Promote this build to beta/latest after publishing versioned platform artifacts."
        required: false
        type: boolean
        default: true
      release_origin:
        required: false
        type: string
        default: cloudflare-r2
      release_public_origin:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
      amr_profile:
        required: false
        type: string
        default: ""
      mac_arm64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_arm64_smoke_mode:
        required: false
        type: string
        default: core
      mac_arm64_target:
        required: false
        type: string
        default: dmg
      mac_arm64_update_metadata_url:
        required: false
        type: string
        default: ""
      mac_arm64_update_target_version:
        required: false
        type: string
        default: ""
      mac_x64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_x64_smoke_mode:
        required: false
        type: string
        default: core
      mac_x64_target:
        required: false
        type: string
        default: all
      win_x64_sign_mode:
        required: false
        type: string
        default: "unsigned"
      win_x64_smoke_mode:
        required: false
        type: string
        default: core
      win_x64_target:
        required: false
        type: string
        default: all
      win_x64_update_metadata_url:
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        required: false
        type: string
        default: ""
    outputs:
      beta_version:
        description: "The beta version that was built."
        value: ${{ jobs.metadata.outputs.beta_version }}
      shell_version:
        description: "The Electron Shell compatibility version that was built or reused."
        value: ${{ jobs.metadata.outputs.shell_version }}
      closure_version:
        description: "The Standalone Closure version that was built or reused."
        value: ${{ jobs.metadata.outputs.closure_version }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.metadata.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.metadata.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published beta."
        value: ${{ jobs.metadata.outputs.previous_commit }}
      release_state:
        description: "complete | partial | failed."
        value: ${{ jobs.publish.outputs.release_state || (jobs.metadata.outputs.promote == 'false' && 'partial') }}
      version_metadata_url:
        description: "Public URL of this build's version metadata.json."
        value: ${{ jobs.publish.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_arm64_url || jobs.build_mac_arm64.outputs.mac_arm64_url }}
      win_x64_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.publish.outputs.win_x64_url || jobs.build_win_x64.outputs.win_x64_url }}
      mac_arm64_smoke_result:
        description: "macOS arm64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.build_mac_arm64.outputs.smoke_result }}
      win_x64_smoke_result:
        description: "Windows x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.build_win_x64.outputs.smoke_result }}
      mac_x64_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_x64_url }}

permissions:
  actions: write
  contents: read


env:
  OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr_profile }}
  RELEASE_MAC_ARM64_SIGN_MODE: ${{ inputs.mac_arm64_sign_mode }}
  RELEASE_MAC_X64_SIGN_MODE: ${{ inputs.mac_x64_sign_mode }}
  RELEASE_WIN_X64_SIGN_MODE: ${{ inputs.win_x64_sign_mode }}
  # Release runners repeatedly install the same workspace before metadata and
  # platform work. Reuse the repository's dependency-aware postinstall scheduler
  # at a deliberately conservative, cross-platform fixed width; this keeps the
  # release hot path simple while avoiding the serial workspace rebuild default.
  OPEN_DESIGN_POSTINSTALL_CONCURRENCY: 2
  # The 0.19 epoch deliberately drops the historical combined package. A beta
  # Closure requires the first canonical Shell proven across an independent
  # release binding. Earlier 0.19 beta Shells were never published and do not
  # satisfy the final releaseVersion/Shell-version projection contract.
  CLOSURE_MIN_SHELL_VERSION: 0.19.0-beta.4
  LEGACY_MAC_ARM64_DIGEST: sha256:6d9c2fea2106fc0207acd4ee78bc8d08f9563f967121dbffd399b8d510d0c37f
  LEGACY_MAC_ARM64_VERSION: 0.16.2-beta.155
  LEGACY_WIN_X64_DIGEST: sha256:a0c2ef5d8b0da1ef7f93d375211fff396aa73d90b2cc3c591c27268fe6966330
  LEGACY_WIN_X64_VERSION: 0.16.2-beta.155
  OPEN_DESIGN_TELEMETRY_RELAY_URL: ${{ vars.OPEN_DESIGN_TELEMETRY_RELAY_URL }}
  # `publish` governs distribution metadata only. Build inputs must remain
  # identical between publish=false QA and the final publish=true lane so the
  # verified immutable Shell bytes can be reused without a signing/notary pass.
  POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
  POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
  # Vela web console origin for the AMR profile this build targets. Held in a
  # per-profile repository secret instead of the source tree: the non-prod AMR
  # environments are internal deployments and this repository is public, so
  # neither the workflow nor the product code may name their hostnames.
  #
  # tools-pack bakes it into open-design-config.json and the packaged runtime
  # forwards it to the daemon as OD_VELA_WEB_URL, which is the second half of the
  # workspace-team gate (the first being the AMR profile allowlist). A profile
  # whose secret is not configured therefore ships with workspace-team dormant
  # rather than pointed at an unknown backend. `prod` never gets an origin — the
  # packaged gate rejects it regardless.
  #
  # Secrets read here: VELA_WEB_URL_FEATURE_TEST, VELA_WEB_URL_TEST.
  OD_VELA_WEB_URL: ${{ inputs.amr_profile == 'feature-test' && secrets.VELA_WEB_URL_FEATURE_TEST || inputs.amr_profile == 'test' && secrets.VELA_WEB_URL_TEST || '' }}
  RELEASE_BRANCH: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  RELEASE_WORKFLOW: ${{ github.workflow }}

jobs:
  metadata:
    name: Prepare beta metadata and shared Closure
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest
    env:
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      OPEN_DESIGN_BETA_METADATA_URL: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/beta/latest/metadata.json
      OPEN_DESIGN_STABLE_METADATA_URL: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/stable/latest/metadata.json
    outputs:
      base_version: ${{ steps.beta.outputs.base_version }}
      beta_version: ${{ steps.reservation.outputs.release_version || steps.beta.outputs.beta_version }}
      shell_version: ${{ steps.reservation.outputs.release_version || steps.beta.outputs.beta_version }}
      closure_version: ${{ steps.reservation.outputs.release_version || steps.beta.outputs.beta_version }}
      branch: ${{ steps.identity.outputs.branch }}
      commit: ${{ steps.identity.outputs.commit }}
      previous_commit: ${{ steps.prev.outputs.previous_commit }}
      promote: ${{ inputs.promote }}
      release_name: ${{ steps.beta.outputs.release_name }}
      state_source: ${{ steps.reservation.outputs.state_source || steps.beta.outputs.state_source }}
      version_lock_key: ${{ steps.reservation.outputs.version_lock_key }}
    steps:
      - name: Validate checkout ref shape
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            echo "release-beta ref must be a branch, tag, or full 40-character commit SHA; abbreviated SHA '$REQUESTED_REF' is ambiguous" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve built identity
        id: identity
        env:
          BUILD_REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          echo "BUILT_SHA=$built_sha" >> "$GITHUB_ENV"
          {
            echo "branch=$BUILD_REF"
            echo "commit=$built_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate exact beta publisher ref
        if: ${{ inputs.publish }}
        env:
          REQUESTED_REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          if [ -z "$REQUESTED_REF" ]; then
            echo "release-beta publish requires an explicit branch, tag, or full commit identity" >&2
            exit 1
          fi
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            expected_sha="${REQUESTED_REF,,}"
          else
            remote_refs="$(git ls-remote origin "refs/heads/$REQUESTED_REF" "refs/tags/$REQUESTED_REF^{}" "refs/tags/$REQUESTED_REF")"
            expected_sha="$(printf '%s\n' "$remote_refs" | awk '
              $2 ~ /\^\{\}$/ { print $1; found = 1; exit }
              first == "" { first = $1 }
              END { if (!found) print first }
            ')"
          fi
          if [ -z "$expected_sha" ]; then
            echo "Could not resolve exact beta publisher ref '$REQUESTED_REF'" >&2
            exit 1
          fi
          if [ "$built_sha" != "$expected_sha" ]; then
            echo "release-beta publisher ref drifted: expected $expected_sha, built $built_sha" >&2
            exit 1
          fi

      - name: Capture previous beta commit
        id: prev
        run: |
          set -euo pipefail
          prev="$(curl -fsSL "$OPEN_DESIGN_BETA_METADATA_URL" | jq -r '.github.commit // ""' 2>/dev/null || true)"
          echo "previous beta commit: ${prev:-<none>}"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"

      - name: Validate beta inputs
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_origin }}" ] && [ "${{ inputs.release_origin }}" != "cloudflare-r2" ]; then
            echo "release-beta supports release_origin=cloudflare-r2 only" >&2
            exit 1
          fi
          if [ "${{ inputs.enable_mac_arm64 }}" != "true" ] && [ "${{ inputs.enable_win_x64 }}" != "true" ] && [ "${{ inputs.enable_mac_x64 }}" != "true" ]; then
            echo "release-beta requires at least one target to be enabled" >&2
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.enable_win_x64 }}" = "true" ] && [ "${{ inputs.win_x64_target }}" != "nsis" ] && [ "${{ inputs.win_x64_target }}" != "all" ]; then
            echo "release-beta publish requires win_x64_target=nsis or all so the installer and updater feed are produced" >&2
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.enable_mac_arm64 }}" = "true" ] && [ "${{ inputs.mac_arm64_sign_mode }}" != "notarized" ]; then
            echo "release-beta publish requires mac_arm64_sign_mode=notarized" >&2
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.enable_mac_x64 }}" = "true" ] && [ "${{ inputs.mac_x64_sign_mode }}" != "notarized" ]; then
            echo "release-beta publish requires mac_x64_sign_mode=notarized" >&2
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.promote }}" = "true" ] && { [ "${{ inputs.enable_mac_arm64 }}" != "true" ] || [ "${{ inputs.enable_mac_x64 }}" != "true" ] || [ "${{ inputs.enable_win_x64 }}" != "true" ]; }; then
            echo "release-beta promotion requires mac_arm64, mac_x64, and win_x64" >&2
            exit 1
          fi

      - name: Validate R2 release access
        if: ${{ inputs.publish }}
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          R2_ACCESS_PROBE_NAME: release-beta
          RELEASE_CHANNEL: beta
          RELEASE_PUBLIC_ORIGIN: ${{ env.RELEASE_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release check-storage

      - name: Prepare beta release metadata
        id: beta
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          GITHUB_REF_NAME: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: pnpm exec tools-release prepare beta

      - name: Reserve immutable beta version
        id: reservation
        if: ${{ inputs.publish }}
        env:
          BASE_VERSION: ${{ steps.beta.outputs.base_version }}
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          RELEASE_CHANNEL: beta
          RELEASE_LANE: beta
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_COMMIT: ${{ env.BUILT_SHA }}
          RELEASE_PUBLIC_ORIGIN: ${{ env.RELEASE_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION_CANDIDATE: ${{ steps.beta.outputs.beta_version }}
          RELEASE_VERSION_MANUAL_OVERRIDE: "false"
        run: pnpm exec tools-release reserve-version beta

      - name: Build shared Standalone Closure
        uses: ./.github/actions/release/closure/shared
        env:
          RELEASE_COMMIT: ${{ env.BUILT_SHA }}
          RELEASE_PUBLIC_ORIGIN: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION_LOCK_KEY: ${{ steps.reservation.outputs.version_lock_key }}
          RELEASE_VERSION_LOCK_REQUIRED: ${{ inputs.publish && 'true' || 'false' }}
        with:
          channel: beta
          min-shell-version: ${{ env.CLOSURE_MIN_SHELL_VERSION }}
          publish-enabled: ${{ inputs.publish }}
          release-version: ${{ steps.reservation.outputs.release_version || steps.beta.outputs.beta_version }}

  build_mac_arm64:
    name: Build beta mac_arm64
    needs:
      - metadata
    if: ${{ inputs.enable_mac_arm64 }}
    runs-on: macos-14
    outputs:
      mac_arm64_url: ${{ steps.platform.outputs.dmg_url }}
      smoke_result: ${{ steps.platform.outputs.smoke_result }}
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLOUDFLARE_R2_RELEASES_AK: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      CLOUDFLARE_R2_RELEASES_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      CLOUDFLARE_R2_RELEASES_SK: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      CLOUDFLARE_R2_RELEASES_URL: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Distribute beta mac_arm64
        id: platform
        uses: ./.github/actions/release/platform/mac/beta
        with:
          amr-profile: ${{ inputs.amr_profile }}
          arch: arm64
          artifact-id: mac-arm64
          build-target: ${{ inputs.mac_arm64_target }}
          closure-version: ${{ needs.metadata.outputs.closure_version }}
          dogfood-enabled: "true"
          legacy-migration-enabled: "true"
          namespace: release-beta
          platform: darwin-arm64
          publish: ${{ inputs.publish }}
          release-public-origin: ${{ inputs.release_public_origin }}
          release-version: ${{ needs.metadata.outputs.beta_version }}
          shell-smoke-matrix: mac-shell-v3
          shell-version: ${{ needs.metadata.outputs.shell_version }}
          sign-mode: ${{ inputs.mac_arm64_sign_mode }}
          smoke-mode: ${{ inputs.mac_arm64_smoke_mode }}
          target: mac_arm64
          update-metadata-url: ${{ inputs.mac_arm64_update_metadata_url }}
          update-target-version: ${{ inputs.mac_arm64_update_target_version }}

  build_mac_x64:
    name: Build beta mac_x64
    needs:
      - metadata
    if: ${{ inputs.enable_mac_x64 }}
    runs-on: macos-15-intel
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLOUDFLARE_R2_RELEASES_AK: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      CLOUDFLARE_R2_RELEASES_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      CLOUDFLARE_R2_RELEASES_SK: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      CLOUDFLARE_R2_RELEASES_URL: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Distribute beta mac_x64
        id: platform
        uses: ./.github/actions/release/platform/mac/beta
        with:
          amr-profile: ${{ inputs.amr_profile }}
          arch: x64
          artifact-id: mac-x64
          build-target: ${{ inputs.mac_x64_target }}
          closure-version: ${{ needs.metadata.outputs.closure_version }}
          namespace: release-beta-x64
          platform: darwin-x64
          publish: ${{ inputs.publish }}
          release-public-origin: ${{ inputs.release_public_origin }}
          release-version: ${{ needs.metadata.outputs.beta_version }}
          shell-smoke-matrix: mac-shell-v2
          shell-version: ${{ needs.metadata.outputs.shell_version }}
          sign-mode: ${{ inputs.mac_x64_sign_mode }}
          smoke-lanes-on-miss: shell,standalone
          smoke-mode: ${{ inputs.mac_x64_smoke_mode }}
          target: mac_x64

  build_win_x64:
    name: Build beta win_x64
    needs:
      - metadata
    if: ${{ inputs.enable_win_x64 }}
    runs-on: windows-latest
    outputs:
      smoke_result: ${{ steps.platform.outputs.smoke_result }}
      win_x64_url: ${{ steps.platform.outputs.win_x64_url }}
    env:
      CLOUDFLARE_R2_RELEASES_AK: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      CLOUDFLARE_R2_RELEASES_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      CLOUDFLARE_R2_RELEASES_SK: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      CLOUDFLARE_R2_RELEASES_URL: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      OD_UPDATE_METADATA_URL: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/beta/latest/metadata.json
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Distribute beta win_x64
        id: platform
        uses: ./.github/actions/release/platform/win/beta
        with:
          metadata_beta_version: ${{ needs.metadata.outputs.beta_version }}
          metadata_closure_version: ${{ needs.metadata.outputs.closure_version }}
          metadata_shell_version: ${{ needs.metadata.outputs.shell_version }}
          workflow_amr_profile: ${{ inputs.amr_profile }}
          workflow_publish: ${{ inputs.publish }}
          workflow_release_public_origin: ${{ inputs.release_public_origin }}
          workflow_win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
          workflow_win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
          workflow_win_x64_target: ${{ inputs.win_x64_target }}
          workflow_win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
          workflow_win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}

  publish:
    name: Stage beta metadata
    needs:
      - metadata
      - build_mac_arm64
      - build_mac_x64
      - build_win_x64
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.publish &&
        inputs.promote &&
        needs.metadata.result == 'success' &&
        (inputs.enable_mac_arm64 || inputs.enable_win_x64 || inputs.enable_mac_x64) &&
        (!inputs.enable_mac_arm64 || needs.build_mac_arm64.result == 'success') &&
        (!inputs.enable_win_x64 || needs.build_win_x64.result == 'success') &&
        (!inputs.enable_mac_x64 || needs.build_mac_x64.result == 'success')
      }}
    runs-on: ubuntu-latest
    outputs:
      release_state: ${{ steps.distribute.outputs.release_state }}
      version_metadata_url: ${{ steps.distribute.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.distribute.outputs.mac_arm64_url }}
      win_x64_url: ${{ steps.distribute.outputs.win_x64_url }}
      mac_x64_url: ${{ steps.distribute.outputs.mac_x64_url }}
    env:
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Download mac_arm64 publish manifest
        if: ${{ inputs.enable_mac_arm64 && needs.build_mac_arm64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-mac-arm64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Download mac_x64 publish manifest
        if: ${{ inputs.enable_mac_x64 && needs.build_mac_x64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Download win_x64 publish manifest
        if: ${{ inputs.enable_win_x64 && needs.build_win_x64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Download shared Standalone contract
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-closure-shared
          path: ${{ runner.temp }}/release-closure/shared

      - name: Download mac_arm64 Standalone contribution
        if: ${{ inputs.enable_mac_arm64 && needs.build_mac_arm64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-closure-darwin-arm64
          path: ${{ runner.temp }}/release-closure/targets/darwin-arm64

      - name: Download mac_x64 Standalone contribution
        if: ${{ inputs.enable_mac_x64 && needs.build_mac_x64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-closure-darwin-x64
          path: ${{ runner.temp }}/release-closure/targets/darwin-x64

      - name: Download win_x64 Standalone contribution
        if: ${{ inputs.enable_win_x64 && needs.build_win_x64.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-beta-closure-win32-x64
          path: ${{ runner.temp }}/release-closure/targets/win32-x64

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge the sole version-wide Standalone graph
        run: |
          set -euo pipefail
          target_contributions=()
          if [ "${{ inputs.enable_mac_arm64 }}" = "true" ]; then
            target_contributions+=("$RUNNER_TEMP/release-closure/targets/darwin-arm64/target-contribution.json")
          fi
          if [ "${{ inputs.enable_mac_x64 }}" = "true" ]; then
            target_contributions+=("$RUNNER_TEMP/release-closure/targets/darwin-x64/target-contribution.json")
          fi
          if [ "${{ inputs.enable_win_x64 }}" = "true" ]; then
            target_contributions+=("$RUNNER_TEMP/release-closure/targets/win32-x64/target-contribution.json")
          fi
          mkdir -p "$RUNNER_TEMP/release-closure"
          pnpm exec tools-release merge-closure-distribution \
            "$RUNNER_TEMP/release-closure/shared/shared-contribution.json" \
            "${target_contributions[@]}" \
            --output "$RUNNER_TEMP/release-closure/closure-distribution.json"

      - name: Distribute staged beta metadata
        id: distribute
        uses: ./.github/actions/release/publish-metadata
        with:
          enable_mac_arm64: ${{ inputs.enable_mac_arm64 }}
          enable_mac_x64: ${{ inputs.enable_mac_x64 }}
          enable_win_x64: ${{ inputs.enable_win_x64 }}
          mac_arm64_result: ${{ needs.build_mac_arm64.result }}
          mac_x64_result: ${{ needs.build_mac_x64.result }}
          win_x64_result: ${{ needs.build_win_x64.result }}
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          RELEASE_ACTIVATE_LATEST: "false"
          RELEASE_CHANNEL: beta
          RELEASE_CLOSURE_DISTRIBUTION_MANIFEST_PATH: ${{ runner.temp }}/release-closure/closure-distribution.json
          RELEASE_CLOSURE_DISTRIBUTION_REQUIRED: "true"
          RELEASE_SHELL_REQUIRED: "true"
          RELEASE_INSTALLATION_VERSION_MIN_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_BETA }}
          RELEASE_INSTALLATION_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_INSTALLATION_VERSION_MIN_URL_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_BETA }}
          RELEASE_INSTALLATION_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_LEGACY_INSTALLATION_MIGRATION_REQUIRED: "true"
          RELEASE_LATEST_CAS_REQUIRED: "true"
          RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
          RELEASE_VERSION_LOCK_REQUIRED: ${{ inputs.publish && 'true' || 'false' }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_PUBLIC_ORIGIN: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.beta_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}

  public_acceptance:
    name: Accept public ${{ matrix.target }} beta artifacts
    needs:
      - metadata
      - publish
    if: >-
      ${{
        !cancelled() &&
        inputs.publish &&
        needs.metadata.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.publish.outputs.release_state == 'complete'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_dir: dmg
            namespace: release-beta
            os: mac
            runner: macos-14
            target: mac_arm64
          - artifact_dir: dmg
            namespace: release-beta-x64
            os: mac
            runner: macos-15-intel
            target: mac_x64
          - artifact_dir: builder
            namespace: release-beta-win
            os: win
            runner: windows-latest
            target: win_x64
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_NAMESPACE: ${{ matrix.namespace }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.beta_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-download immutable public ${{ matrix.target }} artifacts
        env:
          RELEASE_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
          RELEASE_PUBLIC_ACCEPTANCE_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          RELEASE_PUBLIC_ACCEPTANCE_DOWNLOAD_DIR: ${{ runner.temp }}/public-feedback/tools-pack/out/${{ matrix.os }}/namespaces/${{ matrix.namespace }}/${{ matrix.artifact_dir }}
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
        run: pnpm exec tools-release prepare-public-acceptance

      - name: Smoke immutable public ${{ matrix.target }} install and online Closure cold start
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          OD_PACKAGED_E2E_MAC: ${{ matrix.os == 'mac' && '1' || '' }}
          OD_PACKAGED_E2E_MAC_SMOKE_LANES: shell
          OD_PACKAGED_E2E_MAC_SMOKE_PROFILE: core
          OD_PACKAGED_E2E_NAMESPACE: ${{ matrix.namespace }}
          OD_PACKAGED_E2E_RELEASE_CHANNEL: beta
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.beta_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/public-feedback/report
          OD_PACKAGED_E2E_SHELL_SMOKE_PROOF: public-immutable-artifacts
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/public-feedback/tools-pack
          OD_PACKAGED_E2E_WIN: ${{ matrix.os == 'win' && '1' || '' }}
          OD_PACKAGED_E2E_WIN_SMOKE_LANES: shell
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: core
          OD_STANDALONE_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
          OD_UPDATE_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        run: pnpm exec tsx scripts/release-smoke.ts ${{ matrix.os }} specs/${{ matrix.os }}.spec.ts

      - name: Issue public ${{ matrix.target }} acceptance credential
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
          RELEASE_PUBLIC_ACCEPTANCE_SMOKE_SUMMARY_PATH: ${{ runner.temp }}/public-feedback/report/summary.json
          RELEASE_PUBLIC_ACCEPTANCE_SUITE_RESULT_PATH: ${{ runner.temp }}/public-feedback/report/suite-result.json
        run: pnpm exec tools-release issue-public-acceptance

      - name: Upload public ${{ matrix.target }} acceptance credential
        uses: actions/upload-artifact@v7
        with:
          name: open-design-beta-${{ matrix.target }}-public-acceptance
          path: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          if-no-files-found: error

      - name: Upload public ${{ matrix.target }} acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-beta-${{ matrix.target }}-public-acceptance-evidence
          path: |
            ${{ runner.temp }}/public-feedback/build.json
            ${{ runner.temp }}/public-feedback/plan.json
            ${{ runner.temp }}/public-feedback/report
          if-no-files-found: warn

  activate:
    name: Activate accepted beta release
    needs:
      - metadata
      - publish
      - public_acceptance
    if: >-
      ${{
        !cancelled() &&
        inputs.publish &&
        needs.metadata.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.public_acceptance.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.release_public_origin != '' && inputs.release_public_origin || vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.beta_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all public acceptance credentials
        uses: actions/download-artifact@v8
        with:
          pattern: open-design-beta-*-public-acceptance
          merge-multiple: true
          path: ${{ runner.temp }}/public-acceptance

      - name: Activate accepted immutable beta metadata with CAS
        env:
          RELEASE_ACTIVATION_WORK_DIR: ${{ runner.temp }}/release-activation
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-activation/outputs.json
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_DIR: ${{ runner.temp }}/public-acceptance
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release activate-public-release

      - name: Read back activated beta public feed
        env:
          RELEASE_LATEST_METADATA_URL: ${{ env.RELEASE_PUBLIC_ORIGIN }}/beta/latest/metadata.json
          RELEASE_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
          RELEASE_PUBLIC_FEED_REPORT_PATH: ${{ runner.temp }}/release-activation/public-feed-observation.json
        run: pnpm exec tools-release observe-public-feed

      - name: Publish activation summary
        run: |
          {
            echo "## Accepted beta activation"
            echo ""
            echo "- version: \`${{ needs.metadata.outputs.beta_version }}\`"
            echo "- commit: \`${{ needs.metadata.outputs.commit }}\`"
            echo "- mac_arm64/mac_x64/win_x64 public artifact smoke: \`success\`"
            echo "- latest CAS and public readback: \`success\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
