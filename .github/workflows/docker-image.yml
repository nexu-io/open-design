name: Docker image

# Standalone Docker packaging line (not part of core merge validation in ci.yml).
#
# - pull_request / standalone workflow_dispatch: smoke build only (push: false, amd64)
# - workflow_call from release-stable-docker: idempotent version-tag reconcile

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build when invoked as a reusable workflow."
        required: false
        type: string
        default: ""
      release_version:
        description: "Stable Docker tag to publish when invoked from release automation."
        required: false
        type: string
        default: ""
      expected_revision:
        description: "Authoritative stable source commit from versioned release metadata."
        required: false
        type: string
        default: ""
      cloud_backend:
        description: Build apps/cloud instead of the desktop daemon image
        type: boolean
        default: false
      cloud_publish:
        description: Push the cloud image to the configured registry
        type: boolean
        default: false
      cloud_environment:
        description: GitHub environment holding cloud registry configuration
        type: string
        default: cloud-staging
    outputs:
      reconciliation:
        description: "Version-tag reconciliation action: noop or published."
        value: ${{ jobs.build-and-push.outputs.reconciliation }}
      version_digest:
        description: "Verified multi-arch digest for the immutable version tag."
        value: ${{ jobs.build-and-push.outputs.version_digest }}
      cloud_digest:
        description: Built cloud backend image digest
        value: ${{ jobs.cloud-backend.outputs.digest }}
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/scripts/release/stable-docker.py"
      - ".github/workflows/docker-image.yml"
      - ".github/workflows/release-stable-docker.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    if: ${{ !inputs.cloud_backend }}
    runs-on: ubuntu-latest
    outputs:
      reconciliation: ${{ steps.verify.outputs.reconciliation }}
      version_digest: ${{ steps.verify.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted Docker control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .docker-control

      - name: Check out image source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: source

      - name: Resolve publish mode
        id: mode
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if { [ -n "${RELEASE_VERSION:-}" ] && [ -z "${EXPECTED_REVISION:-}" ]; } || \
             { [ -z "${RELEASE_VERSION:-}" ] && [ -n "${EXPECTED_REVISION:-}" ]; }; then
            echo "::error::release_version and expected_revision must be supplied together"
            exit 1
          fi
          if [ -n "${RELEASE_VERSION:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            # pull_request and standalone workflow_dispatch: smoke only
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: ${{ steps.mode.outputs.publish == 'true' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Prefer Google's public Docker Hub cache, with upstream fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        if: ${{ steps.mode.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable version tag
        id: existing
        if: ${{ steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/od:${{ inputs.release_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          inspection="$RUNNER_TEMP/stable-docker-existing.json"
          error="$RUNNER_TEMP/stable-docker-existing.err"
          if docker buildx imagetools inspect "$IMAGE" --format '{{json .}}' > "$inspection" 2> "$error"; then
            python3 .docker-control/.github/scripts/release/stable-docker.py image-state \
              --inspection "$inspection" \
              --expected-revision "$EXPECTED_REVISION" \
              --expected-version "$RELEASE_VERSION" \
              --github-output "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found|does not exist' "$error"; then
            {
              echo "state=missing"
              echo "digest="
              echo "missing_platforms=linux/amd64,linux/arm64"
            } >> "$GITHUB_OUTPUT"
          else
            cat "$error" >&2
            echo "::error::could not determine whether $IMAGE already exists"
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/od
          # spec §15.1 tag scheme:
          #   - workflow_call (stable)  → immutable :<release_version> only
          #   - PR / manual validate    → local-only sha tags (only when not publishing)
          tags: |
            type=raw,value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-sha-,format=short,enable=${{ steps.mode.outputs.publish != 'true' && github.event_name == 'pull_request' }}
            type=sha,prefix=manual-sha-,format=short,enable=${{ steps.mode.outputs.publish != 'true' && github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.expected_revision || github.sha }}
            org.opencontainers.image.version=${{ inputs.release_version || github.sha }}

      - name: Build and push
        if: ${{ steps.mode.outputs.publish != 'true' || steps.existing.outputs.state != 'complete' }}
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/deploy/Dockerfile
          platforms: ${{ steps.mode.outputs.platforms }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.revision=${{ inputs.expected_revision || github.sha }}
            index:org.opencontainers.image.version=${{ inputs.release_version || github.sha }}
          # The in-tree Dockerfile uses node:24-alpine + apk for build
          # tooling; we keep that default so the workflow doesn't drift
          # from local builds. Spec §15.1 nominates bookworm-slim as
          # the canonical base; switching is a follow-up that needs
          # the Dockerfile's apk lines re-cast for apt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public GHCR pull access
        id: verify
        if: ${{ steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXISTING_STATE: ${{ steps.existing.outputs.state }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/od:${{ inputs.release_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          inspection="$RUNNER_TEMP/stable-docker-verified.json"
          verified=false
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "$IMAGE" --format '{{json .}}' > "$inspection"; then
              verified=true
              break
            fi
            echo "public GHCR verification attempt $attempt failed; retrying"
            sleep 15
          done
          if [ "$verified" != "true" ]; then
            printf '%s\n' \
              "Published image is not anonymously pullable: $IMAGE" \
              "" \
              "Make the GHCR package public before cutting a public Docker release:" \
              "GitHub organization -> Packages -> od -> Package settings -> Change visibility -> Public." >&2
            exit 1
          fi
          python3 .docker-control/.github/scripts/release/stable-docker.py image-state \
            --inspection "$inspection" \
            --expected-revision "$EXPECTED_REVISION" \
            --expected-version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"
          if [ "${EXISTING_STATE:-}" = "complete" ]; then
            echo "reconciliation=noop" >> "$GITHUB_OUTPUT"
          else
            echo "reconciliation=published" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish reconciliation summary
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/od:${{ inputs.release_version }}
          RECONCILIATION: ${{ steps.verify.outputs.reconciliation }}
        run: |
          {
            echo "## Stable Docker version tag"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Action: \`$RECONCILIATION\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cloud-backend:
    if: ${{ inputs.cloud_backend }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.cloud_environment }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check cloud image contract
        env:
          CLOUD_PUBLISH: ${{ inputs.cloud_publish }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$SOURCE_REF" ] && [ "$SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo '::error::Cloud images must build the triggering commit'
            exit 1
          fi
          node .github/scripts/cloud/release.ts check backend
      - name: Validate registry configuration
        if: ${{ inputs.cloud_publish }}
        env:
          CLOUD_REGISTRY: ${{ vars.CLOUD_REGISTRY }}
          CLOUD_BACKEND_IMAGE: ${{ vars.CLOUD_BACKEND_IMAGE }}
          CLOUD_REGISTRY_USERNAME: ${{ secrets.CLOUD_REGISTRY_USERNAME }}
          CLOUD_REGISTRY_PASSWORD: ${{ secrets.CLOUD_REGISTRY_PASSWORD }}
        run: |
          : "${CLOUD_REGISTRY:?Set CLOUD_REGISTRY}"
          : "${CLOUD_BACKEND_IMAGE:?Set CLOUD_BACKEND_IMAGE}"
          : "${CLOUD_REGISTRY_USERNAME:?Set CLOUD_REGISTRY_USERNAME}"
          : "${CLOUD_REGISTRY_PASSWORD:?Set CLOUD_REGISTRY_PASSWORD}"
          case "$CLOUD_BACKEND_IMAGE" in
            "$CLOUD_REGISTRY"/*) ;;
            *) echo '::error::CLOUD_BACKEND_IMAGE must belong to CLOUD_REGISTRY'; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ inputs.cloud_publish }}
        with:
          registry: ${{ vars.CLOUD_REGISTRY }}
          username: ${{ secrets.CLOUD_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUD_REGISTRY_PASSWORD }}
      - name: Build cloud backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/cloud/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.cloud_publish }}
          tags: ${{ vars.CLOUD_BACKEND_IMAGE || 'open-design-cloud' }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cloud-backend
          cache-to: type=gha,mode=max,scope=cloud-backend
      - name: Record image result
        env:
          IMAGE: ${{ vars.CLOUD_BACKEND_IMAGE || 'open-design-cloud' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ inputs.cloud_publish }}
        run: |
          {
            echo "Cloud backend image: $IMAGE@$DIGEST"
            echo "Published: $PUBLISHED"
            echo 'Cluster rollout and database migrations are managed separately.'
          } >> "$GITHUB_STEP_SUMMARY"
