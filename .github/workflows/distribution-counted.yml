name: distribution-counted

on:
  workflow_call:
    inputs:
      channel:
        description: "Registered counted release channel."
        required: true
        type: string
      release_name:
        description: "Human-readable packaged release name."
        required: true
        type: string
      publish:
        description: "Publish immutable version objects. False seals an unlisted candidate only."
        required: false
        type: boolean
        default: true
      promote:
        description: "Activate the channel latest pointer after immutable publication."
        required: false
        type: boolean
        default: true
      enhanced_validation:
        description: "Run the prerelease functional, E2E, and daemon validation suite."
        required: false
        type: boolean
        default: false
      stable_qualification:
        description: "Issue stable-promotion qualification after publication."
        required: false
        type: boolean
        default: false
      smoke_advisory:
        description: "Record platform smoke failure without blocking counted publication."
        required: false
        type: boolean
        default: false
      verify_notarization:
        description: "Verify notarized macOS artifacts after packaging."
        required: false
        type: boolean
        default: false
      ref:
        description: "Optional git ref to build. Empty builds the caller's ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Base version (x.y.z). Required when ref is not release/vX.Y.Z."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "AMR profile baked into the build. Only prod can receive stable-promotion qualification."
        required: false
        type: string
        default: "test"
      mac_arm64_sign_mode:
        description: "macOS arm64 signing mode: unsigned, signed, or notarized."
        required: false
        type: string
        default: "notarized"
      mac_x64_sign_mode:
        description: "macOS x64 signing mode: unsigned, signed, or notarized."
        required: false
        type: string
        default: "notarized"
      win_x64_sign_mode:
        description: "Windows x64 signing mode: unsigned or signed."
        required: false
        type: string
        default: "unsigned"
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The counted release version that was built."
        value: ${{ jobs.metadata.outputs.release_version }}
      candidate_id:
        description: "Immutable candidate build-spec digest."
        value: ${{ jobs.metadata.outputs.candidate_id }}
      candidate_manifest_url:
        description: "Public unlisted candidate manifest URL when publish is false."
        value: ${{ jobs.candidate.outputs.manifest_url }}
      channel:
        description: "The counted release channel."
        value: ${{ jobs.metadata.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.metadata.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.metadata.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published counted release; empty on cold start."
        value: ${{ jobs.metadata.outputs.previous_commit }}
      mac_arm64_smoke_result:
        description: "macOS arm64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.build_mac.outputs.smoke_result }}
      mac_x64_smoke_result:
        description: "macOS x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.build_mac_intel.outputs.smoke_result }}
      win_x64_smoke_result:
        description: "Windows x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.build_win.outputs.smoke_result }}
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json."
        value: ${{ inputs.publish && jobs.publish.outputs.version_metadata_url || '' }}
      stable_qualification_url:
        description: "Immutable stable-promotion qualification URL; empty when the capability is disabled."
        value: ${{ jobs.publish.outputs.stable_qualification_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ inputs.publish && jobs.publish.outputs.mac_arm64_url || jobs.candidate.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 dmg download URL."
        value: ${{ inputs.publish && jobs.publish.outputs.mac_intel_url || jobs.candidate.outputs.mac_x64_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ inputs.publish && jobs.publish.outputs.win_url || jobs.candidate.outputs.win_x64_url }}
permissions:
  actions: write
  contents: read
env:
  RELEASE_MAC_ARM64_SIGN_MODE: ${{ inputs.mac_arm64_sign_mode }}
  RELEASE_MAC_X64_SIGN_MODE: ${{ inputs.mac_x64_sign_mode }}
  RELEASE_WIN_X64_SIGN_MODE: ${{ inputs.win_x64_sign_mode }}
  OPEN_DESIGN_TELEMETRY_RELAY_URL: ${{ vars.OPEN_DESIGN_TELEMETRY_RELAY_URL }}
  # PostHog product-analytics ingest. Defined as repository secret + var
  # so official builds ship with analytics enabled; PR builds and forks
  # without these run the daemon in no-op analytics mode (events never
  # leave the user's machine, /api/analytics/config returns enabled=false).
  POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  # PostHog Error tracking sourcemap upload. Personal API key (phx_...) and
  # project ID let tools-pack's web-sourcemaps step ship browser sourcemaps
  # to PostHog after `next build` and before the .map files are stripped
  # from the packaged bundle. Missing in PR/fork builds → upload is skipped
  # and the helper still strips .map to keep source out of the installer.
  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
  POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
  # Workspace Team gate for packaged prerelease builds. tools-pack reads
  # OPEN_DESIGN_AMR_PROFILE and bakes OD_VELA_WEB_URL into open-design-config.json;
  # both are required for the packaged daemon to enable the workspace-team
  # transport (see shells/electron/src/workspace-team.ts).
  #
  # Every profile resolves its matching origin. Non-stable publication defaults
  # to test, including defensive handling for an older caller that passes an
  # empty string; explicit prod / feature-test inputs remain directional-debug
  # overrides.
  #
  # Origins stay in repository secrets rather than literals: the non-prod AMR
  # environments are internal deployments and this repository is public.
  # Secrets read here: VELA_WEB_URL_FEATURE_TEST, VELA_WEB_URL_TEST,
  # VELA_WEB_URL_PROD.
  OPEN_DESIGN_AMR_PROFILE: ${{ inputs.amr_profile || 'test' }}
  OD_VELA_WEB_URL: ${{ inputs.amr_profile == 'feature-test' && secrets.VELA_WEB_URL_FEATURE_TEST || (inputs.amr_profile == 'test' || inputs.amr_profile == '') && secrets.VELA_WEB_URL_TEST || inputs.amr_profile == 'prod' && secrets.VELA_WEB_URL_PROD || '' }}
jobs:
  metadata:
    name: Prepare ${{ inputs.channel }} metadata
    runs-on: ubuntu-latest
    env:
      # Frozen once per channel. This is the Closure protocol declaration, not
      # the temporary old-installer migration floor forwarded at publication.
      CLOSURE_MIN_SHELL_VERSION: ${{ vars.RELEASE_SHELL_VERSION_MIN_PRERELEASE }}
      GH_TOKEN: ${{ github.token }}
      OPEN_DESIGN_COUNTED_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/${{ inputs.channel }}/latest/metadata.json
      OPEN_DESIGN_PRERELEASE_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/${{ inputs.channel }}/latest/metadata.json
      OPEN_DESIGN_RELEASE_CHANNEL: ${{ inputs.channel }}
      OPEN_DESIGN_STABLE_VERSION: ${{ inputs.release_version }}
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
    outputs:
      base_version: ${{ steps.release.outputs.base_version }}
      branch: ${{ steps.release.outputs.branch }}
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      github_release_enabled: ${{ steps.release.outputs.github_release_enabled }}
      latest_stable: ${{ steps.release.outputs.latest_stable }}
      previous_commit: ${{ steps.prev.outputs.previous_commit }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      release_number: ${{ steps.reservation.outputs.release_number }}
      release_name: ${{ steps.reservation.outputs.release_name }}
      release_version: ${{ steps.reservation.outputs.release_version }}
      state_source: ${{ steps.reservation.outputs.state_source }}
      version_lock_key: ${{ steps.reservation.outputs.version_lock_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve built commit
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate publication mode
        if: ${{ inputs.promote && !inputs.publish }}
        run: |
          echo "promote=true requires publish=true" >&2
          exit 1

      - name: Capture previous counted release commit
        id: prev
        run: |
          set -euo pipefail
          prev="$(curl -fsSL "$OPEN_DESIGN_COUNTED_METADATA_URL" | jq -r '.github.commit // ""' 2>/dev/null || true)"
          echo "previous ${{ inputs.channel }} commit: ${prev:-<none>}"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"
      - name: Prepare counted release metadata
        id: release
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          GITHUB_REF_NAME: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: pnpm exec tools-release prepare "${{ inputs.channel }}"
      - name: Reserve immutable counted version
        id: reservation
        env:
          BASE_VERSION: ${{ steps.release.outputs.base_version }}
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_COMMIT: ${{ env.BUILT_SHA }}
          RELEASE_LANE: counted
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_VERSION_CANDIDATE: ${{ steps.release.outputs.release_version }}
          RELEASE_VERSION_MANUAL_OVERRIDE: "false"
        run: pnpm exec tools-release reserve-version "${{ inputs.channel }}"

      - name: Prepare immutable candidate identity
        id: candidate
        env:
          RELEASE_CANDIDATE_SPEC_PATH: ${{ runner.temp }}/release-candidate/spec.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RELEASE_CANDIDATE_SPEC_PATH")"
          jq -n \
            --arg amrProfile "${{ inputs.amr_profile || 'test' }}" \
            --arg channel "${{ inputs.channel }}" \
            --arg closureMinShellVersion "$CLOSURE_MIN_SHELL_VERSION" \
            --arg commit "$BUILT_SHA" \
            --arg macArm64SignMode "${{ inputs.mac_arm64_sign_mode }}" \
            --arg macX64SignMode "${{ inputs.mac_x64_sign_mode }}" \
            --arg releaseVersion "${{ steps.reservation.outputs.release_version }}" \
            --arg winX64SignMode "${{ inputs.win_x64_sign_mode }}" \
            '{amrProfile: $amrProfile, channel: $channel, closureMinShellVersion: $closureMinShellVersion, commit: $commit, macArm64SignMode: $macArm64SignMode, macX64SignMode: $macX64SignMode, releaseVersion: $releaseVersion, schemaVersion: 1, targets: ["mac_arm64", "mac_x64", "win_x64"], winX64SignMode: $winX64SignMode}' > "$RELEASE_CANDIDATE_SPEC_PATH"
          pnpm exec tools-release prepare-candidate

      - name: Upload immutable candidate spec
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.channel }}-candidate-spec
          path: ${{ runner.temp }}/release-candidate/spec.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate counted release storage access
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          R2_ACCESS_PROBE_NAME: release-${{ inputs.channel }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release check-storage

      - name: Build and publish shared Standalone Closure
        uses: ./.github/actions/release/closure/shared
        with:
          channel: ${{ inputs.channel }}
          min-shell-version: ${{ env.CLOSURE_MIN_SHELL_VERSION }}
          publish-enabled: "true"
          release-version: ${{ steps.reservation.outputs.release_version }}
        env:
          RELEASE_COMMIT: ${{ env.BUILT_SHA }}
          RELEASE_VERSION_LOCK_KEY: ${{ steps.reservation.outputs.version_lock_key }}
          RELEASE_VERSION_LOCK_REQUIRED: "true"
  functional_e2e:
    name: P0 Functional E2E
    needs: metadata
    if: ${{ inputs.enhanced_validation }}
    uses: ./.github/workflows/ui-extended-main.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      suite: p0
  e2e_vitest:
    name: E2E Vitest
    needs: metadata
    if: ${{ inputs.enhanced_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright
        run: pnpm -C e2e exec playwright install --with-deps chromium
      - name: Prebuild workspace type declarations
        run: |
          pnpm --filter @open-design/daemon build
          pnpm --filter @open-design/desktop build
          pnpm --filter @open-design/web build:sidecar
      - name: Run E2E Vitest
        run: pnpm --filter @open-design/e2e test
  daemon_unit_tests:
    name: Daemon tests (${{ matrix.shard }}/4)
    needs: metadata
    if: ${{ inputs.enhanced_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run daemon test shard
        env:
          OD_WATCHER_TEST_DEBUG: "1"
        run: pnpm --filter @open-design/daemon test --shard=${{ matrix.shard }}/4
  verify:
    name: Verify build (typecheck + tests)
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build daemon and desktop (typecheck dependencies)
        run: |
          pnpm --filter @open-design/daemon build
          pnpm --filter @open-design/shell-electron build
      - name: Typecheck workspaces
        run: pnpm -r --workspace-concurrency=4 --if-present run typecheck
      - name: Check repository layout policies
        run: pnpm guard
  build_mac:
    name: Build ${{ inputs.channel }} mac arm64
    needs: [metadata, functional_e2e, e2e_vitest, daemon_unit_tests, verify]
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.verify.result == 'success' &&
        (!inputs.enhanced_validation || (
          needs.functional_e2e.result == 'success' &&
          needs.e2e_vitest.result == 'success' &&
          needs.daemon_unit_tests.result == 'success'
        ))
      }}
    runs-on: macos-14
    outputs:
      candidate_manifest_url: ${{ steps.platform.outputs.candidate_manifest_url }}
      candidate_primary_url: ${{ steps.platform.outputs.candidate_primary_url }}
      smoke_result: ${{ steps.platform.outputs.smoke_result }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_PUBLISH_SIDE_EFFECTS: "true"
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: "true"
      RELEASE_SHELL_REQUIRED: "true"
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - name: Distribute mac_arm64
        id: platform
        uses: ./.github/actions/release/platform/mac
        with:
          app-name: ${{ format('{0}.app', inputs.release_name) }}
          artifact-id: mac-arm64
          channel: ${{ inputs.channel }}
          candidate-id: ${{ needs.metadata.outputs.candidate_id }}
          candidate-enabled: "true"
          closure-version: ${{ needs.metadata.outputs.release_version }}
          diagnostics: "true"
          diagnostics-artifact-name: open-design-${{ inputs.channel }}-mac-build-diagnostics
          inspect-framework: "true"
          namespace: release-${{ inputs.channel }}
          release-name: ${{ inputs.release_name }}
          report-artifact-name: open-design-${{ inputs.channel }}-mac-e2e-report
          release-version: ${{ needs.metadata.outputs.release_version }}
          sign-mode: ${{ inputs.mac_arm64_sign_mode }}
          smoke-advisory: ${{ inputs.smoke_advisory }}
          target: mac_arm64
          upload-report: "true"
          verify-notarization: ${{ inputs.verify_notarization }}

  build_mac_intel:
    name: Build ${{ inputs.channel }} mac intel x64
    needs: [metadata, functional_e2e, e2e_vitest, daemon_unit_tests, verify]
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.verify.result == 'success' &&
        (!inputs.enhanced_validation || (
          needs.functional_e2e.result == 'success' &&
          needs.e2e_vitest.result == 'success' &&
          needs.daemon_unit_tests.result == 'success'
        ))
      }}
    runs-on: macos-15-intel
    outputs:
      candidate_manifest_url: ${{ steps.platform.outputs.candidate_manifest_url }}
      candidate_primary_url: ${{ steps.platform.outputs.candidate_primary_url }}
      smoke_result: ${{ steps.platform.outputs.smoke_result }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_PUBLISH_SIDE_EFFECTS: "true"
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: "true"
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - name: Distribute mac_x64
        id: platform
        uses: ./.github/actions/release/platform/mac
        with:
          app-name: ${{ format('{0}.app', inputs.release_name) }}
          artifact-id: mac-x64
          channel: ${{ inputs.channel }}
          candidate-id: ${{ needs.metadata.outputs.candidate_id }}
          candidate-enabled: "true"
          closure-version: ${{ needs.metadata.outputs.release_version }}
          namespace: release-${{ inputs.channel }}-intel
          release-name: ${{ inputs.release_name }}
          release-version: ${{ needs.metadata.outputs.release_version }}
          sign-mode: ${{ inputs.mac_x64_sign_mode }}
          smoke-advisory: ${{ inputs.smoke_advisory }}
          target: mac_x64
          verify-notarization: ${{ inputs.verify_notarization }}

  build_win:
    name: Build ${{ inputs.channel }} win x64
    needs: [metadata, functional_e2e, e2e_vitest, daemon_unit_tests, verify]
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.verify.result == 'success' &&
        (!inputs.enhanced_validation || (
          needs.functional_e2e.result == 'success' &&
          needs.e2e_vitest.result == 'success' &&
          needs.daemon_unit_tests.result == 'success'
        ))
      }}
    runs-on: windows-latest
    outputs:
      candidate_manifest_url: ${{ steps.platform.outputs.candidate_manifest_url }}
      candidate_primary_url: ${{ steps.platform.outputs.candidate_primary_url }}
      smoke_result: ${{ steps.platform.outputs.smoke_result }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_PUBLISH_SIDE_EFFECTS: "true"
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: "true"
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - name: Distribute win_x64
        id: platform
        uses: ./.github/actions/release/platform/win
        with:
          channel: ${{ inputs.channel }}
          candidate-id: ${{ needs.metadata.outputs.candidate_id }}
          candidate-enabled: "true"
          closure-version: ${{ needs.metadata.outputs.release_version }}
          namespace: release-${{ inputs.channel }}-win
          release-name: ${{ inputs.release_name }}
          release-version: ${{ needs.metadata.outputs.release_version }}
          sign-mode: ${{ inputs.win_x64_sign_mode }}
          smoke-advisory: ${{ inputs.smoke_advisory }}
          smoke-mode: ${{ inputs.win_x64_smoke_mode }}
          update-metadata-url: ${{ inputs.win_x64_update_metadata_url }}
          update-target-version: ${{ inputs.win_x64_update_target_version }}

  candidate:
    name: Seal ${{ inputs.channel }} candidate
    needs: [metadata, build_mac, build_mac_intel, build_win, publish]
    if: ${{ !cancelled() && !inputs.promote && needs.metadata.result == 'success' && needs.build_mac.result == 'success' && needs.build_mac_intel.result == 'success' && needs.build_win.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      manifest_url: ${{ steps.finalize.outputs.candidate_manifest_url }}
      mac_arm64_url: ${{ needs.build_mac.outputs.candidate_primary_url }}
      mac_x64_url: ${{ needs.build_mac_intel.outputs.candidate_primary_url }}
      win_x64_url: ${{ needs.build_win.outputs.candidate_primary_url }}
    steps:
      - name: Checkout candidate finalizer
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Setup release toolchain
        uses: ./.github/actions/release/platform/setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download candidate spec
        uses: actions/download-artifact@v8
        with:
          name: open-design-${{ inputs.channel }}-candidate-spec
          path: ${{ runner.temp }}/release-candidate
      - name: Prepare candidate target URLs
        env:
          MAC_ARM64_MANIFEST: ${{ needs.build_mac.outputs.candidate_manifest_url }}
          MAC_X64_MANIFEST: ${{ needs.build_mac_intel.outputs.candidate_manifest_url }}
          WIN_X64_MANIFEST: ${{ needs.build_win.outputs.candidate_manifest_url }}
        run: jq -n '[env.MAC_ARM64_MANIFEST, env.MAC_X64_MANIFEST, env.WIN_X64_MANIFEST]' > "$RUNNER_TEMP/release-candidate/target-urls.json"
      - name: Seal candidate manifest
        id: finalize
        env:
          RELEASE_CANDIDATE_SPEC_PATH: ${{ runner.temp }}/release-candidate/spec.json
          RELEASE_CANDIDATE_TARGET_URLS_PATH: ${{ runner.temp }}/release-candidate/target-urls.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        run: pnpm exec tools-release finalize-candidate

  publish:
    name: Publish ${{ inputs.channel }} release
    needs:
      - metadata
      - functional_e2e
      - e2e_vitest
      - daemon_unit_tests
      - verify
      - build_mac
      - build_mac_intel
      - build_win
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.metadata.result == 'success' &&
        needs.verify.result == 'success' &&
        (!inputs.enhanced_validation || (
          needs.functional_e2e.result == 'success' &&
          needs.e2e_vitest.result == 'success' &&
          needs.daemon_unit_tests.result == 'success'
        )) &&
        needs.build_mac.result == 'success' &&
        needs.build_mac_intel.result == 'success' &&
        needs.build_win.result == 'success'
      }}
    runs-on: ubuntu-latest
    outputs:
      version_metadata_url: ${{ steps.distribute.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.distribute.outputs.mac_arm64_url }}
      mac_intel_url: ${{ steps.distribute.outputs.mac_x64_url }}
      win_url: ${{ steps.distribute.outputs.win_x64_url }}
      stable_qualification_url: ${{ steps.qualification_outputs.outputs.qualificationUrl }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      BRANCH_NAME: ${{ needs.metadata.outputs.branch }}
      ENABLE_MAC: "true"
      ENABLE_MAC_INTEL: "true"
      ENABLE_WIN: "true"
      GITHUB_RELEASE_ENABLED: "false"
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_ACTIVATE_LATEST: ${{ inputs.publish && inputs.promote }}
      RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      RELEASE_VERSION_LOCK_KEY: ${{ needs.metadata.outputs.version_lock_key }}
      RELEASE_VERSION_LOCK_REQUIRED: "true"
      REPORT_MODE: zip
      RELEASE_INSTALLATION_VERSION_MIN_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_PRERELEASE }}
      RELEASE_INSTALLATION_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
      RELEASE_INSTALLATION_VERSION_MIN_URL_PRERELEASE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_PRERELEASE }}
      RELEASE_INSTALLATION_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
      RELEASE_LEGACY_INSTALLATION_MIGRATION_REQUIRED: "true"
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0

      - name: Distribute counted release
        id: distribute
        uses: ./.github/actions/release/publish-counted
        with:
          channel: ${{ inputs.channel }}
          mac_arm64_result: ${{ needs.build_mac.result }}
          mac_x64_result: ${{ needs.build_mac_intel.result }}
          win_x64_result: ${{ needs.build_win.result }}

      - name: Issue stable-promotion qualification
        id: qualify
        if: ${{ inputs.publish && inputs.stable_qualification }}
        env:
          RELEASE_MAC_ARM64_SMOKE_RESULT: ${{ needs.build_mac.outputs.smoke_result }}
          RELEASE_MAC_X64_SMOKE_RESULT: ${{ needs.build_mac_intel.outputs.smoke_result }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata/metadata.json
          RELEASE_METADATA_URL: ${{ steps.distribute.outputs.version_metadata_url }}
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-qualification/outputs.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_QUALIFICATION_WORK_DIR: ${{ runner.temp }}/release-qualification
          RELEASE_WIN_X64_SMOKE_RESULT: ${{ needs.build_win.outputs.smoke_result }}
        run: pnpm exec tools-release issue-stable-qualification

      - name: Read stable qualification outputs
        id: qualification_outputs
        if: ${{ inputs.publish && inputs.stable_qualification }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-qualification/outputs.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));

  cleanup_partial_release_assets:
    name: Cleanup unpublished ${{ inputs.channel }} asset artifacts
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
      - publish
    if: ${{ always() && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit || inputs.ref || github.ref }}

      - name: Delete unpublished counted release asset artifacts
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: intermediate ${{ inputs.channel }} asset Actions artifacts from this unpublished run. Canonical manual downloads are only the R2 links in a successful publish summary
          ARTIFACT_NAME_REGEX: "-release-assets$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
