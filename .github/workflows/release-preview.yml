name: release-preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to build. Empty builds the dispatched ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Optional base version (x.y.z). Empty uses preview/vX.Y.Z when present, otherwise shells/electron/package.json."
        required: false
        type: string
        default: ""
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Optional git ref to build. Empty builds the caller's ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Optional base version (x.y.z). Empty uses preview/vX.Y.Z when present, otherwise shells/electron/package.json."
        required: false
        type: string
        default: ""
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The preview version that was built."
        value: ${{ jobs.distribute.outputs.release_version }}
      channel:
        description: "The preview channel."
        value: ${{ jobs.distribute.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.distribute.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.distribute.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published preview; empty on cold start."
        value: ${{ jobs.distribute.outputs.previous_commit }}
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json."
        value: ${{ jobs.distribute.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_intel_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.distribute.outputs.win_url }}

permissions:
  actions: write
  contents: read

concurrency:
  group: open-design-release-preview
  cancel-in-progress: false

jobs:
  distribute:
    name: Distribute preview release
    uses: ./.github/workflows/distribution-preview.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      release_version: ${{ inputs.release_version }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}
