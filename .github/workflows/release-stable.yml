name: release-stable

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit at the matching release/vX.Y.Z ref
        required: true
        type: string
      source_ref:
        description: Full release ref, for example refs/heads/release/v1.2.3
        required: true
        type: string
      release_version:
        description: Stable version, for example 1.2.3
        required: true
        type: string
      standalone_version:
        description: Independently versioned Standalone runtime
        required: true
        default: 0.1.0
        type: string
      confirm_end_user_distribution:
        description: I authorize this stable end-user distribution
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  plan:
    name: "[plan] Release workloads · identities and cache decisions"
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.convergence.outputs.run }}
      batch_run: ${{ steps.convergence.outputs.batch_run }}
      node_version: ${{ steps.toolchain.outputs.node_version }}
      shell_matrix: ${{ steps.topology.outputs.shell_matrix }}
      electron_matrix: ${{ steps.topology.outputs.electron_matrix }}
      terminal_matrix: ${{ steps.topology.outputs.terminal_matrix }}
      validation_matrix: ${{ steps.topology.outputs.validation_matrix }}
      platform_matrix: ${{ steps.topology.outputs.platform_matrix }}
      capsule_matrix: ${{ steps.topology.outputs.capsule_matrix }}
      data_matrix: ${{ steps.topology.outputs.data_matrix }}
    steps:
      - name: "[validate] Validate immutable inputs"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: "[validate] Verify checkout identity"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote --refs origin "$SOURCE_REF" | cut -f1)" = "$SOURCE_SHA"

      - name: "[plan] Project pinned toolchain"
        id: toolchain
        run: echo "node_version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: "[plan] Project workflow execution declarations"
        id: topology
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json execution
          --workflow release-stable --output "$RUNNER_TEMP/exact-plan" --github-output "$GITHUB_OUTPUT"

      - name: "[plan] Resolve reusable scene results"
        id: convergence
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          set -euo pipefail
          RUNNER_PLAN=$(cat "$RUNNER_TEMP/exact-plan/runners.json")
          python3 .github/scripts/convergence.py \
            --config .github/config/plan/release-stable.json \
            github-output \
            --workflow release-stable \
            --scope-plan "$RUNNER_TEMP/exact-plan/scope.json" \
            --runner-plan-json "$RUNNER_PLAN" \
            --mode enforce \
            --pending "$RUNNER_TEMP/exact-plan/pending.json" \
            --products-output "$RUNNER_TEMP/exact-plan/artifacts"

      - name: "[store] exact-convergence-plan · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

          if-no-files-found: error
          retention-days: 1

  tools:
    name: "[prepare] tools/release · tool and policy"
    needs: [plan]
    runs-on: ubuntu-24.04
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: "[fetch] Acquire reusable release tool"
        if: ${{ !fromJSON(needs.plan.outputs.run).release_tools }}
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json acquire
          --descriptor "$RUNNER_TEMP/exact-plan/artifacts/release_tools/tool.json" --output "$RUNNER_TEMP/release-tools"

      - name: "[setup] pnpm · pinned package manager"
        uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}
        with:
          version: 10.33.2

      - name: "[setup] Workload concurrency · runner capacity"
        uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}

      - name: "[build] Build portable release tool"
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp tools/release/dist/tools-release "$RUNNER_TEMP/release-tools/tools-release"

      - name: "[setup] Expose release tool"
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: "[validate] Verify portable release tool"
        run: tools-release self-check

      - name: "[validate] Resolve tools-release validation profile"
        env:
          CHANNEL: stable
          END_USER_DISTRIBUTION: "true"
          PROFILE: stable-distribution
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN || secrets.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          STABLE_AUTHORIZED: ${{ inputs.confirm_end_user_distribution }}
        run: |
          set -euo pipefail
          tools-release policy resolve \
            --profile "$PROFILE" --channel "$CHANNEL" --release-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
            --endpoint-url "$STORAGE_ENDPOINT" --bucket "$STORAGE_BUCKET" --public-base-url "$PUBLIC_ORIGIN" \
            --end-user-distribution "$END_USER_DISTRIBUTION" --stable-authorized "$STABLE_AUTHORIZED" \
            --receipt "$RUNNER_TEMP/release-policy/release-policy.json"
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --capability plan \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/plan-authorization.json"

      - name: "[store] release-tools · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools
          if-no-files-found: error
          retention-days: 1

      - name: "[store] release-policy · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy
          if-no-files-found: error
          retention-days: 1

  validation:
    name: "[test] Shell and Closure · ${{ matrix.target }} · misses"
    needs: [tools, plan]
    if: ${{ fromJSON(needs.plan.outputs.batch_run).validation }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.validation_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: "[fetch] release-tools · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: "[setup] Expose release tool"
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: "[fetch] release-policy · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - name: "[setup] pnpm · pinned package manager"
        uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.batch_run).validation }}
        with:
          version: 10.33.2

      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ fromJSON(needs.plan.outputs.batch_run).validation && 'pnpm' || '' }}

      - name: "[setup] Workload concurrency · runner capacity"
        uses: ./.github/actions/configure-ci-parallelism

      - name: "[setup] Prepare validation workspace"
        if: ${{ fromJSON(needs.plan.outputs.batch_run).validation }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
        run: pnpm install --frozen-lockfile

      - name: "[test] Materialize selected validation evidence"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          tools-release validation materialize
          --root "$GITHUB_WORKSPACE" --source-commit "$SOURCE_SHA"
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/validation.execution.json"
          --output "$RUNNER_TEMP/exact-validation"
          --receipt "$RUNNER_TEMP/validation-materialization.json"

      - name: "[store] exact-validation-diagnostics · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exact-validation-diagnostics-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/*/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: "[store] exact-validation-contract-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_contract_darwin_arm64 }}
        with:
          name: exact-validation-contract-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/contract
          if-no-files-found: error
          retention-days: 1

      - name: "[store] exact-validation-shell-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_shell_darwin_arm64 }}
        with:
          name: exact-validation-shell-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/shell
          if-no-files-found: error
          retention-days: 1

      - name: "[store] exact-validation-closure-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_closure_darwin_arm64 }}
        with:
          name: exact-validation-closure-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/closure
          if-no-files-found: error
          retention-days: 1

  runtime:
    name: "[build] apps/web + apps/daemon · misses"
    needs: [tools, plan]
    if: ${{ fromJSON(needs.plan.outputs.batch_run).runtime }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan
      - name: "[fetch] release-tools · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools
      - name: "[setup] pnpm · pinned package manager"
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: "[setup] Expose release tool"
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: "[restore] Dependency cache · workload inputs"
        uses: actions/cache@v5.0.5
        with:
          path: ~/.npm
          key: runtime-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: runtime-npm-${{ runner.os }}-${{ runner.arch }}-
      - name: "[setup] Workload concurrency · runner capacity"
        uses: ./.github/actions/configure-ci-parallelism
      - name: "[setup] Prepare runtime build dependencies"
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: runtime-build
        run: pnpm install --frozen-lockfile
      - name: "[build] Build selected runtime resources"
        run: >-
          tools-release runtime build --root "$GITHUB_WORKSPACE"
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/runtime.execution.json"
          --target darwin-arm64 --output "$RUNNER_TEMP/runtime-built"
          --receipt "$RUNNER_TEMP/runtime-build.json"
      - name: "[store] exact-runtime-cache-daemon-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run).closure_runtime_daemon_darwin_arm64 }}
        with:
          name: exact-runtime-cache-daemon-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/runtime-built/products/open-design-daemon
          if-no-files-found: error
          retention-days: 1
      - name: "[store] exact-runtime-cache-web-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run).closure_runtime_web_darwin_arm64 }}
        with:
          name: exact-runtime-cache-web-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/runtime-built/products/open-design-web
          if-no-files-found: error
          retention-days: 1

  scene:
    name: "[build] shells/electron · scene, base and toolchain · ${{ matrix.target }} · misses"
    needs: [tools, plan, capsule, runtime]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && (fromJSON(needs.plan.outputs.batch_run).electron_scenes || fromJSON(needs.plan.outputs.batch_run).bases || fromJSON(needs.plan.outputs.batch_run).toolchains) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.electron_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: "[fetch] release-tools · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: "[setup] Expose release tool"
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: "[fetch] release-policy · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: "[restore] Restore converged scene"
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release scene import \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/scene.json" \
            --transport "$RUNNER_TEMP/exact-scene-artifact/scene.tar" --output "$RUNNER_TEMP/exact-scene"

      - name: "[setup] pnpm · pinned package manager"
        uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || fromJSON(needs.plan.outputs.run)[matrix.base_workload] || fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}
        with:
          version: 10.33.2

      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || fromJSON(needs.plan.outputs.run)[matrix.base_workload] || fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: "[setup] Workload concurrency · runner capacity"
        uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || fromJSON(needs.plan.outputs.run)[matrix.base_workload] || fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}

      - name: "[setup] Prepare scene workspace"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || fromJSON(needs.plan.outputs.run)[matrix.base_workload] || fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: ${{ matrix.postinstall_level }}
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: "[fetch] exact-runtime-cache-daemon-darwin-arm64 · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && fromJSON(needs.plan.outputs.run).closure_runtime_daemon_darwin_arm64 }}
        with:
          name: exact-runtime-cache-daemon-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/runtime-built/open-design-daemon
      - name: "[fetch] exact-runtime-cache-web-darwin-arm64 · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && fromJSON(needs.plan.outputs.run).closure_runtime_web_darwin_arm64 }}
        with:
          name: exact-runtime-cache-web-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/runtime-built/open-design-web
      - name: "[fetch] Acquire complete scene runtime resources"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          tools-release runtime acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/runtime.json"
          --products "$RUNNER_TEMP/runtime-built" --target "$TARGET"
          --output "$RUNNER_TEMP/exact-closure-resources"
          --receipt "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json"

      - name: "[fetch] exact-capsule-product · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.workload] && fromJSON(needs.plan.outputs.batch_run).capsules }}
        with:
          name: exact-capsule-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/capsules

      - name: "[fetch] Acquire scene Capsule inputs"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        run: >-
          tools-release capsule acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/capsules.json"
          --output "$RUNNER_TEMP/capsules"

      - name: "[build] Export built Electron toolchain"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_ZIP_PATH: /usr/bin/zip
        run: >-
          tools-release toolchain build --root "$GITHUB_WORKSPACE" --target "$TARGET"
          --output "$RUNNER_TEMP/toolchain-artifact"

      - name: "[store] exact-toolchain · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.toolchain_workload] }}
        with:
          name: exact-toolchain-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/toolchain-artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: "[build] Build native scene"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release build scene \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --resources "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json" --capsule-directory "$RUNNER_TEMP/capsules" \
            --output "$RUNNER_TEMP/exact-scene" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: "[build] Build and contribute Electron base"
        if: ${{ matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.base_workload }}
          ARCHIVE_ZIP_PATH: /usr/bin/zip
        shell: bash
        run: |
          set -euo pipefail
          tools-release build base \
            --root "$GITHUB_WORKSPACE" --shell electron --target "$TARGET" \
            --scene "$RUNNER_TEMP/exact-scene" \
            --output "$RUNNER_TEMP/exact-base" --receipt "$RUNNER_TEMP/base-build-receipt.json"
          tools-release base export \
            --target "$TARGET" \
            --build-receipt "$RUNNER_TEMP/base-build-receipt.json" \
            --output "$RUNNER_TEMP/base-contribution"

      - name: "[store] exact-base-product · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload] }}
        with:
          name: exact-base-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/base-contribution/artifact
          if-no-files-found: error
          retention-days: 1

      - name: "[validate] Verify release-neutral scene"
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          tools-release scene verify \
            --scene "$RUNNER_TEMP/exact-scene" --target "$TARGET"

      - name: "[build] Pack scene transport"
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        shell: bash
        run: |
          tools-release scene pack \
            --scene "$RUNNER_TEMP/exact-scene" --output "$RUNNER_TEMP/exact-scene-artifact/scene.tar"

      - name: "[store] exact · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-scene-artifact/scene.tar
          if-no-files-found: error
          retention-days: 1

  terminal_scene:
    name: "[build] shells/terminal · scene · ${{ matrix.target }} · misses"
    needs: [tools, plan]
    if: ${{ fromJSON(needs.plan.outputs.batch_run).terminal_scenes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.terminal_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
