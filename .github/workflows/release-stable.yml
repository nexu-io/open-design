name: release-stable

on:
  workflow_dispatch:
    inputs:
      prerelease_version:
        description: "Exact validated prerelease version to promote, for example 0.5.1-prerelease.3."
        required: true
        type: string
      publish:
        description: "Publish the validated stable build to R2 and GitHub Releases. OFF by default; unchecked runs the complete prepublish build, signing, notarization, and smoke path without public side effects."
        required: false
        type: boolean
        default: false
      metadata_only:
        description: "Stop after validating promotion metadata. Ignored when publish is enabled."
        required: false
        type: boolean
        default: false
      ref:
        description: "Stable release branch to build, for example release/v0.5.1. Empty builds the dispatch ref, which must also be release/vX.Y.Z."
        required: false
        type: string
        default: ""
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      prerelease_version:
        description: "Exact validated prerelease version to promote."
        required: true
        type: string
      publish:
        description: "Publish to R2 and GitHub Releases. False runs the complete prepublish path."
        required: false
        type: boolean
        default: false
      metadata_only:
        description: "Stop after validating promotion metadata. Ignored when publish is true."
        required: false
        type: boolean
        default: false
      ref:
        description: "Stable release branch to build. Empty builds the caller's ref, which must also be release/vX.Y.Z."
        required: false
        type: string
        default: ""
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The stable version that was validated or published."
        value: ${{ jobs.metadata.outputs.release_version }}
      channel:
        description: "The stable release channel."
        value: ${{ jobs.metadata.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.metadata.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.metadata.outputs.commit }}
      dry_run:
        description: "Whether this run is a dry-run."
        value: ${{ jobs.metadata.outputs.dry_run }}
      dry_run_mode:
        description: "The stable dry-run boundary: metadata or prepublish."
        value: ${{ jobs.metadata.outputs.dry_run_mode }}
      previous_commit:
        description: "Commit SHA of the previously published prerelease (changelog baseline); empty on cold start."
        value: ${{ jobs.metadata.outputs.previous_commit }}
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json."
        value: ${{ jobs.publish.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 (Intel) dmg download URL."
        value: ${{ jobs.publish.outputs.mac_intel_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.publish.outputs.win_url }}

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: open-design-release-stable-${{ inputs.publish && 'publish' || inputs.metadata_only && 'metadata' || 'prepublish' }}
  cancel-in-progress: false

env:
  STABLE_SAVE_PNPM_CACHE: "false"
  # Workspace Team's four vela transports are gated in the packaged runtime on
  # BOTH a known AMR profile and a non-empty vela web origin
  # (workspaceTeamTransportEnv in apps/packaged/src/workspace-team.ts). Neither
  # has a default in tools-pack, so a lane that omits them ships a client whose
  # team features are silently dormant: the build succeeds, the app starts, and
  # the gap only shows up in a user's hands.
  #
  # Unlike beta/prerelease these are production channels, so the profile is
  # pinned rather than taken from an input — there is no legitimate stable or
  # preview build aimed at the test backend. Naming prod explicitly is a no-op
  # for AMR itself (apps/daemon/src/integrations/vela-profile.ts already
  # defaults to prod); it exists to satisfy the first half of the gate. A fork
  # or PR build without the secret leaves the origin empty, which keeps the
  # transports dormant rather than half-enabled.
  OPEN_DESIGN_AMR_PROFILE: prod
  OD_VELA_WEB_URL: ${{ secrets.VELA_WEB_URL_PROD }}
  OD_VELA_WEB_URL_FEATURE_TEST: ${{ secrets.VELA_WEB_URL_FEATURE_TEST }}
  OD_VELA_WEB_URL_TEST: ${{ secrets.VELA_WEB_URL_TEST }}
  OD_VELA_WEB_URL_PROD: ${{ secrets.VELA_WEB_URL_PROD }}
  OPEN_DESIGN_TELEMETRY_RELAY_URL: ${{ vars.OPEN_DESIGN_TELEMETRY_RELAY_URL }}
  # PostHog product-analytics ingest. Defined as repository secret + var
  # so official builds ship with analytics enabled; PR builds and forks
  # without these run the daemon in no-op analytics mode (events never
  # leave the user's machine, /api/analytics/config returns enabled=false).
  POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  # PostHog Error tracking sourcemap upload. Personal API key (phx_...) and
  # project ID let tools-pack's web-sourcemaps step ship browser sourcemaps
  # to PostHog after `next build` and before the .map files are stripped
  # from the packaged bundle. Missing in PR/fork builds → upload is skipped
  # and the helper still strips .map to keep source out of the installer.
  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
  POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
  # Run/repo attribution for the published metadata + per-platform manifests,
  # set workflow-wide so the platform build jobs and the publish-metadata step
  # agree on github.runId — publish-metadata.ts refuses a platform manifest
  # whose github.{runId,commit} disagree with the publish step's. These are the
  # same for caller and callee under workflow_call, so they're safe here. Branch
  # is NOT: under workflow_call (or inputs.ref) github.ref_name is the caller's
  # ref, so RELEASE_BRANCH is passed per publish step as the resolved
  # needs.metadata.outputs.branch instead, matching what the metadata job built.
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  RELEASE_WORKFLOW: ${{ github.workflow }}

jobs:
  metadata:
    name: "[prepare] Stable metadata and Plan"
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      OPEN_DESIGN_PRERELEASE_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/prerelease/latest/metadata.json
      OPEN_DESIGN_RELEASE_DRY_RUN: ${{ inputs.publish && 'false' || inputs.metadata_only && 'metadata' || 'prepublish' }}
      OPEN_DESIGN_RELEASE_CHANNEL: stable
      OPEN_DESIGN_RELEASES_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      OPEN_DESIGN_STABLE_PRERELEASE_VERSION: ${{ inputs.prerelease_version }}
    outputs:
      run: ${{ steps.plan.outputs.run }}
      hit: ${{ steps.plan.outputs.hit }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_count: ${{ steps.plan.outputs.test_count }}
      common_matrix: ${{ steps.plan.outputs.common_matrix }}
      common_count: ${{ steps.plan.outputs.common_count }}
      requests: ${{ steps.plan.outputs.requests }}
      sources: ${{ steps.plan.outputs.sources }}
      pending_artifact: stable-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
      contribution: ${{ steps.mode.outputs.contribution }}
      contributions: ${{ steps.plan.outputs.contributions }}
      base_version: ${{ steps.stable.outputs.base_version }}
      branch: ${{ steps.stable.outputs.branch }}
      channel: ${{ steps.stable.outputs.channel }}
      commit: ${{ steps.stable.outputs.commit }}
      dry_run: ${{ steps.stable.outputs.dry_run }}
      dry_run_mode: ${{ steps.stable.outputs.dry_run_mode }}
      github_release_enabled: ${{ steps.stable.outputs.github_release_enabled }}
      mac_intel_namespace: ${{ steps.stable.outputs.mac_intel_namespace }}
      namespace: ${{ steps.stable.outputs.namespace }}
      publish_side_effects_enabled: ${{ steps.stable.outputs.publish_side_effects_enabled }}
      prerelease_number: ${{ steps.stable.outputs.prerelease_number }}
      previous_stable: ${{ steps.stable.outputs.previous_stable }}
      previous_commit: ${{ steps.prev.outputs.previous_commit }}
      release_name: ${{ steps.stable.outputs.release_name }}
      release_version: ${{ steps.stable.outputs.release_version }}
      run_prepublish_jobs: ${{ steps.stable.outputs.run_prepublish_jobs }}
      stable_version: ${{ steps.stable.outputs.stable_version }}
      state_source: ${{ steps.stable.outputs.state_source }}
      version_tag: ${{ steps.stable.outputs.version_tag }}
      win_namespace: ${{ steps.stable.outputs.win_namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 1

      # Under workflow_call the runner's GITHUB_SHA/GITHUB_REF_NAME describe the
      # caller's ref (e.g. main for the scheduled daily build), not the ref we
      # actually checked out. Resolve the real built HEAD so the published
      # metadata.json records the branch we built, not the caller.
      - name: Resolve built identity
        id: identity
        env:
          BUILD_REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          {
            echo "branch=$BUILD_REF"
            echo "commit=$built_sha"
          } >> "$GITHUB_OUTPUT"
          echo "BUILT_SHA=$built_sha" >> "$GITHUB_ENV"

      - name: "[prepare] Distinct workflow control snapshot"
        if: ${{ steps.identity.outputs.commit != github.sha && (!inputs.metadata_only || inputs.publish) }}
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: plan-control
          fetch-depth: 1

      - name: "[resolve] Actual source runner profiles"
        id: runners
        if: ${{ !inputs.metadata_only || inputs.publish }}
        env:
          OD_CI_RUNNER_MODE: ${{ vars.OD_CI_RUNNER_MODE }}
        run: python3 .github/scripts/runners.py

      - name: "[resolve] Formal release result consumption"
        id: mode
        if: ${{ !inputs.metadata_only || inputs.publish }}
        run: |
          echo "contribution=true" >> "$GITHUB_OUTPUT"
          echo "mode=enforce" >> "$GITHUB_OUTPUT"

      - name: "[plan] Frozen stable workloads"
        id: plan
        if: ${{ !inputs.metadata_only || inputs.publish }}
        env:
          EXECUTION_INPUTS: ${{ toJSON(inputs) }}
          RUNNER_PLAN: ${{ steps.runners.outputs.runs_on }}
          CONTROL_ROOT: ${{ steps.identity.outputs.commit == github.sha && '.' || 'plan-control' }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          runners="$(jq -c '. + {source_javascript:["ubuntu-latest"],release_tests:["ubuntu-latest"],source_mac_arm64:["macos-14"],source_mac_x64:["macos-15-intel"],source_win_x64:["windows-latest"]}' <<< "$RUNNER_PLAN")"
          python3 "$CONTROL_ROOT/.github/scripts/convergence.py" --root . --config "$CONTROL_ROOT/.github/config/convergence/release-stable.json" github-output \
            --workflow release-stable --all-workloads --runner-plan-json "$runners" \
            --execution-inputs-json "$EXECUTION_INPUTS" --mode enforce --pending "$RUNNER_TEMP/pending-convergence.json"

      - name: "[retain] Frozen Plan witness"
        if: ${{ !inputs.metadata_only || inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: stable-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pending-convergence.json
            ${{ runner.temp }}/requests
          if-no-files-found: error
          retention-days: 7

      - name: Setup release control
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-control

      # Capture the previously published prerelease commit BEFORE this run overwrites
      # prerelease/latest/metadata.json, so the notification can diff the changelog
      # against the last package. Empty on cold start (HTTP 404).
      - name: Capture previous prerelease commit
        id: prev
        run: |
          set -euo pipefail
          prev="$(curl -fsSL "$OPEN_DESIGN_PRERELEASE_METADATA_URL" | jq -r '.github.commit // ""' 2>/dev/null || true)"
          echo "previous prerelease commit: ${prev:-<none>}"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: stable
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          GITHUB_REF_NAME: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: pnpm exec tools-release prepare stable

      # Reports missing or partial stable release notes as a run annotation and
      # a job-summary entry. It is deliberately not a gate: see
      # docs/CHANGELOG/README.md.
      - name: Check stable release note coverage
        env:
          RELEASE_CHANNEL: stable
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-note-preflight/plan.json
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: pnpm exec tools-release prepare-release-note

      - name: Validate R2 release access
        if: ${{ steps.stable.outputs.publish_side_effects_enabled == 'true' }}
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          R2_ACCESS_PROBE_NAME: ${{ steps.stable.outputs.namespace }}
          RELEASE_CHANNEL: stable
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release check-storage

  common:
    name: "[build] Shared JavaScript"
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    needs: metadata
    if: ${{ needs.metadata.outputs.contribution == 'true' && needs.metadata.outputs.common_count != '0' }}
    runs-on: ${{ fromJSON(needs.metadata.outputs.common_matrix).include[0].runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: '[validate] Source references'
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_javascript
      - name: '[prepare] JavaScript build tools'
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: shared-javascript
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
      - name: '[build] Source packages'
        id: source_packages
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.packages.retain && format('{0}/source-products/packages/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.packages.operation == 'restore' && 'import' || 'build' }} packages
          --url "$SOURCE_PACKAGES_URL" --sha256 "$SOURCE_PACKAGES_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source daemon'
        id: source_daemon
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.daemon.retain && format('{0}/source-products/daemon/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.daemon.operation == 'restore' && 'import' || 'build' }} daemon
          --url "$SOURCE_DAEMON_URL" --sha256 "$SOURCE_DAEMON_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source shell'
        id: source_shell
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.shell.retain && format('{0}/source-products/shell/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.metadata.outputs.requests).source_javascript.shell.operation == 'restore' && 'import' || 'build' }} shell
          --url "$SOURCE_SHELL_URL" --sha256 "$SOURCE_SHELL_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ !cancelled() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-stable.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: stable-common-results
          products: manifest
          batches: '["source_javascript"]'
          formal-release: 'true'
          current-job: '[build] Shared JavaScript'
          step-results: |
            {"[build] Source packages":"${{ steps.source_packages.outcome }}","[build] Source daemon":"${{ steps.source_daemon.outcome }}","[build] Source shell":"${{ steps.source_shell.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}

  source_mac_arm64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] mac_arm64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && needs.metadata.outputs.contribution == 'true' && fromJSON(needs.metadata.outputs.requests).source_mac_arm64.web.operation == 'build' }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_arm64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
          postinstall-intent: source-web
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ success() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-stable.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: stable-source-mac-arm64
          products: manifest
          batches: '["source_mac_arm64"]'
          formal-release: 'true'
          current-job: '[build] mac_arm64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  source_mac_x64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] mac_x64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && needs.metadata.outputs.contribution == 'true' && (fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build') }}
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Disable Spotlight indexing for mac_x64 workload
        run: |
          set -euo pipefail
          sudo mdutil -i off /
          sudo mdutil -i off /System/Volumes/Data
          mdutil -s / /System/Volumes/Data
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
          postinstall-intent: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' && 'mac-runtime' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' && 'source-web' || 'release-executor' }}
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.web.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: "[prepare] Platform product tools"
        id: platform_product_tools
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' }}
        shell: bash
        run: pnpm --filter @open-design/tools-pack build
      - name: "[build] Release executor"
        id: release_executor
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.executor.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/executor/product/workspace.tar.gz
        run: |
          set -euo pipefail
          pnpm --filter @open-design/tools-release build
          pnpm --filter @open-design/tools-pack executor:dev export --output "$SOURCE_OUTPUT" --json
      - name: "[build] mac_x64 runtime"
        id: mac_x64_runtime
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_mac_x64.runtime.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/runtime/product/workspace.tar.gz
        run: >-
          pnpm exec tools-pack mac runtime-export
          --dir "$RUNNER_TEMP/mac-runtime-export"
          --namespace runtime-export
          --output "$SOURCE_OUTPUT"
          --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ !cancelled() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-stable.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: stable-source-mac-x64
          products: manifest
          batches: '["source_mac_x64"]'
          formal-release: 'true'
          current-job: '[build] mac_x64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}","[prepare] Platform product tools":"${{ steps.platform_product_tools.outcome }}","[build] Release executor":"${{ steps.release_executor.outcome }}","[build] mac_x64 runtime":"${{ steps.mac_x64_runtime.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  source_win_x64:
    outputs:
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] win_x64 workload"
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.metadata.result == 'success' && needs.metadata.outputs.contribution == 'true' && (fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' || fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.metadata.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_win_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
          postinstall-intent: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' && 'source-web' || 'release-executor' }}
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.web.operation == 'build' }}
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: "[prepare] Platform product tools"
        id: platform_product_tools
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build' }}
        shell: pwsh
        run: pnpm.cmd --filter @open-design/tools-pack build
      - name: "[build] Release executor"
        id: release_executor
        if: ${{ fromJSON(needs.metadata.outputs.requests).source_win_x64.executor.operation == 'build' }}
        shell: pwsh
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}\source-products\executor\product\workspace.tar.gz
        run: |
          $ErrorActionPreference = "Stop"
          pnpm.cmd --filter @open-design/tools-release build
          if ($LASTEXITCODE -ne 0) { throw "tools-release build failed with exit code $LASTEXITCODE" }
          pnpm.cmd --filter @open-design/tools-pack executor:dev export --output $env:SOURCE_OUTPUT --json
          if ($LASTEXITCODE -ne 0) { throw "release executor export failed with exit code $LASTEXITCODE" }
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ success() && needs.metadata.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-stable.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: stable-source-win-x64
          products: manifest
          batches: '["source_win_x64"]'
          formal-release: 'true'
          current-job: '[build] win_x64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}","[build] Release executor":"${{ steps.release_executor.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    needs:
      - metadata
      - common
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    needs: [metadata, common]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && needs.metadata.outputs.run_prepublish_jobs == 'true' && needs.metadata.outputs.test_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.test_matrix) }}
    env:
      OD_WATCHER_TEST_DEBUG: ${{ matrix.debug || '' }}
      TEST_KIND: ${{ matrix.kind }}
      TEST_SHARD: ${{ matrix.shard || '' }}
      TEST_GROUP: ${{ matrix.group || '' }}
      TEST_SHARED: ${{ needs.metadata.outputs.contribution }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        if: ${{ needs.metadata.outputs.contribution == 'true' }}
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --shared packages,daemon,shell
      - name: Configure CI parallelism
        if: ${{ matrix.kind == 'ui' }}
        uses: ./.github/actions/configure-ci-parallelism
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: ${{ format('test-{0}', matrix.kind) }}
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Setup Playwright
        if: ${{ matrix.kind == 'e2e' || matrix.kind == 'ui' }}
        uses: ./.github/actions/setup-playwright
        with:
          package-json-path: e2e/package.json
          install-command: pnpm -C e2e exec playwright install --with-deps chromium
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Allow Chromium user namespaces on GitHub Ubuntu
        if: ${{ matrix.kind == 'e2e' }}
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare test dependencies
        run: python3 .github/scripts/release/test_unit.py prepare
      - name: Clean Playwright state
        if: ${{ matrix.kind == 'ui' }}
        run: pnpm -C e2e exec tsx scripts/playwright.ts clean
      - name: Run test unit
        run: python3 .github/scripts/release/test_unit.py run
      - name: Preserve project-runtime domain artifact
        if: ${{ success() && matrix.kind == 'ui' && matrix.group == 'project-runtime' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}-domain
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Run UI critical extras
        if: ${{ matrix.extra == true }}
        run: python3 .github/scripts/release/test_unit.py extra
      - name: Upload Playwright debug artifact
        if: ${{ always() && matrix.kind == 'ui' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  cache_test:
    name: "[cache] Completed test results"
    needs: [metadata, test]
    if: ${{ always() && !cancelled() && needs.metadata.result == 'success' && needs.metadata.outputs.run_prepublish_jobs == 'true' && needs.metadata.outputs.contribution == 'true' && needs.metadata.outputs.test_count != '0' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: '[cache] Publish independently successful workloads'
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-stable.json
          pending-artifact: ${{ needs.metadata.outputs.pending_artifact }}
          id: stable-test-results
          products: none
          formal-release: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
  quality_gate:
    name: Verify stable quality gate
    needs: [metadata, test]
    if: ${{ always() && !cancelled() && needs.metadata.outputs.run_prepublish_jobs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a cached or freshly successful verify result
        env:
          VERIFY_HIT: ${{ fromJSON(needs.metadata.outputs.hit).test_verify }}
          VERIFY_JOB_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_HIT" = "true" ] || [ "$VERIFY_JOB_RESULT" = "success" ]; then
            exit 0
          fi
          echo "stable verify workload was neither reused nor completed successfully (hit=$VERIFY_HIT job=$VERIFY_JOB_RESULT)" >&2
          exit 1

  build_mac:
    outputs:
      manifest_key: ${{ steps.mac_arm64_platform_outputs.outputs.platform_manifest_key }}
      url: ${{ steps.mac_arm64_platform_outputs.outputs.dmg_url }}
    name: Build stable mac arm64
    needs:
      - metadata
      - common
      - source_mac_arm64
      - quality_gate
    if: ${{ !cancelled() && needs.metadata.outputs.run_prepublish_jobs == 'true' && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.source_mac_arm64.result == 'success' && needs.source_mac_arm64.outputs.requests || needs.source_mac_arm64.result == 'skipped' && needs.metadata.outputs.requests || 'null' }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_arm64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        uses: ./.github/actions/setup-workspace
        with:
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
          cache-tools: 'true'
          postinstall-intent: platform-build
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm exec tools-pack workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ""
        run: pnpm exec tools-pack workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: Prepare mac_arm64 signing certificate
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/open-design-signing.p12"
          if ! printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$cert_path"
          fi
          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build stable mac_arm64
        id: mac_arm64_tools_pack_build
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OD_WEB_SOURCEMAP_UPLOAD: "true"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-build/mac_arm64"
          rm -rf "$RUNNER_TEMP/tools-pack"
          : > "$RUNNER_TEMP/release-build/mac_arm64/build.log"
          build_args=(
            exec tools-pack mac package
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace "${{ needs.metadata.outputs.namespace }}"
            --portable
            --app-version "${{ needs.metadata.outputs.release_version }}"
            --build-json "$RUNNER_TEMP/release-build/mac_arm64/build.json"
            --mac-compression "normal"
            --to "all"
            --json
            --require-vela-cli
          )
          build_args+=(--signed --notarize)
          pnpm "${build_args[@]}" 2> >(tee -a "$RUNNER_TEMP/release-build/mac_arm64/build.log" >&2)
      - name: Smoke release mac packaged runtime
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          OD_PACKAGED_E2E_BUILD_LOG_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.log
          OD_PACKAGED_E2E_MAC: "1"
          OD_PACKAGED_E2E_MAC_ONBOARDING_SMOKE: ${{ needs.metadata.outputs.channel == 'nightly' && '1' || '0' }}
          OD_PACKAGED_E2E_NAMESPACE: ${{ needs.metadata.outputs.namespace }}
          OD_PACKAGED_E2E_RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/release-report/mac
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release-smoke.ts mac specs/mac.spec.ts

      - name: Upload mac e2e spec report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-mac-e2e-report
          path: ${{ runner.temp }}/release-report/mac
          if-no-files-found: warn

      - name: Write mac_arm64 release report
        id: report_mac_arm64
        if: ${{ !cancelled() && steps.mac_arm64_tools_pack_build.outcome == 'success' }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          BUILD_LOG_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.log
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: stable
          RELEASE_NAMESPACE: ${{ needs.metadata.outputs.namespace }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}/release-report/mac/report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}/release-report/mac/summary.md
          RELEASE_SMOKE_EXEMPT: "false"
          RELEASE_SMOKE_MODE: core
          RELEASE_TARGET: mac_arm64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: mac_arm64 stable build
        run: pnpm exec tools-release write-report
      - name: Publish mac_arm64 report summary
        if: ${{ !cancelled() && steps.report_mac_arm64.outcome == 'success' }}
        run: cat "${{ runner.temp }}/release-report/mac/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare mac_arm64 assets
        env:
          RELEASE_ARTIFACT_MODE: all
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_arm64
          RELEASE_CHANNEL: stable
          RELEASE_NAMESPACE: ${{ needs.metadata.outputs.namespace }}
          RELEASE_NOTES: Open Design ${{ needs.metadata.outputs.release_version }}
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: mac_arm64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: pnpm exec tools-release prepare-platform-assets
      - name: Publish mac_arm64 platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_arm64
          RELEASE_ARTIFACT_MODE: all
          RELEASE_BRANCH: ${{ needs.metadata.outputs.branch }}
          RELEASE_CHANNEL: stable
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_DRY_RUN_MODE: ${{ needs.metadata.outputs.dry_run_mode }}
          RELEASE_PUBLISH_SIDE_EFFECTS: ${{ needs.metadata.outputs.publish_side_effects_enabled }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-platform-outputs/mac_arm64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac
          RELEASE_REPORT_ZIP_PATH: ${{ runner.temp }}/release-report/mac-report.zip
          RELEASE_SIGNED: "true"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/release-platform-outputs/mac_arm64.md
          RELEASE_TARGET: mac_arm64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: pnpm exec tools-release publish-platform
      - name: Read mac_arm64 platform outputs
        id: mac_arm64_platform_outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/mac_arm64.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Upload mac stable publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-mac-arm64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/mac_arm64.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload mac stable release bundle
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-mac-release-assets
          path: ${{ runner.temp }}/release-assets/mac_arm64
          retention-days: 1

  build_mac_intel:
    outputs:
      manifest_key: ${{ steps.mac_x64_platform_outputs.outputs.platform_manifest_key }}
      url: ${{ steps.mac_x64_platform_outputs.outputs.dmg_url }}
    name: Build stable mac intel x64
    needs:
      - metadata
      - common
      - source_mac_x64
      - quality_gate
    if: ${{ !cancelled() && needs.metadata.outputs.run_prepublish_jobs == 'true' && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      OD_TOOLS_PACK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: Disable Spotlight indexing for mac_x64 build
        run: |
          set -euo pipefail
          sudo mdutil -i off /
          sudo mdutil -i off /System/Volumes/Data
          mdutil -s / /System/Volumes/Data
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.source_mac_x64.result == 'success' && needs.source_mac_x64.outputs.requests || needs.source_mac_x64.result == 'skipped' && needs.metadata.outputs.requests || 'null' }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[restore] Release executor"
        shell: bash
        run: |
          python3 .github/scripts/release/mac_diagnostics.py \
            --output "$RUNNER_TEMP/release-build/mac_x64/restore-resources.jsonl" \
            -- python3 .github/scripts/release/executor.py restore \
            --url "$SOURCE_EXECUTOR_URL" --sha256 "$SOURCE_EXECUTOR_SHA256" \
            --output "$RUNNER_TEMP/release-executor"
      - name: "[restore] mac_x64 runtime"
        shell: bash
        run: >-
          node "$RELEASE_EXECUTOR_ROOT/pack/dist/index.mjs" mac runtime-restore
          --url "$SOURCE_RUNTIME_URL" --sha256 "$SOURCE_RUNTIME_SHA256"
          --output "$RUNNER_TEMP/mac-runtime-product"
          --json
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: node "$RELEASE_EXECUTOR_ROOT/pack/dist/index.mjs" workspace import javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ""
        run: node "$RELEASE_EXECUTOR_ROOT/pack/dist/index.mjs" workspace import web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: Prepare mac_x64 signing certificate
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/open-design-signing.p12"
          if ! printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$cert_path"
          fi
          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build stable mac_x64
        id: mac_x64_tools_pack_build
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"
          DEBUG: electron-builder
          DEBUG_DMG: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OD_WEB_SOURCEMAP_UPLOAD: "false"
        run: |
          set -euo pipefail
          SECONDS=0
          trap 'printf "[timing] mac_x64 package: %ss\n" "$SECONDS"' EXIT
          mkdir -p "$RUNNER_TEMP/release-build/mac_x64"
          rm -rf "$RUNNER_TEMP/tools-pack"
          : > "$RUNNER_TEMP/release-build/mac_x64/build.log"
          build_args=(
            "$RELEASE_EXECUTOR_ROOT/pack/dist/index.mjs" mac package
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace "${{ needs.metadata.outputs.mac_intel_namespace }}"
            --portable
            --app-version "${{ needs.metadata.outputs.release_version }}"
            --build-json "$RUNNER_TEMP/release-build/mac_x64/build.json"
            --mac-runtime-product "$RUNNER_TEMP/mac-runtime-product"
            --mac-compression "normal"
            --to "all"
            --json
            --require-vela-cli
          )
          build_args+=(--signed --notarize)
          python3 .github/scripts/release/mac_diagnostics.py \
            --output "$RUNNER_TEMP/release-build/mac_x64/runner-resources.jsonl" \
            -- node "${build_args[@]}" \
            2> >(tee -a "$RUNNER_TEMP/release-build/mac_x64/build.log" >&2)
      - name: Verify stable mac_x64 signature and notarization
        run: |
          set -euo pipefail
          build_json="$RUNNER_TEMP/release-build/mac_x64/build.json"
          dmg_path="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).dmgPath; if (typeof value !== "string" || value.length === 0) process.exit(1); process.stdout.write(value);' "$build_json")"
          if [ ! -f "$dmg_path" ]; then
            echo "stable mac_x64 DMG not found: $dmg_path" >&2
            exit 1
          fi

          mount_point="$(mktemp -d "$RUNNER_TEMP/stable-mac-x64.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          candidate_app="$mount_point/Open Design.app"
          if [ ! -d "$candidate_app" ]; then
            echo "stable app not found in DMG: $candidate_app" >&2
            exit 1
          fi
          # The signature is checked on every signed build, because
          # platforms.mac[Intel].signed == true is what the stable promotion
          # gate reads. The stapled-ticket and Gatekeeper assessments only pass
          # for a notarized build, so they follow mac_sign_mode rather than
          # failing the job for doing exactly what it was asked to do.
          codesign --verify --deep --strict "$candidate_app"
          xcrun stapler validate "$candidate_app"
          spctl --assess --type execute --verbose=4 "$candidate_app"

      - name: Write mac_x64 release report
        id: report_mac_x64
        if: ${{ !cancelled() && steps.mac_x64_tools_pack_build.outcome == 'success' }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_x64/build.json
          BUILD_LOG_PATH: ${{ runner.temp }}/release-build/mac_x64/build.log
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: stable
          RELEASE_NAMESPACE: ${{ needs.metadata.outputs.mac_intel_namespace }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}/release-report/mac_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}/release-report/mac_x64/report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}/release-report/mac_x64/summary.md
          RELEASE_SMOKE_EXEMPT: "true"
          RELEASE_SMOKE_MODE: skip
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: mac_x64 stable build
        run: node "$RELEASE_EXECUTOR_ROOT/release/dist/index.mjs" write-report
      - name: Publish mac_x64 report summary
        if: ${{ !cancelled() && steps.report_mac_x64.outcome == 'success' }}
        run: cat "${{ runner.temp }}/release-report/mac_x64/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare mac_x64 assets
        env:
          RELEASE_ARTIFACT_MODE: all
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_x64
          RELEASE_CHANNEL: stable
          RELEASE_NAMESPACE: ${{ needs.metadata.outputs.mac_intel_namespace }}
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
        run: node "$RELEASE_EXECUTOR_ROOT/release/dist/index.mjs" prepare-platform-assets
      - name: Publish mac_x64 platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_x64
          RELEASE_ARTIFACT_MODE: all
          RELEASE_BRANCH: ${{ needs.metadata.outputs.branch }}
          RELEASE_CHANNEL: stable
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_DRY_RUN_MODE: ${{ needs.metadata.outputs.dry_run_mode }}
          RELEASE_PUBLISH_SIDE_EFFECTS: ${{ needs.metadata.outputs.publish_side_effects_enabled }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-platform-outputs/mac_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_SIGNED: "true"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: mac_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: node "$RELEASE_EXECUTOR_ROOT/release/dist/index.mjs" publish-platform
      - name: Read mac_x64 platform outputs
        id: mac_x64_platform_outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/mac_x64.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Upload mac intel stable publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/mac_x64.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload mac intel stable release bundle
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-mac-intel-release-assets
          path: ${{ runner.temp }}/release-assets/mac_x64
          retention-days: 1

  build_win:
    outputs:
      manifest_key: ${{ steps.win_x64_platform_outputs.outputs.platform_manifest_key }}
      url: ${{ steps.win_x64_platform_outputs.outputs.installer_url }}
    name: Build stable win x64
    needs:
      - metadata
      - common
      - source_win_x64
      - quality_gate
    if: ${{ !cancelled() && needs.metadata.outputs.run_prepublish_jobs == 'true' && needs.metadata.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      OD_TOOLS_PACK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.source_win_x64.result == 'success' && needs.source_win_x64.outputs.requests || needs.source_win_x64.result == 'skipped' && needs.metadata.outputs.requests || 'null' }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.metadata.outputs.common_count != '0' && needs.common.outputs.sources || needs.metadata.outputs.common_count == '0' && needs.metadata.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_win_x64 ${{ (needs.metadata.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[restore] Release executor"
        shell: pwsh
        run: >-
          python3 .github/scripts/release/executor.py restore
          --url "$env:SOURCE_EXECUTOR_URL" --sha256 "$env:SOURCE_EXECUTOR_SHA256"
          --output "$env:RUNNER_TEMP\release-executor"
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: "[prepare] Release executor pnpm shim"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pnpmScript = "$env:RELEASE_EXECUTOR_ROOT\pack\node_modules\pnpm\bin\pnpm.cjs"
          if (-not (Test-Path -LiteralPath $pnpmScript)) { throw "release executor pnpm is missing: $pnpmScript" }
          $shimDir = "$env:RUNNER_TEMP\release-executor-bin"
          $shimPath = "$shimDir\pnpm.cmd"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          [System.IO.File]::WriteAllText($shimPath, "@echo off`r`nnode `"%RELEASE_EXECUTOR_ROOT%\pack\node_modules\pnpm\bin\pnpm.cjs`" %*`r`n", [System.Text.Encoding]::ASCII)
          $version = (& $shimPath --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "10.33.2") { throw "release executor pnpm version mismatch: $version" }
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "[prepare] Workspace package links"
        shell: pwsh
        run: >-
          node "$env:RELEASE_EXECUTOR_ROOT\pack\node_modules\pnpm\bin\pnpm.cjs"
          install --frozen-lockfile --prod --ignore-scripts --prefer-offline
          --filter @open-design/packaged...
      - name: "[restore] Shared JavaScript"
        shell: pwsh
        run: node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$env:WORKSPACE_SOURCES" --scratch "$env:RUNNER_TEMP\shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: pwsh
        env:
          SOURCE_OUTPUT: ""
        run: node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" workspace ${{ (needs.metadata.outputs.contribution == 'true') && 'import' || 'build' }} web --url "$env:SOURCE_WEB_URL" --sha256 "$env:SOURCE_WEB_SHA256" --output "$env:SOURCE_OUTPUT" --scratch "$env:RUNNER_TEMP\source-import" --web-output-mode standalone --json
      - name: Setup NSIS
        shell: pwsh
        run: |
          if ((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            exit 0
          }
          choco install nsis -y --no-progress
      - name: Build stable win_x64
        id: win_tools_pack_build
        shell: pwsh
        env:
          OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.win_x64_update_metadata_url }}
          OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.win_x64_update_target_version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\release-build\win_x64" | Out-Null
          node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" win cleanup --dir "${{ runner.temp }}\tools-pack" --namespace "${{ needs.metadata.outputs.win_namespace }}" --json
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win cleanup failed with exit code $LASTEXITCODE" }
          $buildArgs = @("$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs", "win", "package", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "${{ needs.metadata.outputs.win_namespace }}", "--portable", "--app-version", "${{ needs.metadata.outputs.release_version }}", "--build-json", "${{ runner.temp }}\release-build\win_x64\build.json", "--to", "all", "--require-vela-cli", "--json")
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win build failed with exit code $LASTEXITCODE" }
          $build = Get-Content -Raw "${{ runner.temp }}\release-build\win_x64\build.json" | ConvertFrom-Json
          node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" win validate-payload --namespace "${{ needs.metadata.outputs.win_namespace }}" --payload-path $build.payloadPath --expected-version "${{ needs.metadata.outputs.release_version }}" --json
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win validate-payload failed with exit code $LASTEXITCODE" }
      - name: Prepare stable Windows smoke harness
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-smoke
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}
      - name: Build stable win_x64 update fixture
        if: ${{ inputs.win_x64_smoke_mode == 'full' && inputs.win_x64_update_metadata_url == '' && inputs.win_x64_update_target_version == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = [regex]::Match("${{ needs.metadata.outputs.release_version }}", "^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$")
          if (-not $match.Success) { throw "full Windows stable smoke requires stable version x.y.z; got ${{ needs.metadata.outputs.release_version }}" }
          $updateVersion = "{0}.{1}.{2}" -f $match.Groups["major"].Value, $match.Groups["minor"].Value, ([int]$match.Groups["patch"].Value + 1)
          $buildArgs = @("exec", "tools-pack", "win", "build", "--dir", "${{ runner.temp }}\release-work\win_x64\tools-pack-update-fixture", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "${{ needs.metadata.outputs.win_namespace }}", "--app-version", $updateVersion, "--to", "nsis", "--require-vela-cli", "--json")
          $updateOutput = pnpm.cmd @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture failed with exit code $LASTEXITCODE" }
          $updateOutput | Set-Content -Path "${{ runner.temp }}\windows-tools-pack-update-build.json" -Encoding utf8
          $updateBuild = $updateOutput | ConvertFrom-Json
          pnpm.cmd exec tools-pack win validate-payload --namespace "${{ needs.metadata.outputs.win_namespace }}" --payload-path $updateBuild.payloadPath --expected-version $updateVersion --json

      - name: Smoke release windows packaged runtime
        if: ${{ inputs.win_x64_smoke_mode != 'skip' }}
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/release-build/win_x64/build.json
          OD_PACKAGED_E2E_WIN: "1"
          OD_PACKAGED_E2E_WIN_ONBOARDING_SMOKE: ${{ needs.metadata.outputs.channel == 'nightly' && '1' || '0' }}
          OD_PACKAGED_E2E_NAMESPACE: ${{ needs.metadata.outputs.win_namespace }}
          OD_PACKAGED_E2E_RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/release-report/win
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/tools-pack
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: ${{ inputs.win_x64_smoke_mode }}
          OD_PACKAGED_E2E_WIN_UPDATE_FIXTURE: ${{ inputs.win_x64_smoke_mode == 'full' && inputs.win_x64_update_metadata_url == '' && inputs.win_x64_update_target_version == '' && 'tools-serve' || '' }}
          OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ inputs.win_x64_update_metadata_url }}
          OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ inputs.win_x64_update_target_version }}
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec tsx scripts/release-smoke.ts win specs/win.spec.ts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload windows e2e spec report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-win-e2e-report
          path: ${{ runner.temp }}/release-report/win
          if-no-files-found: warn

      - name: Write win_x64 release report
        id: report_win_x64
        if: ${{ !cancelled() && steps.win_tools_pack_build.outcome == 'success' }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_BUILD_TARGET: all
          RELEASE_CHANNEL: stable
          RELEASE_NAMESPACE: ${{ needs.metadata.outputs.win_namespace }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win\report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win\summary.md
          RELEASE_SMOKE_EXEMPT: ${{ inputs.win_x64_smoke_mode == 'skip' && 'true' || 'false' }}
          RELEASE_SMOKE_MODE: ${{ inputs.win_x64_smoke_mode }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          REPORT_TITLE: win_x64 stable build
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" write-report
      - name: Publish win_x64 report summary
        if: ${{ !cancelled() && steps.report_win_x64.outcome == 'success' }}
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\release-report\win\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Prepare win_x64 assets
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_CHANNEL: stable
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_INCLUDE_ZIP: "true"
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" prepare-platform-assets
      - name: Publish win_x64 platform
        env:
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_BRANCH: ${{ needs.metadata.outputs.branch }}
          RELEASE_CHANNEL: stable
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_DRY_RUN_MODE: ${{ needs.metadata.outputs.dry_run_mode }}
          RELEASE_PUBLISH_SIDE_EFFECTS: ${{ needs.metadata.outputs.publish_side_effects_enabled }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win
          WIN_INCLUDE_ZIP: "true"
          RELEASE_SIGNED: "false"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" publish-platform
      - name: Read win_x64 platform outputs
        id: win_x64_platform_outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/win_x64.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Upload windows stable publish manifest
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests/win_x64.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload windows stable release bundle
        uses: actions/upload-artifact@v7
        with:
          name: open-design-release-win-release-assets
          path: ${{ runner.temp }}/release-assets/win_x64
          retention-days: 1

  publish_docker_image:
    name: Publish stable Docker image
    needs:
      - metadata
      - publish
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.metadata.outputs.dry_run != 'true' &&
        needs.metadata.outputs.github_release_enabled == 'true' &&
        needs.metadata.result == 'success' &&
        needs.publish.result == 'success'
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      release_version: ${{ needs.metadata.outputs.stable_version }}
      publish_latest: true

  publish:
    name: Finalize ${{ needs.metadata.outputs.channel }} release plan
    needs:
      - metadata
      - quality_gate
      - build_mac
      - build_mac_intel
      - build_win
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.metadata.outputs.run_prepublish_jobs == 'true' &&
        needs.metadata.result == 'success' &&
        needs.quality_gate.result == 'success' &&
        needs.build_mac.result == 'success' &&
        needs.build_mac_intel.result == 'success' &&
        needs.build_win.result == 'success'
      }}
    runs-on: ubuntu-latest
    outputs:
      version_metadata_url: ${{ steps.outputs.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.outputs.outputs.mac_arm64_dmg_url }}
      mac_intel_url: ${{ steps.outputs.outputs.mac_x64_dmg_url }}
      win_url: ${{ steps.outputs.outputs.win_x64_installer_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Record the real built commit in metadata.json. Under workflow_call the
      # runner's GITHUB_SHA is the caller's ref, so pin it to the resolved build
      # commit; the next run reads this back as its changelog baseline.
      GITHUB_SHA: ${{ needs.metadata.outputs.commit }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      BRANCH_NAME: ${{ needs.metadata.outputs.branch }}
      ENABLE_LINUX: "false"
      ENABLE_MAC: "true"
      ENABLE_MAC_INTEL: "true"
      ENABLE_WIN: "true"
      GITHUB_RELEASE_ENABLED: ${{ needs.metadata.outputs.github_release_enabled }}
      MAC_INTEL_SIGNED: "true"
      PRERELEASE_NUMBER: ${{ needs.metadata.outputs.prerelease_number }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
      RELEASE_SIGNED: "true"
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      REPORT_MODE: zip
      STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
      VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1

      - name: Setup release publisher
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-publish
          save-pnpm-cache: ${{ env.STABLE_SAVE_PNPM_CACHE }}

      - name: Download mac publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-mac-arm64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Download mac intel publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-mac-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Download windows publish manifest
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-win-x64-publish-manifest
          path: ${{ runner.temp }}/release-platform-manifests

      - name: Pre-flight tag/release check
        if: ${{ needs.metadata.outputs.github_release_enabled == 'true' }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "tag $VERSION_TAG already exists on origin; aborting" >&2
            exit 1
          fi
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "release $VERSION_TAG already exists; aborting" >&2
            exit 1
          fi

      - name: Download mac release bundle
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-mac-release-assets
          path: ${{ runner.temp }}/release-assets/mac

      - name: Download mac intel release bundle
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-mac-intel-release-assets
          path: ${{ runner.temp }}/release-assets/mac-intel

      - name: Download windows release bundle
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-win-release-assets
          path: ${{ runner.temp }}/release-assets/win

      - name: Download mac e2e spec report
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-mac-e2e-report
          path: ${{ runner.temp }}/release-report/mac

      # The windows smoke uploads this artifact with `if-no-files-found: warn`,
      # so a skipped smoke leaves an empty report directory and publishes no
      # artifact at all. Guard the download when smoke is explicitly skipped.
      - name: Download windows e2e spec report
        if: ${{ inputs.win_x64_smoke_mode != 'skip' }}
        uses: actions/download-artifact@v8
        with:
          name: open-design-release-win-e2e-report
          path: ${{ runner.temp }}/release-report/win

      - name: Prepare stable GitHub Release asset plan
        env:
          ENABLE_LINUX_X64: "false"
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_GITHUB_ASSETS_DIR: ${{ runner.temp }}/github-release-assets
          RELEASE_GITHUB_ASSETS_SOURCE_DIR: ${{ runner.temp }}/release-assets
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/github-release-assets-plan/outputs.json
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/github-release-assets-plan/summary.md
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: pnpm exec tools-release prepare-github-assets

      - name: Publish GitHub Release asset plan summary
        run: cat "${{ runner.temp }}/github-release-assets-plan/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Write stable release notes
        id: notes
        if: ${{ needs.metadata.outputs.github_release_enabled == 'true' }}
        env:
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: bash .github/scripts/release/github/stable-notes.sh

      - name: Create draft release with tag
        id: create_release
        if: ${{ needs.metadata.outputs.github_release_enabled == 'true' }}
        run: |
          set -euo pipefail
          # gh release create creates the tag at $GITHUB_SHA atomically with the release.
          # Using --draft keeps the release invisible until R2 publish and asset upload verify successfully.
          gh release create "$VERSION_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --draft

      - name: Upload assets to draft release
        if: ${{ needs.metadata.outputs.github_release_enabled == 'true' }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION_TAG" "$RUNNER_TEMP/github-release-assets"/*

      - name: Prepare and publish stable release notes
        env:
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-metadata/release-note-plan.json
          RELEASE_PUBLISH_SIDE_EFFECTS: ${{ needs.metadata.outputs.publish_side_effects_enabled }}
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          pnpm exec tools-release prepare-release-note
          pnpm exec tools-release publish-release-note
          pnpm exec tools-release verify-release-note

      - name: Prepare release metadata
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          ENABLE_LINUX_X64: "false"
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: "true"
          ENABLE_WIN_X64: "true"
          LINUX_X64_RESULT: skipped
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_ASSET_SUFFIX: ""
          RELEASE_BRANCH: ${{ needs.metadata.outputs.branch }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_DRY_RUN_MODE: ${{ needs.metadata.outputs.dry_run_mode }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_PUBLISH_SIDE_EFFECTS: ${{ needs.metadata.outputs.publish_side_effects_enabled }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-metadata/outputs.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SIGNED: "true"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          RELEASE_WORKFLOW: ${{ github.workflow }}
          STABLE_VERSION: ${{ needs.metadata.outputs.stable_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
          VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release publish-metadata

      - name: Read metadata outputs
        id: outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-metadata/outputs.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));

      - name: Verify release metadata
        env:
          ENABLE_LINUX_X64: "false"
          ENABLE_MAC_ARM64: "true"
          ENABLE_MAC_X64: "true"
          ENABLE_WIN_X64: "true"
          LINUX_X64_RESULT: skipped
          MAC_ARM64_RESULT: ${{ needs.build_mac.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_intel.result }}
          RELEASE_DRY_RUN_MODE: ${{ needs.metadata.outputs.dry_run_mode }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_METADATA_PATH: ${{ needs.metadata.outputs.publish_side_effects_enabled == 'true' && '' || format('{0}/release-metadata/metadata.json', runner.temp) }}
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          WIN_X64_RESULT: ${{ needs.build_win.result }}
        run: pnpm exec tools-release verify-metadata

      - name: Promote draft to published latest
        if: ${{ needs.metadata.outputs.github_release_enabled == 'true' }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION_TAG" \
            --draft=false \
            --latest

      - name: Cleanup release + tag on failure
        if: ${{ failure() && needs.metadata.outputs.github_release_enabled == 'true' && steps.create_release.outcome == 'success' }}
        run: |
          set +e
          echo "publish failed after release was created; rolling back release and tag"
          gh release delete "$VERSION_TAG" --cleanup-tag --yes
          # belt-and-suspenders: ensure remote tag is gone even if --cleanup-tag missed
          git push origin --delete "refs/tags/$VERSION_TAG" || true

      - name: Publish summary
        env:
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_METADATA_PATH: ${{ needs.metadata.outputs.publish_side_effects_enabled == 'true' && '' || format('{0}/release-metadata/metadata.json', runner.temp) }}
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/release-metadata/summary.md
        run: |
          pnpm exec tools-release summary-metadata
          cat "${{ runner.temp }}/release-metadata/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup workflow artifacts
        if: ${{ success() && needs.metadata.outputs.publish_side_effects_enabled == 'true' }}
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: stable publish manifests and GitHub Release staging bundles; Plan witnesses and diagnostic reports are retained
          ARTIFACT_NAME_REGEX: "^(open-design-release-(mac-arm64|mac-x64|win-x64)-publish-manifest|open-design-release-(mac|mac-intel|win)-release-assets)$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh

  cleanup_partial_release_assets:
    name: Cleanup unpublished release asset artifacts
    needs:
      - metadata
      - build_mac
      - build_mac_intel
      - build_win
      - publish
    if: ${{ always() && needs.metadata.outputs.dry_run != 'true' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Delete unpublished release asset artifacts
        env:
          ARTIFACT_CLEANUP_DESCRIPTION: intermediate release asset Actions artifacts from this unpublished run. Canonical manual downloads are only the R2 links in a successful publish summary
          ARTIFACT_NAME_REGEX: "-release-assets$"
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
