        shell: bash
        run: |
          tools-release scene import \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/scene.json" \
            --transport "$RUNNER_TEMP/exact-scene-artifact/scene.tar" --output "$RUNNER_TEMP/exact-scene"

      - name: "[setup] pnpm · pinned package manager"
        uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
