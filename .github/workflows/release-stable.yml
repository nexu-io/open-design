name: release-stable

on:
  workflow_dispatch:
    inputs:
      prerelease_version:
        description: "Exact validated prerelease version to promote, for example 0.5.1-prerelease.3."
        required: true
        type: string
      dry_run:
        description: "Release mode. metadata stops after promotion metadata; prepublish runs build/smoke/report/plan without publishing; publish performs the stable release."
        required: false
        type: choice
        options:
          - metadata
          - prepublish
          - publish
        default: metadata
      ref:
        description: "Stable release branch to build, for example release/v0.5.1. Empty builds the dispatch ref, which must also be release/vX.Y.Z."
        required: false
        type: string
        default: ""
      mac_arm64_sign_mode:
        description: "macOS arm64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed, notarized]
        default: notarized
      mac_x64_sign_mode:
        description: "macOS x64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed, notarized]
        default: notarized
      win_x64_sign_mode:
        description: "Windows x64 signing mode."
        required: true
        type: choice
        options: [unsigned, signed]
        default: unsigned
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      prerelease_version:
        description: "Exact validated prerelease version to promote."
        required: true
        type: string
      dry_run:
        description: "Release mode: metadata, prepublish, or publish. The legacy false value is also accepted for callers."
        required: false
        type: string
        default: "metadata"
      ref:
        description: "Stable release branch to build. Empty builds the caller's ref, which must also be release/vX.Y.Z."
        required: false
        type: string
        default: ""
      mac_arm64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_x64_sign_mode:
        required: false
        type: string
        default: notarized
      win_x64_sign_mode:
        required: false
        type: string
        default: unsigned
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage: skip, core, or full."
        required: false
        type: string
        default: "core"
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows x64 payload smoke."
        required: false
        type: string
        default: ""
    outputs:
      release_version:
        description: "The stable version that was validated or published."
        value: ${{ jobs.distribute.outputs.release_version }}
      channel:
        description: "The stable release channel."
        value: ${{ jobs.distribute.outputs.channel }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.distribute.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.distribute.outputs.commit }}
      dry_run:
        description: "Whether this run is a dry-run."
        value: ${{ jobs.distribute.outputs.dry_run }}
      dry_run_mode:
        description: "The stable dry-run boundary: metadata or prepublish."
        value: ${{ jobs.distribute.outputs.dry_run_mode }}
      previous_commit:
        description: "Commit SHA of the previously published prerelease (changelog baseline); empty on cold start."
        value: ${{ jobs.distribute.outputs.previous_commit }}
      version_metadata_url:
        description: "Public R2 URL of this build's version metadata.json."
        value: ${{ jobs.distribute.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_arm64_url }}
      mac_intel_url:
        description: "macOS x64 (Intel) dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_intel_url }}
      win_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.distribute.outputs.win_url }}

permissions:
  actions: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: open-design-release-stable-${{ inputs.dry_run }}
  cancel-in-progress: false

jobs:
  distribute:
    name: Distribute stable release
    uses: ./.github/workflows/distribution.yml
    secrets: inherit
    with:
      channel: stable
      prerelease_version: ${{ inputs.prerelease_version }}
      dry_run: ${{ inputs.dry_run }}
      ref: ${{ inputs.ref }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}
