name: release-stable

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit at the matching release/vX.Y.Z ref
        required: true
        type: string
      source_ref:
        description: Full release ref, for example refs/heads/release/v1.2.3
        required: true
        type: string
      release_version:
        description: Stable version, for example 1.2.3
        required: true
        type: string
      standalone_version:
        description: Independently versioned Standalone runtime
        required: true
        default: 0.1.0
        type: string
      confirm_end_user_distribution:
        description: I authorize this stable end-user distribution
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release-neutral Shell scenes
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.convergence.outputs.run }}
      batch_run: ${{ steps.convergence.outputs.batch_run }}
      node_version: ${{ steps.toolchain.outputs.node_version }}
      shell_matrix: ${{ steps.topology.outputs.shell_matrix }}
      electron_matrix: ${{ steps.topology.outputs.electron_matrix }}
      terminal_matrix: ${{ steps.topology.outputs.terminal_matrix }}
      validation_matrix: ${{ steps.topology.outputs.validation_matrix }}
      platform_matrix: ${{ steps.topology.outputs.platform_matrix }}
      capsule_matrix: ${{ steps.topology.outputs.capsule_matrix }}
      data_matrix: ${{ steps.topology.outputs.data_matrix }}
    steps:
      - name: Validate immutable inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote --refs origin "$SOURCE_REF" | cut -f1)" = "$SOURCE_SHA"

      - name: Project pinned toolchain
        id: toolchain
        run: echo "node_version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Project workflow execution declarations
        id: topology
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json execution
          --workflow release-stable --output "$RUNNER_TEMP/exact-plan" --github-output "$GITHUB_OUTPUT"

      - name: Resolve reusable scene results
        id: convergence
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          set -euo pipefail
          RUNNER_PLAN=$(cat "$RUNNER_TEMP/exact-plan/runners.json")
          python3 .github/scripts/convergence.py \
            --config .github/config/plan/release-stable.json \
            github-output \
            --workflow release-stable \
            --scope-plan "$RUNNER_TEMP/exact-plan/scope.json" \
            --runner-plan-json "$RUNNER_PLAN" \
            --mode enforce \
            --pending "$RUNNER_TEMP/exact-plan/pending.json" \
            --products-output "$RUNNER_TEMP/exact-plan/artifacts"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

          if-no-files-found: error
          retention-days: 1

  tools:
    name: Acquire release tools and authorize release policy
    needs: [plan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Acquire reusable release tool
        if: ${{ !fromJSON(needs.plan.outputs.run).release_tools }}
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json acquire
          --descriptor "$RUNNER_TEMP/exact-plan/artifacts/release_tools/tool.json" --output "$RUNNER_TEMP/release-tools"

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}
        with:
          version: 10.33.2

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}

      - name: Build portable release tool
        if: ${{ fromJSON(needs.plan.outputs.run).release_tools }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp tools/release/dist/tools-release "$RUNNER_TEMP/release-tools/tools-release"

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Verify portable release tool
        run: tools-release self-check

      - name: Resolve tools-release validation profile
        env:
          CHANNEL: stable
          END_USER_DISTRIBUTION: "true"
          PROFILE: stable-distribution
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN || secrets.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          STABLE_AUTHORIZED: ${{ inputs.confirm_end_user_distribution }}
        run: |
          set -euo pipefail
          tools-release policy resolve \
            --profile "$PROFILE" --channel "$CHANNEL" --release-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
            --endpoint-url "$STORAGE_ENDPOINT" --bucket "$STORAGE_BUCKET" --public-base-url "$PUBLIC_ORIGIN" \
            --end-user-distribution "$END_USER_DISTRIBUTION" --stable-authorized "$STABLE_AUTHORIZED" \
            --receipt "$RUNNER_TEMP/release-policy/release-policy.json"
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --capability plan \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/plan-authorization.json"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy
          if-no-files-found: error
          retention-days: 1

  validation:
    name: Exact validation (${{ matrix.target }})
    needs: [tools, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.validation_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.batch_run).validation }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ fromJSON(needs.plan.outputs.batch_run).validation && 'pnpm' || '' }}

      - uses: ./.github/actions/configure-ci-parallelism

      - name: Prepare validation workspace
        if: ${{ fromJSON(needs.plan.outputs.batch_run).validation }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
        run: pnpm install --frozen-lockfile

      - name: Materialize selected validation evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          tools-release validation materialize
          --root "$GITHUB_WORKSPACE" --source-commit "$SOURCE_SHA"
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/validation.json"
          --output "$RUNNER_TEMP/exact-validation"
          --receipt "$RUNNER_TEMP/validation-materialization.json"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exact-validation-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_contract_darwin_arm64 }}
        with:
          name: exact-validation-contract-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/contract
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_shell_darwin_arm64 }}
        with:
          name: exact-validation-shell-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/shell
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ success() && fromJSON(needs.plan.outputs.run).validation_closure_darwin_arm64 }}
        with:
          name: exact-validation-closure-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/products/closure
          if-no-files-found: error
          retention-days: 1

  scene:
    name: ${{ matrix.shell }} scene (${{ matrix.target }})
    needs: [tools, plan, capsule]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.electron_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Restore converged scene
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release scene import \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/scene.json" \
            --transport "$RUNNER_TEMP/exact-scene-artifact/scene.tar" --output "$RUNNER_TEMP/exact-scene"

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || (matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload]) }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || (matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload]) }}
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || (matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload]) }}

      - name: Prepare scene workspace
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] || (matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload]) }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build release-neutral scene inputs
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release build scene-inputs \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --output "$RUNNER_TEMP/exact-closure-resources" \
            --receipt "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json"

      - uses: actions/download-artifact@v8
        if: ${{ matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-capsule-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/capsules

      - name: Build native scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release build scene \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --resources "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json" --capsule-directory "$RUNNER_TEMP/capsules" \
            --output "$RUNNER_TEMP/exact-scene" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: Restore converged Electron base
        if: ${{ matrix.shell == 'electron' && !fromJSON(needs.plan.outputs.run)[matrix.base_workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.base_workload }}
          ARCHIVE_ZIP_PATH: /usr/bin/zip
        shell: bash
        run: |
          set -euo pipefail
          tools-release artifact acquire \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/base.json" \
            --output "$RUNNER_TEMP/base-contribution/artifact"

      - name: Build and contribute Electron base
        if: ${{ matrix.shell == 'electron' && fromJSON(needs.plan.outputs.run)[matrix.base_workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.base_workload }}
          ARCHIVE_ZIP_PATH: /usr/bin/zip
        shell: bash
        run: |
          set -euo pipefail
          tools-release build base \
            --root "$GITHUB_WORKSPACE" --shell electron --target "$TARGET" \
            --scene "$RUNNER_TEMP/exact-scene" \
            --output "$RUNNER_TEMP/exact-base" --receipt "$RUNNER_TEMP/base-build-receipt.json"
          tools-release base export \
            --target "$TARGET" \
            --build-receipt "$RUNNER_TEMP/base-build-receipt.json" \
            --output "$RUNNER_TEMP/base-contribution"

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ matrix.shell == 'electron' }}
        with:
          name: exact-base-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/base-contribution/artifact
          if-no-files-found: error
          retention-days: 1

      - name: Verify release-neutral scene
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          tools-release scene verify \
            --scene "$RUNNER_TEMP/exact-scene" --target "$TARGET"

      - name: Pack scene transport
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        shell: bash
        run: |
          tools-release scene pack \
            --scene "$RUNNER_TEMP/exact-scene" --output "$RUNNER_TEMP/exact-scene-artifact/scene.tar"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-scene-artifact/scene.tar
          if-no-files-found: error
          retention-days: 1

  terminal_scene:
    name: ${{ matrix.shell }} scene (${{ matrix.target }})
    needs: [tools, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.terminal_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Restore converged scene
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release scene import \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/scene.json" \
            --transport "$RUNNER_TEMP/exact-scene-artifact/scene.tar" --output "$RUNNER_TEMP/exact-scene"

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}

      - name: Prepare scene workspace
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: ${{ matrix.postinstall_level }}
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build release-neutral scene inputs
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release build scene-inputs \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --output "$RUNNER_TEMP/exact-closure-resources" \
            --receipt "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json"

      - name: Build native scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release build scene \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --resources "$RUNNER_TEMP/exact-closure-resources/resource-receipt.json" \
            --output "$RUNNER_TEMP/exact-scene" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: Verify release-neutral scene
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          tools-release scene verify \
            --scene "$RUNNER_TEMP/exact-scene" --target "$TARGET"

      - name: Pack scene transport
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        shell: bash
        run: |
          tools-release scene pack \
            --scene "$RUNNER_TEMP/exact-scene" --output "$RUNNER_TEMP/exact-scene-artifact/scene.tar"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-scene-artifact/scene.tar
          if-no-files-found: error
          retention-days: 1

  platform:
    name: Native platform (${{ matrix.target }})
    needs: [tools, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platform_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.plan.outputs.node_version }}

      - name: Restore converged platform
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release platform import \
            --target "$TARGET" \
            --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/platform.json" \
            --output "$RUNNER_TEMP/exact-platform/$TARGET"

      - uses: actions/checkout@v6.0.2
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          version: 10.33.2

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}

      - name: Build independent platform
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: ${{ matrix.postinstall_level }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          tools-release build platform \
            --root "$GITHUB_WORKSPACE" --shell electron --target "$TARGET" \
            --output "$RUNNER_TEMP/exact-platform/$TARGET" \
            --receipt "$RUNNER_TEMP/exact-platform/$TARGET/platform-build-receipt.json"

      - name: Contribute verified platform
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release platform export \
            --target "$TARGET" \
            --build-receipt "$RUNNER_TEMP/exact-platform/$TARGET/platform-build-receipt.json" \
            --output "$RUNNER_TEMP/platform-contribution"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-platform-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-platform
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-platform-cache-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/platform-contribution/artifact
          if-no-files-found: error
          retention-days: 1

  capsule:
    name: Capsule (${{ matrix.target }})
    needs: [tools, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.capsule_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.plan.outputs.node_version }}

      - name: Restore converged capsule
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release capsule import \
            --target "$TARGET" --descriptor "$RUNNER_TEMP/exact-plan/artifacts/$WORKLOAD/capsule.json" \
            --output "$RUNNER_TEMP/exact-capsule/$TARGET"

      - uses: actions/checkout@v6.0.2
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          version: 10.33.2

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}

      - name: Build independent capsule
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: ${{ matrix.postinstall_level }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          tools-release build capsule \
            --root "$GITHUB_WORKSPACE" --shell electron --target "$TARGET" \
            --output "$RUNNER_TEMP/exact-capsule/$TARGET" \
            --receipt "$RUNNER_TEMP/exact-capsule/$TARGET/capsule-build-receipt.json"

      - name: Export verified portable capsule
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          tools-release capsule export \
            --target "$TARGET" \
            --build-receipt "$RUNNER_TEMP/exact-capsule/$TARGET/capsule-build-receipt.json" \
            --output "$RUNNER_TEMP/capsule-contribution"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-capsule-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-capsule
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-capsule-cache-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/capsule-contribution/artifact
          if-no-files-found: error
          retention-days: 1

  data:
    name: Data resources (batch)
    needs: [tools, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan
      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Expose release tool
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: ./.github/actions/release-data
        with:
          source-sha: ${{ inputs.source_sha }}
          run: ${{ needs.plan.outputs.run }}

  prepare:
    name: Prepare signed exact content
    needs: [tools, plan, scene, terminal_scene, platform, capsule, data, validation]
    runs-on: ubuntu-24.04
    environment: standalone-stable-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-*-scene-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scenes

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - name: Authorize prepare capability
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --capability prepare \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/prepare-authorization.json"

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-platform-product-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/platforms
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-data-product-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/data-products
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-capsule-product-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/capsules
          merge-multiple: true

      - name: Compose and sign content metadata
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STANDALONE_VERSION: ${{ inputs.standalone_version }}
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN || secrets.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
          SHELL_MATRIX: ${{ needs.plan.outputs.shell_matrix }}
        run: |
          set -euo pipefail
          tools-release prepare \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --channel "$CHANNEL" --release-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" --root "$GITHUB_WORKSPACE" --standalone-version "$STANDALONE_VERSION" \
            --shells "$RUNNER_TEMP/exact-plan/inputs/shells.json" --scenes "$RUNNER_TEMP/scenes" \
            --capsules "$RUNNER_TEMP/capsules" --platforms "$RUNNER_TEMP/platforms" --data-resources "$RUNNER_TEMP/data-products" \
            --output "$RUNNER_TEMP/exact-prepare" --receipt "$RUNNER_TEMP/exact-prepare/prepare-receipt.json"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-prepared-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-prepare
          if-no-files-found: error
          retention-days: 1

  distribution:
    name: ${{ matrix.shell }} distribution (${{ matrix.target }})
    needs: [tools, plan, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scene-artifact

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: pnpm/action-setup@v5
        if: ${{ matrix.shell == 'electron' }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ matrix.shell == 'electron' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore distribution scene
        shell: bash
        run: |
          tools-release scene unpack \
            --archive "$RUNNER_TEMP/scene-artifact/scene.tar" --output "$RUNNER_TEMP/scene"

      - uses: ./.github/actions/configure-ci-parallelism
        if: ${{ matrix.shell == 'electron' }}

      - name: Prepare Electron distribution toolchain
        if: ${{ matrix.shell == 'electron' }}
        env:
          OPEN_DESIGN_POSTINSTALL_LEVEL: electron-build
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        if: ${{ matrix.shell == 'electron' }}
        with:
          name: exact-base-product-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/base-transport

      - name: Restore distribution base
        if: ${{ matrix.shell == 'electron' }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release base unpack \
            --target "$TARGET" \
            --source "$RUNNER_TEMP/base-transport" --output "$RUNNER_TEMP/base"

      - name: Build native distribution
        env:
          CSC_LINK: ${{ matrix.shell == 'electron' && secrets.APPLE_SIGNING_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.shell == 'electron' && secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.shell == 'electron' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.shell == 'electron' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.shell == 'electron' && secrets.APPLE_TEAM_ID || '' }}
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          tools-release build distribution \
            --root "$GITHUB_WORKSPACE" --shell "$SHELL_TYPE" --target "$TARGET" \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --scene "$RUNNER_TEMP/scene" --prepared "$RUNNER_TEMP/prepared" --base-directory "$RUNNER_TEMP/base" \
            --output "$RUNNER_TEMP/distribution" --receipt "$RUNNER_TEMP/distribution/distribution-receipt.json"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-distribution-${{ matrix.shell }}-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distribution
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Finalize and publish exact channel
    needs: [tools, plan, distribution]
    runs-on: ubuntu-24.04
    environment: standalone-stable-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-distribution-*-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distributions

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - name: Authorize finalize capability
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --capability finalize \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/finalize-authorization.json"

      - name: Finalize signed Shell sidecar and channel head
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SHELL_MATRIX: ${{ needs.plan.outputs.shell_matrix }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
        run: |
          set -euo pipefail
          tools-release finalize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --prepared "$RUNNER_TEMP/prepared" \
            --distributions "$RUNNER_TEMP/distributions" --output "$RUNNER_TEMP/exact-final" \
            --receipt "$RUNNER_TEMP/exact-final/pack-receipt.json"

      - name: Publish immutable release objects
        env:
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN || secrets.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          tools-release publish \
            --pack-receipt "$RUNNER_TEMP/exact-final/pack-receipt.json" --policy "$RUNNER_TEMP/release-policy/release-policy.json" \
            --endpoint-url "$STORAGE_ENDPOINT" --bucket "$STORAGE_BUCKET" --public-base-url "$PUBLIC_ORIGIN" \
            --receipt "$RUNNER_TEMP/exact-final/publish-receipt.json"
          cp "$RUNNER_TEMP/release-policy/release-policy.json" "$RUNNER_TEMP/exact-final/release-policy.json"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-published-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-final
          if-no-files-found: error
          retention-days: 1

      - name: Bind workload results in the Linux control plane
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json contribute-all
          --pending "$RUNNER_TEMP/exact-plan/pending.json" --source-commit "$SOURCE_SHA"
          --output "$RUNNER_TEMP/convergence-products"

      - name: Create reusable scene handoff
        id: convergence_handoff
        continue-on-error: true
        run: >-
          python3 .github/scripts/convergence.py
          --config .github/config/plan/release-stable.json
          handoff
          --pending "$RUNNER_TEMP/exact-plan/pending.json"
          --products-root "$RUNNER_TEMP/convergence-products"
          --handoff-root "$RUNNER_TEMP/handoff-convergence-exact-scenes"
          --id release-stable-results

      - name: Upload reusable scene handoff
        if: ${{ steps.convergence_handoff.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.convergence_handoff.outputs.name }}
          path: ${{ steps.convergence_handoff.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-stable-${{ inputs.release_version }}-receipts
          path: |
            ${{ runner.temp }}/exact-final/*.json
            ${{ runner.temp }}/exact-final/documents/*.json
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Public installed acceptance (${{ matrix.shell }}/${{ matrix.target }})
    needs: [tools, plan, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-published-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/published

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Authorize installed acceptance capability
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/published/release-policy.json" --capability acceptance \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/acceptance-authorization.json"

      - name: Inspect accepted carrier compatibility
        if: ${{ matrix.shell == 'electron' }}
        shell: bash
        run: >-
          tools-release baseline inspect
          --publish-receipt "$RUNNER_TEMP/published/publish-receipt.json"
          --policy "$RUNNER_TEMP/published/release-policy.json" --target "${{ matrix.target }}"
          --receipt "$RUNNER_TEMP/baseline-inspection/receipt.json" --github-env "$GITHUB_ENV"

      - name: Retain notification comparison baseline
        if: ${{ matrix.shell == 'electron' && matrix.target == 'darwin-arm64' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-notification-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline-inspection/accepted-baseline.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Download accepted public artifact
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release acceptance fetch \
            --publication "$RUNNER_TEMP/published/publish-receipt.json" \
            --policy "$RUNNER_TEMP/published/release-policy.json" \
            --shell "$SHELL_TYPE" --target "$TARGET" --output "$RUNNER_TEMP" \
            --receipt "$RUNNER_TEMP/required-acceptance.json" --github-env "$GITHUB_ENV"

      - name: Install and exercise Darwin Shell lifecycle
        if: ${{ matrix.shell == 'terminal' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: >-
          tools-release installation exercise
          --publication "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json"
          --shell terminal --target "${{ matrix.target }}" --mode first
          --artifact "$RUNNER_TEMP/public-shell-artifact.tar.gz" --work-root "$RUNNER_TEMP/installed-acceptance"

      - name: Install and exercise macOS Electron Shell
        if: ${{ matrix.shell == 'electron' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: >-
          tools-release installation exercise
          --publication "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json"
          --shell electron --target "${{ matrix.target }}" --mode first
          --artifact "$RUNNER_TEMP/public-shell-artifact.dmg" --work-root "$RUNNER_TEMP/installed-acceptance"

      - uses: actions/download-artifact@v8
        if: ${{ matrix.shell == 'electron' && env.ELECTRON_ACCEPTANCE_MODE == 'hot' }}
        with:
          name: exact-validation-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation

      - name: Fetch accepted baseline for upgrade acceptance
        if: ${{ matrix.shell == 'electron' && env.ELECTRON_ACCEPTANCE_MODE == 'hot' }}
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          tools-release baseline fetch \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --baseline "$RUNNER_TEMP/baseline-inspection/accepted-baseline.json" --publish-receipt "$RUNNER_TEMP/published/publish-receipt.json" \
            --validation "$RUNNER_TEMP/exact-validation/shell.json" \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" --target "$TARGET" --output "$RUNNER_TEMP/baseline" \
            --receipt "$RUNNER_TEMP/baseline/fetch-receipt.json"

      - name: Exercise accepted macOS Shell through CDP hot update
        if: ${{ matrix.shell == 'electron' && env.ELECTRON_ACCEPTANCE_MODE == 'hot' && startsWith(matrix.target, 'darwin-') }}
        env:
          CHANNEL: stable
        shell: bash
        run: >-
          tools-release installation exercise
          --publication "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json"
          --shell electron --target "${{ matrix.target }}" --mode hot
          --artifact "$RUNNER_TEMP/baseline/baseline-shell-artifact.dmg" --work-root "$RUNNER_TEMP/installed-acceptance"
          --baseline-receipt "$RUNNER_TEMP/baseline/fetch-receipt.json"

      - name: Install and exercise Windows Electron Shell
        if: ${{ matrix.shell == 'electron' && startsWith(matrix.target, 'win32-') }}
        shell: pwsh
        run: >-
          tools-release installation exercise
          --publication "$env:RUNNER_TEMP/published/publish-receipt.json" --policy "$env:RUNNER_TEMP/published/release-policy.json"
          --shell electron --target "${{ matrix.target }}" --mode first
          --artifact "$env:RUNNER_TEMP/public-shell-artifact.exe" --work-root "$env:RUNNER_TEMP/installed-acceptance"

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: stable-installation-diagnostics-${{ matrix.shell }}-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/installed-acceptance/diagnostics
          if-no-files-found: ignore
          retention-days: 1

      - name: Bind installed acceptance credential
        shell: bash
        run: >-
          tools-release installation collect
          --publication "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json"
          --shell "${{ matrix.shell }}" --target "${{ matrix.target }}"
          --work-root "$RUNNER_TEMP/installed-acceptance" --inspection "$RUNNER_TEMP/baseline-inspection/receipt.json"
          --receipt "$RUNNER_TEMP/acceptance/${{ matrix.shell }}-${{ matrix.target }}.json"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-acceptance-${{ matrix.shell }}-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 30

  activate:
    name: Activate accepted exact channel
    needs: [tools, acceptance]
    runs-on: ubuntu-24.04
    environment: standalone-stable-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: Expose release tool
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: exact-published-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/published

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-acceptance-*-${{ inputs.release_version }}
          path: ${{ runner.temp }}/acceptances
          merge-multiple: true

      - name: Activate latest channel head after acceptance
        env:
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
        run: |
          set -euo pipefail
          tools-release activate \
            --publish-receipt "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json" \
            --channel-head "$RUNNER_TEMP/published/documents/channel-head.json" --acceptances "$RUNNER_TEMP/acceptances" \
            --receipt "$RUNNER_TEMP/activate-receipt.json"

      - name: Promote accepted Electron baseline snapshot
        env:
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
        run: |
          set -euo pipefail
          tools-release baseline promote \
            --publish-receipt "$RUNNER_TEMP/published/publish-receipt.json" --policy "$RUNNER_TEMP/published/release-policy.json" \
            --channel-head "$RUNNER_TEMP/published/documents/channel-head.json" --activation-receipt "$RUNNER_TEMP/activate-receipt.json" \
            --acceptance "$RUNNER_TEMP/acceptances/electron-darwin-arm64.json" \
            --receipt "$RUNNER_TEMP/baseline-promote-receipt.json"

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: exact-activation-stable-${{ inputs.release_version }}
          path: |
            ${{ runner.temp }}/activate-receipt.json
            ${{ runner.temp }}/baseline-promote-receipt.json
          if-no-files-found: error
          retention-days: 30

  notify:
    name: Report release outcome
    needs: [plan, tools, validation, scene, terminal_scene, platform, capsule, data, prepare, distribution, publish, acceptance, activate]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report and notify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FEISHU_BOT: ${{ secrets.RELEASE_FEISHU_STABLE }}
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
          RELEASE_CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 .github/scripts/feishu.py
          --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
          --plan-artifact "exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          --publication-artifact "exact-$RELEASE_CHANNEL-$RELEASE_VERSION-receipts"
          --activation-artifact "exact-activation-$RELEASE_CHANNEL-$RELEASE_VERSION"
          --baseline-artifact "exact-notification-baseline-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/notification/report.json"

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: release-notification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notification/report.json
          if-no-files-found: warn
          retention-days: 30
