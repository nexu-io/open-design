          storage-bucket: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          public-origin: ${{ vars.OD_WORKLOAD_RESULTS_BASE_URL || secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          access-key-id: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          secret-access-key: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}

  prepare:
    name: "[prepare] Release content · validated and signed"
    needs: [tools, plan, scene, terminal_scene, platform, capsule, data, validation]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: standalone-stable-release
    timeout-minutes: 10
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: "[setup] Node.js · declared toolchain"
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: "[fetch] exact-set-scene-set · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.batch_run).scenes }}
        with:
          pattern: exact-*-scene-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scenes

      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: "[fetch] release-tools · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-tools-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-tools

      - name: "[setup] Expose release tool"
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/release-tools/tools-release"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: "[fetch] release-policy · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-policy

      - name: "[validate] Authorize prepare capability"
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tools-release policy authorize \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --capability prepare \
            --channel "$CHANNEL" --release-version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/prepare-authorization.json"

      - name: "[fetch] exact-platform-product-set · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.batch_run).platforms }}
        with:
          pattern: exact-platform-product-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/platforms
          merge-multiple: true

      - name: "[fetch] Acquire complete platform inputs"
        run: >-
          tools-release platform acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/platforms.json"
          --output "$RUNNER_TEMP/platforms"


      - name: "[validate] Closure data references · current run"
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          PRODUCT_RECEIPTS: ${{ needs.data.outputs.products || '{}' }}
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json bind
          --pending "$RUNNER_TEMP/exact-plan/pending.json" --batch data
          --products-json "$PRODUCT_RECEIPTS" --output "$RUNNER_TEMP/exact-plan/artifacts"
          --products-root "$RUNNER_TEMP/convergence-products"

      - name: "[fetch] Closure data resources · complete version set"
        run: >-
          tools-release resource acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/data.json"
          --products "$RUNNER_TEMP/data-built"
          --output "$RUNNER_TEMP/data-products"
          --receipt "$RUNNER_TEMP/data-acquisition.json"

      - name: "[fetch] exact-capsule-product-set · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.batch_run).capsules }}
        with:
          pattern: exact-capsule-product-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/capsules
          merge-multiple: true

      - name: "[fetch] Acquire complete capsule inputs"
        run: >-
          tools-release capsule acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/capsules.json"
          --output "$RUNNER_TEMP/capsules"

      - name: "[fetch] Acquire complete scene inputs"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          tools-release scene acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/scenes.json"
          --source-commit "$SOURCE_SHA" --output "$RUNNER_TEMP/scenes"

      - name: "[fetch] exact-validation-contract-darwin-arm64 · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.run).validation_contract_darwin_arm64 }}
        with:
          name: exact-validation-contract-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/validation-products/contract

      - name: "[fetch] exact-validation-shell-darwin-arm64 · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.run).validation_shell_darwin_arm64 }}
        with:
          name: exact-validation-shell-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/validation-products/shell

      - name: "[fetch] exact-validation-closure-darwin-arm64 · workflow artifact"
        uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.run).validation_closure_darwin_arm64 }}
        with:
          name: exact-validation-closure-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/validation-products/closure

      - name: "[fetch] Acquire complete validation evidence"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          tools-release validation acquire
          --sources "$RUNNER_TEMP/exact-plan/artifacts/batches/validation.json"
          --products "$RUNNER_TEMP/validation-products" --source-commit "$SOURCE_SHA"
          --output "$RUNNER_TEMP/exact-validation"

      - name: "[store] exact-validation-darwin-arm64 · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-validation-darwin-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-validation/*.json
          if-no-files-found: error
          retention-days: 30

      - name: "[sign] Compose and sign content metadata"
        env:
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          CHANNEL: stable
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STANDALONE_VERSION: ${{ inputs.standalone_version }}
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN || secrets.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
          SHELL_MATRIX: ${{ needs.plan.outputs.shell_matrix }}
        run: |
          set -euo pipefail
          tools-release prepare \
            --policy "$RUNNER_TEMP/release-policy/release-policy.json" --channel "$CHANNEL" --release-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" --root "$GITHUB_WORKSPACE" --standalone-version "$STANDALONE_VERSION" \
            --shells "$RUNNER_TEMP/exact-plan/inputs/shells.json" --scenes "$RUNNER_TEMP/scenes" \
            --capsules "$RUNNER_TEMP/capsules" --platforms "$RUNNER_TEMP/platforms" --data-resources "$RUNNER_TEMP/data-products" \
            --output "$RUNNER_TEMP/exact-prepare" --receipt "$RUNNER_TEMP/exact-prepare/prepare-receipt.json" \
            --native-output "$RUNNER_TEMP/exact-installation-input" --freeze-storage true

      - name: "[store] exact-prepared-stable · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-prepared-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-prepare
          if-no-files-found: error
          retention-days: 1

      - name: "[store] exact-installation-input-stable · workflow artifact"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-installation-input-stable-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-installation-input
          if-no-files-found: error
          retention-days: 1

      - name: "[validate] Bind workload results in the Linux control plane"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 .github/scripts/convergence.py --config .github/config/plan/release-stable.json contribute-all
          --pending "$RUNNER_TEMP/exact-plan/pending.json" --source-commit "$SOURCE_SHA"
          --output "$RUNNER_TEMP/convergence-products"

      - name: "[prepare] Create reusable scene handoff"
        id: convergence_handoff
        continue-on-error: true
        run: >-
          python3 .github/scripts/convergence.py
          --config .github/config/plan/release-stable.json
          handoff
          --pending "$RUNNER_TEMP/exact-plan/pending.json"
          --products-root "$RUNNER_TEMP/convergence-products"
          --handoff-root "$RUNNER_TEMP/handoff-convergence-exact-scenes"
          --id release-stable-results

      - name: "[store] Upload reusable scene handoff"
        if: ${{ steps.convergence_handoff.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.convergence_handoff.outputs.name }}
          path: ${{ steps.convergence_handoff.outputs.path }}
          if-no-files-found: error
          retention-days: 1
  distribution:
    name: "[build] ${{ matrix.shell }} distribution · ${{ matrix.target }} · native package"
    needs: [tools, plan, prepare]
    if: ${{ !cancelled() && !failure() && needs.tools.result == 'success' && needs.plan.result == 'success' && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
