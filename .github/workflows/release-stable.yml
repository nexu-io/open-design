    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "[fetch] Repository source · pinned SHA"
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: "[fetch] exact-convergence-plan · workflow artifact"
        uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
