name: distribution

on:
  workflow_call:
    inputs:
      channel:
        description: Registered release channel selected by an explicit release ritual
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      release_version:
        required: false
        type: string
        default: ""
      release_name:
        required: false
        type: string
        default: ""
      prerelease_version:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: string
        default: metadata
      amr_profile:
        required: false
        type: string
        default: prod
      mac_arm64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_x64_sign_mode:
        required: false
        type: string
        default: notarized
      win_x64_sign_mode:
        required: false
        type: string
        default: unsigned
      win_x64_smoke_mode:
        required: false
        type: string
        default: core
      win_x64_update_metadata_url:
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        required: false
        type: string
        default: ""
      enhanced_validation:
        required: false
        type: boolean
        default: false
      stable_qualification:
        required: false
        type: boolean
        default: false
      smoke_advisory:
        required: false
        type: boolean
        default: false
      verify_notarization:
        required: false
        type: boolean
        default: false
      enable_mac_arm64:
        required: false
        type: boolean
        default: true
      enable_mac_x64:
        required: false
        type: boolean
        default: true
      enable_win_x64:
        required: false
        type: boolean
        default: true
      publish:
        required: false
        type: boolean
        default: true
      promote:
        required: false
        type: boolean
        default: true
      force:
        required: false
        type: boolean
        default: false
      shell_version:
        required: false
        type: string
        default: ""
      closure_version:
        required: false
        type: string
        default: ""
      release_origin:
        required: false
        type: string
        default: cloudflare-r2
      release_public_origin:
        required: false
        type: string
        default: ""
      mac_arm64_smoke_mode:
        required: false
        type: string
        default: core
      mac_arm64_target:
        required: false
        type: string
        default: dmg
      mac_arm64_update_metadata_url:
        required: false
        type: string
        default: ""
      mac_arm64_update_target_version:
        required: false
        type: string
        default: ""
      mac_x64_smoke_mode:
        required: false
        type: string
        default: core
      mac_x64_target:
        required: false
        type: string
        default: all
      win_x64_target:
        required: false
        type: string
        default: all
    outputs:
      release_version:
        value: ${{ jobs.beta.outputs.beta_version || jobs.counted.outputs.release_version || jobs.stable.outputs.release_version }}
      beta_version:
        value: ${{ jobs.beta.outputs.beta_version }}
      shell_version:
        value: ${{ jobs.beta.outputs.shell_version }}
      closure_version:
        value: ${{ jobs.beta.outputs.closure_version }}
      channel:
        value: ${{ inputs.channel }}
      branch:
        value: ${{ jobs.beta.outputs.branch || jobs.counted.outputs.branch || jobs.stable.outputs.branch }}
      commit:
        value: ${{ jobs.beta.outputs.commit || jobs.counted.outputs.commit || jobs.stable.outputs.commit }}
      previous_commit:
        value: ${{ jobs.beta.outputs.previous_commit || jobs.counted.outputs.previous_commit || jobs.stable.outputs.previous_commit }}
      release_state:
        value: ${{ jobs.beta.outputs.release_state }}
      dry_run:
        value: ${{ jobs.stable.outputs.dry_run }}
      dry_run_mode:
        value: ${{ jobs.stable.outputs.dry_run_mode }}
      version_metadata_url:
        value: ${{ jobs.beta.outputs.version_metadata_url || jobs.counted.outputs.version_metadata_url || jobs.stable.outputs.version_metadata_url }}
      stable_qualification_url:
        value: ${{ jobs.counted.outputs.stable_qualification_url }}
      mac_arm64_url:
        value: ${{ jobs.beta.outputs.mac_arm64_url || jobs.counted.outputs.mac_arm64_url || jobs.stable.outputs.mac_arm64_url }}
      mac_x64_url:
        value: ${{ jobs.beta.outputs.mac_x64_url || jobs.counted.outputs.mac_intel_url || jobs.stable.outputs.mac_intel_url }}
      mac_intel_url:
        value: ${{ jobs.counted.outputs.mac_intel_url || jobs.stable.outputs.mac_intel_url }}
      win_x64_url:
        value: ${{ jobs.beta.outputs.win_x64_url || jobs.counted.outputs.win_url || jobs.stable.outputs.win_url }}
      win_url:
        value: ${{ jobs.counted.outputs.win_url || jobs.stable.outputs.win_url }}
      mac_arm64_smoke_result:
        value: ${{ jobs.beta.outputs.mac_arm64_smoke_result || jobs.counted.outputs.mac_arm64_smoke_result }}
      mac_x64_smoke_result:
        value: ${{ jobs.counted.outputs.mac_x64_smoke_result }}
      win_x64_smoke_result:
        value: ${{ jobs.beta.outputs.win_x64_smoke_result || jobs.counted.outputs.win_x64_smoke_result }}

jobs:
  validate:
    name: Validate release ritual profile
    runs-on: ubuntu-latest
    steps:
      - name: Require a registered channel and its safety profile
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.channel }}" in
            beta|preview) ;;
            prerelease)
              [ "${{ inputs.enhanced_validation }}" = "true" ]
              [ "${{ inputs.stable_qualification }}" = "true" ]
              [ "${{ inputs.verify_notarization }}" = "true" ]
              ;;
            stable)
              [ -n "${{ inputs.prerelease_version }}" ]
              ;;
            *) echo "unregistered release channel: ${{ inputs.channel }}" >&2; exit 1 ;;
          esac

  beta:
    needs: validate
    if: ${{ inputs.channel == 'beta' }}
    uses: ./.github/workflows/distribution-beta.yml
    secrets: inherit
    with:
      enable_mac_arm64: ${{ inputs.enable_mac_arm64 }}
      enable_mac_x64: ${{ inputs.enable_mac_x64 }}
      enable_win_x64: ${{ inputs.enable_win_x64 }}
      publish: ${{ inputs.publish }}
      promote: ${{ inputs.promote }}
      force: ${{ inputs.force }}
      release_version: ${{ inputs.release_version }}
      shell_version: ${{ inputs.shell_version }}
      closure_version: ${{ inputs.closure_version }}
      release_origin: ${{ inputs.release_origin }}
      release_public_origin: ${{ inputs.release_public_origin }}
      ref: ${{ inputs.ref }}
      amr_profile: ${{ inputs.amr_profile }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_arm64_smoke_mode: ${{ inputs.mac_arm64_smoke_mode }}
      mac_arm64_target: ${{ inputs.mac_arm64_target }}
      mac_arm64_update_metadata_url: ${{ inputs.mac_arm64_update_metadata_url }}
      mac_arm64_update_target_version: ${{ inputs.mac_arm64_update_target_version }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      mac_x64_smoke_mode: ${{ inputs.mac_x64_smoke_mode }}
      mac_x64_target: ${{ inputs.mac_x64_target }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_target: ${{ inputs.win_x64_target }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}

  counted:
    needs: validate
    if: ${{ inputs.channel == 'preview' || inputs.channel == 'prerelease' }}
    uses: ./.github/workflows/distribution-counted.yml
    secrets: inherit
    with:
      channel: ${{ inputs.channel }}
      release_name: ${{ inputs.release_name }}
      enhanced_validation: ${{ inputs.enhanced_validation }}
      stable_qualification: ${{ inputs.stable_qualification }}
      smoke_advisory: ${{ inputs.smoke_advisory }}
      verify_notarization: ${{ inputs.verify_notarization }}
      ref: ${{ inputs.ref }}
      release_version: ${{ inputs.release_version }}
      amr_profile: ${{ inputs.amr_profile }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}

  stable:
    needs: validate
    if: ${{ inputs.channel == 'stable' }}
    uses: ./.github/workflows/distribution-stable.yml
    secrets: inherit
    with:
      prerelease_version: ${{ inputs.prerelease_version }}
      dry_run: ${{ inputs.dry_run }}
      ref: ${{ inputs.ref }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}
