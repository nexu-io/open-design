name: distribution-exact-accept

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Candidate commit SHA from its manifest."
        required: true
        type: string
      exact_name:
        description: "Candidate channel, including prerelease or an exact channel."
        required: true
        type: string
      metadata_url:
        description: "Immutable candidate version metadata URL."
        required: true
        type: string
      mutable_metadata_url:
        description: "Acceptance discovery URL; the immutable metadata URL itself is valid."
        required: true
        type: string
      public_origin:
        description: "Release public origin."
        required: true
        type: string
      release_version:
        description: "Exact occupied candidate version."
        required: true
        type: string
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      exact_name:
        required: true
        type: string
      metadata_url:
        required: true
        type: string
      mutable_metadata_url:
        required: true
        type: string
      public_origin:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  public_acceptance:
    name: Accept public ${{ matrix.target }} exact artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_dir: dmg
            namespace: release-${{ inputs.exact_name }}
            os: mac
            runner: macos-14
            target: mac_arm64
          - artifact_dir: dmg
            namespace: release-${{ inputs.exact_name }}-x64
            os: mac
            runner: macos-15-intel
            target: mac_x64
          - artifact_dir: builder
            namespace: release-${{ inputs.exact_name }}-win
            os: win
            runner: windows-latest
            target: win_x64
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_SHA: ${{ inputs.commit }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_NAMESPACE: ${{ matrix.namespace }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Re-download immutable public ${{ matrix.target }} artifacts
        env:
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_PUBLIC_ACCEPTANCE_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          RELEASE_PUBLIC_ACCEPTANCE_DOWNLOAD_DIR: ${{ runner.temp }}/public-feedback/tools-pack/out/${{ matrix.os }}/namespaces/${{ matrix.namespace }}/${{ matrix.artifact_dir }}
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
        run: pnpm exec tools-release prepare-public-acceptance
      - name: Smoke immutable public ${{ matrix.target }} install and online Closure cold start
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          OD_PACKAGED_E2E_MAC: ${{ matrix.os == 'mac' && '1' || '' }}
          OD_PACKAGED_E2E_MAC_SMOKE_LANES: shell
          OD_PACKAGED_E2E_MAC_SMOKE_PROFILE: core
          OD_PACKAGED_E2E_NAMESPACE: ${{ matrix.namespace }}
          OD_PACKAGED_E2E_RELEASE_CHANNEL: ${{ inputs.exact_name }}
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ inputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/public-feedback/report
          OD_PACKAGED_E2E_SHELL_SMOKE_PROOF: public-immutable-artifacts
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/public-feedback/tools-pack
          # Exercise the final reusable-Shell shape: an empty Store receives a
          # mutable latest discovery URL, then Standalone re-fetches the exact
          # immutable sibling before preparation. No releaseVersion is injected.
          OD_STANDALONE_METADATA_URL: ${{ inputs.mutable_metadata_url }}
          OD_PACKAGED_E2E_WIN: ${{ matrix.os == 'win' && '1' || '' }}
          OD_PACKAGED_E2E_WIN_SMOKE_LANES: shell
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: core
          OD_TOOLS_PACK_EMBEDDED_CONFIG_ONLY: "1"
        run: pnpm exec tsx scripts/release-smoke.ts ${{ matrix.os }} specs/${{ matrix.os }}.spec.ts
      - name: Issue public ${{ matrix.target }} acceptance credential
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
          RELEASE_PUBLIC_ACCEPTANCE_SMOKE_SUMMARY_PATH: ${{ runner.temp }}/public-feedback/report/summary.json
          RELEASE_PUBLIC_ACCEPTANCE_SUITE_RESULT_PATH: ${{ runner.temp }}/public-feedback/report/suite-result.json
        run: pnpm exec tools-release issue-public-acceptance
      - name: Upload public ${{ matrix.target }} acceptance credential
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance
          path: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          if-no-files-found: error
      - name: Upload public ${{ matrix.target }} acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance-evidence
          path: |
            ${{ runner.temp }}/public-feedback/build.json
            ${{ runner.temp }}/public-feedback/plan.json
            ${{ runner.temp }}/public-feedback/report
          if-no-files-found: warn

  activate:
    name: Activate accepted exact release
    needs: public_acceptance
    if: ${{ !cancelled() && needs.public_acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_CHANNEL: ${{ inputs.exact_name }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download all public acceptance credentials
        uses: actions/download-artifact@v8
        with:
          pattern: open-design-${{ inputs.exact_name }}-*-public-acceptance
          merge-multiple: true
          path: ${{ runner.temp }}/public-acceptance
      - name: Issue stable qualification for accepted prerelease
        if: ${{ inputs.exact_name == 'prerelease' }}
        env:
          RELEASE_MAC_ARM64_SMOKE_RESULT: success
          RELEASE_MAC_X64_SMOKE_RESULT: success
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata/metadata.json
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-qualification/outputs.json
          RELEASE_QUALIFICATION_WORK_DIR: ${{ runner.temp }}/release-qualification
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_WIN_X64_SMOKE_RESULT: success
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_MANIFEST_DIR" "$(dirname "$RELEASE_METADATA_PATH")"
          curl -fsSL "$RELEASE_METADATA_URL" -o "$RELEASE_METADATA_PATH"
          for target in mac_arm64 mac_x64 win_x64; do
            jq --arg target "$target" '.releaseTargets[$target]' "$RELEASE_METADATA_PATH" > "$RELEASE_MANIFEST_DIR/$target.json"
          done
          pnpm exec tools-release issue-stable-qualification
      - name: Activate accepted immutable exact metadata with CAS
        env:
          RELEASE_ACTIVATION_WORK_DIR: ${{ runner.temp }}/release-activation
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-activation/outputs.json
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_DIR: ${{ runner.temp }}/public-acceptance
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release activate-public-release
      - name: Read back activated exact public feed
        env:
          RELEASE_LATEST_METADATA_URL: ${{ inputs.public_origin }}/${{ inputs.exact_name }}/latest/metadata.json
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_PUBLIC_FEED_REPORT_PATH: ${{ runner.temp }}/release-activation/public-feed-observation.json
        run: pnpm exec tools-release observe-public-feed
      - name: Publish activation summary
        run: |
          {
            echo "## Accepted exact activation"
            echo ""
            echo "- version: \`${{ inputs.release_version }}\`"
            echo "- commit: \`${{ inputs.commit }}\`"
            echo "- mac_arm64/mac_x64/win_x64 public artifact smoke: \`success\`"
            echo "- latest CAS and public readback: \`success\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
