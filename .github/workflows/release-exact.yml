name: Notarization timing experiment (no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notarization-timing-experiment
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/experiment/notarization-timing'
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [full, minimal]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare sample from the same released arm64 app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release/notarization-experiment.py prepare "${{ matrix.variant }}"
      - name: Sign, submit once, wait, and validate
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 .github/scripts/release/notarization-experiment.py measure "${{ matrix.variant }}"
      - name: Retain reports only, never application packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-timing-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/notarization-experiment/reports/
          if-no-files-found: warn
          retention-days: 14
