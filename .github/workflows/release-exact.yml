name: release-exact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full current-main commit to build
        required: true
        type: string
      channel:
        description: Isolated exact channel
        required: true
        type: choice
        options: [somechan, somepreview, betahyx]
      release_version:
        description: Counted channel version, for example 0.1.0-somechan.1
        required: true
        type: string
      standalone_version:
        description: Independently versioned Standalone runtime
        required: true
        default: 0.1.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-exact-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release-neutral Shell scenes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.convergence.outputs.run }}
      shell_matrix: ${{ steps.topology.outputs.shell_matrix }}
    steps:
      - name: Validate immutable inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          [[ "$CHANNEL" == "somechan" || "$CHANNEL" == "somepreview" || "$CHANNEL" == "betahyx" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-${CHANNEL}\.[0-9]+$ ]]

      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Verify exact release transition algebra
        run: python3 .github/scripts/release.py --self-check

      - uses: pnpm/action-setup@v5
        if: ${{ inputs.channel == 'betahyx' }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ inputs.channel == 'betahyx' }}
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Build exact content-identity planner
        if: ${{ inputs.channel == 'betahyx' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @open-design/metatool build
          pnpm --filter @open-design/tools-release build

      - name: Resolve canonical Electron release plans
        if: ${{ inputs.channel == 'betahyx' }}
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLIC_ORIGIN: ${{ secrets.EXACT_RELEASE_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-plan"
          for target in darwin-arm64 win32-x64; do
            node tools/release/bin/tools-release.mjs exact-release-plan \
              --root "$GITHUB_WORKSPACE" \
              --channel "$CHANNEL" \
              --target "$target" \
              --accepted-pointer-url "${PUBLIC_ORIGIN%/}/$CHANNEL/accepted/electron/$target/latest.json" \
              --output "$RUNNER_TEMP/exact-plan/electron-$target.json"
          done

      - name: Resolve Shell topology
        id: topology
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          topology = [
              {"shell": "terminal", "target": "darwin-arm64", "workload": "terminal_scene_darwin_arm64", "runner_class": "terminal_darwin_arm64", "runs_on": "macos-15"},
          ]
          if os.environ["CHANNEL"] == "betahyx":
              topology.extend([
                  {"shell": "electron", "target": "darwin-arm64", "workload": "electron_scene_darwin_arm64", "runner_class": "electron_darwin_arm64", "runs_on": "macos-15"},
                  {"shell": "electron", "target": "win32-x64", "workload": "electron_scene_win32_x64", "runner_class": "electron_win32_x64", "runs_on": "windows-2025"},
              ])
          root = os.path.join(os.environ["RUNNER_TEMP"], "exact-plan")
          os.makedirs(root, exist_ok=True)
          with open(os.path.join(root, "topology.json"), "w") as destination:
              json.dump(topology, destination, sort_keys=True, separators=(",", ":"))
              destination.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("shell_matrix=" + json.dumps({"include": topology}, separators=(",", ":")) + "\n")
          PY

      - name: Resolve reusable scene results
        id: convergence
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"], "exact-plan")
          topology = json.loads(root.joinpath("topology.json").read_text())
          root.joinpath("scope.json").write_text(json.dumps({"enabled": {item["workload"]: True for item in topology}}, sort_keys=True) + "\n")
          root.joinpath("runners.json").write_text(json.dumps({item["runner_class"]: [item["runs_on"]] for item in topology}, sort_keys=True) + "\n")
          PY
          RUNNER_PLAN=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' "$RUNNER_TEMP/exact-plan/runners.json")
          python3 .github/scripts/convergence.py \
            --config .github/config/convergence-exact.json \
            github-output \
            --workflow release-exact \
            --scope-plan "$RUNNER_TEMP/exact-plan/scope.json" \
            --runner-plan-json "$RUNNER_PLAN" \
            --mode enforce \
            --pending "$RUNNER_TEMP/exact-plan/pending.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan
          if-no-files-found: error
          retention-days: 1

  scene:
    name: ${{ matrix.shell }} scene (${{ matrix.target }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: Restore converged scene
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["RUNNER_TEMP"])
          workload = json.loads((root / "exact-plan" / "pending.json").read_text())["workloads"][os.environ["WORKLOAD"]]
          result = workload.get("result")
          if not workload.get("resultHit") or not result:
              raise SystemExit("convergence planner omitted a required scene without a result")
          product = result["products"]["scene"]
          archive = root / "exact-scene-cache.zip"
          urllib.request.urlretrieve(product["source"], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != product["data"]["sha256"]:
              raise SystemExit("converged scene product digest mismatch")
          destination = root / "exact-scene"
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  path = PurePosixPath(entry.filename.rstrip("/"))
                  if not entry.filename or entry.filename.startswith(("/", "\\")) or "\\" in entry.filename or ".." in path.parts:
                      raise SystemExit(f"unsafe converged scene entry: {entry.filename!r}")
              source.extractall(destination)
          PY

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Build release-neutral scene inputs
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          CHANNEL: ${{ inputs.channel }}
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @open-design/platform build
          pnpm --filter @open-design/sidecar build
          pnpm --filter @open-design/standalone build
          pnpm --filter @open-design/closure build
          pnpm --filter @open-design/electron-kit build
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          shell_type, target = os.environ["SHELL_TYPE"], os.environ["TARGET"]
          if shell_type == "terminal":
              lock = json.loads(Path("shells/terminal/node-lock.json").read_text())
              value = lock["targets"][target]
              destination = Path(os.environ["RUNNER_TEMP"], "exact-node", value["archive"])
              destination.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(value["url"], destination)
              if hashlib.sha256(destination.read_bytes()).hexdigest() != value["sha256"]:
                  raise SystemExit("official Node archive digest mismatch")
              request = {
                  "schemaVersion": 1, "operation": "terminal.scene.build", "target": target,
                  "shellVersion": Path("shells/terminal/version").read_text().strip(),
                  "node": {"version": lock["version"], "archiveFile": str(destination), "archiveSha256": value["sha256"]},
                  "closureArtifactFile": str(Path("apps/closure/dist/index.mjs").resolve()),
                  "standaloneDirectory": str(Path("packages/standalone/dist").resolve()),
                  "sidecarDirectory": str(Path("packages/sidecar/dist").resolve()),
                  "platformDirectory": str(Path("packages/platform/dist").resolve()),
                  "sceneDirectory": str(Path(os.environ["RUNNER_TEMP"], "exact-scene")),
              }
          elif shell_type == "electron":
              manifest = json.loads(Path("shells/electron/config/shell.json").read_text())
              plan = json.loads(Path(os.environ["RUNNER_TEMP"], "exact-plan", f"electron-{target}.json").read_text())
              shell_identity = plan["plan"]["nodes"]["electron.shell.build"]["identity"]
              if not shell_identity.startswith("sha256:"):
                  raise SystemExit("Electron Shell plan identity is invalid")
              build_hash = shell_identity.removeprefix("sha256:")
              identity = {"type": shell_type, "version": manifest["version"], "buildHash": build_hash}
              identity["digest"] = hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              manifest.update({"channel": os.environ["CHANNEL"], "shell": identity})
              manifest_path = Path(os.environ["RUNNER_TEMP"], "electron-shell.json")
              manifest_path.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n")
              request = {
                  "schemaVersion": 1, "operation": "electron.scene.build", "target": target,
                  "shellManifestFile": str(manifest_path),
                  "acceptedClosureBaselineFile": str(Path("apps/closure/dist/index.mjs").resolve()),
                  "standaloneLauncherFile": str(Path("packages/standalone/dist/index.mjs").resolve()),
                  "sceneDirectory": str(Path(os.environ["RUNNER_TEMP"], "exact-scene")),
              }
          else:
              raise SystemExit(f"unsupported exact Shell: {shell_type}")
          Path(os.environ["RUNNER_TEMP"], "exact-scene-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Build Darwin Terminal scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && matrix.shell == 'terminal' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: sh shells/terminal/sh/scene.sh --request "$RUNNER_TEMP/exact-scene-request.json" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: Build native Electron scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && matrix.shell == 'electron' }}
        shell: bash
        run: pnpm --filter @open-design/shell-electron exact:scene -- --request "$RUNNER_TEMP/exact-scene-request.json" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: Verify scene and prepare convergence product
        env:
          ARTIFACT_NAME: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          scene = json.loads((root / "exact-scene" / "scene.json").read_text())
          if scene.get("target") != os.environ["TARGET"] or not isinstance(scene.get("shellBuildHash"), str):
              raise SystemExit("restored or built Shell scene identity mismatch")
          encoded = json.dumps(scene, sort_keys=True)
          for release_field in (os.environ["RELEASE_VERSION"], "publishedAt", "artifactBaseUrl", "signatures"):
              if release_field in encoded:
                  raise SystemExit(f"Shell scene contains release-owned field: {release_field}")
          pending = json.loads((root / "exact-plan" / "pending.json").read_text())["workloads"][os.environ["WORKLOAD"]]
          if pending["run"]:
              destination = root / "convergence-products" / os.environ["WORKLOAD"]
              destination.mkdir(parents=True)
              manifest = {
                  "workload": os.environ["WORKLOAD"],
                  "digest": pending["digest"],
                  "executionClass": pending["executionClass"],
                  "products": {"scene": {"type": "job", "source": os.environ["ARTIFACT_NAME"], "data": {"target": os.environ["TARGET"]}}},
              }
              (destination / "product-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-scene
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-convergence-manifest-${{ matrix.workload }}-${{ github.run_id }}
          path: ${{ runner.temp }}/convergence-products
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Prepare signed exact content
    needs: [plan, scene]
    runs-on: ubuntu-24.04
    environment: standalone-exact-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-*-scene-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scenes

      - name: Read previous content floor when available
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLIC_ORIGIN: ${{ secrets.EXACT_RELEASE_PUBLIC_ORIGIN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          try:
              with urllib.request.urlopen(f"{os.environ['PUBLIC_ORIGIN'].rstrip('/')}/{os.environ['CHANNEL']}/latest/channel-head.json", timeout=10) as response:
                  head = json.load(response)["head"]
              with urllib.request.urlopen(head["lanes"]["content"]["url"], timeout=10) as response:
                  (root / "previous-content-metadata.json").write_bytes(response.read())
          except (KeyError, OSError, urllib.error.URLError, json.JSONDecodeError):
              pass
          PY

      - name: Compose and sign content metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STANDALONE_VERSION: ${{ inputs.standalone_version }}
          PUBLIC_ORIGIN: ${{ secrets.EXACT_RELEASE_PUBLIC_ORIGIN }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
          SHELL_MATRIX: ${{ needs.plan.outputs.shell_matrix }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          topology = json.loads(os.environ["SHELL_MATRIX"])["include"]
          shell_records = {}
          closure_artifact = standalone_artifact = None
          for item in topology:
              shell_type, target = item["shell"], item["target"]
              directory = root / "scenes" / f"exact-{shell_type}-scene-{target}-{os.environ['SOURCE_SHA']}"
              manifest = directory / "scene.json"
              scene = json.loads(manifest.read_text())
              record = shell_records.setdefault(shell_type, {"type": shell_type, "version": scene["shellVersion"], "scenes": []})
              if record["version"] != scene["shellVersion"]:
                  raise SystemExit(f"{shell_type} scenes contain different Shell versions")
              record["scenes"].append({"target": target, "sceneDirectory": str(directory), "sceneManifestSha256": hashlib.sha256(manifest.read_bytes()).hexdigest()})
              closure_artifact = closure_artifact or directory / scene["closure"]["file"]
              standalone_artifact = standalone_artifact or directory / scene["standalone"]["entrypoint"]
          if closure_artifact is None or standalone_artifact is None:
              raise SystemExit("exact topology contains no Shell scenes")
          published_at = subprocess.check_output(['git', 'show', '--no-patch', '--format=%cI', os.environ['SOURCE_SHA']], text=True).strip()
          request = {
              "schemaVersion": 1,
              "operation": "exact.prepare",
              "channel": os.environ["CHANNEL"],
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "publishedAt": published_at,
              "standaloneVersion": os.environ["STANDALONE_VERSION"],
              "artifactBaseUrl": f"{os.environ['PUBLIC_ORIGIN'].rstrip('/')}/{os.environ['CHANNEL']}/{os.environ['RELEASE_VERSION']}",
              "closureArtifactFile": str(closure_artifact),
              "standaloneArtifactFile": str(standalone_artifact),
              "shells": sorted(shell_records.values(), key=lambda value: value["type"]),
              "outputDirectory": str(root / "exact-prepare"),
          }
          previous = root / "previous-content-metadata.json"
          if previous.is_file(): request["previousContentMetadataFile"] = str(previous)
          (root / "exact-prepare-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/pack.py --request "$RUNNER_TEMP/exact-prepare-request.json" --receipt "$RUNNER_TEMP/exact-prepare/prepare-receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-prepare
          if-no-files-found: error
          retention-days: 1

  distribution:
    name: ${{ matrix.shell }} distribution (${{ matrix.target }})
    needs: [plan, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-${{ matrix.shell }}-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scene

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - uses: pnpm/action-setup@v5
        if: ${{ matrix.shell == 'electron' }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ matrix.shell == 'electron' }}
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Prepare Electron distribution toolchain
        if: ${{ matrix.shell == 'electron' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @open-design/standalone build
          pnpm --filter @open-design/electron-kit build

      - name: Write native distribution request
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          prepared = json.loads((root / "prepared" / "prepare-receipt.json").read_text())
          scene = root / "scene"
          common = {
              "schemaVersion": 1, "target": os.environ["TARGET"], "sceneDirectory": str(scene),
              "sceneManifestSha256": hashlib.sha256((scene / "scene.json").read_bytes()).hexdigest(),
              "outputDirectory": str(root / "distribution"),
          }
          if os.environ["SHELL_TYPE"] == "terminal":
              request = {**common, "operation": "terminal.distribution.build",
                  "trustFile": str(root / "prepared" / "trust" / "keys.json"),
                  "releaseDocumentsDirectory": str(root / "prepared" / "documents"),
                  "release": {"channel": os.environ["CHANNEL"], "releaseVersion": os.environ["RELEASE_VERSION"], "sourceCommit": os.environ["SOURCE_SHA"], "publishedAt": prepared["publishedAt"], "artifactBaseUrl": prepared["artifactBaseUrl"]}}
          elif os.environ["SHELL_TYPE"] == "electron":
              request = {**common, "operation": "electron.distribution.build",
                  "acceptedContentMetadataFile": str(root / "prepared" / "documents" / "content-metadata.json"),
                  "acceptedTrustFile": str(root / "prepared" / "trust" / "keys.json"),
                  "channelHeadUrl": prepared["artifactBaseUrl"].rsplit("/", 1)[0] + "/latest/channel-head.json"}
          else:
              raise SystemExit(f"unsupported exact Shell: {os.environ['SHELL_TYPE']}")
          (root / "distribution-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Build Darwin distribution
        if: ${{ matrix.shell == 'terminal' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: sh shells/terminal/sh/distribution.sh --request "$RUNNER_TEMP/distribution-request.json" --receipt "$RUNNER_TEMP/distribution/distribution-receipt.json"

      - name: Build native Electron distribution
        if: ${{ matrix.shell == 'electron' }}
        shell: bash
        run: pnpm --filter @open-design/shell-electron exact:distribution -- --request "$RUNNER_TEMP/distribution-request.json" --receipt "$RUNNER_TEMP/distribution/shell-contribution.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-distribution-${{ matrix.shell }}-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distribution
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Finalize and publish exact channel
    needs: [plan, distribution]
    runs-on: ubuntu-24.04
    environment: standalone-exact-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-distribution-*-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distributions

      - name: Finalize signed Shell sidecar and channel head
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SHELL_MATRIX: ${{ needs.plan.outputs.shell_matrix }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          prepared = json.loads((root / "prepared" / "prepare-receipt.json").read_text())
          shells = {shell["type"]: shell for shell in prepared["shells"]}
          contributions = []
          for item in json.loads(os.environ["SHELL_MATRIX"])["include"]:
              shell_type, target = item["shell"], item["target"]
              directory = root / "distributions" / f"exact-distribution-{shell_type}-{target}-{os.environ['RELEASE_VERSION']}"
              contribution_file = directory / "shell-contribution.json"
              if shell_type == "terminal":
                  receipt = json.loads((directory / "distribution-receipt.json").read_text())
                  scene = next(scene for scene in shells[shell_type]["scenes"] if scene["target"] == target)
                  contribution = {
                      "schemaVersion": 1, "operation": "shell.distribution.contribute",
                      "shell": {"type": shell_type, "version": shells[shell_type]["version"], "buildHash": scene["shellBuildHash"]},
                      "target": target, "artifact": receipt["archive"],
                      "updater": {"protocol": "standalone-shell-updater-v3", "handler": "sidecar-v1", "interaction": "restart-and-install"},
                  }
                  contribution_file.write_text(json.dumps(contribution, sort_keys=True, separators=(",", ":")) + "\n")
              elif shell_type == "electron":
                  contribution = json.loads(contribution_file.read_text())
              else:
                  raise SystemExit(f"unsupported exact Shell: {shell_type}")
              archive_file = directory / Path(contribution["artifact"]["file"]).name
              contributions.append({"receipt": str(contribution_file), "archiveFile": str(archive_file)})
          request = {
              "schemaVersion": 1,
              "operation": "exact.finalize",
              "prepareReceipt": str(root / "prepared" / "prepare-receipt.json"),
              "contentMetadataFile": str(root / "prepared" / "documents" / "content-metadata.json"),
              "closureArtifactFile": str(next((root / "prepared" / "artifacts").glob("closure-*.mjs"))),
              "standaloneArtifactFile": str(next((root / "prepared" / "artifacts").glob("standalone-launcher-*.mjs"))),
              "contributions": contributions,
              "outputDirectory": str(root / "exact-final"),
          }
          (root / "exact-finalize-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/pack.py --request "$RUNNER_TEMP/exact-finalize-request.json" --receipt "$RUNNER_TEMP/exact-final/pack-receipt.json"

      - name: Publish immutable release objects
        env:
          OD_EXACT_RELEASE_TOKEN: ${{ secrets.EXACT_RELEASE_TOKEN }}
          STORAGE_ENDPOINT: ${{ secrets.EXACT_RELEASE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.EXACT_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          request = {"schemaVersion": 1, "operation": "exact.publish", "packReceipt": str(root / "exact-final" / "pack-receipt.json"), "endpointUrl": os.environ["STORAGE_ENDPOINT"], "bucket": os.environ["STORAGE_BUCKET"]}
          (root / "exact-publish-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/release.py --request "$RUNNER_TEMP/exact-publish-request.json" --receipt "$RUNNER_TEMP/exact-final/publish-receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-published-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-final
          if-no-files-found: error
          retention-days: 1

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: exact-convergence-manifest-*-${{ github.run_id }}
          path: ${{ runner.temp }}/convergence-products
          merge-multiple: true

      - name: Create reusable scene handoff
        id: convergence_handoff
        continue-on-error: true
        run: >-
          python3 .github/scripts/convergence.py
          --config .github/config/convergence-exact.json
          handoff
          --pending "$RUNNER_TEMP/exact-plan/pending.json"
          --products-root "$RUNNER_TEMP/convergence-products"
          --handoff-root "$RUNNER_TEMP/handoff-convergence-exact-scenes"
          --id exact-scenes

      - name: Upload reusable scene handoff
        if: ${{ steps.convergence_handoff.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.convergence_handoff.outputs.name }}
          path: ${{ steps.convergence_handoff.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-${{ inputs.channel }}-${{ inputs.release_version }}-receipts
          path: |
            ${{ runner.temp }}/exact-final/*.json
            ${{ runner.temp }}/exact-final/documents/*.json
            ${{ runner.temp }}/exact-finalize-request.json
            ${{ runner.temp }}/exact-publish-request.json
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Public installed acceptance (${{ matrix.shell }}/${{ matrix.target }})
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shell_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-published-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/published

      - name: Download accepted public artifact
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          published = json.loads((root / "published" / "publish-receipt.json").read_text())
          required = next(item for item in published["requiredAcceptances"] if item["shell"]["type"] == os.environ["SHELL_TYPE"] and item["target"] == os.environ["TARGET"])
          suffix = ".tar.gz" if os.environ["SHELL_TYPE"] == "terminal" else (".dmg" if os.environ["TARGET"].startswith("darwin-") else ".exe")
          archive = root / f"public-shell-artifact{suffix}"
          urllib.request.urlretrieve(required["artifact"]["url"], archive)
          body = archive.read_bytes()
          if hashlib.sha256(body).hexdigest() != required["artifact"]["sha256"] or len(body) != required["artifact"]["size"]:
              raise SystemExit("public Shell artifact binding mismatch")
          (root / "required-acceptance.json").write_text(json.dumps(required, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Install and exercise Darwin Shell lifecycle
        if: ${{ matrix.shell == 'terminal' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/public-shell-artifact.tar.gz" -C "$RUNNER_TEMP/extracted"
          sh "$RUNNER_TEMP/extracted/nexu-terminal/sh/install.sh" \
            --source "$RUNNER_TEMP/extracted/nexu-terminal" \
            --root "$RUNNER_TEMP/installed-shell" \
            --channel "${{ inputs.channel }}" \
            --namespace exact-public-acceptance > "$RUNNER_TEMP/installed-proof.json"
          run_terminal() {
            operation=$1
            shift
            sh "$RUNNER_TEMP/installed-shell/sh/terminal.sh" \
              --root "$RUNNER_TEMP/installed-shell" \
              --store-root "$RUNNER_TEMP/acceptance-store" \
              --channel "${{ inputs.channel }}" \
              --namespace exact-public-acceptance \
              --operation "$operation" \
              --result "$RUNNER_TEMP/runtime-$operation.json" \
              "$@"
          }
          run_terminal start --attachment-id public-acceptance
          run_terminal status
          run_terminal stop

      - name: Install and exercise macOS Electron Shell
        if: ${{ matrix.shell == 'electron' && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/electron-volume"
          app="$RUNNER_TEMP/installed-electron.app"
          mkdir -p "$volume"
          hdiutil attach "$RUNNER_TEMP/public-shell-artifact.dmg" -nobrowse -readonly -mountpoint "$volume"
          trap 'hdiutil detach "$volume" >/dev/null 2>&1 || true' EXIT
          source_app=$(find "$volume" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$source_app"
          ditto "$source_app" "$app"
          hdiutil detach "$volume"
          trap - EXIT
          executable="$app/Contents/MacOS/open-design-electron-foundation"
          test -x "$executable"
          OD_PACKAGED_E2E_HEADLESS=1 ELECTRON_KIT_SMOKE_EXIT_MS=3000 "$executable" --user-data-dir="$RUNNER_TEMP/electron-user-data"

      - name: Install and exercise Windows Electron Shell
        if: ${{ matrix.shell == 'electron' && startsWith(matrix.target, 'win32-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'public-shell-artifact.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'installed-electron'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Electron installer exited with $($install.ExitCode)" }
          $executable = Join-Path $installRoot 'open-design-electron-foundation.exe'
          if (-not (Test-Path $executable)) { throw 'installed Electron executable is missing' }
          $env:OD_PACKAGED_E2E_HEADLESS = '1'
          $env:ELECTRON_KIT_SMOKE_EXIT_MS = '3000'
          $runtime = Start-Process -FilePath $executable -ArgumentList "--user-data-dir=$env:RUNNER_TEMP/electron-user-data" -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw "installed Electron exited with $($runtime.ExitCode)" }

      - name: Bind installed acceptance credential
        env:
          SHELL_TYPE: ${{ matrix.shell }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SHELL_TYPE" == "electron" && "$TARGET" == darwin-* ]]; then
            installed_root="$RUNNER_TEMP/installed-electron.app/Contents/Resources"
          elif [[ "$SHELL_TYPE" == "electron" ]]; then
            installed_root="$RUNNER_TEMP/installed-electron/resources"
          else
            installed_root="$RUNNER_TEMP/installed-shell"
          fi
          runtime_args=()
          if [[ "$SHELL_TYPE" == "electron" ]]; then
            runtime_args=(--runtime-log "$RUNNER_TEMP/electron-user-data/exact/channels/${{ inputs.channel }}/namespaces/electron-foundation-headless/runtime/electron/logs/electron-runtime.jsonl")
          fi
          python3 .github/scripts/release/installed_acceptance.py \
            --root "$RUNNER_TEMP" \
            --installed-root "$installed_root" \
            --shell-type "$SHELL_TYPE" \
            --target "$TARGET" \
            "${runtime_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-acceptance-${{ matrix.shell }}-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 30

  activate:
    name: Activate accepted exact channel
    needs: [acceptance]
    runs-on: ubuntu-24.04
    environment: standalone-exact-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-published-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/published

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-acceptance-*-${{ inputs.release_version }}
          path: ${{ runner.temp }}/acceptances
          merge-multiple: true

      - name: Activate latest channel head after acceptance
        env:
          OD_EXACT_RELEASE_TOKEN: ${{ secrets.EXACT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((root / "published" / "publish-receipt.json").read_text())
          receipt["channelHead"]["file"] = str(root / "published" / "documents" / "channel-head.json")
          relocated = root / "published" / "relocated-publish-receipt.json"
          relocated.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          credentials = sorted(str(path) for path in (root / "acceptances").glob("*.json"))
          request = {"schemaVersion": 1, "operation": "exact.activate", "publishReceipt": str(relocated), "acceptanceCredentials": credentials}
          (root / "activate-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/release.py --request "$RUNNER_TEMP/activate-request.json" --receipt "$RUNNER_TEMP/activate-receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-activation-${{ inputs.channel }}-${{ inputs.release_version }}
          path: |
            ${{ runner.temp }}/activate-request.json
            ${{ runner.temp }}/activate-receipt.json
          if-no-files-found: error
          retention-days: 30
