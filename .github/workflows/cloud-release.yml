name: Cloud release

# Separate cloud delivery entrypoint. Desktop release and merge gates stay independent.
# Enable automatic triggers only after apps/cloud and the Cloudflare target land.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to build or publish
        type: choice
        options: [web, backend, resources, all]
        default: web
      publish:
        description: Publish backend image or Filesys resources (Cloudflare is a placeholder)
        type: boolean
        default: false
      environment:
        description: GitHub environment containing cloud configuration
        type: environment
        default: cloud-staging

permissions:
  contents: read

# Resource pointers have a single writer per environment; never cancel a publication.
concurrency:
  group: cloud-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check selected component contracts
        env:
          CLOUD_TARGET: ${{ inputs.target }}
          CLOUD_PUBLISH: ${{ inputs.publish }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/cloud/release.ts check "$CLOUD_TARGET"

  web:
    needs: preflight
    if: ${{ inputs.target == 'web' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          install-profile: source-web
      - name: Build web dependencies
        run: corepack pnpm --filter '@open-design/web^...' --workspace-concurrency=1 -r --if-present run build
      - name: Build pure static frontend
        env:
          OD_WEB_OUTPUT_MODE: export
        run: corepack pnpm --filter @open-design/web build
      - name: Stage static site and source receipt
        run: node .github/scripts/cloud/release.ts prepare-web
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-web-${{ github.sha }}
          path: .tmp/cloud-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Cloudflare deployment placeholder
        run: |
          echo 'Static site is available in cloud-web-<sha>/site. Cloudflare deployment is not connected.' >> "$GITHUB_STEP_SUMMARY"
          # TODO: consume the exact site artifact in a Cloudflare deploy job.
          # Choose Pages or Workers, then configure account/project/token and API routing.
          # preflight intentionally rejects publish=true for web/all until connected.

  backend:
    needs: preflight
    if: ${{ inputs.target == 'backend' || inputs.target == 'all' }}
    # docker-image.yml also declares packages:write for its separate stable job.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      cloud_backend: true
      cloud_publish: ${{ inputs.publish }}
      cloud_environment: ${{ inputs.environment }}
    secrets: inherit

  resources:
    needs: preflight
    if: ${{ inputs.target == 'resources' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and build cloud resource tooling
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts --filter ./apps/cloud...
          corepack pnpm --filter ./apps/cloud... -r rebuild
          corepack pnpm --filter ./apps/cloud... --workspace-concurrency=1 -r --if-present run build
      - name: Prepare resources and mapping from this commit
        env:
          OD_CLOUD_RESOURCE_DIR: ${{ runner.temp }}/cloud-resources
        run: node .github/scripts/cloud/release.ts prepare-resources
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-resources-${{ github.sha }}
          path: ${{ runner.temp }}/cloud-resources
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish-resources:
    needs: resources
    if: ${{ inputs.publish }}
    environment: ${{ inputs.environment }}
    runs-on: ${{ vars.CLOUD_PUBLISH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and build publisher
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts --filter ./apps/cloud...
          corepack pnpm --filter ./apps/cloud... -r rebuild
          corepack pnpm --filter ./apps/cloud... --workspace-concurrency=1 -r --if-present run build
      - uses: actions/download-artifact@v4
        with:
          name: cloud-resources-${{ github.sha }}
          path: ${{ runner.temp }}/cloud-resources
      - name: Publish assets, verify receipts, then publish mapping
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OD_CLOUD_RESOURCE_DIR: ${{ runner.temp }}/cloud-resources
          FILESYS_PUBLISH_URL: ${{ vars.FILESYS_PUBLISH_URL }}
          FILESYS_PUBLISH_TOKEN: ${{ secrets.FILESYS_PUBLISH_TOKEN }}
        run: node .github/scripts/cloud/release.ts publish-resources
