  delivery_report:
    name: "[report] Beta CDN delivery"
    needs:
      - release_prepare
      - common
      - source_mac_arm64
      - source_mac_x64
      - source_win_x64
      - build_mac_arm64
      - build_mac_x64
      - build_win_x64
      - publish
      - test
      - smoke_mac_arm64
      - smoke_mac_x64
      - smoke_win_x64
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect release timing ledger
        id: timing_ledger
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          MAC_ARM64_UPLOAD_TIMINGS: ${{ needs.build_mac_arm64.outputs.publish_timings }}
          MAC_X64_UPLOAD_TIMINGS: ${{ needs.build_mac_x64.outputs.publish_timings }}
          POSTINSTALL_BUILD_MAC_ARM64: ${{ needs.build_mac_arm64.outputs.postinstall_result }}
          POSTINSTALL_BUILD_MAC_ARM64_TIMINGS: ${{ needs.build_mac_arm64.outputs.postinstall_timings }}
          POSTINSTALL_BUILD_MAC_X64: ${{ needs.build_mac_x64.outputs.postinstall_result }}
          POSTINSTALL_BUILD_MAC_X64_TIMINGS: ${{ needs.build_mac_x64.outputs.postinstall_timings }}
          POSTINSTALL_BUILD_WIN_X64: ${{ needs.build_win_x64.outputs.postinstall_result }}
          POSTINSTALL_BUILD_WIN_X64_TIMINGS: ${{ needs.build_win_x64.outputs.postinstall_timings }}
          POSTINSTALL_COMMON: ${{ needs.common.outputs.postinstall_result }}
          POSTINSTALL_COMMON_TIMINGS: ${{ needs.common.outputs.postinstall_timings }}
          POSTINSTALL_PUBLISH: ${{ needs.publish.outputs.postinstall_result }}
          POSTINSTALL_PUBLISH_TIMINGS: ${{ needs.publish.outputs.postinstall_timings }}
          POSTINSTALL_RELEASE_PREPARE: ${{ needs.release_prepare.outputs.postinstall_result }}
          POSTINSTALL_RELEASE_PREPARE_TIMINGS: ${{ needs.release_prepare.outputs.postinstall_timings }}
          POSTINSTALL_SMOKE_MAC_ARM64: ${{ needs.smoke_mac_arm64.outputs.postinstall_result }}
          POSTINSTALL_SMOKE_MAC_ARM64_TIMINGS: ${{ needs.smoke_mac_arm64.outputs.postinstall_timings }}
          POSTINSTALL_SMOKE_MAC_X64: ${{ needs.smoke_mac_x64.outputs.postinstall_result }}
          POSTINSTALL_SMOKE_MAC_X64_TIMINGS: ${{ needs.smoke_mac_x64.outputs.postinstall_timings }}
          POSTINSTALL_SMOKE_WIN_X64: ${{ needs.smoke_win_x64.outputs.postinstall_result }}
          POSTINSTALL_SMOKE_WIN_X64_TIMINGS: ${{ needs.smoke_win_x64.outputs.postinstall_timings }}
          POSTINSTALL_SOURCE_MAC_ARM64: ${{ needs.source_mac_arm64.outputs.postinstall_result }}
          POSTINSTALL_SOURCE_MAC_ARM64_TIMINGS: ${{ needs.source_mac_arm64.outputs.postinstall_timings }}
          POSTINSTALL_SOURCE_MAC_X64: ${{ needs.source_mac_x64.outputs.postinstall_result }}
          POSTINSTALL_SOURCE_MAC_X64_TIMINGS: ${{ needs.source_mac_x64.outputs.postinstall_timings }}
          POSTINSTALL_SOURCE_WIN_X64: ${{ needs.source_win_x64.outputs.postinstall_result }}
          POSTINSTALL_SOURCE_WIN_X64_TIMINGS: ${{ needs.source_win_x64.outputs.postinstall_timings }}
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          TIMING_LEDGER_PATH: ${{ runner.temp }}/release-timing-ledger.json
          WIN_X64_UPLOAD_TIMINGS: ${{ needs.build_win_x64.outputs.publish_timings }}
        with:
          script: |
            const fs = require("fs");
            const thresholdMs = 30_000;
            const toMs = (start, end) => start && end
              ? Math.max(0, new Date(end).getTime() - new Date(start).getTime())
              : null;
            const seconds = (durationMs) => durationMs == null ? "—" : `${(durationMs / 1000).toFixed(1)}s`;
            const uploadTimings = (target, raw) => {
              if (!raw) return [];
              try {
                const entries = JSON.parse(raw);
                return Array.isArray(entries) ? entries.map((entry) => ({ target, ...entry })) : [];
              } catch (error) {
                core.warning(`Could not parse ${target} upload timings: ${error.message}`);
                return [];
              }
            };
            const postinstallObservation = (job, key) => {
              const resultRaw = process.env[`POSTINSTALL_${key}`];
              const timingsRaw = process.env[`POSTINSTALL_${key}_TIMINGS`];
              if (!resultRaw && !timingsRaw) return null;
              try {
                return {
                  job,
                  result: resultRaw ? JSON.parse(resultRaw) : null,
                  timings: timingsRaw ? JSON.parse(timingsRaw) : [],
                };
              } catch (error) {
                core.warning(`Could not parse ${job} postinstall observation: ${error.message}`);
                return null;
              }
            };
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: "latest",
              per_page: 100,
            });
            const normalizedJobs = jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              startedAt: job.started_at,
              completedAt: job.completed_at,
              durationMs: toMs(job.started_at, job.completed_at),
              runner: {
                name: job.runner_name || null,
                group: job.runner_group_name || null,
                labels: job.labels || [],
              },
              steps: (job.steps || []).map((step) => ({
                name: step.name,
                number: step.number,
                status: step.status,
                conclusion: step.conclusion,
                startedAt: step.started_at,
                completedAt: step.completed_at,
                durationMs: toMs(step.started_at, step.completed_at),
              })),
            }));
            const completedAt = (job) => job.completedAt == null ? Number.NEGATIVE_INFINITY : new Date(job.completedAt).getTime();
            const runStartedAt = workflowRun.run_started_at || workflowRun.created_at;
            const publishJob = normalizedJobs.find((job) => job.name === "[publish] Beta distribution");
            const validationJobs = normalizedJobs.filter((job) =>
              /^\[(prepare|build|publish|test|validate)\]/.test(job.name) &&
              job.conclusion !== "skipped" &&
              job.completedAt != null,
            );
            const validationEndJob = validationJobs.sort((left, right) => completedAt(right) - completedAt(left))[0] || null;
            const durationFromRunStart = (timestamp) => toMs(runStartedAt, timestamp);
            const slowSteps = normalizedJobs
              .flatMap((job) => job.steps.map((step) => ({
                job: job.name,
                runner: job.runner,
                ...step,
              })))
              .filter((step) => step.durationMs != null && step.durationMs >= thresholdMs)
              .sort((left, right) => right.durationMs - left.durationMs);
            const postinstall = [
              postinstallObservation("[prepare] Beta release and Plan", "RELEASE_PREPARE"),
              postinstallObservation("[build] Shared JavaScript", "COMMON"),
              postinstallObservation("[build] mac_arm64 workload", "SOURCE_MAC_ARM64"),
              postinstallObservation("[build] mac_arm64 Electron full", "BUILD_MAC_ARM64"),
              postinstallObservation("[build] mac_x64 workload", "SOURCE_MAC_X64"),
              postinstallObservation("[build] mac_x64 Electron full", "BUILD_MAC_X64"),
              postinstallObservation("[build] win_x64 workload", "SOURCE_WIN_X64"),
              postinstallObservation("[build] win_x64 Electron full", "BUILD_WIN_X64"),
              postinstallObservation("[publish] Beta distribution", "PUBLISH"),
              postinstallObservation("[validate] beta mac_arm64 downloaded artifact", "SMOKE_MAC_ARM64"),
              postinstallObservation("[validate] beta mac_x64 downloaded artifact", "SMOKE_MAC_X64"),
              postinstallObservation("[validate] beta win_x64 downloaded artifact", "SMOKE_WIN_X64"),
            ].filter(Boolean);
            const slowPostinstall = postinstall
              .flatMap((observation) => observation.timings.map((timing) => ({ job: observation.job, ...timing })))
              .filter((timing) => timing.durationMs >= thresholdMs)
              .sort((left, right) => right.durationMs - left.durationMs);
            const ledger = {
              schemaVersion: 1,
              generatedAt: new Date().toISOString(),
              thresholdMs,
              release: {
                channel: "beta",
                version: process.env.RELEASE_VERSION,
                repository: context.repo.owner + "/" + context.repo.repo,
                workflow: workflowRun.name,
                runId: context.runId,
                runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || "0"),
                commit: workflowRun.head_sha,
                event: workflowRun.event,
                startedAt: runStartedAt,
              },
              wallClock: {
                delivery: {
                  endpoint: "version metadata published",
                  completedAt: publishJob?.completedAt || null,
                  durationMs: durationFromRunStart(publishJob?.completedAt),
                },
                validation: {
                  endpoint: validationEndJob?.name || null,
                  completedAt: validationEndJob?.completedAt || null,
                  durationMs: durationFromRunStart(validationEndJob?.completedAt),
                },
              },
              uploads: [
                ...uploadTimings("mac_arm64", process.env.MAC_ARM64_UPLOAD_TIMINGS),
                ...uploadTimings("mac_x64", process.env.MAC_X64_UPLOAD_TIMINGS),
                ...uploadTimings("win_x64", process.env.WIN_X64_UPLOAD_TIMINGS),
              ].sort((left, right) => right.durationMs - left.durationMs),
              postinstall,
              slowSteps,
              jobs: normalizedJobs,
            };
            fs.writeFileSync(process.env.TIMING_LEDGER_PATH, JSON.stringify(ledger, null, 2) + "\n", "utf8");
            core.setOutput("available", "true");
            core.setOutput("path", process.env.TIMING_LEDGER_PATH);
            const rows = slowSteps.slice(0, 30).map((step) => [
              step.job,
              step.name,
              step.runner.name || step.runner.labels.join(", ") || "—",
              seconds(step.durationMs),
            ]);
            const slowUploads = ledger.uploads.filter((entry) => entry.durationMs >= thresholdMs).slice(0, 20);
            const summary = core.summary
              .addHeading("Release timing ledger", 2)
              .addRaw(`- delivery wall clock: \`${seconds(ledger.wallClock.delivery.durationMs)}\`\n`)
              .addRaw(`- validation wall clock: \`${seconds(ledger.wallClock.validation.durationMs)}\`\n`)
              .addRaw(`- observation threshold: \`${seconds(thresholdMs)}\`\n\n`)
              .addTable([
                [
                  { data: "Job", header: true },
                  { data: "Step", header: true },
                  { data: "Runner", header: true },
                  { data: "Duration", header: true },
                ],
                ...rows,
              ]);
            if (slowUploads.length > 0) {
              summary
                .addHeading("Uploads at or above 30 seconds", 3)
                .addTable([
                  [
                    { data: "Target", header: true },
                    { data: "Object", header: true },
                    { data: "Size", header: true },
                    { data: "Duration", header: true },
                  ],
                  ...slowUploads.map((entry) => [
                    entry.target,
                    entry.objectKey,
                    `${(entry.bytes / 1024 / 1024).toFixed(1)} MiB`,
                    seconds(entry.durationMs),
                  ]),
                ]);
            }
            if (slowPostinstall.length > 0) {
              summary
                .addHeading("Postinstall operations at or above 30 seconds", 3)
                .addTable([
                  [
                    { data: "Job", header: true },
                    { data: "Entry", header: true },
                    { data: "Operation", header: true },
                    { data: "Duration", header: true },
                  ],
                  ...slowPostinstall.slice(0, 30).map((entry) => [
                    entry.job,
                    entry.entry || "—",
                    entry.target || entry.operation,
                    seconds(entry.durationMs),
                  ]),
                ]);
            }
            await summary.write();
      - name: Preserve release timing ledger
        if: ${{ always() && steps.timing_ledger.outputs.available == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-beta-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.timing_ledger.outputs.path }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish direct CDN links and validation results
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
          MAC_ARM64_URL: ${{ needs.publish.outputs.mac_arm64_url }}
          MAC_X64_URL: ${{ needs.publish.outputs.mac_x64_url }}
          WIN_X64_URL: ${{ needs.publish.outputs.win_x64_url }}
          TEST_RESULT: ${{ needs.test.result }}
          MAC_ARM64_RESULT: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_arm64.smokeMode == 'core' && needs.smoke_mac_arm64.result || needs.build_mac_arm64.result }}
          MAC_X64_RESULT: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_x64.smokeMode == 'core' && needs.smoke_mac_x64.result || needs.build_mac_x64.result }}
          WIN_X64_RESULT: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode == 'core' && needs.smoke_win_x64.result || needs.build_win_x64.result }}
        with:
          script: |
            const link = (label, url) => url ? `[${label}](${url})` : "—";
            const lines = [
              "## Beta CDN delivery",
              "",
              `- version: \`${process.env.RELEASE_VERSION}\``,
              `- metadata: ${link("metadata.json", process.env.METADATA_URL)}`,
              `- workflow: [run ${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              "",
              "| Target | Direct CDN artifact | Download validation |",
              "| --- | --- | --- |",
              `| macOS arm64 | ${link("DMG", process.env.MAC_ARM64_URL)} | \`${process.env.MAC_ARM64_RESULT}\` |`,
              `| macOS x64 | ${link("DMG", process.env.MAC_X64_URL)} | \`${process.env.MAC_X64_RESULT}\` |`,
              `| Windows x64 | ${link("installer", process.env.WIN_X64_URL)} | \`${process.env.WIN_X64_RESULT}\` |`,
              "",
              `- release tests: \`${process.env.TEST_RESULT}\``,
            ];
            await core.summary.addRaw(lines.join("\n")).write();
