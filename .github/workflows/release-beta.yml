name: release-beta
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Release intent. Probe profiles are nonpublishing and target macOS x64."
        required: true
        type: choice
        options:
          - publish
          - build
          - validate
          - mac-x64-dmg-probe
        default: publish
      targets:
        description: "Native targets: default, all, none, or a comma-separated list of mac_arm64, mac_x64, win_x64."
        required: true
        type: string
        default: default
      ref:
        description: "Optional git ref to build. Empty builds the dispatched ref."
        required: false
        type: string
        default: ""
      release_version:
        description: "Optional beta version override. Empty resolves the next beta version from metadata."
        required: false
        type: string
        default: ""
      force:
        description: "Allow a beta build whose base version is not greater than the current stable/beta feed."
        required: true
        type: boolean
        default: false
      amr_profile:
        description: "AMR profile baked into the packaged app."
        required: true
        type: choice
        options:
          - prod
          - test
          - feature-test
        default: prod
      plan_overrides:
        description: "Strict JSON overrides for declared release/platform Plan fields."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: publish
      targets:
        required: false
        type: string
        default: default
      ref:
        required: false
        type: string
        default: ""
      release_version:
        required: false
        type: string
        default: ""
      force:
        required: false
        type: boolean
        default: false
      amr_profile:
        required: false
        type: string
        default: prod
      plan_overrides:
        required: false
        type: string
        default: ""
      promote:
        description: "Promote this publish profile to beta/latest after versioned platform artifacts."
        required: false
        type: boolean
        default: true
    outputs:
      beta_version:
        description: "The beta version that was built."
        value: ${{ jobs.release_prepare.outputs.beta_version }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.release_prepare.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.release_prepare.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published beta."
        value: ${{ jobs.release_prepare.outputs.previous_commit }}
      release_state:
        description: "complete | partial | failed."
        value: ${{ jobs.publish.outputs.release_state || (jobs.release_prepare.outputs.promote == 'false' && 'partial') }}
      version_metadata_url:
        description: "Public URL of this build's version metadata.json."
        value: ${{ jobs.publish.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_arm64_url || jobs.build_mac_arm64.outputs.url }}
      win_x64_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.publish.outputs.win_x64_url || jobs.build_win_x64.outputs.url }}
      mac_arm64_smoke_result:
        description: "macOS arm64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.release_prepare.outputs.mac_arm64_smoke_mode == 'core' && jobs.smoke_mac_arm64.outputs.smoke_result || jobs.build_mac_arm64.outputs.smoke_result }}
      mac_x64_smoke_result:
        description: "macOS x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.release_prepare.outputs.mac_x64_smoke_mode == 'core' && jobs.smoke_mac_x64.outputs.smoke_result || jobs.build_mac_x64.outputs.smoke_result }}
      win_x64_smoke_result:
        description: "Windows x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.release_prepare.outputs.win_x64_smoke_mode == 'core' && jobs.smoke_win_x64.outputs.smoke_result || jobs.build_win_x64.outputs.smoke_result }}
      mac_x64_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.publish.outputs.mac_x64_url }}

permissions:
  actions: write
  contents: read

concurrency:
  group: open-design-release-beta
  cancel-in-progress: false

env:
  BETA_SAVE_PNPM_CACHE: ${{ github.repository == 'nexu-io/open-design' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/plan-foundation' }}
  BETA_PNPM_STORE_CACHE_FORMAT: 7z-2603-mx1
  OPEN_DESIGN_TELEMETRY_RELAY_URL: ${{ vars.OPEN_DESIGN_TELEMETRY_RELAY_URL }}
  POSTHOG_KEY: ${{ inputs.profile == 'publish' && secrets.POSTHOG_KEY || '' }}
  POSTHOG_HOST: ${{ inputs.profile == 'publish' && vars.POSTHOG_HOST || '' }}
  POSTHOG_CLI_API_KEY: ${{ inputs.profile == 'publish' && secrets.POSTHOG_CLI_API_KEY || '' }}
  POSTHOG_CLI_PROJECT_ID: ${{ inputs.profile == 'publish' && vars.POSTHOG_CLI_PROJECT_ID || '' }}
  # Vela web console origin for the AMR profile this build targets. Held in a
  # per-profile repository secret instead of the source tree: the non-prod AMR
  # environments are internal deployments and this repository is public, so
  # neither the workflow nor the product code may name their hostnames.
  #
  # tools-pack bakes it into open-design-config.json and the packaged runtime
  # forwards it to the daemon as OD_VELA_WEB_URL, which is the second half of the
  # workspace-team gate (the first being the AMR profile allowlist). A profile
  # whose selected secret is not configured therefore ships with workspace-team
  # dormant rather than pointed at an unknown backend. An empty profile defaults
  # to prod and receives the prod origin, matching resolveAmrProfile.
  #
  # OD_VELA_WEB_URL preserves the build's startup profile. The three explicit
  # values are also baked into the package as a profile map, so the hidden
  # runtime environment switcher can move data AND console links together.
  # Secrets read here: VELA_WEB_URL_FEATURE_TEST, VELA_WEB_URL_TEST,
  # VELA_WEB_URL_PROD.
  OD_VELA_WEB_URL: ${{ inputs.amr_profile == 'feature-test' && secrets.VELA_WEB_URL_FEATURE_TEST || inputs.amr_profile == 'test' && secrets.VELA_WEB_URL_TEST || (inputs.amr_profile == 'prod' || inputs.amr_profile == '') && secrets.VELA_WEB_URL_PROD || '' }}
  OD_VELA_WEB_URL_FEATURE_TEST: ${{ secrets.VELA_WEB_URL_FEATURE_TEST }}
  OD_VELA_WEB_URL_TEST: ${{ secrets.VELA_WEB_URL_TEST }}
  OD_VELA_WEB_URL_PROD: ${{ secrets.VELA_WEB_URL_PROD }}
  RELEASE_BRANCH: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  RELEASE_WORKFLOW: ${{ github.workflow }}

jobs:
  release_prepare:
    name: "[prepare] Beta release and Plan"
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest
    env:
      RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
      OPEN_DESIGN_BETA_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/beta/latest/metadata.json
    outputs:
      postinstall_result: ${{ steps.workspace_setup.outputs.postinstall-result-json }}
      postinstall_timings: ${{ steps.workspace_setup.outputs.postinstall-timings-json }}
      run: ${{ steps.plan.outputs.run }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_count: ${{ steps.plan.outputs.test_count }}
      common_matrix: ${{ steps.plan.outputs.common_matrix }}
      common_count: ${{ steps.plan.outputs.common_count }}
      requests: ${{ steps.plan.outputs.requests }}
      sources: ${{ steps.plan.outputs.sources }}
      pending_artifact: beta-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
      contribution: ${{ steps.mode.outputs.contribution }}
      contributions: ${{ steps.plan.outputs.contributions }}
      execution_plan: ${{ steps.execution_plan.outputs.execution_plan }}
      run_source_mac_arm64: ${{ steps.execution_plan.outputs.run_source_mac_arm64 }}
      run_source_mac_x64: ${{ steps.execution_plan.outputs.run_source_mac_x64 }}
      run_source_win_x64: ${{ steps.execution_plan.outputs.run_source_win_x64 }}
      run_build_mac_arm64: ${{ steps.execution_plan.outputs.run_build_mac_arm64 }}
      run_build_mac_x64: ${{ steps.execution_plan.outputs.run_build_mac_x64 }}
      run_build_win_x64: ${{ steps.execution_plan.outputs.run_build_win_x64 }}
      run_publish: ${{ steps.execution_plan.outputs.run_publish }}
      run_test: ${{ steps.execution_plan.outputs.run_test }}
      run_smoke_mac_arm64: ${{ steps.execution_plan.outputs.run_smoke_mac_arm64 }}
      run_smoke_mac_x64: ${{ steps.execution_plan.outputs.run_smoke_mac_x64 }}
      run_smoke_win_x64: ${{ steps.execution_plan.outputs.run_smoke_win_x64 }}
      mac_arm64_smoke_mode: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).platforms.mac_arm64.smokeMode }}
      mac_x64_smoke_mode: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).platforms.mac_x64.smokeMode }}
      win_x64_smoke_mode: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).platforms.win_x64.smokeMode }}
      branch: ${{ steps.identity.outputs.branch }}
      commit: ${{ steps.identity.outputs.commit }}
      asset_version_suffix: ${{ steps.beta.outputs.asset_version_suffix }}
      base_version: ${{ steps.beta.outputs.base_version }}
      beta_version: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.releaseVersion != '' && fromJSON(steps.execution_plan.outputs.execution_plan).release.releaseVersion || steps.beta.outputs.beta_version }}
      previous_commit: ${{ steps.prev.outputs.previous_commit }}
      promote: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.promote }}
      release_name: ${{ steps.beta.outputs.release_name }}
      state_source: ${{ steps.beta.outputs.state_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Resolve built identity
        id: identity
        env:
          BUILD_REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          {
            echo "branch=$BUILD_REF"
            echo "commit=$built_sha"
          } >> "$GITHUB_OUTPUT"
          echo "BUILT_SHA=$built_sha" >> "$GITHUB_ENV"
      - name: "[prepare] Distinct workflow control snapshot"
        if: ${{ steps.identity.outputs.commit != github.sha }}
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: plan-control
          fetch-depth: 1
      - name: "[resolve] Actual source runner profiles"
        id: runners
        env:
          OD_CI_RUNNER_MODE: ${{ vars.OD_CI_RUNNER_MODE }}
        run: python3 .github/scripts/runners.py
      - name: "[resolve] Authorized result consumption"
        id: mode
        env:
          AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/plan-foundation' && steps.identity.outputs.commit == github.sha }}
        run: |
          echo "contribution=$AUTHORIZED" >> "$GITHUB_OUTPUT"
          if [ "$AUTHORIZED" = true ]; then
            echo "mode=enforce" >> "$GITHUB_OUTPUT"
          else
            echo "mode=shadow" >> "$GITHUB_OUTPUT"
          fi
      - name: "[plan] Frozen source test results"
        id: plan
        env:
          EXECUTION_INPUTS: ${{ toJSON(inputs) }}
          RUNNER_PLAN: ${{ steps.runners.outputs.runs_on }}
          CONTROL_ROOT: ${{ steps.identity.outputs.commit == github.sha && '.' || 'plan-control' }}
          PLAN_MODE: ${{ steps.mode.outputs.mode }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          runners="$(jq -c '. + {source_javascript:["ubuntu-latest"],release_tests:["ubuntu-latest"],source_mac_arm64:["macos-14"],source_mac_x64:["macos-15-intel"],source_win_x64:["windows-latest"]}' <<< "$RUNNER_PLAN")"
          python3 "$CONTROL_ROOT/.github/scripts/convergence.py" --root . --config "$CONTROL_ROOT/.github/config/convergence/release-beta.json" github-output \
            --workflow release-beta --all-workloads --runner-plan-json "$runners" \
            --execution-inputs-json "$EXECUTION_INPUTS" --mode "$PLAN_MODE" --pending "$RUNNER_TEMP/pending-convergence.json"
      - name: "[plan] Frozen release execution"
        id: execution_plan
        env:
          CONTROL_ROOT: ${{ steps.identity.outputs.commit == github.sha && '.' || 'plan-control' }}
          RELEASE_CONTRIBUTION: ${{ steps.mode.outputs.contribution }}
          RELEASE_EXECUTION_PLAN_PATH: ${{ runner.temp }}/release-execution-plan.json
          RELEASE_INPUTS_JSON: ${{ toJSON(inputs) }}
          RELEASE_REQUESTS_JSON: ${{ steps.plan.outputs.requests }}
        run: python3 "$CONTROL_ROOT/.github/scripts/release/execution_plan.py" github-output
      - name: "[retain] Frozen Plan witness"
        uses: actions/upload-artifact@v7
        with:
          name: beta-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pending-convergence.json
            ${{ runner.temp }}/requests
            ${{ runner.temp }}/release-execution-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Setup release control
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-control
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
      - name: Validate shared beta publisher
        if: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.publish }}
        run: |
          set -euo pipefail
          built_sha="$(git rev-parse HEAD)"
          # Task-scoped authorization; arbitrary feature refs remain build-only.
          case "${GITHUB_REF:-}" in
            refs/heads/feat/plan-foundation) task_ref=true ;;
            *) task_ref=false ;;
          esac
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] &&
             [ "$task_ref" = true ] && [ "$built_sha" = "${GITHUB_SHA:-}" ]; then
            echo "Authorized Plan task beta publication at $built_sha"
            exit 0
          fi
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$main_sha" ]; then
            echo "Could not resolve the current main commit; refusing shared beta publication." >&2
            exit 1
          fi
          if [ "$built_sha" != "$main_sha" ]; then
            echo "Shared beta publication is restricted to the current main commit ($main_sha); got $built_sha. Re-run this ref with publish=false for build artifacts." >&2
            exit 1
          fi
      - name: Capture previous beta commit
        id: prev
        run: |
          set -euo pipefail
          prev="$(curl -fsSL "$OPEN_DESIGN_BETA_METADATA_URL" | jq -r '.github.commit // ""' 2>/dev/null || true)"
          echo "previous beta commit: ${prev:-<none>}"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"
      - name: Validate R2 release access
        if: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.publish }}
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          R2_ACCESS_PROBE_NAME: release-beta
          RELEASE_CHANNEL: beta
          RELEASE_PUBLIC_ORIGIN: ${{ env.RELEASE_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release check-storage
      - name: Prepare beta release metadata
        id: beta
        env:
          GITHUB_SHA: ${{ env.BUILT_SHA }}
          GITHUB_REF_NAME: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.ref != '' && fromJSON(steps.execution_plan.outputs.execution_plan).release.ref || github.ref_name }}
          OPEN_DESIGN_RELEASE_TAG_REMOTE: origin
          OPEN_DESIGN_RELEASE_FORCE: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.force && '1' || '' }}
        run: pnpm exec tools-release prepare beta
      - name: Validate built release-note command before native packaging
        if: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.publish }}
        env:
          RELEASE_CHANNEL: beta
          RELEASE_VERSION: ${{ fromJSON(steps.execution_plan.outputs.execution_plan).release.releaseVersion != '' && fromJSON(steps.execution_plan.outputs.execution_plan).release.releaseVersion || steps.beta.outputs.beta_version }}
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-note-preflight.json
        run: pnpm exec tools-release prepare-release-note

  common:
    name: "[build] Shared JavaScript"
    outputs:
      postinstall_result: ${{ steps.workspace_setup.outputs.postinstall-result-json }}
      postinstall_timings: ${{ steps.workspace_setup.outputs.postinstall-timings-json }}
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    needs: release_prepare
    if: ${{ needs.release_prepare.outputs.contribution == 'true' && needs.release_prepare.outputs.common_count != '0' }}
    runs-on: ${{ fromJSON(needs.release_prepare.outputs.common_matrix).include[0].runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: '[validate] Source references'
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.release_prepare.outputs.requests }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_javascript
      - name: '[prepare] JavaScript build tools'
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: shared-javascript
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
      - name: '[build] Source packages'
        id: source_packages
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.packages.retain && format('{0}/source-products/packages/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.packages.operation == 'restore' && 'import' || 'build' }} packages
          --url "$SOURCE_PACKAGES_URL" --sha256 "$SOURCE_PACKAGES_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source daemon'
        id: source_daemon
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.daemon.retain && format('{0}/source-products/daemon/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.daemon.operation == 'restore' && 'import' || 'build' }} daemon
          --url "$SOURCE_DAEMON_URL" --sha256 "$SOURCE_DAEMON_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[build] Source shell'
        id: source_shell
        env:
          SOURCE_OUTPUT: ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.shell.retain && format('{0}/source-products/shell/product', runner.temp) || '' }}
        run: >-
          pnpm exec tools-pack workspace ${{ fromJSON(needs.release_prepare.outputs.requests).source_javascript.shell.operation == 'restore' && 'import' || 'build' }} shell
          --url "$SOURCE_SHELL_URL" --sha256 "$SOURCE_SHELL_SHA256" --output "$SOURCE_OUTPUT"
          --scratch "$RUNNER_TEMP/source-import" --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ !cancelled() && needs.release_prepare.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-beta.json
          pending-artifact: ${{ needs.release_prepare.outputs.pending_artifact }}
          id: beta-common-results
          products: manifest
          batches: '["source_javascript"]'
          current-job: '[build] Shared JavaScript'
          step-results: |
            {"[build] Source packages":"${{ steps.source_packages.outcome }}","[build] Source daemon":"${{ steps.source_daemon.outcome }}","[build] Source shell":"${{ steps.source_shell.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}

  source_mac_arm64:
    outputs:
      postinstall_result: ${{ steps.workspace_setup.outputs.postinstall-result-json }}
      postinstall_timings: ${{ steps.workspace_setup.outputs.postinstall-timings-json }}
      requests: ${{ steps.workload_results.outputs.requests }}
      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] mac_arm64 workload"
    if: ${{ always() && !cancelled() && needs.release_prepare.result == 'success' && !contains(needs.*.result, 'failure') && needs.release_prepare.outputs.run_source_mac_arm64 == 'true' }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.release_prepare.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.release_prepare.outputs.common_count != '0' && needs.common.outputs.sources || needs.release_prepare.outputs.common_count == '0' && needs.release_prepare.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_mac_arm64 ${{ (needs.release_prepare.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: source-web
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
      - name: "[restore] Shared JavaScript"
        shell: bash
        run: pnpm --filter @open-design/tools-pack workspace:dev ${{ (needs.release_prepare.outputs.contribution == 'true') && 'import' || 'build' }} javascript --sources "$WORKSPACE_SOURCES" --scratch "$RUNNER_TEMP/shared-javascript" --json
      - name: "[build] Source web"
        id: source_web
        shell: bash
        env:
          SOURCE_OUTPUT: ${{ runner.temp }}/source-products/web/product
          OD_WEB_BUILD_ID: ${{ env.SOURCE_WEB_BUILD_ID }}
        run: pnpm --filter @open-design/tools-pack workspace:dev build web --url "$SOURCE_WEB_URL" --sha256 "$SOURCE_WEB_SHA256" --output "$SOURCE_OUTPUT" --scratch "$RUNNER_TEMP/source-import" --web-output-mode standalone --json
      - name: '[cache] Publish workload results'
        id: workload_results
        if: ${{ success() && needs.release_prepare.outputs.contribution == 'true' }}
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-beta.json
          pending-artifact: ${{ needs.release_prepare.outputs.pending_artifact }}
          id: beta-source-mac-arm64
          products: manifest
          batches: '["source_mac_arm64"]'
          current-job: '[build] mac_arm64 workload'
          step-results: |
            {"[build] Source web":"${{ steps.source_web.outcome }}"}
          local-products-root: ${{ runner.temp }}/source-products
          local-product-pattern: '**/workspace.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
