          VERSION_METADATA_URL: ${{ needs.publish.outputs.version_metadata_url }}
        shell: bash
        run: |
          pnpm exec tools-release artifact resolve --output "$RUNNER_TEMP/installer.json"
          pnpm exec tools-pack stage-artifact "$RUNNER_TEMP/installer.json"
      - name: Install and inspect downloaded artifact
        id: smoke
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/release-build/mac_arm64/build.json
          OD_PACKAGED_E2E_MAC: "1"
