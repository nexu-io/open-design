          if ($LASTEXITCODE -ne 0) { throw "tools-pack win cleanup failed with exit code $LASTEXITCODE" }
          $buildArgs = @("$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs", "win", "package", "--dir", "${{ runner.temp }}\tools-pack", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--portable", "--app-version", "${{ needs.release_prepare.outputs.beta_version }}", "--build-json", "${{ runner.temp }}\release-build\win_x64\build.json", "--to", "${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target }}", "--require-vela-cli", "--json")
          if ("${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.signMode }}" -eq "on") { $buildArgs += "--signed" }
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win build failed with exit code $LASTEXITCODE" }
          $build = Get-Content -Raw "${{ runner.temp }}\release-build\win_x64\build.json" | ConvertFrom-Json
          node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" win validate-payload --namespace release-beta-win --payload-path $build.payloadPath --expected-version "${{ needs.release_prepare.outputs.beta_version }}" --json
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win validate-payload failed with exit code $LASTEXITCODE" }
      - name: Upload win_x64 installer for manual distribution
        if: ${{ !cancelled() && !fromJSON(needs.release_prepare.outputs.execution_plan).release.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-beta-win-x64-installer
          path: |
            ${{ runner.temp }}\tools-pack\out\win\namespaces\release-beta-win\builder\*-setup.exe
            ${{ runner.temp }}\tools-pack\out\win\namespaces\release-beta-win\builder\*-portable.zip
          if-no-files-found: warn
          retention-days: 14
      - name: "[prepare] Full smoke dependencies"
        if: ${{ (fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode == 'full') }}
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: workspace
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
      - name: Build beta win_x64 update fixture
        if: ${{ (fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode == 'full' && fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateMetadataUrl == '' && fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateTargetVersion == '') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = [regex]::Match("${{ needs.release_prepare.outputs.beta_version }}", "^(?<base>\d+\.\d+\.\d+)-beta\.(?<number>\d+)$")
          if (-not $match.Success) { throw "full Windows smoke requires a counted beta version; got ${{ needs.release_prepare.outputs.beta_version }}" }
          $updateVersion = "{0}-beta.{1}" -f $match.Groups["base"].Value, ([int]$match.Groups["number"].Value + 1)
          $buildArgs = @("$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs", "win", "build", "--dir", "${{ runner.temp }}\release-work\win_x64\tools-pack-update-fixture", "--cache-dir", "${{ runner.temp }}\tools-pack-cache", "--namespace", "release-beta-win", "--app-version", $updateVersion, "--build-json", "${{ runner.temp }}\release-build\win_x64\windows-tools-pack-update-build.json", "--to", "nsis", "--require-vela-cli", "--json")
          if ("${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.signMode }}" -eq "on") { $buildArgs += "--signed" }
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture failed with exit code $LASTEXITCODE" }
          $updateBuild = Get-Content -Raw "${{ runner.temp }}\release-build\win_x64\windows-tools-pack-update-build.json" | ConvertFrom-Json
          node "$env:RELEASE_EXECUTOR_ROOT\pack\dist\index.mjs" win validate-payload --namespace release-beta-win --payload-path $updateBuild.payloadPath --expected-version $updateVersion --json
          if ($LASTEXITCODE -ne 0) { throw "tools-pack win update fixture validation failed with exit code $LASTEXITCODE" }
      - name: Smoke beta win_x64 packaged runtime
        id: win_x64_smoke
        if: ${{ (fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode == 'full') }}
        continue-on-error: true
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          OD_PACKAGED_E2E_NAMESPACE: release-beta-win
          OD_PACKAGED_E2E_RELEASE_CHANNEL: beta
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}\tools-pack
          OD_PACKAGED_E2E_WIN: "1"
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode }}
          OD_PACKAGED_E2E_WIN_UPDATE_FIXTURE: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode == 'full' && fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateMetadataUrl == '' && fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateTargetVersion == '' && 'tools-serve' || '' }}
          OD_PACKAGED_E2E_WIN_UPDATE_METADATA_URL: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateMetadataUrl }}
          OD_PACKAGED_E2E_WIN_UPDATE_VERSION: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.updateTargetVersion }}
        run: pnpm exec tsx scripts/release-smoke.ts win specs/win.spec.ts
      - name: Write win_x64 release report
        id: report_win_x64
        if: ${{ !cancelled() && steps.win_tools_pack_build.outcome == 'success' }}
        env:
          BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_BUILD_TARGET: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target }}
          RELEASE_CHANNEL: beta
          RELEASE_NAMESPACE: release-beta-win
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          RELEASE_REPORT_JSON_PATH: ${{ runner.temp }}\release-report\win_x64\report.json
          RELEASE_REPORT_SUMMARY_PATH: ${{ runner.temp }}\release-report\win_x64\summary.md
          RELEASE_SMOKE_EXEMPT: "true"
          RELEASE_SMOKE_MODE: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.smokeMode }}
          RELEASE_SMOKE_OUTCOME: ${{ steps.win_x64_smoke.outcome }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          REPORT_TITLE: win_x64 beta build
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" write-report
      - name: Publish win_x64 report summary
        if: ${{ !cancelled() && steps.report_win_x64.outcome == 'success' }}
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\release-report\win_x64\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Prepare win_x64 assets
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).release.publish }}
        env:
          RELEASE_ASSET_SUFFIX: .unsigned
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_BUILD_JSON_PATH: ${{ runner.temp }}\release-build\win_x64\build.json
          RELEASE_CHANNEL: beta
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          WIN_INCLUDE_ZIP: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target == 'all' || fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target == 'zip' }}
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" prepare-platform-assets
      - name: Publish win_x64 platform
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).release.publish }}
        env:
          RELEASE_ASSET_SUFFIX: .unsigned
          RELEASE_ASSETS_DIR: ${{ runner.temp }}\release-assets\win_x64
          RELEASE_CHANNEL: beta
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}\release-platform-manifests
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}\release-platform-outputs\win_x64.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}\release-report\win_x64
          WIN_INCLUDE_ZIP: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target == 'all' || fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.target == 'zip' }}
          RELEASE_SIGNED: "false"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_TARGET: win_x64
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
        run: node "$env:RELEASE_EXECUTOR_ROOT\release\dist\index.mjs" publish-platform
      - name: Read win_x64 platform outputs
        id: win_x64_platform_outputs
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).release.publish }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-platform-outputs/win_x64.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
  publish:
    name: "[publish] Beta distribution"
    needs:
      - release_prepare
      - build_mac_arm64
      - build_mac_x64
      - build_win_x64
    if: ${{ always() && !cancelled() && needs.release_prepare.result == 'success' && needs.release_prepare.outputs.run_publish == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      postinstall_result: ${{ steps.workspace_setup.outputs.postinstall-result-json }}
      postinstall_timings: ${{ steps.workspace_setup.outputs.postinstall-timings-json }}
      release_state: ${{ steps.outputs.outputs.release_state }}
      version_metadata_url: ${{ steps.outputs.outputs.version_metadata_url }}
      mac_arm64_url: ${{ steps.outputs.outputs.mac_arm64_dmg_url }}
      win_x64_url: ${{ steps.outputs.outputs.win_x64_installer_url }}
      mac_x64_url: ${{ steps.outputs.outputs.mac_x64_dmg_url }}
    env:
      GITHUB_SHA: ${{ needs.release_prepare.outputs.commit }}
      RELEASE_COMMIT: ${{ needs.release_prepare.outputs.commit }}
      RELEASE_ASSET_SUFFIX: ${{ needs.release_prepare.outputs.asset_version_suffix }}
      RELEASE_CHANNEL: beta
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
    steps:
      - name: Validate planned platform results
        env:
          EXECUTION_PLAN: ${{ needs.release_prepare.outputs.execution_plan }}
          MAC_ARM64_RESULT: ${{ needs.build_mac_arm64.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_x64.result }}
          WIN_X64_RESULT: ${{ needs.build_win_x64.result }}
        run: |
          set -euo pipefail
          for target in mac_arm64 mac_x64 win_x64; do
            enabled="$(jq -r --arg target "$target" '.platforms[$target].enabled' <<< "$EXECUTION_PLAN")"
            result_var="${target^^}_RESULT"
            result="${!result_var}"
            if [ "$enabled" = true ] && [ "$result" != success ]; then
              echo "planned platform $target did not succeed: $result" >&2
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: Setup workspace
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: release-publish
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
      - name: Download mac_arm64 platform manifest
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_arm64.enabled && needs.build_mac_arm64.result == 'success' }}
        env:
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_PLATFORM_MANIFEST_KEY: ${{ needs.build_mac_arm64.outputs.manifest_key }}
          RELEASE_TARGET: mac_arm64
        run: pnpm exec tools-release download-platform-manifest
      - name: Download mac_x64 platform manifest
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_x64.enabled && needs.build_mac_x64.result == 'success' }}
        env:
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_PLATFORM_MANIFEST_KEY: ${{ needs.build_mac_x64.outputs.manifest_key }}
          RELEASE_TARGET: mac_x64
        run: pnpm exec tools-release download-platform-manifest
      - name: Download win_x64 platform manifest
        if: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.enabled && needs.build_win_x64.result == 'success' }}
        env:
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_PLATFORM_MANIFEST_KEY: ${{ needs.build_win_x64.outputs.manifest_key }}
          RELEASE_TARGET: win_x64
        run: pnpm exec tools-release download-platform-manifest
      - name: Prepare and publish beta release notes
        env:
          RELEASE_CHANNEL: beta
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_NOTE_PLAN_PATH: ${{ runner.temp }}/release-metadata/release-note-plan.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
        run: |
          pnpm exec tools-release prepare-release-note
          pnpm exec tools-release publish-release-note
          pnpm exec tools-release verify-release-note
      - name: Publish beta metadata
        env:
          BASE_VERSION: ${{ needs.release_prepare.outputs.base_version }}
          ENABLE_MAC_ARM64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_arm64.enabled }}
          ENABLE_MAC_X64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_x64.enabled }}
          ENABLE_WIN_X64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.enabled }}
          MAC_ARM64_RESULT: ${{ needs.build_mac_arm64.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_x64.result }}
          RELEASE_ASSET_SUFFIX: ${{ needs.release_prepare.outputs.asset_version_suffix }}
          RELEASE_CHANNEL: beta
          RELEASE_LAUNCHER_VERSION_MIN_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_BETA }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_BETA }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_DIR: ${{ runner.temp }}/release-metadata
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-metadata/outputs.json
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_SIGNED: "true"
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          STATE_SOURCE: ${{ needs.release_prepare.outputs.state_source }}
          WIN_X64_RESULT: ${{ needs.build_win_x64.result }}
        run: pnpm exec tools-release publish-metadata
      - name: Read metadata outputs
        id: outputs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-metadata/outputs.json`, "utf8"));
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, String(value));
      - name: Verify beta metadata
        env:
          ENABLE_MAC_ARM64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_arm64.enabled }}
          ENABLE_MAC_X64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_x64.enabled }}
          ENABLE_WIN_X64: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.win_x64.enabled }}
          MAC_ARM64_RESULT: ${{ needs.build_mac_arm64.result }}
          MAC_X64_RESULT: ${{ needs.build_mac_x64.result }}
          RELEASE_CHANNEL: beta
          RELEASE_LAUNCHER_VERSION_MIN_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_BETA }}
          RELEASE_LAUNCHER_VERSION_MIN_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_STABLE }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_BETA: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_BETA }}
          RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE: ${{ vars.RELEASE_LAUNCHER_VERSION_MIN_URL_STABLE }}
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_NOTE_MANIFEST_PATH: ${{ runner.temp }}/release-metadata/release-note-publication.json
          RELEASE_VERSION: ${{ needs.release_prepare.outputs.beta_version }}
          WIN_X64_RESULT: ${{ needs.build_win_x64.result }}
        run: pnpm exec tools-release verify-metadata
      - name: Write beta metadata summary
        env:
          RELEASE_CHANNEL: beta
          RELEASE_METADATA_URL: ${{ steps.outputs.outputs.version_metadata_url }}
          RELEASE_SUMMARY_PATH: ${{ runner.temp }}/release-metadata/summary.md
        run: pnpm exec tools-release summary-metadata
      - name: Publish summary
        run: cat "${{ runner.temp }}/release-metadata/summary.md" >> "$GITHUB_STEP_SUMMARY"
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    needs: [release_prepare, common]
    if: ${{ !cancelled() && needs.release_prepare.result == 'success' && !contains(needs.*.result, 'failure') && needs.release_prepare.outputs.run_test == 'true' && needs.release_prepare.outputs.test_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_prepare.outputs.test_matrix) }}
    env:
      OD_WATCHER_TEST_DEBUG: ${{ matrix.debug || '' }}
      TEST_KIND: ${{ matrix.kind }}
      TEST_SHARD: ${{ matrix.shard || '' }}
      TEST_GROUP: ${{ matrix.group || '' }}
      TEST_SHARED: ${{ needs.release_prepare.outputs.contribution }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        if: ${{ needs.release_prepare.outputs.contribution == 'true' }}
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.release_prepare.outputs.common_count != '0' && needs.common.outputs.sources || needs.release_prepare.outputs.common_count == '0' && needs.release_prepare.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --shared packages,daemon,shell
      - name: Configure CI parallelism
        if: ${{ matrix.kind == 'ui' }}
        uses: ./.github/actions/configure-ci-parallelism
      - name: Setup workspace
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: ${{ format('test-{0}', matrix.kind) }}
          save-pnpm-cache: ${{ env.BETA_SAVE_PNPM_CACHE }}
          pnpm-store-cache-format: ${{ env.BETA_PNPM_STORE_CACHE_FORMAT }}
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Setup Playwright
        if: ${{ matrix.kind == 'e2e' || matrix.kind == 'ui' }}
        uses: ./.github/actions/setup-playwright
        with:
          package-json-path: e2e/package.json
          install-command: pnpm -C e2e exec playwright install --with-deps chromium
          runner-labels: ${{ toJSON(matrix.runner) }}
      - name: Allow Chromium user namespaces on GitHub Ubuntu
        if: ${{ matrix.kind == 'e2e' }}
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare test dependencies
        run: python3 .github/scripts/release/test_unit.py prepare
      - name: Clean Playwright state
        if: ${{ matrix.kind == 'ui' }}
        run: pnpm -C e2e exec tsx scripts/playwright.ts clean
      - name: Run test unit
        run: python3 .github/scripts/release/test_unit.py run
      - name: Preserve project-runtime domain artifact
        if: ${{ success() && matrix.kind == 'ui' && matrix.group == 'project-runtime' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}-domain
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Run UI critical extras
        if: ${{ matrix.extra == true }}
        run: python3 .github/scripts/release/test_unit.py extra
      - name: Upload Playwright debug artifact
        if: ${{ always() && matrix.kind == 'ui' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-e2e-${{ github.run_id }}-p0-${{ matrix.group }}
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  cache_test:
    name: "[cache] Completed test results"
    needs: [release_prepare, test]
    if: ${{ always() && !cancelled() && needs.release_prepare.result == 'success' && needs.release_prepare.outputs.contribution == 'true' && needs.release_prepare.outputs.test_count != '0' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: '[cache] Publish independently successful workloads'
        uses: ./.github/actions/convergence
        with:
          config: .github/config/convergence/release-beta.json
          pending-artifact: ${{ needs.release_prepare.outputs.pending_artifact }}
          id: beta-test-results
          products: none
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
          CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
