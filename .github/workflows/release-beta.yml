name: release-beta

on:
  workflow_dispatch:
    inputs:
      enable_mac_arm64:
        description: "Build and publish macOS arm64 beta artifacts."
        required: true
        type: boolean
        default: true
      enable_win_x64:
        description: "Build and publish Windows x64 beta artifacts."
        required: true
        type: boolean
        default: true
      enable_mac_x64:
        description: "Build and publish macOS x64 beta artifacts."
        required: true
        type: boolean
        default: true
      publish:
        description: "Publish beta assets and metadata."
        required: true
        type: boolean
        default: true
      promote:
        description: "Promote this build to beta/latest after publishing versioned platform artifacts."
        required: true
        type: boolean
        default: true
      release_public_origin:
        description: "Optional public release origin override."
        required: false
        type: string
        default: ""
      ref:
        description: "Optional branch, tag, or full 40-character commit SHA to build. Abbreviated SHAs are rejected."
        required: false
        type: string
        default: ""
      amr_profile:
        description: "Optional AMR profile baked into the build (e.g. feature-test to point the packaged app at that profile's AMR backend and enable the workspace-team transport). Empty leaves the default (prod)."
        required: false
        type: string
        default: ""
      mac_arm64_sign_mode:
        description: "macOS arm64 signing mode."
        required: true
        type: choice
        options:
          - "unsigned"
          - "signed"
          - "notarized"
        default: "notarized"
      mac_arm64_smoke_mode:
        description: "macOS arm64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      mac_arm64_target:
        description: "macOS arm64 build target."
        required: true
        type: choice
        options:
          - dmg
          - all
        default: dmg
      mac_arm64_update_metadata_url:
        description: "Optional external updater metadata URL for full macOS arm64 payload smoke."
        required: false
        type: string
        default: ""
      mac_arm64_update_target_version:
        description: "Optional external updater target version expected by full macOS arm64 payload smoke."
        required: false
        type: string
        default: ""
      mac_x64_sign_mode:
        description: "macOS x64 signing mode."
        required: true
        type: choice
        options:
          - "unsigned"
          - "signed"
          - "notarized"
        default: notarized
      mac_x64_smoke_mode:
        description: "macOS x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      mac_x64_target:
        description: "macOS x64 build target."
        required: true
        type: choice
        options:
          - dmg
          - all
        default: all
      win_x64_sign_mode:
        description: "Windows x64 signing mode."
        required: true
        type: choice
        options:
          - "unsigned"
          - "signed"
        default: "unsigned"
      win_x64_smoke_mode:
        description: "Windows x64 smoke coverage."
        required: true
        type: choice
        options:
          - skip
          - core
          - full
        default: core
      win_x64_target:
        description: "Windows x64 build target."
        required: true
        type: choice
        options:
          - nsis
          - all
          - zip
          - dir
        default: all
      win_x64_update_metadata_url:
        description: "Optional external updater metadata URL for full Windows payload smoke."
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        description: "Optional external updater target version expected by full Windows payload smoke."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      enable_mac_arm64:
        required: false
        type: boolean
        default: true
      enable_win_x64:
        required: false
        type: boolean
        default: true
      enable_mac_x64:
        required: false
        type: boolean
        default: true
      publish:
        required: false
        type: boolean
        default: true
      promote:
        description: "Promote this build to beta/latest after publishing versioned platform artifacts."
        required: false
        type: boolean
        default: true
      release_origin:
        required: false
        type: string
        default: cloudflare-r2
      release_public_origin:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
      amr_profile:
        required: false
        type: string
        default: ""
      mac_arm64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_arm64_smoke_mode:
        required: false
        type: string
        default: core
      mac_arm64_target:
        required: false
        type: string
        default: dmg
      mac_arm64_update_metadata_url:
        required: false
        type: string
        default: ""
      mac_arm64_update_target_version:
        required: false
        type: string
        default: ""
      mac_x64_sign_mode:
        required: false
        type: string
        default: notarized
      mac_x64_smoke_mode:
        required: false
        type: string
        default: core
      mac_x64_target:
        required: false
        type: string
        default: all
      win_x64_sign_mode:
        required: false
        type: string
        default: "unsigned"
      win_x64_smoke_mode:
        required: false
        type: string
        default: core
      win_x64_target:
        required: false
        type: string
        default: all
      win_x64_update_metadata_url:
        required: false
        type: string
        default: ""
      win_x64_update_target_version:
        required: false
        type: string
        default: ""
      notification_stream:
        required: false
        type: string
        default: release
    outputs:
      beta_version:
        description: "The beta version that was built."
        value: ${{ jobs.distribute.outputs.beta_version }}
      shell_version:
        description: "The Electron Shell compatibility version that was built or reused."
        value: ${{ jobs.distribute.outputs.shell_version }}
      closure_version:
        description: "The Standalone Closure version that was built or reused."
        value: ${{ jobs.distribute.outputs.closure_version }}
      branch:
        description: "The branch that was built."
        value: ${{ jobs.distribute.outputs.branch }}
      commit:
        description: "The commit SHA that was built."
        value: ${{ jobs.distribute.outputs.commit }}
      previous_commit:
        description: "Commit SHA of the previously published beta."
        value: ${{ jobs.distribute.outputs.previous_commit }}
      release_state:
        description: "complete | partial | failed."
        value: ${{ jobs.distribute.outputs.release_state }}
      version_metadata_url:
        description: "Public URL of this build's version metadata.json."
        value: ${{ jobs.distribute.outputs.version_metadata_url }}
      mac_arm64_url:
        description: "macOS arm64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_arm64_url }}
      win_x64_url:
        description: "Windows x64 installer download URL."
        value: ${{ jobs.distribute.outputs.win_x64_url }}
      mac_arm64_smoke_result:
        description: "macOS arm64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.mac_arm64_smoke_result }}
      win_x64_smoke_result:
        description: "Windows x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.win_x64_smoke_result }}
      mac_x64_url:
        description: "macOS x64 dmg download URL."
        value: ${{ jobs.distribute.outputs.mac_x64_url }}
      mac_x64_smoke_result:
        description: "macOS x64 packaged smoke outcome; advisory to publication."
        value: ${{ jobs.distribute.outputs.mac_x64_smoke_result }}

permissions:
  actions: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: open-design-release-beta
  cancel-in-progress: false

jobs:
  distribute:
    name: Distribute beta release
    uses: ./.github/workflows/distribution.yml
    secrets: inherit
    with:
      channel: beta
      enable_mac_arm64: ${{ inputs.enable_mac_arm64 }}
      enable_win_x64: ${{ inputs.enable_win_x64 }}
      enable_mac_x64: ${{ inputs.enable_mac_x64 }}
      publish: ${{ inputs.publish }}
      promote: ${{ inputs.promote }}
      release_origin: ${{ inputs.release_origin }}
      release_public_origin: ${{ inputs.release_public_origin }}
      ref: ${{ inputs.ref }}
      amr_profile: ${{ inputs.amr_profile }}
      mac_arm64_sign_mode: ${{ inputs.mac_arm64_sign_mode }}
      mac_arm64_smoke_mode: ${{ inputs.mac_arm64_smoke_mode }}
      mac_arm64_target: ${{ inputs.mac_arm64_target }}
      mac_arm64_update_metadata_url: ${{ inputs.mac_arm64_update_metadata_url }}
      mac_arm64_update_target_version: ${{ inputs.mac_arm64_update_target_version }}
      mac_x64_sign_mode: ${{ inputs.mac_x64_sign_mode }}
      mac_x64_smoke_mode: ${{ inputs.mac_x64_smoke_mode }}
      mac_x64_target: ${{ inputs.mac_x64_target }}
      win_x64_sign_mode: ${{ inputs.win_x64_sign_mode }}
      win_x64_smoke_mode: ${{ inputs.win_x64_smoke_mode }}
      win_x64_target: ${{ inputs.win_x64_target }}
      win_x64_update_metadata_url: ${{ inputs.win_x64_update_metadata_url }}
      win_x64_update_target_version: ${{ inputs.win_x64_update_target_version }}

  notify:
    name: Report beta release
    needs: distribute
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/release-notify.yml
    with:
      branch: ${{ needs.distribute.outputs.branch }}
      channel: beta
      commit: ${{ needs.distribute.outputs.commit }}
      mac_arm64_smoke: ${{ needs.distribute.outputs.mac_arm64_smoke_result }}
      mac_arm64_url: ${{ needs.distribute.outputs.mac_arm64_url }}
      mac_x64_smoke: ${{ needs.distribute.outputs.mac_x64_smoke_result }}
      mac_x64_url: ${{ needs.distribute.outputs.mac_x64_url }}
      metadata_url: ${{ needs.distribute.outputs.version_metadata_url }}
      notification_stream: ${{ inputs.notification_stream }}
      previous_commit: ${{ needs.distribute.outputs.previous_commit }}
      release_mode: ${{ inputs.publish && 'publish' || 'validation' }}
      release_result: ${{ needs.distribute.result }}
      release_state: ${{ needs.distribute.outputs.release_state }}
      version: ${{ needs.distribute.outputs.beta_version }}
      win_x64_smoke: ${{ needs.distribute.outputs.win_x64_smoke_result }}
      win_x64_url: ${{ needs.distribute.outputs.win_x64_url }}
    secrets:
      bot: ${{ secrets.RELEASE_FEISHU_BETA }}
