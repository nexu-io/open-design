      sources: ${{ steps.workload_results.outputs.sources }}
    name: "[build] win_x64 workload"
    if: ${{ always() && !cancelled() && needs.release_prepare.result == 'success' && !contains(needs.*.result, 'failure') && needs.release_prepare.outputs.run_source_win_x64 == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release_prepare.outputs.commit }}
          fetch-depth: 1
      - name: "[validate] Source references"
        shell: bash
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          SOURCE_REQUESTS: ${{ needs.release_prepare.outputs.requests }}
          SHARED_SOURCES: ${{ toJSON(fromJSON(needs.release_prepare.outputs.common_count != '0' && needs.common.outputs.sources || needs.release_prepare.outputs.common_count == '0' && needs.release_prepare.outputs.sources || 'null').source_javascript) }}
        run: python3 .github/scripts/convergence.py resolve-references --batch source_win_x64 ${{ (needs.release_prepare.outputs.contribution == 'true') && '--shared packages,daemon,shell' || '' }}
      - name: "[prepare] Workspace source tools"
        id: workspace_setup
        uses: ./.github/actions/setup-workspace
