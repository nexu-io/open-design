          RELEASE_ASSET_SUFFIX: ${{ fromJSON(needs.release_prepare.outputs.execution_plan).platforms.mac_x64.signMode != 'no' && '.signed' || '.unsigned' }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets/mac_x64
          RELEASE_CHANNEL: beta
