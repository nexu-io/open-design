name: notify-daily-feishu

# Every morning (09:00 Asia/Shanghai) build a beta package off main (the
# development tip) by reusing release-beta, then post a Feishu card with download
# links and the changelog since the previously published beta — to the SAME
# Feishu bot as the per-push release stream (FEISHU_RELEASE_WEBHOOK). The two
# streams share one group; their cards stay distinguishable via CHANNEL_LABEL
# (Beta vs Nightly) and STREAM_LABEL.
#
# Beta is the daily R&D channel, so it tracks main rather than a release branch:
# a per-patch release/vX.Y.Z branch freezes once it ships stable, at which point
# its base version equals the latest stable and release-beta's
# strictly-greater-than-stable guard rejects every build. main always leads
# stable, so it never hits that trap. Pass `ref` to build a one-off beta from a
# specific branch (e.g. a release branch) instead.
#
# NOTE: schedule triggers only fire from the default branch (main), so this file
# must live on main to run on its cron.

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Override the ref to build (e.g. release/v0.10.1). Empty builds main."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: feishu-daily
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve build ref
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      force: ${{ steps.recovery.outputs.force }}
      promote: ${{ steps.recovery.outputs.promote }}
      release_version: ${{ steps.recovery.outputs.release_version }}
    steps:
      - name: Pick build ref (main, or override)
        id: pick
        env:
          OVERRIDE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_REF:-}" ]; then
            echo "using override ref: $OVERRIDE_REF"
            echo "ref=$OVERRIDE_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "using default ref: main"
          echo "ref=main" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow helper
        uses: actions/checkout@v6.0.2
        with:
          path: workflow-source

      - name: Checkout build ref for recovery check
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ steps.pick.outputs.ref }}
          path: build-source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve foreign beta recovery
        id: recovery
        env:
          BUILD_REF: ${{ steps.pick.outputs.ref }}
          OPEN_DESIGN_BETA_METADATA_URL: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}/beta/latest/metadata.json
          PACKAGED_PACKAGE_JSON_PATH: build-source/apps/packaged/package.json
        run: node --experimental-strip-types workflow-source/.github/scripts/release/resolve-daily-beta-recovery.ts

  build:
    name: Build beta from main
    needs: resolve
    uses: ./.github/workflows/release-beta.yml
    secrets: inherit
    with:
      enable_mac_arm64: true
      enable_win_x64: true
      force: ${{ needs.resolve.outputs.force == 'true' }}
      promote: ${{ needs.resolve.outputs.promote == 'true' }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_version: ${{ needs.resolve.outputs.release_version }}

  notify:
    name: Notify Feishu (daily)
    needs:
      - resolve
      - build
    if: ${{ !cancelled() && needs.build.outputs.beta_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built ref
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Compute changelog since last beta
        id: changelog
        env:
          PREV: ${{ needs.build.outputs.previous_commit }}
          CUR: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/changelog.txt"
          : > "$file"
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null && git cat-file -e "${CUR}^{commit}" 2>/dev/null; then
            git log --no-merges --pretty=format:'%s (%h)' "${PREV}..${CUR}" > "$file" || true
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Post Feishu card
        env:
          # Daily and release-push streams share one Feishu bot; both post to
          # FEISHU_RELEASE_WEBHOOK. CHANNEL_LABEL/STREAM_LABEL still distinguish
          # the two card types within that single group.
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_RELEASE_SIGN_SECRET }}
          CHANNEL_LABEL: "Beta"
          VERSION: ${{ needs.build.outputs.beta_version }}
          BRANCH: ${{ needs.build.outputs.branch }}
          COMMIT: ${{ needs.build.outputs.commit }}
          PREVIOUS_COMMIT: ${{ needs.build.outputs.previous_commit }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
          BUILD_STATE: ${{ needs.build.result }}
          RELEASE_STATE: ${{ needs.build.outputs.release_state }}
          RELEASE_NOTE: ${{ needs.build.outputs.release_state == 'partial' && '共享 beta/latest 当前版本高于 main，已保留原指针；本次仅发布可下载的版本化快照。' || '' }}
          MAC_ARM64_SMOKE_RESULT: ${{ needs.build.outputs.mac_arm64_smoke_result }}
          WIN_X64_SMOKE_RESULT: ${{ needs.build.outputs.win_x64_smoke_result }}
          MAC_ARM64_URL: ${{ needs.build.outputs.mac_arm64_url }}
          WIN_URL: ${{ needs.build.outputs.win_x64_url }}
          STREAM_LABEL: "每日定时"
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types tools/release/src/notifications/feishu.ts

  notify_failure:
    name: Notify Feishu when daily beta fails
    needs:
      - resolve
      - build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted notifier
        uses: actions/checkout@v6.0.2
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Post daily beta failure card
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_RELEASE_SIGN_SECRET }}
          NOTICE_TITLE: "🚨 每日 beta 构建失败"
          NOTICE_TEMPLATE: "red"
          NOTICE_BODY: |
            main 的每日 beta 构建未完成。失败可能发生在版本 / release metadata 校验阶段，因此即使尚未生成 beta_version，也必须立即处理。

            **构建 ref**: `${{ needs.resolve.outputs.ref }}`

            独立的 prerelease Windows canary 不受该 metadata 门禁影响；请结合两个 workflow 判断是发布状态问题还是产品 smoke 问题。
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types tools/release/src/notifications/feishu-notice.ts
