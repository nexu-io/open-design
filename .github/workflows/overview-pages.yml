name: Overview Pages

on:
  push:
    branches:
      - main
    paths:
      - overview.html
      - catalog/**
      - design-templates/**
      - design-systems/**
      - skills/**
      - scripts/build-github-pages-site.ts
      - .github/workflows/overview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nexu-io/open-design'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build overview site
        run: pnpm exec tsx scripts/build-github-pages-site.ts --out-dir .tmp/github-pages-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/github-pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
