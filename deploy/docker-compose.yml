name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    # List format for portability (avoids YAML mapping issues on Windows/macOS).
    # Every OD_* name here matches the env var name the daemon reads —
    # set the same name in your .env file and it will be forwarded as-is.
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=192}
      - OD_BIND_HOST=0.0.0.0
      - OD_PORT=7456
      # Derive from OPEN_DESIGN_PORT so origin validation always trusts the
      # published host port. Set OD_WEB_PORT in .env to override.
      - OD_WEB_PORT=${OD_WEB_PORT:-${OPEN_DESIGN_PORT:-7456}}
      # Legacy OPEN_DESIGN_ALLOWED_ORIGINS is supported as a fallback for
      # existing .env files. New deployments should use OD_ALLOWED_ORIGINS.
      - OD_ALLOWED_ORIGINS=${OD_ALLOWED_ORIGINS:-${OPEN_DESIGN_ALLOWED_ORIGINS:-}}
      - OD_API_TOKEN=${OD_API_TOKEN:-}
      - OD_DISABLE_API_AUTH=${OD_DISABLE_API_AUTH:-${OPEN_DESIGN_DISABLE_API_AUTH:-}}
      # Auth is opt-in: set OD_API_TOKEN and the middleware activates.
      # The host port is bound to 127.0.0.1 (Docker-host only), so the
      # only callers are the host user and the same-machine browser —
      # loopback bypass handles that path.  To force-disable auth even
      # with a token set (shared-host CI, testing), add
      # OD_DISABLE_API_AUTH=1 to your .env.  OPEN_DESIGN_DISABLE_API_AUTH
      # is accepted as a backward-compat fallback.
      - OD_ADDITIONAL_ALLOWED_DIRS=${OD_ADDITIONAL_ALLOWED_DIRS:-}
      # WARNING: This flag trusts RFC1918 (private) remote addresses as
      # if they were localhost.  The published port is bound to 127.0.0.1
      # so only the host machine reaches it — safe as shipped.  If you
      # change the port binding to 0.0.0.0 (LAN/VPN), every browser on
      # that network can mint a session cookie without knowing OD_API_TOKEN.
      # Set this to 0 via .env when publishing on a private subnet.
      # 0 = only localhost can bootstrap (secure).  Set to 1 only when
      # running behind a same-host reverse proxy (nginx sidecar, etc.)
      # where the daemon sees RFC1918 remote addresses but all other
      # network paths are controlled.
      - OD_BOOTSTRAP_ALLOW_PRIVATE_SUBNET=${OD_BOOTSTRAP_ALLOW_PRIVATE_SUBNET:-0}
      - OD_TRUST_PROXY=${OD_TRUST_PROXY:-}
      - OD_PUBLIC_BASE_URL=${OD_PUBLIC_BASE_URL:-}
      - OD_CODEX_SANDBOX=${OD_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
