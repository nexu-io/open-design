name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    # List format for portability (avoids YAML mapping issues on Windows/macOS).
    # Every OD_* name here matches the env var name the daemon reads —
    # set the same name in your .env file and it will be forwarded as-is.
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=192}
      - OD_BIND_HOST=0.0.0.0
      - OD_ALLOWED_ORIGINS=${OD_ALLOWED_ORIGINS:-}
      - OD_PORT=7456
      # Derive from OPEN_DESIGN_PORT so origin validation always trusts the
      # published host port. Set OD_WEB_PORT in .env to override.
      - OD_WEB_PORT=${OD_WEB_PORT:-${OPEN_DESIGN_PORT:-7456}}
      - OD_API_TOKEN=${OD_API_TOKEN:-}
      # API auth is disabled by default because the host port is locked to
      # 127.0.0.1 (only accessible from the Docker host). Set OD_API_TOKEN
      # in your .env and remove this line to enable token-based auth.
      - OD_DISABLE_API_AUTH=1
      - OD_ADDITIONAL_ALLOWED_DIRS=${OD_ADDITIONAL_ALLOWED_DIRS:-}
      - OD_CODEX_SANDBOX=${OD_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
