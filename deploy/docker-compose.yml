name: open-design

services:
  open-design:
    container_name: open-design
    image: ${MARKETING_AX_IMAGE:-docker.io/vanjayak/open-design:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      MAX_BIND_HOST: 0.0.0.0
      MAX_ALLOWED_ORIGINS: ${MARKETING_AX_ALLOWED_ORIGINS:-}
      MAX_PORT: 7456
      MAX_WEB_PORT: ${MARKETING_AX_PORT:-7456}
      MAX_API_TOKEN: ${MAX_API_TOKEN:?Please run 'openssl rand -hex 32' to generate one, and set it in your .env file.}
      MAX_CODEX_SANDBOX: ${MAX_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${MARKETING_AX_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MARKETING_AX_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
