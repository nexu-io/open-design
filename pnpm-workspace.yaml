packages:
  - packages/*
  - apps/*
  - tools/*
  - e2e

overrides:
  brace-expansion: 5.0.6
  devalue: 5.8.1
  fast-uri: 3.1.2
  hono: 4.12.19
  ip-address: 10.2.0
  postcss: 8.5.15
  protobufjs: 8.4.0
  qs: 6.15.2
  tmp: 0.2.7
  yaml: 2.9.0

allowBuilds:
  better-sqlite3: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true

# Preserve pre-pnpm-11 behavior: only the packages above may run install scripts;
# any other package with build scripts is ignored rather than failing the install.
strictDepBuilds: false

# Opt out of pnpm 11's default 1-day maturity window so CI and fresh installs
# do not fail on recently published dependencies.
minimumReleaseAge: 0
