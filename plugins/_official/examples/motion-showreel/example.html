<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta name="od-motion-output" content="video">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Reel 2026 — Showreel</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:ArchivoX;src:url('assets/archivo-expanded-black.ttf') format('truetype');font-display:block}
@font-face{font-family:ArchivoC;src:url('assets/archivo-condensed-black.ttf') format('truetype');font-display:block}
@font-face{font-family:ArchivoB;src:url('assets/archivo-extrabold.ttf') format('truetype');font-display:block}
@font-face{font-family:InstrumentI;src:url('assets/instrument-serif-italic.ttf') format('truetype');font-display:block}
@font-face{font-family:JBMono;src:url('assets/jetbrains-mono-medium.ttf') format('truetype');font-display:block}
@font-face{font-family:JBMonoB;src:url('assets/jetbrains-mono-bold.ttf') format('truetype');font-display:block}
:root{--bg:#202020;--ink:#FAFAFA;--accent:#87EA5C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#0B0B0C;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="15" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   Motion Reel 2026 — a frame-faithful rebuild of the viral
   "15-second motion designer showreel" (@stephanlivera).
   Seven chapters at 128 BPM. One canvas, one clock: render(t)
   draws every frame purely from timeline time.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080, bpm: 128, reducedAt: 14.6,
  brand: 'OPEN DESIGN', role: 'motion designer', year: '2026',
  dark: '#202020', ink: '#26251E', green: '#87EA5C', paper: '#FAFAFA', deep: '#007106', pale: '#D0FFB5',

};
const BEAT = 60 / CFG.bpm;
const F = { wide: '"ArchivoX", "Arial Black", sans-serif', cond: '"ArchivoC", "Arial Narrow", sans-serif', bold: '"ArchivoB", Arial, sans-serif', serif: '"InstrumentI", Georgia, serif', mono: '"JBMono", ui-monospace, Menlo, monospace', monoB: '"JBMonoB", ui-monospace, Menlo, monospace' };
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const E = n => gsap.parseEase(n);

const seg = (t, a, b) => clamp((t - a) / (b - a));

const TAU = Math.PI * 2;

// A word drawn glyph by glyph; fx(i) returns {dx, dy, sx, sy, a, blur:[vx,vy]}

// [start, label, background, hud ink]
const CH = [[0, '01 — IDENTITY', CFG.dark, CFG.paper], [2.0, '01 — IDENTITY', CFG.green, CFG.ink], [3.5, '02 — EASING', CFG.paper, CFG.ink], [5.5, '03 — MORPHING', CFG.deep, CFG.paper], [7.45, '04 — SYSTEMS', CFG.dark, CFG.paper], [9.75, '05 — DEPTH', CFG.dark, CFG.paper], [11.2, '06 — KINETIC TYPE', CFG.dark, CFG.paper], [13.1, '07 — END', CFG.green, CFG.ink]];

/* 01b — the brand title on orange */
function title(t) {
  const cx = 960, cy = 540;
  const grow = EZ.o3(seg(t, 0, 0.25)); // the orange disc opens inside the cream ring
  if (grow < 1) { ctx.fillStyle = CFG.paper; ctx.fillRect(0, 0, CFG.w, CFG.h); circle(cx, cy, 1300 * grow, CFG.green); }

  text('SHOWREEL — ' + CFG.year, 1776, 270, 22, F.mono, CFG.ink, 'right', seg(t, 0.4, 0.6));
  // letters slide in from the left, squeeze and stretch, then settle wide

  const lines = CFG.brand.split(' '), size = Math.min(270, ...lines.map(l => fitSize(l, F.wide, 300, 1600)));

    word(line, cx, base[k], size, F.wide, CFG.ink, (j) => {

  text('SAME DISTANCE · SAME DURATION (0.8s)', 1340, 192, 18, F.mono, 'rgba(38,37,30,.55)', 'left', EZ.o3(enter));

/* 03 — morphing: one shape, four forms, an orbit that follows */
const NP = 160;

    if (driftSince === null || drift * previousDrift <= 0 || Math.abs(drift - previousDrift) > .1) driftSince = now;
    previousDrift = drift;
    if (now - driftSince >= 750) {
      audio.currentTime = target; correctedAt = now; driftSince = null;
    }
  };
}
  // END shared motion audio sync
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';controls.appendChild(button);
  // Gallery thumbnails load the page in an opaque sandbox; those stay silent until asked.
  let enabled=window.origin!=='null',pending=false,chosen=false;
  const timeline=()=>window.__timelines&&window.__timelines.main;
  const syncAudio=createMotionAudioSync(audio);
  let wasPlaying=false,lastTime=0;
  function label() { button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-label',enabled?'Mute sound':'Enable sound');button.setAttribute('aria-pressed',String(enabled)); }
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;label();if(!chosen)waitForGesture();}).finally(()=>{pending=false;}); }
  function waitForGesture() {
    const start=event=>{
      if(event.target===button)return;
      document.removeEventListener('pointerdown',start,true);document.removeEventListener('keydown',start,true);
      if(chosen||enabled)return;
      const tl=timeline();enabled=true;label();if(tl)syncAudio(tl.time(),true,true);play();
    };
    document.addEventListener('pointerdown',start,true);document.addEventListener('keydown',start,true);
  }
  label();
  button.onclick=()=>{chosen=true;enabled=!enabled;label();const tl=timeline();if(enabled&&tl){if(tl.progress()>=1)tl.restart();else tl.play();syncAudio(tl.time(),true,true);play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)syncAudio(Number(event.target.value),false,true);});
  function sync() {
    if (window.__odMotionSourcePlayer) return;
    const tl=timeline();
    if(tl&&enabled&&!window.__odFrameRenderer){
      const time=tl.time(),moving=!tl.paused()&&tl.progress()<1;
      syncAudio(time,moving,(moving&&!wasPlaying)||time<lastTime-.1);
      wasPlaying=moving;lastTime=time;
      if(moving)play();else audio.pause();
    }else { audio.pause();wasPlaying=false; }
    requestAnimationFrame(sync);
  }sync();
})();
</script>
