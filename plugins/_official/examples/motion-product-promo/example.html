<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>

<title>Pennyflow — Product Promo</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:InterD;src:url('assets/inter-regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:InterD;src:url('assets/inter-semibold.ttf') format('truetype');font-weight:600;font-display:block}
@font-face{font-family:FrauncesB;src:url('assets/fraunces-bold.ttf') format('truetype');font-display:block}
@font-face{font-family:InstrumentI;src:url('assets/instrument-serif-italic.ttf') format('truetype');font-display:block}

:root{--bg:#FFFFFF;--ink:#111111;--accent:#1F70F3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}

#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="15" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   Pennyflow — a frame-faithful rebuild of the viral product
   promo (@achxvi) with a fictional brand. A halftone mascot asks
   "Got something to sell?", products pop onto blue cards, a phone
   store fills in, a checkout bento handles the money, "Handled."
   is stamped, "You create. We handle the flow." resolves into the
   wordmark. 15 s. render(t) is a pure function of time; the
   halftone is an ordered dither of a quarter-resolution layer.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080, reducedAt: 9.6,
  brand: 'Pennyflow', domain: 'pennyflow.com', store: 'yourname.pennyflow.com',
  white: '#FFFFFF', ink: '#111111', blue: '#1F70F3', paper: '#FBFBFB', black: '#060606', grey: '#8C8C8C', soft: '#B3B3B3', line: '#E6E6E6'
};
const F = { sans: 'InterD, "Helvetica Neue", Arial, sans-serif', serif: 'FrauncesB, Georgia, serif', ital: 'InstrumentI, Georgia, serif', mono: 'JBMono, ui-monospace, Menlo, monospace' };
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const EZ = {
  o3: k => 1 - Math.pow(1 - k, 3), i3: k => k * k * k, io3: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  expo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k), back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }
};
// damped spring step response, 0 → 1 (z < 1)
function spring(dt, w = 16, z = 0.55) { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + z * w / wd * Math.sin(wd * dt)); }

/* ---------- drawing helpers ---------- */
const font = (size, fam, weight = '') => `${weight} ${size}px ${fam}`.trim();
function tw(s, size, fam, weight = '') { ctx.font = font(size, fam, weight); return ctx.measureText(s).width; }
function txt(s, x, y, size, fam, color, align = 'left', alpha = 1, weight = '') {
  if (alpha <= 0.002 || !s) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.font = font(size, fam, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y); ctx.restore();
}
// a word that rises into a clipped line, with a short vertical smear while it moves
function rise(s, x, y, size, fam, color, p, weight = '') {
  if (p <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 20, y - size * 1.05, tw(s, size, fam, weight) + 60, size * 1.35); ctx.clip();
  const dy = (1 - EZ.expo(p)) * size * 1.1;
  if (p < 0.95) for (let k = 3; k > 0; k--) txt(s, x, y + dy + k * size * 0.08 * (1 - p), size, fam, color, 'left', 0.18, weight);
  txt(s, x, y + dy, size, fam, color, 'left', 1, weight); ctx.restore();
}
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function box(x, y, w, h, r, fill, stroke, lw = 2) { rr(ctx, x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function dot(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = color; ctx.fill(); }
function check(x, y, s, color, lw = 3) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x - s * 0.12, y + s * 0.38); ctx.lineTo(x + s * 0.55, y - s * 0.42); ctx.stroke(); ctx.restore(); }
const money = v => '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* ---------- halftone: draw grey shapes at quarter resolution, then ordered-dither ---------- */
const CELL = 4, BW = CFG.w / CELL, BH = CFG.h / CELL;
const hb = document.createElement('canvas'); hb.width = BW; hb.height = BH; const hg = hb.getContext('2d', { willReadFrequently: true });
const ho = document.createElement('canvas'); ho.width = BW; ho.height = BH; const hoc = ho.getContext('2d');
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) * 16);
function halftone(draw, ink = [17, 17, 17], paper = [255, 255, 255], alpha = 1) {
  if (alpha <= 0.002) return;
  const m = ctx.getTransform();
  hg.setTransform(1, 0, 0, 1, 0, 0); hg.clearRect(0, 0, BW, BH);
  hg.setTransform(m.a / CELL, m.b / CELL, m.c / CELL, m.d / CELL, m.e / CELL, m.f / CELL);
  draw(hg);
  const img = hg.getImageData(0, 0, BW, BH), d = img.data;
  for (let y = 0, i = 0; y < BH; y++) {
    const row = (y & 3) * 4;
    for (let x = 0; x < BW; x++, i += 4) {
      if (d[i + 3] < 110) { d[i + 3] = 0; continue; }
      const c = d[i] < BAYER[row + (x & 3)] ? ink : paper;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  hoc.putImageData(img, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha *= alpha; ctx.imageSmoothingEnabled = false; ctx.drawImage(ho, 0, 0, CFG.w, CFG.h); ctx.restore();
}
const grey = v => `rgb(${v},${v},${v})`;
function shade(g, x, y, r, stops, ox = -0.35, oy = -0.4) { const gr = g.createRadialGradient(x + ox * r, y + oy * r, r * 0.05, x, y, r); stops.forEach(([k, v]) => gr.addColorStop(k, grey(v))); return gr; }

/* ---------- the mascot: a girl with a bob and bangs (grey values; the halftone pass turns them into dots) ---------- */
// o: x, y (head centre), r, look/lookY (gaze), smile 0–1, open 0–1 (mouth), eyes 'open'|'happy', wink, blink 0–1,
//    tilt (head), sway (hair lag), hop (px up), squash (>1 flattens), body (false = head only)
function mascot(g, o) {
  const r = o.r, lx = (o.look || 0) * 0.13 * r, ly = (o.lookY || 0) * 0.07 * r, s = o.smile ?? 0.7, sw = o.sway || 0;
  const sq = o.squash || 1;
  g.save(); g.translate(o.x, o.y - (o.hop || 0));
  if (o.body !== false) {
    // sweater, then a round white collar
    g.save(); g.translate(0, 2.4 * r); g.scale(1 / Math.sqrt(sq), sq); g.translate(0, -2.4 * r);
    g.fillStyle = shade(g, 0.05 * r, 2.45 * r, 1.9 * r, [[0, 196], [0.55, 138], [1, 70]], -0.45, -0.55);
    g.beginPath(); g.ellipse(0.05 * r, 2.5 * r, 1.45 * r, 1.4 * r, 0, 0, TAU); g.fill();
    g.fillStyle = grey(36); g.beginPath(); g.ellipse(0, 1.02 * r, 0.36 * r, 0.2 * r, 0, 0, TAU); g.fill();
    for (const sx of [-1, 1]) { g.fillStyle = shade(g, sx * 0.24 * r, 1.22 * r, 0.3 * r, [[0, 255], [1, 214]]); g.beginPath(); g.ellipse(sx * 0.24 * r, 1.2 * r, 0.3 * r, 0.17 * r, sx * 0.35, 0, TAU); g.fill(); }
    g.strokeStyle = grey(30); g.lineWidth = 0.06 * r; rr(g, 0.5 * r, 1.88 * r, 0.34 * r, 0.34 * r, 0.05 * r); g.stroke();
    g.restore();
  }
  g.rotate(o.tilt || 0); g.scale(1 / Math.sqrt(sq), sq);
  // two buns and a rounded bob behind the face, swinging a little behind the head's motion
  g.save(); g.rotate(sw * 0.5);
  for (const sx of [-1, 1]) { const bx = sx * 0.66 * r - sw * 0.2 * r, by = -0.9 * r; g.fillStyle = shade(g, bx, by, 0.32 * r, [[0, 128], [0.5, 62], [1, 22]]); g.beginPath(); g.arc(bx, by, 0.32 * r, 0, TAU); g.fill(); }
  g.fillStyle = shade(g, 0, -0.1 * r, 1.15 * r, [[0, 118], [0.45, 58], [1, 20]], -0.3, -0.5);
  g.beginPath(); g.ellipse(0, -0.1 * r, 1.04 * r, 0.98 * r, 0, Math.PI * 0.94, Math.PI * 2.06);
  g.lineTo(1.0 * r, 0.5 * r); g.quadraticCurveTo(1.02 * r, 0.84 * r, 0.72 * r, 0.76 * r); g.lineTo(-0.72 * r, 0.76 * r); g.quadraticCurveTo(-1.02 * r, 0.84 * r, -1.0 * r, 0.5 * r); g.closePath(); g.fill();
  g.restore();
  // face
  g.fillStyle = shade(g, 0, 0, 1.0 * r, [[0, 255], [0.55, 240], [0.85, 192], [1, 140]]);
  g.beginPath(); g.ellipse(0, 0.04 * r, 0.92 * r, 0.9 * r, 0, 0, TAU); g.fill();
  // bangs with a scalloped edge, and a white clip
  g.save(); g.rotate(sw * 0.25);
  g.fillStyle = shade(g, 0, -0.6 * r, 1.0 * r, [[0, 130], [0.5, 66], [1, 24]], -0.25, -0.6);
  // fringe: rounded locks between temple and temple
  const locks = [0.9, 0.6, 0.3, 0, -0.3, -0.6, -0.9];
  g.beginPath(); g.moveTo(-0.92 * r, 0.06 * r); g.quadraticCurveTo(-0.98 * r, -1.0 * r, 0, -1.04 * r); g.quadraticCurveTo(0.98 * r, -1.0 * r, 0.92 * r, 0.06 * r);
  g.quadraticCurveTo(0.92 * r, -0.3 * r, locks[0] * r, -0.36 * r);
  for (let k = 0; k < locks.length - 1; k++) { const a = locks[k] * r, b = locks[k + 1] * r; g.quadraticCurveTo((a + b) / 2, -0.12 * r - (k % 2) * 0.05 * r, b, -0.36 * r); }
  g.quadraticCurveTo(-0.92 * r, -0.3 * r, -0.92 * r, 0.06 * r); g.fill();
  g.fillStyle = grey(246); g.save(); g.translate(0.5 * r, -0.5 * r); g.rotate(-0.5); rr(g, -0.17 * r, -0.05 * r, 0.34 * r, 0.1 * r, 0.05 * r); g.fill(); g.restore();
  g.restore();
  // blush
  g.fillStyle = grey(160); for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(sx * 0.5 * r + lx * 0.6, 0.36 * r + ly, 0.16 * r, 0.1 * r, 0, 0, TAU); g.fill(); }
  // eyes with lashes
  const blink = o.blink || 0;
  for (const sx of [-1, 1]) {
    const ex = sx * 0.3 * r + lx, ey = 0.1 * r + ly, mode = (o.wink && sx === 1) ? 'happy' : (o.eyes || 'open');
    g.strokeStyle = grey(0); g.lineCap = 'round';
    if (mode === 'happy' || blink > 0.85) {
      g.lineWidth = 0.06 * r; g.beginPath(); g.arc(ex, ey + 0.07 * r, 0.12 * r, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
    } else {
      const h = 0.19 * r * (1 - blink);
      g.fillStyle = grey(0); g.beginPath(); g.ellipse(ex, ey, 0.135 * r, h, 0, 0, TAU); g.fill();
      g.fillStyle = grey(255); g.beginPath(); g.arc(ex - 0.04 * r, ey - 0.07 * r * (1 - blink), 0.05 * r, 0, TAU); g.fill();
      g.beginPath(); g.arc(ex + 0.04 * r, ey + 0.06 * r * (1 - blink), 0.022 * r, 0, TAU); g.fill();
      g.lineWidth = 0.035 * r; g.beginPath(); g.moveTo(ex + sx * 0.1 * r, ey - h * 0.7); g.lineTo(ex + sx * 0.2 * r, ey - h * 0.95); g.stroke();
    }
  }
  // mouth: a small smile, or an open mouth with a tongue
  const open = o.open || 0, mx = lx * 0.9, my = 0.47 * r + ly;
  if (open > 0.05) {
    // a wide D-shaped mouth that reads at a distance, teeth showing when it opens wide
    const mw = 0.17 * r * (0.75 + open * 0.35), mh = 0.22 * r * open + 0.04 * r;
    g.fillStyle = grey(0); g.beginPath(); g.ellipse(mx, my - 0.03 * r, mw, mh, 0, 0, Math.PI); g.fill();
    g.fillStyle = grey(150); g.beginPath(); g.ellipse(mx, my - 0.03 * r + mh * 0.62, mw * 0.55, mh * 0.34, 0, 0, Math.PI); g.fill();
    if (open > 0.45) { g.fillStyle = grey(250); g.fillRect(mx - mw * 0.62, my - 0.03 * r, mw * 1.24, 0.035 * r); }
  } else {
    g.strokeStyle = grey(0); g.lineWidth = 0.045 * r; g.lineCap = 'round'; g.beginPath(); g.arc(mx, my - 0.16 * r * s, 0.15 * r, Math.PI * (0.5 - 0.3 * s), Math.PI * (0.5 + 0.3 * s)); g.stroke();
  }
  g.restore();
}
// The life in the original's character: a nod and a small hop on every beat, a lazy tilt, regular blinks,
// and a squash on landing. Returns mascot options for time t; `extra` overrides per scene.
const BEAT = 0.5;
function alive(t, extra = {}) {
  const ph = (t % BEAT) / BEAT, k = Math.sin(ph * Math.PI);
  const blinkAt = [0.85, 2.3, 3.6, 5.1, 5.95, 7.7, 9.3, 10.4, 12.2, 13.0, 14.6].some(b => t > b && t < b + 0.09);
  return Object.assign({ hop: k * 7, tilt: Math.sin(t * Math.PI * 0.9) * 0.05, sway: -Math.cos(t * Math.PI * 0.9) * 0.05, squash: 1 + (1 - k) * 0.012, blink: blinkAt ? 1 : 0 }, extra);
}
// Visual mouth gestures alongside the copy: [start, length, openness].
// The soundtrack contains background music only, with no voice or simulated speech.
const SPEECH = [
  [0.62, 0.1, 0.35], [0.74, 0.1, 0.3], [0.86, 0.16, 0.4],                                         // psst…
  [1.15, 0.16, 0.9], [1.36, 0.12, 0.7], [1.5, 0.16, 0.8], [1.85, 0.12, 0.6], [1.98, 0.22, 1.0],   // Got some-thing to sell?
  [2.95, 0.14, 0.6], [3.45, 0.14, 0.6], [3.95, 0.16, 0.7],                                         // courses, ebooks, apps
  [4.58, 0.12, 0.7], [4.72, 0.1, 0.5], [4.84, 0.16, 0.8], [5.05, 0.12, 0.6], [5.18, 0.08, 0.4], [5.28, 0.08, 0.4], [5.38, 0.12, 0.5],
  [5.7, 0.08, 0.4], [5.8, 0.22, 0.9], [6.15, 0.08, 0.5], [6.26, 0.12, 0.8], [6.4, 0.18, 0.7],      // Pennyflow turns it into a store in minutes
  [11.3, 0.18, 0.9], [11.75, 0.12, 0.7], [11.9, 0.16, 0.8], [12.25, 0.14, 0.8], [12.55, 0.12, 0.8], [12.68, 0.12, 0.6],
  [13.05, 0.12, 0.6], [13.2, 0.24, 1.0]                                                            // You create. We handle the flow.
];
function mouth(t) {
  let m = 0;
  for (const [a, d, k] of SPEECH) {
    if (t < a - 0.04 || t > a + d + 0.08) continue;
    const e = t < a ? (t - a + 0.04) / 0.04 : t < a + d ? 1 - 0.35 * Math.sin((t - a) / d * Math.PI * 2) ** 2 : 1 - (t - a - d) / 0.08;
    m = Math.max(m, k * clamp(e));
  }

}
// talking adds a nod to whatever the scene's pose is
function talking(t, o) { const m = mouth(t); return Object.assign({}, o, { open: Math.max(o.open || 0, m), hop: (o.hop || 0) + m * 6, tilt: (o.tilt || 0) + m * 0.04 * Math.sin(t * 17) }); }
// an extra hop with a squash on landing, starting at `at`
function jump(t, at, h = 36) { const u = seg(t, at, at + 0.42); if (u <= 0 || u >= 1) return { hop: 0, squash: 1 }; return { hop: Math.sin(u * Math.PI) * h, squash: u > 0.8 ? 1 + (1 - Math.abs(u - 0.9) * 10) * 0.08 : 1 - Math.sin(u * Math.PI) * 0.05 }; }

/* ---------- product objects (isometric, grey) ---------- */
function iso(g, x, y, w, d, h, top, left, right) {
  const c = Math.cos(Math.PI / 6), s = Math.sin(Math.PI / 6);
  const p = (a, b, z) => [x + (a - b) * c, y + (a + b) * s - z];
  const face = (pts, v) => { g.fillStyle = grey(v); g.beginPath(); pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); g.fill(); };
  face([p(0, 0, h), p(w, 0, h), p(w, d, h), p(0, d, h)], top);
  face([p(0, d, h), p(w, d, h), p(w, d, 0), p(0, d, 0)], left);
  face([p(w, 0, h), p(w, d, h), p(w, d, 0), p(w, 0, 0)], right);
}
function isoQuad(g, x, y, pts, v) {
  const c = Math.cos(Math.PI / 6), s = Math.sin(Math.PI / 6);
  g.fillStyle = grey(v); g.beginPath(); pts.forEach(([a, b, z], i) => { const px = x + (a - b) * c, py = y + (a + b) * s - z; i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.closePath(); g.fill();
}
function laptop(g, x, y, k) {
  const W = 150 * k, D = 105 * k, H = 8 * k, S = 100 * k, lean = 22 * k;
  iso(g, x - 40 * k, y + 5 * k, W, D, H, 232, 120, 165);
  // the lid stands on the deck's back edge, leaning back
  const lid = [[0, 0, H], [W, 0, H], [W, -lean, H + S], [0, -lean, H + S]];
  isoQuad(g, x - 40 * k, y + 5 * k, lid, 60);
  const inset = (a, b, z) => [a, b, z]; const m = 0.08;
  isoQuad(g, x - 40 * k, y + 5 * k, [[W * m, -lean * m, H + S * m], [W * (1 - m), -lean * m, H + S * m], [W * (1 - m), -lean * (1 - m), H + S * (1 - m)], [W * m, -lean * (1 - m), H + S * (1 - m)]], 12);
  const c = Math.cos(Math.PI / 6), sn = Math.sin(Math.PI / 6), a = W / 2, b = -lean / 2, z = H + S / 2;
  const px = x - 40 * k + (a - b) * c, py = y + 5 * k + (a + b) * sn - z;
  g.fillStyle = grey(255); g.beginPath(); g.moveTo(px - 10 * k, py - 16 * k); g.lineTo(px - 6 * k, py + 16 * k); g.lineTo(px + 16 * k, py + 4 * k); g.closePath(); g.fill();
}
function books(g, x, y, k) { [[0, 236], [1, 205], [2, 230], [3, 190]].forEach(([i, v]) => iso(g, x - 70 * k + (i % 2) * 8 * k, y + 40 * k - i * 26 * k, 140 * k, 90 * k, 24 * k, v, 90, 150)); }
function apps(g, x, y, k) {

      ctx.save(); ctx.globalAlpha = e ? 0.16 : 1; ctx.translate(1060, 640); ctx.rotate(-0.12); ctx.scale(k * (1 + e * 0.06 * (1 - st)), k * (1 + e * 0.06 * (1 - st)));
      const w = tw('Handled.', 200, F.ital) + 70;
      box(-w / 2, -112, w, 196, 30, 'rgba(255,255,255,.88)', CFG.blue, 7); txt('Handled.', 0, 46, 200, F.ital, CFG.blue, 'center'); ctx.restore();
    }
  }
  hud(t, '04 — handled', '#A8A8A8');
}

/* ============ 05 — flow (11.2 – 13.35 s) ============ */
// where "flow." lands at the end of "We handle the", so the wordmark can pick it up there
function flowWordX() { return 140 + tw('We ', 130, F.sans, 600) + tw('handle ', 130, F.sans, 600) + tw('the ', 130, F.sans, 600); }
function flow(t) {
  ctx.fillStyle = CFG.black; ctx.fillRect(0, 0, CFG.w, CFG.h);
  const grin = t > 12.85;
  halftone(g => mascot(g, talking(t, merge(alive(t, { x: 1650, y: 560, r: 185, look: -0.6, smile: 0.9, wink: t < 11.5, open: grin ? 0.45 : 0, eyes: grin ? 'happy' : 'open' }), jump(t, 12.85, 34)))), [6, 6, 6], [255, 255, 255]);
  rise('You', 140, 520, 160, F.sans, '#fff', seg(t, 11.3, 11.55), 600);
  const cp = EZ.o3(seg(t, 11.75, 12.0));
  if (cp > 0) txt('create.', 140 + tw('You ', 160, F.sans, 600) + (1 - cp) * 60, 520, 190, F.ital, '#fff', 'left', cp);
  const we = EZ.back(seg(t, 12.25, 12.5));
  if (we > 0) { ctx.save(); ctx.translate(140, 790); ctx.rotate((1 - we) * -0.25); txt('We', 0, (1 - we) * 40, 130, F.sans, CFG.soft, 'left', clamp(we), 600); ctx.restore(); }
  const hx = 140 + tw('We ', 130, F.sans, 600);
  rise('handle', hx, 790, 130, F.sans, CFG.soft, seg(t, 12.55, 12.78), 600);
  const thx = hx + tw('handle ', 130, F.sans, 600), th = EZ.back(seg(t, 13.05, 13.22));
  if (th > 0) txt('the', thx, 790 - (1 - th) * 50 - 10 * th, 130, F.sans, CFG.soft, 'left', clamp(th), 600);
  if (t > 12.8 && t < 13.05 && (t * 6 % 1) < 0.5) { ctx.fillStyle = CFG.soft; ctx.fillRect(thx, 770, 18, 6); }
  // "flow." springs up out of the line in blue
  const fp = seg(t, 13.12, 13.3);
  if (fp > 0) { const k = EZ.back(fp); ctx.save(); ctx.translate(flowWordX(), 790 + (1 - k) * 150); ctx.scale(lerp(0.4, 1, k), lerp(0.4, 1, k) * (1 + 0.12 * Math.sin(fp * Math.PI))); txt('flow.', 0, 0, 130, F.ital, CFG.blue, 'left', clamp(fp * 3)); ctx.restore(); }
  hud(t, '05 — flow', '#7A7A7A');
}

/* ============ 06 — the wordmark (13.3 – 15 s) ============ */
const WORD = { y: 604, size: 176 };
function endCard(t) {
  ctx.fillStyle = CFG.white; ctx.fillRect(0, 0, CFG.w, CFG.h);
  const full = tw(CFG.brand, WORD.size, F.serif), x0 = 960 - full / 2, stem = CFG.brand.slice(0, -4);
  // "flow." arrives first, in the italic of the line before, then becomes the wordmark's tail
  const peek = EZ.back(seg(t, 13.88, 14.04)), up = EZ.back(seg(t, 14.06, 14.26)), head = peek;
  if (head > 0) halftone(g => mascot(g, alive(t, { x: 1105, y: lerp(640, 478, peek) - up * 96, r: 150, body: false, look: 0.15, smile: 1, wink: t > 14.45 && t < 14.8, tilt: 0.1 * Math.sin(seg(t, 14.2, 15) * Math.PI) })));
  // "flow." travels from the end of the line to centre stage, grows, then turns into the wordmark's tail with a pop
  const go = EZ.o3(seg(t, 13.3, 13.44)), morph = EZ.io3(seg(t, 13.48, 13.6)), pop = seg(t, 13.56, 13.8);
  const tailX = x0 + tw(stem, WORD.size, F.serif);
  const fx = lerp(lerp(flowWordX(), 1104, go), tailX, morph), fy = lerp(lerp(790, 640, go), WORD.y, morph), fs = lerp(lerp(130, 170, go), WORD.size, morph);
  if (morph < 1) txt('flow.', fx, fy, fs, F.ital, CFG.blue, 'left', 1 - morph);
  if (morph > 0) {
    const k = pop > 0 ? 1 + 0.22 * Math.sin(pop * Math.PI) * (1 - pop) * 2 : 1, cxw = tailX + tw('flow', WORD.size, F.serif) / 2;
    ctx.save(); ctx.translate(cxw, WORD.y); ctx.scale(k, k); ctx.translate(-cxw, -WORD.y); txt('flow', tailX, WORD.y, WORD.size, F.serif, CFG.ink, 'left', morph); ctx.restore();
  }
  // the head pops up from behind the wordmark, then winks
  // the stem letters drop in one by one
  let x = x0;
  [...stem].forEach((ch, i) => {
    const p = seg(t, 13.48 + i * 0.05, 13.7 + i * 0.05), w = tw(ch, WORD.size, F.serif);
    if (p > 0) { ctx.save(); ctx.translate(x + w / 2, WORD.y - (1 - EZ.back(p)) * 120); ctx.rotate((1 - EZ.o3(p)) * (i % 2 ? 0.4 : -0.4)); txt(ch, 0, 0, WORD.size, F.serif, CFG.ink, 'center', clamp(p * 2)); ctx.restore(); }
    x += w;
  });
  const tg = seg(t, 13.85, 14.1), lead = 'The payment infrastructure that ', lw = tw(lead, 40, F.sans, 400), dw = tw('you deserve.', 50, F.ital);
  txt(lead, 960 - (lw + dw) / 2, 688, 40, F.sans, '#6E6E6E', 'left', tg, 400); txt('you deserve.', 960 - (lw + dw) / 2 + lw, 688, 50, F.ital, CFG.ink, 'left', tg);
  const bt = EZ.back(seg(t, 14.15, 14.4)), uw = tw(CFG.domain, 28, F.mono), gw = 250 + 26 + uw, gx = 960 - gw / 2;
  if (bt > 0) { ctx.save(); ctx.translate(gx + 125, 810); ctx.scale(bt, bt); box(-125, -36, 250, 72, 36, CFG.blue); txt('Start selling', 0, 11, 30, F.sans, '#fff', 'center', 1, 400); ctx.restore(); }
  txt(CFG.domain, gx + 276, 820, 28, F.mono, '#6E6E6E', 'left', seg(t, 14.3, 14.5));
  txt('65,000+ creators  ·  160+ countries  ·  no monthly fee', 960, 1002, 22, F.mono, '#9A9A9A', 'center', seg(t, 14.45, 14.7));
}

/* ---------- transitions and the frame ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (t < 2.45) hook(t);
  else if (t < 4.45) cards(t);
  else if (t < 4.72) {
    // whip: the store slides in from the left over the blue board
    const k = EZ.io3(seg(t, 4.45, 4.72));
    ctx.save(); ctx.translate(k * 1920, 0); cards(t); ctx.restore();
    for (let e = 2; e >= 0; e--) { ctx.save(); ctx.globalAlpha = e ? 0.25 : 1; ctx.translate((k - 1) * 1920 - e * 90 * (1 - k), 0); store(t); ctx.restore(); }
  }
  else if (t < 6.95) store(t);
  else if (t < 7.45) {
    // whip out of the store, then the camera pulls out of the express-pay button
    if (t < 7.08) { const k = EZ.i3(seg(t, 6.95, 7.08)); for (let e = 2; e >= 0; e--) { ctx.save(); ctx.globalAlpha = e ? 0.3 : 1; ctx.translate(-k * 600 - e * 80 * k, 0); store(t); ctx.restore(); } }
    else {
      const k = EZ.expo(seg(t, 7.08, 7.45)), s = lerp(16, 1, k), ax = lerp(960, 382, k), ay = lerp(540, 285, k);
      ctx.fillStyle = CFG.black; ctx.fillRect(0, 0, CFG.w, CFG.h);
      ctx.save(); ctx.translate(ax, ay); ctx.scale(s, s); ctx.translate(-382, -285); bento(t); ctx.restore();
    }
  }
  else if (t < 11.2) bento(t);
  else if (t < 13.3) flow(t);
  else {
    // a dithered white wipe sweeps across the black, leaving the wordmark
    const k = EZ.io3(seg(t, 13.3, 13.42));
    if (k < 1) {
      flow(t); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1920 * k + 60, CFG.h); ctx.clip(); endCard(t); ctx.restore();
      halftone(g => { const gr = g.createLinearGradient(1920 * k - 120, 0, 1920 * k + 60, 0); gr.addColorStop(0, grey(255)); gr.addColorStop(1, grey(0)); g.fillStyle = gr; g.fillRect(1920 * k - 120, 0, 180, CFG.h); }, [6, 6, 6], [255, 255, 255]);
    } else endCard(t);
  }
}

/* ---------- master timeline: the only clock ---------- */
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
Promise.all(['400 10px InterD', '600 10px InterD', '10px FrauncesB', '10px InstrumentI', '10px JBMono'].map(f => document.fonts.load(f))).then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() {
  const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h);
  main.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
// Inside an Open Design project the motion source player wraps the stage,
// fits it and adds its own controls; leave both to it there.
const hostPlayer = () => window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport';
const ownFit = fit;
fit = function () { if (hostPlayer()) { main.style.transform = 'translate(-50%,-50%)'; return; } ownFit(); };
window.addEventListener('resize', fit); fit();
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  fit(); if (hostPlayer()) document.getElementById('controls').style.display = 'none';
}, 0));
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => {
  if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause();
  sync();
});
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(CFG.reducedAt); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    requestAnimationFrame(loop);
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 4.3;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<script>
// Sound starts with the film. If the browser blocks unmuted autoplay, the first
// gesture on the page turns it on; the master timeline owns play, pause and seek.
(function() {
  // BEGIN shared motion audio sync
// A render stall is not a request to seek the soundtrack. Only correct drift
// after fresh, stable samples; explicit transport actions bypass that filter.
function createMotionAudioSync(audio) {
  var sampledAt = null, driftSince = null, previousDrift = 0, correctedAt = -Infinity, align = false;
  return function (target, moving, force) {
    var now = performance.now(), gap = sampledAt === null ? Infinity : now - sampledAt;
    sampledAt = now;
    if (force) { align = true; driftSince = null; }
    if (align) {
      if (audio.readyState > 0) {
        if (Math.abs(audio.currentTime - target) > .01) audio.currentTime = target;
        align = false; correctedAt = now;
      }
      return;
    }
    var drift = target - audio.currentTime;
    if (!moving || audio.paused || audio.seeking || audio.readyState < 3 || gap > 200 || Math.abs(drift) <= .3 || now - correctedAt < 1500) {
      driftSince = null; previousDrift = drift; return;
    }
    if (driftSince === null || drift * previousDrift <= 0 || Math.abs(drift - previousDrift) > .1) driftSince = now;
    previousDrift = drift;
    if (now - driftSince >= 750) {
      audio.currentTime = target; correctedAt = now; driftSince = null;
    }
  };
}
  // END shared motion audio sync
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';controls.appendChild(button);
  // Gallery thumbnails load the page in an opaque sandbox; those stay silent until asked.
  let enabled=window.origin!=='null',pending=false,chosen=false;
  const timeline=()=>window.__timelines&&window.__timelines.main;
  const syncAudio=createMotionAudioSync(audio);
  let wasPlaying=false,lastTime=0;
  function label() { button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-label',enabled?'Mute sound':'Enable sound');button.setAttribute('aria-pressed',String(enabled)); }
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;label();if(!chosen)waitForGesture();}).finally(()=>{pending=false;}); }
  function waitForGesture() {
    const start=event=>{
      if(event.target===button)return;
      document.removeEventListener('pointerdown',start,true);document.removeEventListener('keydown',start,true);
      if(chosen||enabled)return;
      const tl=timeline();enabled=true;label();if(tl)syncAudio(tl.time(),true,true);play();
    };
    document.addEventListener('pointerdown',start,true);document.addEventListener('keydown',start,true);
  }
  label();
  button.onclick=()=>{chosen=true;enabled=!enabled;label();const tl=timeline();if(enabled&&tl){if(tl.progress()>=1)tl.restart();else tl.play();syncAudio(tl.time(),true,true);play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)syncAudio(Number(event.target.value),false,true);});
  function sync() {
    if (window.__odMotionSourcePlayer) return;
    const tl=timeline();
    if(tl&&enabled&&!window.__odFrameRenderer){
      const time=tl.time(),moving=!tl.paused()&&tl.progress()<1;
      syncAudio(time,moving,(moving&&!wasPlaying)||time<lastTime-.1);
      wasPlaying=moving;lastTime=time;
      if(moving)play();else audio.pause();
    }else { audio.pause();wasPlaying=false; }
    requestAnimationFrame(sync);
  }sync();
})();
</script>
