<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta name="od-motion-output" content="video">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Shape — UI Motion</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Geist;src:url('assets/geist-regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Geist;src:url('assets/geist-medium.ttf') format('truetype');font-weight:500;font-display:block}
@font-face{font-family:Geist;src:url('assets/geist-semibold.ttf') format('truetype');font-weight:600;font-display:block}
:root{--bg:#EDEDE8;--ink:#0A0A0A;--accent:#0A0A0A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:#fff;color:#0A0A0A;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:#fff}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="14" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="14" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 14.00</span>
</div>

<script>
/* ============================================================

      ctx.strokeStyle = onDark ? '#fff' : '#555'; ctx.lineWidth = 3; ctx.strokeRect(x + p + 18, ry - 10, 20, 20);
      txt(s, x + p + 84, ry + 2, 42, 500, onDark ? '#fff' : CFG.ink, 'left', fade);
      if (k) txt(k, x + w - p, ry + 2, 34, 400, onDark ? '#fff' : '#A0A09C', 'right', fade);
    });
  });
  // 10: toast
  const to = life(t, 11.9, 12.7);
  if (to > 0) blurIn(to, () => {
    const done = spring(t - 12.25, 18, 0.85);
    ctx.fillStyle = lerp(0, 1, done) > 0.5 ? '#fff' : '#3A3A3A'; ctx.beginPath(); ctx.arc(x + 80, cy, 24, 0, TAU); ctx.fill();
    if (done > 0.3) { ctx.strokeStyle = CFG.ink; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 70, cy + 1); ctx.lineTo(x + 78, cy + 9); ctx.lineTo(x + 92, cy - 8); ctx.stroke(); }
    txt('Every frame is code', x + 124, cy + 2, 44, 500, '#fff');
  });
}

/* ---------- background, baked once (smooth field, no dithered gradient) ---------- */
const BG = (() => { const q = document.createElement('canvas'); q.width = 192; q.height = 108; const g = q.getContext('2d'), im = g.createImageData(192, 108), base = hex(CFG.bg);
  for (let y = 0; y < 108; y++) for (let x = 0; x < 192; x++) { const d = Math.hypot((x - 96) / 96, (y - 54) / 54), k = 4 - d * 6, o = (y * 192 + x) * 4; im.data[o] = base[0] + k; im.data[o + 1] = base[1] + k; im.data[o + 2] = base[2] + k; im.data[o + 3] = 255; }
  g.putImageData(im, 0, 0); const c = document.createElement('canvas'); c.width = CFG.w; c.height = CFG.h; const cg = c.getContext('2d'); cg.imageSmoothingQuality = 'high'; cg.drawImage(q, 0, 0, CFG.w, CFG.h); return c; })();

/* ---------- render ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(BG, 0, 0);
  // the 1440 stage of the original, centred and scaled to the 1080 frame
  ctx.translate(960, 540); ctx.scale(0.75, 0.75); ctx.translate(-720, -720);
  let w = track(t, GW, 20, 0.82), h = track(t, GH, 20, 0.82), r = track(t, GR, 20, 0.9);
  // stretch past max while dragging the volume, then spring back
  const stretch = (spring(t - 4.6, 18, 0.8) - spring(t - 4.95, 18, 0.7)) * 90; w += stretch;
  const x = 720 - w / 2, y = 720 - h / 2, fc = fillAt(t);
  let fill = `rgb(${fc.map(Math.round)})`;
  if (t > 6.22 && t < 6.7) { const on = clamp(spring(t - 6.24, 16, 0.97)); const c = fc.map((v, k) => lerp(v, 10, on)); fill = `rgb(${c.map(Math.round)})`; }
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.16)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; ctx.fillStyle = fill; roundRect(x, y, w, h, r); ctx.fill(); ctx.restore();
  ctx.save(); roundRect(x, y, w, h, r); ctx.clip(); contents(t, x, y, w, h); ctx.restore();
  drawCursor(cursorAt(t));
}

/* ---------- master timeline: the only clock ---------- */
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
Promise.all(['400 10px Geist', '500 10px Geist', '600 10px Geist'].map(f => document.fonts.load(f))).then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() {
  const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h);
  main.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
// Inside an Open Design project the motion source player wraps the stage,
// fits it and adds its own controls; leave both to it there.
const hostPlayer = () => window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport';
const ownFit = fit;
fit = function () { if (hostPlayer()) { main.style.transform = 'translate(-50%,-50%)'; return; } ownFit(); };
window.addEventListener('resize', fit); fit();
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  fit(); if (hostPlayer()) document.getElementById('controls').style.display = 'none';
}, 0));
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => {
  if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause();
  sync();
});
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(CFG.reducedAt); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    requestAnimationFrame(loop);
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 8.8;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<script>
// Sound starts with the film. If the browser blocks unmuted autoplay, the first
// gesture on the page turns it on; the master timeline owns play, pause and seek.
(function() {
  // BEGIN shared motion audio sync
// A render stall is not a request to seek the soundtrack. Only correct drift
// after fresh, stable samples; explicit transport actions bypass that filter.
function createMotionAudioSync(audio) {
  var sampledAt = null, driftSince = null, previousDrift = 0, correctedAt = -Infinity, align = false;
  return function (target, moving, force) {
    var now = performance.now(), gap = sampledAt === null ? Infinity : now - sampledAt;
    sampledAt = now;
    if (force) { align = true; driftSince = null; }
    if (align) {
      if (audio.readyState > 0) {
        if (Math.abs(audio.currentTime - target) > .01) audio.currentTime = target;
        align = false; correctedAt = now;
      }
      return;
    }
    var drift = target - audio.currentTime;
    if (!moving || audio.paused || audio.seeking || audio.readyState < 3 || gap > 200 || Math.abs(drift) <= .3 || now - correctedAt < 1500) {
      driftSince = null; previousDrift = drift; return;
    }
    if (driftSince === null || drift * previousDrift <= 0 || Math.abs(drift - previousDrift) > .1) driftSince = now;
    previousDrift = drift;
    if (now - driftSince >= 750) {
      audio.currentTime = target; correctedAt = now; driftSince = null;
    }
  };
}
  // END shared motion audio sync
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';controls.appendChild(button);
  // Gallery thumbnails load the page in an opaque sandbox; those stay silent until asked.
  let enabled=window.origin!=='null',pending=false,chosen=false;
  const timeline=()=>window.__timelines&&window.__timelines.main;
  const syncAudio=createMotionAudioSync(audio);
  let wasPlaying=false,lastTime=0;
  function label() { button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-label',enabled?'Mute sound':'Enable sound');button.setAttribute('aria-pressed',String(enabled)); }
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;label();if(!chosen)waitForGesture();}).finally(()=>{pending=false;}); }
  function waitForGesture() {
    const start=event=>{
      if(event.target===button)return;
      document.removeEventListener('pointerdown',start,true);document.removeEventListener('keydown',start,true);
      if(chosen||enabled)return;
      const tl=timeline();enabled=true;label();if(tl)syncAudio(tl.time(),true,true);play();
    };
    document.addEventListener('pointerdown',start,true);document.addEventListener('keydown',start,true);
  }
  label();
  button.onclick=()=>{chosen=true;enabled=!enabled;label();const tl=timeline();if(enabled&&tl){if(tl.progress()>=1)tl.restart();else tl.play();syncAudio(tl.time(),true,true);play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)syncAudio(Number(event.target.value),false,true);});
  function sync() {
    if (window.__odMotionSourcePlayer) return;
    const tl=timeline();
    if(tl&&enabled&&!window.__odFrameRenderer){
      const time=tl.time(),moving=!tl.paused()&&tl.progress()<1;
      syncAudio(time,moving,(moving&&!wasPlaying)||time<lastTime-.1);
      wasPlaying=moving;lastTime=time;
      if(moving)play();else audio.pause();
    }else { audio.pause();wasPlaying=false; }
    requestAnimationFrame(sync);
  }sync();
})();
</script>
