<title>PlayStation marketing: 7 lessons for startups</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #efefef; min-height: 100%;
    display: grid; place-items: center; padding: 28px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #262626;
  }
  .ig-post { width: 420px; max-width: 96vw; background: #fff; border: 1px solid #dbdbdb; border-radius: 10px; overflow: hidden; }
  .ig-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; }
  .ig-avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    background: linear-gradient(45deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888); }
  .ig-who { display: flex; flex-direction: column; line-height: 1.2; }
  .ig-handle { font-weight: 600; font-size: 13px; }
  .ig-sub { font-size: 11px; color: #8e8e8e; }
  .ig-more { margin-left: auto; font-weight: 700; letter-spacing: 1px; color: #262626; }
  .ig-view { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #000; }
  .ig-track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; }
  .ig-track::-webkit-scrollbar { display: none; }
  .ig-slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; }
  .ig-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig-count { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; }
  .ig-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .ig-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  .ig-dot.is-active { background: #0095f6; }
  .ig-actions { display: flex; align-items: center; gap: 16px; padding: 10px 14px 6px; }
  .ig-actions .sp { margin-left: auto; }
  .ig-actions svg { width: 24px; height: 24px; stroke: #262626; fill: none; stroke-width: 2; }
  .ig-likes { padding: 2px 14px; font-weight: 600; font-size: 13px; }
  .ig-cap { padding: 3px 14px 2px; font-size: 13px; line-height: 1.4; }
  .ig-cap b { font-weight: 600; }
  .ig-time { padding: 6px 14px 14px; font-size: 10px; letter-spacing: 0.4px; color: #8e8e8e; text-transform: uppercase; }
</style>

    var track=document.getElementById('track');
    var dots=[].slice.call(document.querySelectorAll('#dots .ig-dot'));
    var count=document.getElementById('count');
    dots[0].classList.add('is-active');
    track.addEventListener('scroll', function(){
      var i=Math.round(track.scrollLeft/track.clientWidth);
      dots.forEach(function(d,k){ d.classList.toggle('is-active', k===i); });
      count.textContent=(i+1)+'/'+dots.length;
