<!doctype html>
<!--
  Open Design · OD Next handheld shell — platform-neutral phone (restrained camera dot and symmetric side keys — use when the brief names no platform).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Platform-neutral mobile prototype</title>
  <style>
    :root {
      --phone-screen-width: 390px;
      --phone-screen-height: 844px;
      --phone-bezel: 10px;
      --phone-outer-radius: 52px;
      --phone-screen-radius: 42px;
      --phone-safe-top: 50px;
      --phone-safe-bottom: 29px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f8f8f9;
      --phone-stage-bg: #eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
        linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.85),
        0 32px 68px -20px rgba(10,12,16,.52),
        0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 96px;
      bottom: 96px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .camera-dot {
      position: absolute;
      z-index: 20;
      top: 13px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: start;
      padding: 14px 20px 0;
      color: var(--phone-system-fg);
      opacity: .8;
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 15px;
      font-size: 14px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 56px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 15px;
      gap: 6px;
    }
    .status-icons svg {
      display: block;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .status-icons .connectivity { width: 15px; height: 12px; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .battery { width: 19px; height: 11px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 96px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Preview-only content. Replace it without inheriting the style. */
    .sample-app { min-height: 100%; padding: 18px 20px 34px; background: #f8f8f9; }
    .sample-app .eyebrow { margin: 0 0 6px; color: #6b6e75; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .sample-app h1 { margin: 0; font-size: 29px; line-height: 1.14; letter-spacing: -.025em; }
    .sample-app p { margin: 10px 0 25px; color: #666a72; line-height: 1.5; }
    .sample-card { padding: 18px; border: 1px solid #e2e3e6; border-radius: 18px; background: #fff; box-shadow: 0 7px 20px rgba(20,22,28,.05); }
    .sample-card + .sample-card { margin-top: 12px; }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="neutral">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START: replace everything inside this sample wrapper with the product. -->
        <div class="sample-app">
          <h1>Your app lives here.</h1>
          <p>Sample content only — replace it without inheriting its style.</p>
          <div class="sample-card">Screens mount inside this viewport; the handset stays fixed.</div>
        </div>
        <!-- APP CONTENT END -->
      </main>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <span class="status-cutout-zone"></span>
        <span class="status-icons">
          <svg class="connectivity" viewBox="0 0 15 12"><path d="M1.5 10.5v-2m4 2v-4.5m4 4.5v-7m4 7v-9"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M1.5 4.7a9.2 9.2 0 0 1 13 0M4.2 7.3a5.4 5.4 0 0 1 7.6 0M6.9 10a1.55 1.55 0 0 1 2.2 0"/></svg>
          <svg class="battery" viewBox="0 0 20 11"><rect x=".75" y="1.25" width="16.5" height="8.5" rx="2"/><path d="M18.5 4v3M3.2 3.4h10.4v4.2H3.2z" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="camera-dot" aria-hidden="true"></div>
      <div class="gesture-indicator" aria-hidden="true"></div>
    </section>
  </div>
</body>
</html>
