<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
  </head>
  <body>
    <!-- Eight paused videos: each pins one of Chrome's six sockets for this host while it sits buffered. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
      data-no-timeline
    >
      <div
        id="target"
        class="clip"
        data-start="0"
        data-duration="20"
        data-track-index="0"
        style="
          position: absolute;
          left: 800px;
          top: 100px;
          width: 240px;
          height: 160px;
          background: #f0c020;
        "
      ></div>
      <video
        id="v1"
        class="clip"
        src="assets/v1.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="20"
        data-track-index="1"
        style="position: absolute; left: 0px; top: 600px; width: 480px; height: 240px"
      ></video>
