<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      .card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 700 160px sans-serif;
        color: #fff;
      }
      #card-a {
        background: #2563eb;
      }
      #card-b {
        background: #db2777;
        inset: 30% 30%;
        font-size: 96px;
      }
    </style>
  </head>
  <body>
    <!-- card-a gets its end edge trimmed; card-b gets dragged onto a ruler line. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-no-timeline
    >
      <div id="card-a" class="clip card" data-start="0.5" data-duration="2" data-track-index="0">
        A
      </div>
      <div id="card-b" class="clip card" data-start="3.1" data-duration="1" data-track-index="1">
        B
      </div>
      <!-- card-c lasts 31/30 s and is moved toward card-d's start at the deepest zoom. -->
      <div
        id="card-c"
        class="clip card"
        data-start="0.1"
        data-duration="1.033333"
        data-track-index="2"
      >
        C
      </div>
      <div id="card-d" class="clip card" data-start="1.35" data-duration="0.5" data-track-index="3">
        D
      </div>
    </div>
  </body>
</html>
