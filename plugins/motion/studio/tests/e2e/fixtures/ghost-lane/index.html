<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New track fixture</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        background: #e5e3da;
        color: #232623;
        font: 20px Arial;
      }
      main {
        position: relative;
        width: 1280px;
        height: 720px;
      }
      p {
        position: absolute;
        left: 64px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main
      id="ghost-lane"
      data-composition-id="ghost-lane"
      data-width="1280"
      data-height="720"
      data-start="0"
      data-duration="24"
      data-fps="30"
      data-no-timeline
    >
      <p
        class="clip"
        id="Opening-title"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        style="z-index: 20; top: 30px"
      >
        Opening title
      </p>
      <p
        class="clip"
        id="Product-walkthrough-final-approved-cut-with-alternate-opening-and-captions"
        data-start="0.4"
        data-duration="5"
        data-track-index="1"
        style="z-index: 19; top: 70px"
      >
        Product walkthrough final approved cut with alternate opening and captions
      </p>
      <p
        class="clip"
        id="Detail-shot"
        data-start="0.8"
        data-duration="5"
        data-track-index="2"
        style="z-index: 18; top: 110px"
      >
        Detail shot
      </p>
      <p
        class="clip"
        id="Supporting-graphics"
        data-start="1.2"
        data-duration="5"
        data-track-index="3"
        style="z-index: 17; top: 150px"
      >
        Supporting graphics
      </p>
      <p
        class="clip"
        id="Closing-title"
        data-start="1.6"
        data-duration="5"
        data-track-index="4"
        style="z-index: 16; top: 190px"
      >
        Closing title
      </p>
      <p
        class="clip"
        id="Music-title"
        data-start="2"
        data-duration="5"
        data-track-index="5"
        style="z-index: 15; top: 230px"
      >
        Music title
      </p>
      <p
        class="clip"
        id="Voiceover-title"
        data-start="2.4"
        data-duration="5"
        data-track-index="6"
        style="z-index: 14; top: 270px"
      >
        Voiceover title
      </p>
      <p
        class="clip"
        id="Lower-thirds"
        data-start="2.8"
        data-duration="5"
        data-track-index="7"
        style="z-index: 13; top: 310px"
      >
        Lower thirds
      </p>
      <p
        class="clip"
        id="Screen-recording"
        data-start="3.2"
        data-duration="5"
        data-track-index="8"
        style="z-index: 12; top: 350px"
      >
        Screen recording
      </p>
      <p
        class="clip"
        id="Logo-animation"
        data-start="3.6"
        data-duration="5"
        data-track-index="9"
        style="z-index: 11; top: 390px"
      >
        Logo animation
      </p>
      <p
        class="clip"
        id="second-cut"
        data-start="10"
        data-duration="5"
        data-track-index="1"
        style="z-index: 19; top: 70px"
      >
        Second cut
      </p>
    </main>
  </body>
</html>
