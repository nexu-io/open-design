<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>灵言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:        #faf9f7;
  --surface:   #ffffff;
  --surface-2: #f2f0ec;
  --fg:        #1a1814;
  --fg-2:      #4a4640;
  --muted:     #96908a;
  --divider:   #e4e0da;
  --accent:    #c0392b;
  --accent-lt: #fdf0ee;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --sans:  -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
}
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  width: 390px;
  height: 844px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Status bar */
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg);
}
.status-bar .time { font-size: 15px; font-weight: 600; color: var(--fg); }
.status-bar .icons { display: flex; gap: 6px; align-items: center; }

/* Scrollable area */
.content {
  height: calc(844px - 44px - 83px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 28px;
  -webkit-overflow-scrolling: touch;
}
.content::-webkit-scrollbar { display: none; }

/* ── Masthead ──────────────────────────────────────────────────────── */
.masthead {
  border-top: 3px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  padding: 8px 0;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: 0.2em;
  line-height: 1;
}
.masthead-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.masthead-date {
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.12em;
  font-family: var(--serif);
}
.points-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border: 1px solid var(--divider);
  border-radius: 2px;
  font-size: 10.5px;
  color: var(--fg-2);
  cursor: pointer;
  background: var(--surface);
  letter-spacing: 0.04em;
  transition: border-color 0.12s;
}
.points-chip:active { border-color: var(--accent); color: var(--accent); }

/* ── Hero headline ─────────────────────────────────────────────────── */
.hero {
  padding: 0 0 16px;
  border-bottom: 0.5px solid var(--divider);
  margin-bottom: 18px;
}
.hero-headline {
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.18;
  letter-spacing: 0.04em;
}
.hero-headline em {
  font-style: normal;
  color: var(--accent);
}

/* ── Entry cards ───────────────────────────────────────────────────── */
.entry-cards { margin-bottom: 20px; }

/* Featured card — visual weight above minor cards */
.card-feature {
  border: 1px solid var(--divider);
  border-top: 2.5px solid var(--fg);
  border-radius: 2px;
  background: var(--surface);
  cursor: pointer;
  overflow: hidden;
  margin-bottom: 10px;
  transition: box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1), transform 0.12s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}
.card-feature:active { box-shadow: inset 0 0 0 1px var(--accent); transform: scale(0.985); }
.card-feature-body { padding: 18px 16px 16px; }

/* Stamp eyebrow — replaces left bar */
.card-eyebrow {
  display: inline-block;
  font-size: 8.5px;
  color: var(--accent);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  font-weight: 600;
  border: 1px solid var(--accent);
  border-radius: 1px;
  padding: 2px 6px;
  margin-bottom: 9px;
}

.card-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: 0.06em;
  line-height: 1.28;
  margin-bottom: 5px;
}
.card-desc {
  font-size: 12px;
  color: var(--fg-2);
  line-height: 1.65;
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}
.card-cost { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
.card-arrow { color: var(--muted); }

/* 2-column minor grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.card-minor {
  border: 1px solid var(--divider);
  border-radius: 2px;
  padding: 13px 13px 11px;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.14s, transform 0.12s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}
.card-minor:active { background: var(--surface-2); transform: scale(0.97); }
.card-minor .card-title { font-size: 16px; margin-bottom: 4px; }
.card-minor .card-desc { font-size: 11px; }
.card-minor .card-meta { margin-top: 10px; }

/* Full-width minor */
.card-minor-wide {
  border: 1px solid var(--divider);
  border-radius: 2px;
  padding: 12px 14px;
  background: var(--surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.14s, transform 0.12s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}
.card-minor-wide:active { background: var(--surface-2); transform: scale(0.985); }
.card-minor-wide .card-title { font-size: 16px; margin-bottom: 2px; }
.card-minor-wide .card-desc { font-size: 11px; }
.card-minor-wide .right { display: flex; align-items: center; gap: 10px; margin-left: auto; }

/* ── Section rule ──────────────────────────────────────────────────── */
.section-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0 13px;
}
.section-rule::before { content: ''; flex: 0 0 20px; height: 1px; background: var(--fg); }
.section-rule::after  { content: ''; flex: 1; height: 0.5px; background: var(--divider); }
.section-rule span {
  font-family: var(--serif);
  font-size: 10px;
  color: var(--fg-2);
  letter-spacing: 0.22em;
}

/* ── Quick chips ───────────────────────────────────────────────────── */
.quick-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.quick-chips::-webkit-scrollbar { display: none; }
.quick-chip {
  border: 1px solid var(--divider);
  border-radius: 2px;
  padding: 5px 12px;
  font-size: 12px;
  font-family: var(--serif);
  color: var(--fg-2);
  white-space: nowrap;
  cursor: pointer;
  background: var(--surface);
  flex-shrink: 0;
  letter-spacing: 0.04em;
  transition: border-color 0.12s, color 0.12s;
}
.quick-chip:active, .quick-chip.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-lt);
}

/* ── Tab bar ───────────────────────────────────────────────────────── */
.tab-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 83px;
  background: var(--surface);
  border-top: 1.5px solid var(--fg);
  display: flex;
  align-items: flex-start;
  padding-top: 8px;
  z-index: 10;
}
.tab-bar a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  height: 44px;
  text-decoration: none;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.12em;
  font-family: var(--serif);
  -webkit-tap-highlight-color: transparent;
  transition: color 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}
.tab-bar a svg { opacity: 0.38; transition: opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1); }
.tab-bar a.active { color: var(--accent); }
.tab-bar a.active svg { opacity: 1; stroke: var(--accent); }
</style>
</head>
