<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;} body{background:#fff;font-family:var(--uni-font-sans);color:var(--uni-text-color);padding:18px 20px;box-sizing:border-box;}
 .tag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--uni-text-grey-2);}
 
</style></head><body>
<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;">
 <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:90px;height:54px;background:#fff;border-radius:4px;position:relative;"><div style="position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 0 0 0.5px #c8c7cc;"></div></div><span class="tag">flat + hairline (cards)</span></div>
 <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:54px;height:32px;background:#007aff;border-radius:16px;position:relative;"><div style="position:absolute;top:1px;right:1px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div></div><span class="tag">knob shadow (only stock)</span></div>
 <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:90px;height:54px;background:#fff;border-radius:6px;box-shadow:0 1px 10px rgba(0,0,0,.2);"></div><span class="tag">popup / action sheet</span></div>
</div></body></html>
