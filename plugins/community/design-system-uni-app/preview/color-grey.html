<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;}
  body{background:#fff;color:var(--uni-text-color);font-family:var(--uni-font-sans);padding:18px 20px;box-sizing:border-box;}
  .row{display:flex;align-items:center;gap:10px;}
  .wrap{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:64px;height:64px;border-radius:6px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .chip{display:flex;flex-direction:column;gap:5px;font-size:11px;}
  .chip code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--uni-text-grey-2);font-size:10.5px;}
  .lbl{font-weight:600;color:var(--uni-text-title);font-size:12px;}
  
</style>
</head>
<body>
<div class="wrap">
<div class="chip"><div class="sw" style="background:#f8f8f8"></div><span class="lbl">Page</span><code>#f8f8f8</code></div>
<div class="chip"><div class="sw" style="background:#f7f7f7"></div><span class="lbl">Divider bg</span><code>#f7f7f7</code></div>
<div class="chip"><div class="sw" style="background:#dedede"></div><span class="lbl">Fill hover</span><code>#dedede</code></div>
<div class="chip"><div class="sw" style="background:#c8c7cc"></div><span class="lbl">Hairline</span><code>#c8c7cc</code></div>
<div class="chip"><div class="sw" style="background:#d1d1d1"></div><span class="lbl">Border</span><code>#d1d1d1</code></div>
<div class="chip"><div class="sw" style="background:#dfdfdf"></div><span class="lbl">Switch off</span><code>#dfdfdf</code></div>
</div>
</body>
</html>
